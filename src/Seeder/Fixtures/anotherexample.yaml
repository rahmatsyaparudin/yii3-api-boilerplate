# 2. ENTITIES (Sesuaikan dengan signature method create)
App\Domain\AnotherExample\Entity\AnotherExample:
  another_anotherexample_{1..5}:
    __factory: 
      'App\Domain\AnotherExample\Entity\AnotherExample::create':
        # Urutan: name, status, detailInfo, exampleId, syncMdb
        - '<company()>'   # $name
        - '@status_draft' # $status
        - '@info_empty'   # $detailInfo
        - 1               # $exampleId
        - null            # $syncMdb

  another_anotherexample_{6..10}:
    __factory: 
      'App\Domain\AnotherExample\Entity\AnotherExample::create':
        - '<company()> <sentence()>'  # $name
        - '@status_active'                       # $status
        - '@info_empty'                          # $detailInfo
        - 1                                      # $exampleId
        - 123                                    # $syncMdb
