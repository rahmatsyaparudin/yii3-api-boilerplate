r API (name, version, environment). Path ini termasuk public path (app.jwt.publicPaths) sehingga bisa dipanggil tanpa Bearer token — berguna untuk smoke test bahwa server hidup.\",\n                        \"url\": {\n                            \"raw\": \"{{url-local}}/api/v1/\",\n                            \"host\": [\"{{url-local}}\"],\n                            \"path\": [\"api\", \"v1\", \"\"]\n                        }\n                    }\n                },\n                {\n                    \"name\": \"AnotherExample - List\",\n                    \"request\": {\n                        \"method\": \"GET\",\n                        \"description\": \"Daftar AnotherExample dengan paginasi (environment Local).\\n\\nPermission: another-example.index. Butuh Bearer token valid (JWT atau service token).\\n\\nQuery params opsional: page, page_size (1-200), sort_by, sort_dir (asc|desc), plus filter field seperti id, name, status, example_id.\",\n                        \"url\": {\n                            \"raw\": \"{{url-local}}/api/v1/another-example\",\n                            \"host\": [\"{{url-local}}\"],\n                            \"path\": [\"api\", \"v1\", \"another-example\"]\n                        }\n                    }\n                },\n                {\n                    \"name\": \"AnotherExample - Create\",\n                    \"request\": {\n                        \"method\": \"POST\",\n                        \"description\": \"Buat record AnotherExample baru (environment Local).\\n\\nPermission: another-example.create. Field example_id adalah FK ke tabel example (parent) — harus merujuk record Example yang ada. detail_info audit (created_by, created_at, dst.) diisi otomatis oleh server dari actor yang terautentikasi; field ini boleh dikirim null.\",\n                        \"body\": {\n                            \"mode\": \"raw\",\n                            \"raw\": \"{\\n    \\\"name\\\": \\\"Another example\\\",\\n    \\\"status\\\": 1,\\n    \\\"example_id\\\": 1,\\n    \\\"detail_info\\\": null\\n}\",\n                            \"options\": { \"raw\": { \"language\": \"json\" } }\n                        },\n                        \"url\": {\n                            \"raw\": \"{{url-local}}/api/v1/another-example/create\",\n                            \"host\": [\"{{url-local}}\"],\n                            \"path\": [\"api\", \"v1\", \"another-example\", \"create\"]\n                        }\n                    }\n                },\n                {\n                    \"name\": \"System\",\n                    \"item\": [\n                        {\n                            \"name\": \"ServiceToken - Issue (Create)\",\n                            \"request\": {\n                                \"method\": \"POST\",\n                                \"description\": \"Terbitkan service token baru (environment Local).\\n\\nPermission: system.service-token.create. Butuh Bearer token valid — request ini dilakukan user internal yang sudah login (SSO/JWT) untuk menerbitkan token bagi sistem eksternal.\\n\\nPENTING: plaintext token hanya muncul sekali di data.token — yang disimpan di DB hanya SHA-256-nya. Simpan baik-baik, lalu set ke variable {{bearer-token}} untuk request machine-to-machine selanjutnya.\\n\\nField: username (wajib, unique — identitas service, bukan username penerbit), name (wajib), abilities (opsional, array string), whitelist_host (opsional, default [] = allow all; dukung wildcard 192.168.1.* / *.pos.local), expires_at (opsional, Y-m-d atau Y-m-d H:i:s; kosong = tidak pernah expired).\\n\\nFitur ini opt-in: butuh app.service_token.enabled=true di .env.\",\n                                \"body\": {\n                                    \"mode\": \"raw\",\n                                    \"raw\": \"{\\n    \\\"username\\\": \\\"pos_cabang_a\\\",\\n    \\\"name\\\": \\\"Aplikasi Kasir Cabang A\\\",\\n    \\\"abilities\\\": [\\\"read:products\\\", \\\"write:transactions\\\"],\\n    \\\"whitelist_host\\\": [],\\n    \\\"expires_at\\\": \\\"\\\"\\n}\",\n                                    \"options\": { \"raw\": { \"language\": \"json\" } }\n                                },\n                                \"url\": {\n                                    \"raw\": \"{{url-local}}/api/v1/system/service-token/create\",\n                                    \"host\": [\"{{url-local}}\"],\n                                    \"path\": [\"api\", \"v1\", \"system\", \"service-token\", \"create\"]\n                                }\n                            }\n                        },\n                        {\n                            \"name\": \"ServiceToken - List (Data)\",\n                            \"request\": {\n                                \"method\": \"POST\",\n                                \"description\": \"Daftar service token dengan paginasi (environment Local).\\n\\nPermission: system.service-token.list. Hash token tidak pernah ditampilkan di list/view.\\n\\nFilter exact: id, user_id, status. Filter LIKE: username, name. Sortable: id, user_id, username, name, last_used_at, expires_at, created_at, status.\",\n                                \"body\": {\n                                    \"mode\": \"raw\",\n                                    \"raw\": \"{\\n    \\\"filter\\\": {\\n        \\\"username\\\": \\\"pos\\\",\\n        \\\"status\\\": 1\\n    },\\n    \\\"page\\\": 1,\\n    \\\"page_size\\\": 20,\\n    \\\"sort\\\": {\\n        \\\"by\\\": \\\"id\\\",\\n        \\\"dir\\\": \\\"asc\\\"\\n    }\\n}\",\n                                    \"options\": { \"raw\": { \"language\": \"json\" } }\n                                },\n                                \"url\": {\n                                    \"raw\": \"{{url-local}}/api/v1/system/service-token/data\",\n                                    \"host\": [\"{{url-local}}\"],\n                                    \"p \"{{url-dev}}/api/v1/another-example\",\n                            \"host\": [\"{{url-dev}}\"],\n                            \"path\": [\"api\", \"v1\", \"another-example\"]\n                        }\n                    }\n                },\n                {\n                    \"name\": \"AnotherExample - Create\",\n                    \"request\": {\n                        \"method\": \"POST\",\n                        \"description\": \"Buat record AnotherExample baru (environment Dev).\\n\\nPermission: another-example.create. example_id harus merujuk record Example yang ada di database Dev, bukan Local. detail_info audit diisi otomatis dari actor yang terautentikasi.\",\n                        \"body\": {\n                            \"mode\": \"raw\",\n                            \"raw\": \"{\\n    \\\"name\\\": \\\"Another example\\\",\\n    \\\"status\\\": 1,\\n    \\\"example_id\\\": 1,\\n    \\\"detail_info\\\": null\\n}\",\n                            \"options\": { \"raw\": { \"language\": \"json\" } }\n                        },\n                        \"url\": {\n                            \"raw\": \"{{url-dev}}/api/v1/another-example/create\",\n                            \"host\": [\"{{url-dev}}\"],\n                            \"path\": [\"api\", \"v1\", \"another-example\", \"create\"]\n                        }\n                    }\n                },\n                {\n                    \"name\": \"System\",\n                    \"item\": [\n                        {\n                            \"name\": \"ServiceToken - Issue (Create)\",\n                            \"request\": {\n                                \"method\": \"POST\",\n                                \"description\": \"Terbitkan service token baru (environment Dev).\\n\\nPermission: system.service-token.create. Butuh Bearer token valid yang diterbitkan untuk environment Dev.\\n\\nPENTING: plaintext token hanya muncul sekali di data.token — yang disimpan di DB hanya SHA-256-nya.\\n\\nFitur ini opt-in: butuh app.service_token.enabled=true di .env environment Dev.\",\n                                \"body\": {\n                                    \"mode\": \"raw\",\n                                    \"raw\": \"{\\n    \\\"username\\\": \\\"pos_cabang_a\\\",\\n    \\\"name\\\": \\\"Aplikasi Kasir Cabang A\\\",\\n    \\\"abilities\\\": [\\\"read:products\\\", \\\"write:transactions\\\"],\\n    \\\"whitelist_host\\\": [],\\n    \\\"expires_at\\\": \\\"\\\"\\n}\",\n                                    \"options\": { \"raw\": { \"language\": \"json\" } }\n                                },\n                                \"url\": {\n                                    \"raw\": \"{{url-dev}}/api/v1/system/service-token/create\",\n                                    \"host\": [\"{{url-dev}}\"],\n                                    \"path\": [\"api\", \"v1\", \"system\", \"service-token\", \"create\"]\n                                }\n                            }\n                        },\n                        {\n                            \"name\": \"ServiceToken - List (Data)\",\n                            \"request\": {\n                                \"method\": \"POST\",\n                                \"description\": \"Daftar service token dengan paginasi (environment Dev).\\n\\nPermission: system.service-token.list. Hash token tidak pernah ditampilkan di list/view.\\n\\nFilter exact: id, user_id, status. Filter LIKE: username, name. Sortable: id, user_id, username, name, last_used_at, expires_at, created_at, status.\",\n                                \"body\": {\n                                    \"mode\": \"raw\",\n                                    \"raw\": \"{\\n    \\\"filter\\\": {\\n        \\\"username\\\": \\\"pos\\\",\\n        \\\"status\\\": 1\\n    },\\n    \\\"page\\\": 1,\\n    \\\"page_size\\\": 20,\\n    \\\"sort\\\": {\\n        \\\"by\\\": \\\"id\\\",\\n        \\\"dir\\\": \\\"asc\\\"\\n    }\\n}\",\n                                    \"options\": { \"raw\": { \"language\": \"json\" } }\n                                },\n                                \"url\": {\n                                    \"raw\": \"{{url-dev}}/api/v1/system/service-token/data\",\n                                    \"host\": [\"{{url-dev}}\"],\n                                    \"path\": [\"api\", \"v1\", \"system\", \"service-token\", \"data\"]\n                                }\n                            }\n                        },\n                        {\n                            \"name\": \"ServiceToken - View\",\n                            \"request\": {\n                                \"method\": \"GET\",\n                                \"description\": \"Detail satu service token by id (environment Dev).\\n\\nPermission: system.service-token.view. Ganti {id} di URL dengan id token.\",\n                                \"url\": {\n                                    \"raw\": \"{{url-dev}}/api/v1/system/service-token/1\",\n                                    \"host\": [\"{{url-dev}}\"],\n                                    \"path\": [\"api\", \"v1\", \"system\", \"service-token\", \"1\"]\n                                }\n                            }\n                        },\n                        {\n                            \"name\": \"ServiceToken - Update / Rotate\",\n                            \"request\": {\n                                \"method\": \"PUT\",\n                                \"description\": \"Update service token (environment Dev).\\n\\nPermission: system.service-token.update. Ganti {id} di URL dengan id token.\\n\\n- username bisa di-rename (tetap unique, duplikat → 409).\\n- regenerate: true me-rotate secret — bearer lama langsung mati, plaintext baru dikembalikan sekali di data.token.\\n- status: 1 active, 0 inactive.\",\n                                \"body\": {\n                                    \"mode\": \"raw\",\n                                    \"raw\": \"{\\n    \\\"username\\\": \\\"pos_cabang_a\\\",\\n    \\\"name\\\": \\\"Aplikasi Kasir Cabang A\\\",\\n    \\\"abilities\\\": [\\\"read:products\\\"],\\n    \\\"whitelist_host\\\": [],\\n    \\\"expires_at\\\": \\\"\\\",\\n    \\\"regenerate\\\": false,\\n    \\\"status\\\": 1\\n}\",\n                                    \"options\": { \"raw\": { \"language\": \"json\" } }\n                                },\n                                \"url\": {\n                                    \"raw\": \"{{url-dev}}/api/v1/system/service-token/1\",\n                                    \"host\": [\"{{url-dev}}\"],\n                                    \"path\": [\"api\", \"v1\", \"system\", \"service-token\", \"1\"]\n                                }\n                            }\n                        },\n                        {\n                            \"name\": \"ServiceToken - Revoke (Delete)\",\n                            \"request\": {\n                                \"method\": \"DELETE\",\n                                \"description\": \"Revoke service token (soft delete, environment Dev).\\n\\nPermission: system.service-token.delete. Ganti {id} di URL dengan id token. Efek langsung — bearer token berhenti berfungsi pada request berikutnya.\",\n                                \"url\": {\n                                    \"raw\": \"{{url-dev}}/api/v1/system/service-token/1\",\n                                    \"host\": [\"{{url-dev}}\"],\n                                    \"path\": [\"api\", \"v1\", \"system\", \"service-token\", \"1\"]\n                                }\n                            }\n                        },\n                        {\n                            \"name\": \"Cache - Purge\",\n                            \"request\": {\n                                \"method\": \"POST\",\n                                \"description\": \"Purge semua cache yang tergenerate (environment Dev).\\n\\nPermission: system.cache.purge.\\n\\nMembersihkan semua store cache: PSR-16 cache, Yii cache, FileCache @runtime/cache (termasuk DB schema cache), Redis (flushDB — hanya bila enabled), OPcache, dan realpath/stat cache.\\n\\nResponse data.results melaporkan status per store: purged, skipped, atau failed (pesan di detail).\",\n                                \"url\": {\n                                    \"raw\": \"{{url-dev}}/api/v1/system/cache/purge\",\n                                    \"host\": [\"{{url-dev}}\"],\n                                    \"path\": [\"api\", \"v1\", \"system\", \"cache\", \"purge\"]\n                                }\n                            }\n                        }\n                    ]\n                }\n            ]\n        }\n    ],\n    \"variable\": [\n        { \"key\": \"url-local\", \"value\": \"http://localhost:8080\", \"type\": \"string\" },\n        { \"key\": \"url-dev\", \"value\": \"https://dev.example.com\", \"type\": \"string\" },\n        { \"key\": \"bearer-token\", \"value\": \"\", \"type\": \"string\" }\n    ]\n}\n"}</script>
<script>
const DOCS = JSON.parse(document.getElementById("docs").textContent);

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

function inline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g,"<code>$1</code>");
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g,'<img alt="$1" src="$2" style="max-width:100%">');
  // link .md internal → hash viewer (tetap di halaman ini); link lain dibuka normal
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function(m,t,href){
    const clean = href.replace(/^\.{0,2}\//,"").split("/").pop();
    if(/\.md$/i.test(clean)) return '<a href="#'+clean+'">'+t+'</a>';
    return '<a href="'+href+'" target="_blank" rel="noopener">'+t+'</a>';
  });
  s = s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g,"$1<em>$2</em>");
  return s;
}

// syntax highlighter ringan: php / bash-env / json-yaml
function hl(code, lang){
  let h = esc(code);
  if(lang === "php"){
    h = h.replace(/(&quot;|")([^"&<>\n]*)("|&quot;)/g,'<span class="s">$1$2$3</span>');
    h = h.replace(/'([^'&<>\n]*)'/g,'<span class="s">\'$1\'</span>');
    h = h.replace(/(\/\/[^\n]*|\/\*[\s\S]*?\*\/|#[^\n]*)/g,'<span class="c">$1</span>');
    h = h.replace(/\b(declare|strict_types|namespace|use|final|readonly|class|interface|trait|enum|extends|implements|public|private|protected|static|function|return|new|fn|match|if|elseif|else|foreach|for|while|do|switch|case|default|break|continue|try|catch|finally|throw|self|parent|const|true|false|null|void|int|string|bool|float|array|object|iterable|callable|mixed|never|static|yield|from|as|instanceof|echo|print|require|include)\b/g,'<span class="k">$1</span>');
    h = h.replace(/(\$[A-Za-z_]\w*)/g,'<span class="v">$1</span>');
    h = h.replace(/\b([A-Z][A-Za-z0-9_\\]+)\b/g,'<span class="t">$1</span>');
    h = h.replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="n">$1</span>');
  } else if(lang === "bash" || lang === "sh" || lang === "env" || lang === "dotenv"){
    h = h.replace(/(#[^\n]*)/g,'<span class="c">$1</span>');
    h = h.replace(/^([A-Za-z_][\w.]*=)/gm,'<span class="v">$1</span>');
    h = h.replace(/\b(composer|php|vendor\/bin\/\w+|codecept|psalm|yii|make|docker|curl|export|cd|rm|cp|mv|mkdir|git)\b/g,'<span class="k">$1</span>');
  } else if(lang === "json"){
    h = h.replace(/(&quot;|")([^"&<>\n]*)("|&quot;)(\s*:)?/g,'<span class="s">$1$2$3</span>$4');
    h = h.replace(/\b(true|false|null|\d+(?:\.\d+)?)\b/g,'<span class="n">$1</span>');
  } else if(lang === "yaml" || lang === "yml"){
    h = h.replace(/(#[^\n]*)/g,'<span class="c">$1</span>');
    h = h.replace(/^([\s-]*)([\w.-]+)(:)/gm,'$1<span class="v">$2</span>$3');
  }
  return h;
}

function md(src){
  const lines = src.split(/\r?\n/);
  let html = "", i = 0, list = null;

  const closeList = () => { if(list){ html += "</"+list+">"; list=null; } };

  while(i < lines.length){
    let line = lines[i];

    // fenced code block
    let m = line.match(/^```(\w*)/);
    if(m){
      closeList();
      let buf = []; i++;
      while(i < lines.length && !/^```\s*$/.test(lines[i])) buf.push(lines[i++]);
      i++;
      html += "<pre><code>" + hl(buf.join("\n"), m[1].toLowerCase()) + "</code></pre>";
      continue;
    }

    // table: header | --- | rows
    if(/^\s*\|.*\|\s*$/.test(line) && i+1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      closeList();
      const cells = l => l.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      html += "<table><thead><tr>" + cells(line).map(c=>"<th>"+inline(c)+"</th>").join("") + "</tr></thead><tbody>";
      i += 2;
      while(i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){
        html += "<tr>" + cells(lines[i]).map(c=>"<td>"+inline(c)+"</td>").join("") + "</tr>";
        i++;
      }
      html += "</tbody></table>";
      continue;
    }

    // heading
    m = line.match(/^(#{1,6})\s+(.*)/);
    if(m){ closeList(); const lv = m[1].length; html += `<h${lv}>`+inline(m[2])+`</h${lv}>`; i++; continue; }

    // hr
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(line)){ closeList(); html += "<hr>"; i++; continue; }

    // blockquote
    if(/^\s*>\s?/.test(line)){
      closeList();
      let buf = [];
      while(i < lines.length && /^\s*>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/,""));
      html += "<blockquote><p>"+inline(buf.join(" "))+"</p></blockquote>";
      continue;
    }

    // unordered list
    m = line.match(/^(\s*)[-*+]\s+(.*)/);
    if(m){
      if(list !== "ul"){ closeList(); html += "<ul>"; list = "ul"; }
      html += "<li>"+inline(m[2])+"</li>"; i++; continue;
    }

    // ordered list
    m = line.match(/^\s*\d+[.)]\s+(.*)/);
    if(m){
      if(list !== "ol"){ closeList(); html += "<ol>"; list = "ol"; }
      html += "<li>"+inline(m[1])+"</li>"; i++; continue;
    }

    // blank
    if(/^\s*$/.test(line)){ closeList(); i++; continue; }

    // paragraph (merge until blank/structural line)
    closeList();
    let buf = [line];
    i++;
    while(i < lines.length && lines[i].trim() !== "" &&
          !/^(#{1,6}\s|```|\s*[-*+]\s|\s*\d+[.)]\s|\s*>\s?|\s*\|.*\||\s*-{3,}\s*$)/.test(lines[i])){
      buf.push(lines[i++]);
    }
    html += "<p>"+inline(buf.join(" "))+"</p>";
  }
  closeList();
  return html;
}

// ---- postman collection viewer ----
function methodBadge(m){
  const colors={GET:"#61afef",POST:"#98c379",PUT:"#e5c07b",PATCH:"#e5c07b",DELETE:"#e06c75",HEAD:"#56b6c2",OPTIONS:"#c678dd"};
  const c = colors[m] || "#abb2bf";
  return '<span class="method" style="color:'+c+';border-color:'+c+'">'+esc(m)+'</span>';
}

function renderPostmanItems(items, lvl){
  let html = "";
  items.forEach(it=>{
    if(it.item){
      html += "<h"+lvl+">"+inline(it.name)+"</h"+lvl+">";
      if(it.description) html += '<p class="coldesc">'+inline(it.description)+"</p>";
      html += renderPostmanItems(it.item, Math.min(lvl+1,4));
    } else if(it.request){
      const r = it.request;
      const url = typeof r.url === "string" ? r.url : (r.url && (r.url.raw || r.url.host)) || "";
      html += '<div class="req"><div class="reqhead">'+methodBadge(r.method || "GET")+"<b>"+inline(it.name)+"</b></div>";
      html += '<code class="requrl">'+esc(url)+"</code>";
      if(r.description) html += '<p class="coldesc">'+inline(r.description).replace(/\n/g,"<br>")+"</p>";
      if(r.body && r.body.raw) html += "<pre><code>"+hl(r.body.raw,"json")+"</code></pre>";
      html += "</div>";
    }
  });
  return html;
}

function renderPostman(col){
  let html = "<h1>"+esc(col.info.name)+"</h1>";
  if(col.info.description) html += '<p class="coldesc">'+inline(col.info.description).replace(/\n/g,"<br>")+"</p>";
  if(col.variable && col.variable.length){
    html += "<h3>Collection Variable</h3><table><thead><tr><th>Key</th><th>Value</th></tr></thead><tbody>";
    col.variable.forEach(v=>{ html += "<tr><td><code>"+esc(v.key)+"</code></td><td><code>"+esc(String(v.value ?? ""))+"</code></td></tr>"; });
    html += "</tbody></table>";
  }
  html += renderPostmanItems(col.item || [], 2);
  return html;
}

// ---- sidebar + routing ----
const menu = document.getElementById("menu");
const content = document.getElementById("content");
const files = Object.keys(DOCS);

const title = f => f
  .replace(/\.postman_collection\.json$/i," Postman")
  .replace(/\.(md|json)$/i,"")
  .replace(/^\d+-/,"")
  .replace(/[-_]?guide$/i,"")
  .replace(/[-_]/g," ")
  .replace(/\b\w/g,c=>c.toUpperCase());

files.forEach(f=>{
  const a = document.createElement("a");
  a.href = "#"+f; a.textContent = title(f); a.dataset.file = f;
  menu.appendChild(a);
});

function show(f){
  if(!DOCS[f]){ content.innerHTML = '<div class="empty"><h2>Pilih dokumen di menu kiri</h2><p>'+files.length+' guide tersedia.</p></div>'; return; }
  let html;
  if(/\.json$/i.test(f)){
    let col = null;
    try{ col = JSON.parse(DOCS[f]); }catch(e){}
    html = (col && col.info && col.item) ? renderPostman(col) : "<pre><code>"+hl(DOCS[f],"json")+"</code></pre>";
    const href = "data:application/json;charset=utf-8," + encodeURIComponent(DOCS[f]);
    html = '<p><a class="dl" href="'+href+'" download="'+esc(f)+'">⬇ Download '+esc(f)+'</a></p>' + html;
  } else {
    html = md(DOCS[f]);
  }
  content.innerHTML = html;
  menu.querySelectorAll("a").forEach(a=>a.classList.toggle("active", a.dataset.file===f));
  window.scrollTo(0,0);
}

window.addEventListener("hashchange",()=>show(location.hash.slice(1)));
show(location.hash.slice(1) || "");

document.getElementById("q").addEventListener("input",e=>{
  const q = e.target.value.toLowerCase();
  menu.querySelectorAll("a").forEach(a=>{
    a.style.display = a.textContent.toLowerCase().includes(q) ? "" : "none";
  });
});
</script>
</body>
</html>
