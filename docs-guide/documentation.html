API index test\n│   │   └── NotFoundCest.php # Not found test\n│   ├── Console/            # Console tests\n│   │   ├── HelloCommandCest.php # Hello command test\n│   │   └── YiiCest.php     # Yii framework test\n│   ├── Functional/         # Functional tests\n│   │   └── HomePageCest.php # Home page functional test\n│   ├── Support/            # Test support classes\n│   │   ├── _generated/     # Generated test files\n│   │   ├── ApiTester.php   # API test helper\n│   │   ├── ConsoleTester.php # Console test helper\n│   │   ├── FunctionalTester.php # Functional test helper\n│   │   └── UnitTester.php  # Unit test helper\n│   ├── Unit/              # Unit tests\n│   │   ├── Api/Shared/    # Api shared component tests\n│   │   └── EnvironmentTest.php # Environment test\n│   ├── bootstrap.php       # Test bootstrap\n│   ├── .gitignore          # Test git ignore patterns\n│   ├── Api.suite.yml       # API test suite configuration\n│   ├── Console.suite.yml   # Console test suite configuration\n│   ├── Functional.suite.yml # Functional test suite configuration\n│   └── Unit.suite.yml      # Unit test suite configuration\n├── composer.json           # Composer manifest (App\\ → src, App\\Tests\\ → tests)\n├── yii                     # Console entry point\n├── quality                 # Quality tools runner (PHP CS Fixer, Psalm, Codeception)\n├── Makefile                # Docker/Make task runner\n├── codeception.yml         # Codeception configuration\n├── psalm.xml               # Psalm configuration\n├── rector.php              # Rector configuration\n├── .env.example            # Environment variable template\n└── vendor/                 # Composer dependencies\n    └── ...                 # Third-party packages\n```\n\n### Tanggung Jawab Lapisan\n\n#### API Layer (`src/Api/`)\n- **Actions**: Kelas invokable yang menangani HTTP request dan mengembalikan response PSR-7\n- **Middleware**: Cross-cutting concern (authentication, logging, dll.)\n- **Presenters/ResponseFactory**: Pemformatan response (`src/Api/Shared/`)\n- **Validation**: Validasi dan sanitasi input (`*/Validation/*InputValidator.php`)\n\n#### Application Layer (`src/Application/`)\n- **Application Services**: Mengoordinasikan use case dan workflow\n- **Command/Response DTOs**: Data transfer object untuk input/output\n- **Factories**: `DetailInfoFactory`, `SearchCriteriaFactory`, `SyncFlagFactory`\n\n#### Domain Layer (`src/Domain/`)\n- **Entities**: Objek bisnis inti dengan identity dan behavior\n- **Value Objects**: Struktur data immutable (`src/Domain/Shared/Core/ValueObject/`)\n- **Enums**: `SyncStatus`, `SyncDirection` (`src/Domain/Shared/Core/Enum/`)\n- **Domain Services**: Logika bisnis yang tidak cocok ditempatkan di entity\n- **Repositories**: Interface abstraksi akses data\n- **Concerns**: Trait entity/service yang dapat dipakai ulang (`Identifiable`, `Stateful`, `Descriptive`, `DomainValidator`)\n\n#### Infrastructure Layer (`src/Infrastructure/`)\n- **Repositories**: Implementasi konkret akses data (`src/Infrastructure/Common/Persistence/`)\n- **Database**: Koneksi Yiisoft/Db, service MongoDB dan Redis\n- **Security**: Authentication, authorization, provider actor/current-user\n- **Audit**: Logging dan audit trail (`DatabaseAuditService`)\n- **Monitoring**: Request id, structured logging, metrics, middleware error monitoring\n\n## 🔄 Alur Data\n\n### Alur Pemrosesan Request\n\n```\nHTTP Request\n    ↓\nMiddleware Chain\n    ↓\nInvokable Action (PSR-15 handler)\n    ↓\nApplication Service\n    ↓\nRepository\n    ↓\nDatabase/External API\n    ↓\nResponse\n```\n\n### Contoh: Membuat Entity Example\n\n```\n1. HTTP POST /v1/example/create\n2. RequestParamsMiddleware parses the request into a `payload` (RequestParams) attribute\n3. ExampleCreateAction whitelists + sanitizes input and runs ExampleInputValidator (CREATE context)\n4. ExampleCreateAction builds CreateExampleCommand and calls ExampleApplicationService\n5. ApplicationService builds DetailInfo via DetailInfoFactory and creates the Example entity\n6. ApplicationService calls ExampleRepository.insert()\n7. Repository saves to database, reconstitutes the entity, and syncs to MongoDB\n   (sync_mdb is set to 1 when the MongoDB sync fails, null when synced)\n8. ResponseFactory wraps ExampleResponse data in a success response\n```\n\n## 🧩 Komponen\n\n### Komponen Inti\n\n#### Domain Entities (`src/Domain/Example/Entity/Example.php`)\n```php\nfinal class Example\n{\n    use Identifiable, Stateful, Descriptive;\n\n    public const RESOURCE = 'Example';\n\n    private LockVersion $lockVersion;\n\n    protected function __construct(\n        private readonly ?int $id,\n        private string $name,\n        private ResourceStatus $status,\n        private DetailInfo $detailInfo,\n        private ?SyncMdb $syncMdb = null,\n        ?LockVersion $lockVersion = null,\n    ) {\n        $this->resource    = self::RESOURCE;\n        $this->lockVersion = $lockVersion ?? LockVersion::create();\n    }\n\n    public static function create(\n        string $name,\n        ResourceStatus $status,\n        DetailInfo $detailInfo,\n        ?SyncMdb $syncMdb = null,\n    ): self {\n        self::guardInitialStatus(status: $status, resource: self::RESOURCE);\n\n        return new self(null, $name, $status, $detailInfo, $syncMdb, LockVersion::create());\n    }\n\n    public static function reconstitute(\n        int $id,\n        string $name,\n        ResourceStatus $status,\n        DetailInfo $detailInfo,\n        ?SyncMdb $syncMdb = null,\n        ?LockVersion $lockVersion = null,\n    ): self { /* ... */ }\n}\n```\n\n`src/Domain/AnotherExample/Entity/AnotherExample.php` mengikuti pola yang sama namun\njuga membawa `?SyncFlag $syncFlag` (kolom sync master/origin `origin_id` + `sync_flag`)\nserta referensi `exampleId` ke `Example`.\n\n#### Application Service (`src/Application/Example/ExampleApplicationService.php`)\n```php\nfinal class ExampleApplicationService\n{\n    public function __construct(\n        private AuthorizerInterface $auth,\n        private DetailInfoFactory $detailInfoFactory,\n        private ExampleRepositoryInterface $repository,\n        private ExampleDomainService $domainService\n    ) {}\n\n    public function create(CreateExampleCommand $command): ExampleResponse\n    {\n        // DetailInfo with change_log created by the factory (uses CurrentUser + clock)\n        $detailInfo = $this->detailInfoFactory\n            ->create(detailInfo: [])\n            ->build();\n\n        // Entity creation (status guarded by guardInitialStatus)\n        $data = Example::create(\n            name: $command->name,\n            status: ResourceStatus::from($command->status),\n            detailInfo: $detailInfo\n        );\n\n        // Persistence\n        return ExampleResponse::fromEntity(\n            entity: $this->repository->insert(entity: $data)\n        );\n    }\n}\n```\n\n`AnotherExampleApplicationService` juga meng-inject `SyncFlagFactory` dan membangun\nsync flag master/origin dari command (`origin_id` + `sync_flag`, `1` = belum tersinkron):\n\n```php\n$syncFlag = $this->syncFlagFactory->create(\n    originId: $command->originId,\n    syncFlag: $command->syncFlag ?? 1,\n);\n\n$data = AnotherExample::create(\n    name: $command->name,\n    status: ResourceStatus::from($command->status),\n    detailInfo: $detailInfo,\n    exampleId: $command->exampleId,\n    syncFlag: $syncFlag,\n);\n```\n\n#### Repository (`src/Infrastructure/Common/Persistence/Example/ExampleRepository.php`)\n```php\nfinal class ExampleRepository implements ExampleRepositoryInterface, CurrentUserAwareInterface\n{\n    use HasCoreFeatures;\n    use HasMongoDBSync;\n    use ManagesPersistence;\n\n    public const TABLE_NAME  = 'example';\n    public const SEQUENCE_ID = 'example_id_seq';\n\n    public function insert(Example $entity): Example\n    {\n        return $this->db->transaction(function () use ($entity) {\n            $this->db->createCommand()\n                ->insert(\n                    self::TABLE_NAME,\n                    $this->mapEntityToTable(\n                        entity: $entity,\n                        lockVersion: LockVersion::create()->value()\n                    )\n                )\n                ->execute();\n\n            $newId = (int) $this->db->getLastInsertID(self::SEQUENCE_ID);\n\n            // Reconstitute with the new ID\n            $newEntity = Example::reconstitute(\n                id: $newId,\n                name: $entity->getName(),\n                status: $entity->getStatus(),\n                detailInfo: $entity->getDetailInfo(),\n                lockVersion: LockVersion::create(),\n            );\n\n            // Push to MongoDB; sets sync_mdb=1 when the sync fails\n            $this->syncMongoDB(entity: $newEntity, schemaClass: MdbExampleSchema::class);\n\n            return $newEntity;\n        });\n    }\n}\n```\n\n`AnotherExampleRepository` identik bentuknya namun juga memetakan `origin_id` /\n`sync_flag` melalui `SyncFlag::fieldOriginId()` / `SyncFlag::fieldSyncFlag()`.\n\n## 🔌 Design Pattern\n\n### Repository Pattern\n\n```php\n// Interface (Domain Layer) — src/Domain/Example/Repository/ExampleRepositoryInterface.php\ninterface ExampleRepositoryInterface\n{\n    public function getResource(): string;\n    public function findById(int $id, ?int $status = null): ?Example;\n    public function findByName(string $name, ?int $status = null): ?Example;\n    public function existsByName(string $name, ?int $status = null): bool;\n    public function list(SearchCriteria $criteria): PaginatedResult;\n    public function insert(Example $example): Example;\n    public function update(Example $example): Example;\n    public function delete(Example $example): Example;\n    public function restore(int $id): ?Example;\n}\n\n// Implementation (Infrastructure Layer) — src/Infrastructure/Common/Persistence/Example/\nfinal class ExampleRepository implements ExampleRepositoryInterface, CurrentUserAwareInterface\n{\n    public function insert(Example $entity): Example\n    {\n        // Concrete implementation with Yiisoft/Db\n        return $this->db->transaction(function () use ($entity) {\n            // Database operations + MongoDB sync\n        });\n    }\n}\n```\n\nBinding interface → implementasi berada di `config/common/repository.php`, yang juga\nme-wire `LockVersionConfig` dan `CurrentUser` ke dalam repository melalui pemanggilan setter.\n\n### Factory Pattern\n\nFactory berada di `src/Application/Shared/Core/Factory/` dan `src/Application/AnotherExample/`:\n\n```php\n// DetailInfoFactory — builder-style factory that wraps payloads with change_log audit fields\nfinal class DetailInfoFactory\n{\n    public function __construct(\n        private DateTimeProviderInterface $dateTime,\n        private CurrentUser $currentUser\n    ) {}\n\n    public function create(array $detailInfo = []): self\n    {\n        $this->current = DetailInfo::createdLog(\n            dateTime: $this->dateTime,\n            user: $this->currentUser->getActor()->getUsername(),\n            payload: $detailInfo\n        );\n\n        return $this; // call ->build() to obtain the DetailInfo value object\n    }\n}\n\n// SyncFlagFactory — builds SyncFlag value objects (origin_id + sync_flag + direction)\n$syncFlag = $syncFlagFactory->create(originId: 5, syncFlag: 1); // from raw values\n$syncFlag = $syncFlagFactory->fromRequest($data);               // from request/array input\n$syncFlag = $syncFlagFactory->fromRecord($row);                 // from a DB row\n$syncFlag = $syncFlagFactory->masterToOrigin(originId: 5);      // master → origin\n$syncFlag = $syncFlagFactory->originToMaster(originId: 5);      // origin → master\n$syncFlag = $syncFlagFactory->bidirectional(originId: 5);       // both directions\n$syncFlag = $syncFlagFactory->synced();                         // already synced\n\n// SearchCriteriaFactory — builds SearchCriteria from parsed RequestParams\n$criteria = $searchCriteriaFactory->createFromRequest(\n    params: $payload,                                    // RequestParams from the 'payload' attribute\n    allowedSort: ['id' => 'id', 'name' => 'name'],\n);\n```\n\n### Command Query Separation\n\n```php\n// Commands (Application Layer) — src/Application/Example/Command/CreateExampleCommand.php\nfinal readonly class CreateExampleCommand\n{\n    public function __construct(\n        public string $name,\n        public int $status,\n        public ?array $detailInfo,\n    ) {}\n}\n\n// CreateAnotherExampleCommand additionally carries:\n//   public int $exampleId, public ?int $originId, public ?int $syncFlag\n\n// Response DTOs (Application Layer) — src/Application/Example/Dto/ExampleResponse.php\nfinal readonly class ExampleResponse\n{\n    public function __construct(\n        public int $id,\n        public string $name,\n        public int $status,\n        public array $detail_info,\n        public ?int $sync_mdb,\n        public int $lock_version,\n    ) {}\n\n    public static function fromEntity(Example $entity): self\n    {\n        return new self(\n            id: $entity->getId(),\n            name: $entity->getName(),\n            status: $entity->getStatus()->value(),\n            detail_info: $entity->getDetailInfo()->toArray(),\n            sync_mdb: $entity->getSyncMdbValue(),\n            lock_version: $entity->getLockVersion()->value(),\n        );\n    }\n\n    public function toArray(): array\n    {\n        return \\get_object_vars($this);\n    }\n}\n\n// AnotherExampleResponse additionally exposes example_id, origin_id and sync_flag.\n```\n\n## 🔐 Arsitektur Security\n\n### Authentication & Authorization\n\n```php\n// Middleware are defined in config/common/di/middleware-di.php and stacked via\n// config/common/middleware.php or per-route group (see config/common/routes.php):\n//   JwtMiddleware            – JWT authentication (App\\Presentation\\Core\\Http\\Middleware)\n//   AccessMiddleware         – per-route permission check ('permission' route default)\n//   RateLimitMiddleware      – request rate limiting\n//   CorsMiddleware, SecureHeadersMiddleware, TrustedHostMiddleware, HstsMiddleware\n//   RequestParamsMiddleware  – parses filter/pagination/sort into the 'payload' attribute\n\n// Authorization Service — src/Infrastructure/Core/Security/RbacAuthorizer.php\nfinal class RbacAuthorizer implements AuthorizerInterface\n{\n    public function __construct(\n        private Actor $actor,\n        private PermissionChecker $checker\n    ) {}\n\n    public function can(string $permission): bool\n    {\n        return $this->checker->can($this->actor, $permission);\n    }\n}\n```\n\n### Validasi Input\n\n```php\n// Actions validate input via an AbstractValidator subclass + a ValidationContext\n// (src/Api/V1/Example/Validation/ExampleInputValidator.php)\nfinal class ExampleInputValidator extends AbstractValidator\n{\n    protected function rules(string $context): array\n    {\n        return match ($context) {\n            ValidationContext::CREATE => [\n                'name'   => [new StopOnError([new Required(), new StringValue(), new Length(min: 3, max: 255)])],\n                'status' => [new Required(), new Integer(), new In(RecordStatus::draftOnlyStates())],\n            ],\n            // UPDATE / DELETE / SEARCH contexts ...\n            default => [],\n        };\n    }\n}\n\n// In the action:\n$this->inputValidator->validate(data: $params, context: ValidationContext::CREATE);\n\n// Input Sanitization — App\\Shared\\Core\\Security\\InputSanitizer\n$sanitized = InputSanitizer::process($rawInput);\n```\n\n### Audit Trail\n\n```php\nfinal class DatabaseAuditService implements AuditServiceInterface\n{\n    public function log(\n        string $tableName,\n        int $recordId,\n        string $action,\n        ?array $oldValues = null,\n        ?array $newValues = null,\n        ?ActorInterface $actor = null,\n        ?string $ipAddress = null,\n        ?string $userAgent = null\n    ): void {\n        // Log audit trail to database\n    }\n}\n```\n\n## 🚀 Pertimbangan Performa\n\n### Optimasi Database\n\n#### Query Builder\n```php\n// Repositories use Yiisoft\\Db\\Query directly\n$row = (new Query($this->db))\n    ->from(self::TABLE_NAME)\n    ->where(['id' => $id])\n    ->andWhere($this->scopeWhereNotDeleted())\n    ->one();\n```\n\n#### Schema Caching\n```php\n// DB schema is cached via FileCache + SchemaCache\n// (wired in config/common/di/db-pgsql.php / db-mysql.php)\nSchemaCache::class => [\n    'class'         => SchemaCache::class,\n    '__construct()' => [Reference::to(FileCache::class)],\n    'setEnabled()'  => [true],\n],\n```\n\n#### Strategi Caching\n```php\n// PSR-16 cache implementations are available:\n//   yiisoft/cache-file  → FileCache (used for DB schema cache)\n//   yiisoft/cache-redis → Redis-backed cache (params: 'yiisoft/cache-redis')\n// RedisService (App\\Infrastructure\\Core\\Database\\Redis) can also be used for\n// write-through caching — see AnotherExampleApplicationService::createWithRedisCache().\n```\n\n## 📊 Monitoring & Logging\n\n### Logging Aplikasi\n\n```php\n// PSR-3 logger injection (yiisoft/log, file target)\npublic function __construct(\n    private LoggerInterface $logger\n) {}\n\n$this->logger->info('User created', ['user_id' => $userId, 'ip' => $ip]);\n```\n\n### HTTP Monitoring Middleware\n\nObservability pada level request ditangani oleh middleware di\n`src/Infrastructure/Core/Monitoring/` (dikonfigurasi di `config/common/di/middleware-di.php`\ndan diatur melalui params `app/monitoring`):\n\n- `RequestIdMiddleware` — memberikan/meneruskan header `X-Request-Id`\n- `StructuredLoggingMiddleware` — structured logging untuk request/response\n- `MetricsMiddleware` — metric response time, jumlah request, status code, dan memori\n- `ErrorMonitoringMiddleware` — penangkapan dan pelaporan exception/error\n\n### Penanganan Error\n\n```php\ntry {\n    $result = $this->riskyOperation();\n} catch (\\Throwable $e) {\n    $this->logger->error('Operation failed', [\n        'error' => $e->getMessage(),\n        'trace' => $e->getTraceAsString(),\n    ]);\n    throw $e;\n}\n```\n\n### Monitoring Performa\n\n```php\n// Performance metrics\n$startTime = microtime(true);\n$result = $this->complexOperation();\n$duration = (microtime(true) - $startTime) * 1000; // milliseconds\n\n$this->logger->info('Operation completed', ['duration' => $duration]);\n```\n\n## 🔧 Workflow Development\n\n### Development Lokal\n\n```bash\n# Jalankan development server (composer script: @php ./yii serve)\ncomposer serve\n\n# Jalankan semua quality check (PHP CS Fixer + Psalm + unit test + composer audit)\nphp quality quality:check\n\n# Perbaiki masalah code style secara otomatis\nphp quality quality:check --fix\n\n# Jalankan test (Codeception)\ncomposer test                       # codecept run — semua suite\nvendor/bin/codecept run Unit        # hanya unit suite\nphp quality test:run --unit         # sama, via quality runner\n\n# Generate laporan coverage\nphp quality quality:check --coverage\n```\n\n### Strategi Testing\n\n#### Unit Test\n```php\nfinal class ExampleTest extends TestCase\n{\n    public function testCreate(): void\n    {\n        $example = Example::create(\n            name: 'Test Example',\n            status: ResourceStatus::draft(),\n            detailInfo: DetailInfo::fromArray([]),\n        );\n\n        $this->assertNull($example->getId());\n        $this->assertSame('Test Example', $example->getName());\n    }\n}\n```\n\n#### API Test (format Cest Codeception)\n```php\nfinal class IndexCest\n{\n    public function getHome(ApiTester $I): void\n    {\n        $I->sendGET('/');\n        $I->seeResponseCodeIs(HttpCode::OK);\n        $I->seeResponseIsJson();\n        $I->seeResponseContainsJson(['status' => 'success']);\n    }\n}\n```\n\n#### Functional Test\n```php\nfinal class HomePageCest\n{\n    public function base(FunctionalTester $tester): void\n    {\n        $response = $tester->sendRequest(new ServerRequest(uri: '/'));\n\n        $output = $response->getBody()->getContents();\n        assertJson($output);\n    }\n}\n```\n\n## 🚀 Deployment\n\n### Konfigurasi Environment\n\nEnvironment variable dideklarasikan di `.env` (lihat `.env.example`) dan dibaca oleh\n`App\\Environment` / `config/common/params.php`.\n\n#### Environment Development\n```bash\n# Konfigurasi development\nAPP_ENV=dev\nAPP_DEBUG=1\n```\n\n#### Environment Production\n```bash\n# Konfigurasi production\nAPP_ENV=prod\nAPP_DEBUG=0\n```\n\nVariabel penting lainnya: `db.default.*` (driver/host/kredensial SQL),\n`db.mongodb.*` (target sync MongoDB), `redis.default.*`, `app.jwt.*`,\n`app.cors.*`, `app.optimistic_lock.*`, `app.rateLimit.*`.\n\n### Docker Deployment\n\n#### Dockerfile\n\n`docker/Dockerfile` adalah multi-stage build FrankenPHP:\n\n```dockerfile\nFROM dunglas/frankenphp:1-php8.2-bookworm AS base\n# PHP extensions installed via install-php-extensions\n# (opcache, mbstring, intl, dom, ctype, curl, phar, openssl, xml, pdo, ...)\n\nFROM base AS dev\n# adds xdebug + composer, runs as non-root 'appuser'\n\nFROM base AS prod-builder\n# composer install --no-dev --classmap-authoritative\n\nFROM base AS prod\nENV APP_ENV=prod\n# runs as www-data\n```\n\n#### Docker Compose\n\n`docker/compose.yml` adalah definisi dasar yang minimal; overlay per-environment berada\ndi `docker/dev/compose.yml`, `docker/test/compose.yml` dan\n`docker/prod/compose.yml`. `Makefile` membungkus task-task umum:\n\n```bash\nmake up        # docker compose -f docker/compose.yml -f docker/dev/compose.yml up -d\nmake down      # hentikan environment dev\nmake test      # jalankan codecept di dalam environment test\nmake prod-build  # build image production (docker/Dockerfile --target prod)\n```\n\n### CI/CD Pipeline\n\nTidak ada pipeline CI yang di-commit ke template proyek ini. Pipeline pada umumnya\nsebaiknya menjalankan pemeriksaan yang sama seperti yang dipakai secara lokal:\n\n```bash\ncomposer install\nphp quality quality:check            # cs-fixer + psalm + unit test + composer audit\nphp quality quality:check --coverage # dengan laporan coverage\ncomposer test                        # codecept run\n```\n\n## 📚 Maintenance\n\n### Tugas Rutin\n\n#### Mingguan\n- Update dependensi: `composer update`\n- Jalankan quality check: `php quality quality:check`\n- Tinjau tren test coverage\n- Periksa security advisory: `composer audit`\n\n#### Bulanan\n- Tinjau dan update konfigurasi quality\n- Update coding standard\n- Tambahkan quality check baru sesuai kebutuhan\n- Review optimasi performa\n\n#### Kuartalan\n- Update dependensi mayor\n- Review threshold quality gate\n- Upgrade versi tool\n- Meeting review arsitektur\n\n### Update Versi\n\n#### Update Tool\n```bash\n# Update PHP CS Fixer\ncomposer require --dev friendsofphp/php-cs-fixer\n\n# Update Psalm\ncomposer require --dev vimeo/psalm\n\n# Update Codeception / PHPUnit\ncomposer require --dev codeception/codeception phpunit/phpunit\n```\n\n#### Update Konfigurasi\n```bash\n# Update konfigurasi quality\nvim .php-cs-fixer.php\nvim psalm.xml\nvim quality\n```\n\n---\n\n## 🎯 Kesimpulan\n\nArsitektur Yii3 API mengikuti prinsip clean architecture dengan pemisahan concern yang jelas dan struktur kode yang maintainable. Pendekatan DDD memastikan logika bisnis tetap independen dari urusan infrastruktur, sehingga sistem menjadi lebih testable, maintainable, dan scalable.\n\nManfaat arsitektur utama:\n\n- **Maintainability**: Batas lapisan yang jelas memudahkan perubahan\n- **Testability**: Logika bisnis dapat diuji secara terisolasi\n- **Scalability**: Clean architecture mendukung pertumbuhan\n- **Flexibility**: Mudah dimodifikasi dan diperluas\n- **Quality**: Pemeriksaan otomatis memastikan standar kualitas kode\n\nArsitektur ini menyediakan fondasi yang solid untuk membangun aplikasi API yang robust dan maintainable dengan Yii3! 🚀\n", "03-project-structure-guide.md": "# 📁 **Struktur Lengkap Project Yii3 API dengan DDD + Optimistic Locking**\n\n## **🏗️ ROOT DIRECTORY**\n```\nyii3-api-boilerplate/\n├── 📄 .dockerignore - Aturan ignore Docker\n├── 📄 .editorconfig - Konfigurasi editor\n├── 📄 .env - Environment variables\n├── 📄 .env.example - Contoh environment variables\n├── 📄 .gitignore - Aturan ignore Git\n├── 📄 .php-cs-fixer.php - Konfigurasi PHP CS Fixer\n├── 📄 Makefile - Otomasi build\n├── 📄 QUALITY_SUMMARY.md - Ringkasan kualitas kode\n├── 📄 c3.php - Konfigurasi Codeception (coverage)\n├── 📄 codeception.yml - Konfigurasi Codeception\n├── 📄 composer-dependency-analyser.php - Analisis dependency\n├── 📄 composer.json - Dependency PHP\n├── 📄 composer.lock - Dependency yang terkunci\n├── 📄 composer-template.json - Template composer\n├── 📄 infection.json.dist - Konfigurasi mutation testing\n├── 📄 psalm.xml - Konfigurasi static analysis\n├── 📄 quality - Script quality assurance\n├── 📄 rector.php - Konfigurasi refactoring PHP\n├── 📄 yii - Yii CLI executable\n└── 📄 yii.bat - Yii CLI untuk Windows\n```\n\n## **📁 CONFIGURATION**\n```\nconfig/\n├── 📄 .gitignore - Git ignore untuk config\n├── 📄 configuration.php - Konfigurasi utama\n├── 📁 common/ - Konfigurasi bersama\n│   ├── 📄 access.php - Konfigurasi access control\n│   ├── 📄 aliases.php - Alias class\n│   ├── 📄 application.php - Konfigurasi aplikasi\n│   ├── 📄 middleware.php - Middleware stack\n│   ├── 📄 params.php - Parameter aplikasi\n│   ├── 📄 routes.php - Definisi route\n│   ├── 📄 security.php - Konfigurasi keamanan\n│   └── 📁 di/ - Dependency injection\n│       ├── 📄 access-di.php - DI access control\n│       ├── 📄 application.php - DI aplikasi\n│       ├── 📄 audit.php - DI service audit\n│       ├── 📄 db-mongodb.php - DI MongoDB\n│       ├── 📄 db-pgsql.php - DI PostgreSQL\n│       ├── 📄 db-redis.php - DI Redis\n│       ├── 📄 error-handler.php - DI error handling\n│       ├── 📄 hydrator.php - DI data hydrator\n│       ├── 📄 infrastructure.php - DI infrastructure\n│       ├── 📄 json.php - DI service JSON\n│       ├── 📄 jwt.php - DI service JWT\n│       ├── 📄 logger.php - DI logger\n│       ├── 📄 middleware.php - DI middleware\n│       ├── 📄 monitoring.php - DI monitoring\n│       ├── 📄 repository.php - DI repository\n│       ├── 📄 router.php - DI router\n│       ├── 📄 security.php - DI security\n│       ├── 📄 service.php - DI service\n│       └── 📄 translator.php - DI translator\n├── 📁 console/ - Konfigurasi console\n│   ├── 📄 commands.php - Console commands\n│   └── 📄 params.php - Parameter console\n├── 📁 environments/ - Konfigurasi per-environment\n│   ├── 📁 dev/ - Environment development\n│   │   └── 📄 params.php - Parameter dev\n│   ├── 📁 prod/ - Environment production\n│   │   └── 📄 params.php - Parameter prod\n│   └── 📁 test/ - Environment test\n│       └── 📄 params.php - Parameter test\n└── 📁 web/ - Konfigurasi web\n    ├── 📁 di/ - DI web\n    │   ├── 📄 application.php - DI aplikasi web (middleware stack)\n    │   └── 📄 psr17.php - DI PSR-17\n    └── 📄 params.php - Parameter web\n```\n\n## **📁 SOURCE CODE**\n```\nsrc/\n├── 📄 bootstrap.php - Bootstrap: load vendor autoload + .env\n├── 📄 Environment.php - Manajemen environment\n├── 📁 Api/ - API layer\n│   ├── 📄 IndexAction.php - Action root API\n│   ├── 📁 Shared/ - Komponen API bersama\n│   │   ├── 📄 ExceptionResponderFactory.php - Factory response exception\n│   │   ├── 📄 NotFoundMiddleware.php - Middleware 404\n│   │   ├── 📄 ResponseFactory.php - Factory response\n│   │   └── 📁 Presenter/ - Response presenter\n│   │       ├── 📄 AsIsPresenter.php - Presenter pass-through\n│   │       ├── 📄 CollectionPresenter.php - Presenter collection\n│   │       ├── 📄 FailPresenter.php - Presenter error\n│   │       ├── 📄 OffsetPaginatorPresenter.php - Presenter pagination\n│   │       ├── 📄 PresenterInterface.php - Kontrak presenter\n│   │       ├── 📄 SuccessPresenter.php - Presenter sukses\n│   │       ├── 📄 SuccessWithMetaPresenter.php - Presenter sukses dengan metadata\n│   │       └── 📄 ValidationResultPres / - Environment production\n│   ├── 📄 .env - Environment prod\n│   ├── 📄 .gitignore - Git ignore\n│   └── 📄 compose.yml - Konfigurasi compose prod\n└── 📁 test/ - Environment test\n    ├── 📄 .env - Environment test\n    ├── 📄 .gitignore - Git ignore\n    └── 📄 compose.yml - Konfigurasi compose test\n```\n\n---\n\n## **🎯 FITUR & PATTERN KUNCI**\n\n### **🔐 Implementasi Optimistic Locking**\n- **Value Object**: `LockVersion.php` - Penanganan versi type-safe\n- **Exception**: `OptimisticLockException.php` - Penanganan konflik\n- **Repository**: `ExampleRepository.php` - Optimistic locking di level database\n- **API**: `ExampleUpdateAction.php` - Validasi sisi client\n\n### **🏗️ Domain-Driven Design (DDD)**\n- **Entity**: Domain object kaya dengan behavior\n- **Value Object**: Value object immutable (`LockVersion`, `ResourceStatus`, `DetailInfo`)\n- **Repository**: Abstraksi akses data\n- **Domain Service**: Service business logic\n- **Application Service**: Orkestrasi use case\n\n### **🔀 Perbedaan Modul Example vs AnotherExample**\n\nKeduanya modul demo, tapi mendemokan hal yang berbeda:\n\n| Aspek | `Example` | `AnotherExample` |\n|-------|-----------|------------------|\n| Peran | Modul referensi dasar | Modul child — mendemokan relasi parent→child |\n| Field khusus | `name`, `status`, `detail_info` | + `example_id` (FK ke `example`), `origin_id`, `sync_flag` |\n| Sync | `SyncMdb` (MongoDB) saja | `SyncMdb` + `SyncFlag` (master–origin sync) |\n| `detail_info` | `DetailInfoFactory` shared | Factory custom `AnotherExampleDetailInfoFactory` + DTO `AnotherExampleDetailInfo` (embed data parent `example`) |\n| Migrasi | `src/Migration/Example/` | Juga di `src/Migration/Example/` (satu grup `migrate:module example`) |\n| Permission | `example.*` | `another-example.*` (aturan role sama: `$isKasir`/`$isSuperAdmin`) |\n\nGunakan `Example` sebagai titik awal modul standalone, dan `AnotherExample` sebagai referensi kalau modulmu punya relasi ke entity lain atau butuh sync master–origin.\n\n### **🗄️ Multi-Database Support**\n- **PostgreSQL**: Database relasional utama\n- **MongoDB**: Document storage NoSQL dengan schema\n- **Redis**: Caching dan session storage\n- **Abstract Repository**: Base class untuk MongoDB dan Redis\n\n### **🔒 Security & Authentication**\n- **JWT Middleware**: Autentikasi berbasis token\n- **ServiceTokenAuthMiddleware**: Bearer opaque untuk service eksternal (alternatif JWT tanpa SSO)\n- **RBAC**: Access control berbasis role\n- **Input Sanitization**: Validasi input menyeluruh\n- **Rate Limiting**: Rate limiting berbasis database (opt-in)\n- **Security Headers**: HSTS, CORS, trusted hosts\n\n### **📊 Observability & Monitoring**\n- **Structured Logging**: Log berformat JSON\n- **Error Monitoring**: Pelacakan error terpusat\n- **Metrics Collection**: Metrics aplikasi\n- **Audit Trail**: Audit logging lengkap\n- **Request Tracing**: Propagasi request ID\n\n### **🌐 API Design**\n- **RESTful**: Endpoint REST yang bersih\n- **Versioning**: API versioning (`/v1/`)\n- **Error Handling**: Response error yang konsisten\n- **Validation**: Validasi sadar konteks (context-aware)\n- **Pagination**: Pagination berbasis offset\n- **Filtering & Sorting**: Query parameters\n\n### **🚀 DevOps & Deployment**\n- **Docker**: Deployment terkontainer\n- **Multi-environment**: Konfigurasi dev, test, prod\n- **Quality Gates**: Quality check otomatis\n- **CI/CD**: Workflow GitHub Actions\n\n---\n\n## **📈 Statistik Project**\n- **Total File**: 200+ file\n- **Source Code**: 50.000+ baris PHP\n- **Bahasa**: Dukungan Inggris & Indonesia\n- **Arsitektur**: Clean DDD dengan hexagonal pattern\n\n---\n\n## **🔧 Komponen Boilerplate**\n\n### **🎯 Template Core Boilerplate**\n1. **Pattern Entity**: `src/Domain/Example/Entity/Example.php`\n2. **Pattern Repository**: `src/Infrastructure/Common/Persistence/Example/ExampleRepository.php`\n3. **Application Service**: `src/Application/Example/ExampleApplicationService.php`\n4. **API Action**: `src/Api/V1/Example/Action/*`\n5. **Validasi**: `src/Api/V1/Example/Validation/ExampleInputValidator.php`\n6. **Command & DTO**: `src/Application/Example/Command/*` & `src/Application/Example/Dto/*`\n\n### **🔄 Komponen Bersama**\n1. **Trait**: `src/Domain/Shared/Core/Concerns/Entity/*`\n2. **Value Object**: `src/Domain/Shared/Core/ValueObject/*`\n3. **Exception**: `src/Shared/Core/Exception/*`\n4. **Middleware**: `src/Presentation/Core/Http/Middleware/*`\n5. **Validasi**: `src/Shared/Core/Validation/*`\n\n---\n\n**Status: 🎯 Dokumentasi struktur project lengkap dengan DDD + Optimistic Locking!**\n", "04-application-params-guide.md": "# Panduan Application Parameters\n\n## 📋 Gambaran Umum\n\nApplication parameters menyediakan manajemen konfigurasi terpusat untuk aplikasi Yii3 API. Ada dua bentuk:\n\n1. **`App\\Shared\\ApplicationParams`** — value object readonly kecil yang mengekspos info dasar aplikasi (name, version, language, environment) ke service dan action.\n2. **Params group di `config/common/params.php`** — kumpulan yang lebih besar berisi grup konfigurasi `app/*` dan vendor yang diisi dari `.env`, dikonsumsi terutama di dalam definisi DI via `$params`.\n\nKomponen ini memastikan akses parameter yang konsisten dan type safety di seluruh aplikasi.\n\n---\n\n## 🏗️ Arsitektur\n\n### Prinsip Desain\n- **Centralization**: Single source of truth — `config/common/params.php` memetakan variabel `.env` ke params group\n- **Type Safety**: Pengetikan kuat dengan properti readonly PHP 8+ (`ApplicationParams`)\n- **Flexibility**: Override spesifik environment via `config/environments/{dev,test,prod}/params.php`\n- **Performance**: Akses parameter efisien dengan overhead minimal\n\n---\n\n## 📁 Komponen: ApplicationParams\n\n`src/Shared/ApplicationParams.php` adalah class `final readonly` yang di-wire di `config/common/di/application.php`:\n\n```php\nnamespace App\\Shared;\n\nfinal readonly class ApplicationParams\n{\n    public function __construct(\n        public string $name = 'My Project',\n        public string $version = '1.0',\n        public string $language = 'en',\n        public ?string $environment = null,\n    ) {\n    }\n}\n```\n\n### Definisi DI\n\n```php\n// config/common/di/application.php\n$env = $_ENV['APP_ENV'] ?? 'prod';\n$environment = null;\nif ($env === 'dev' || $env === 'development') {\n    $environment = 'development';\n}\n\nreturn [\n    ApplicationParams::class => [\n        'class' => ApplicationParams::class,\n        '__construct()' => [\n            'name'        => $params['application']['name'] ?? 'My Project',\n            'version'     => $params['application']['version'] ?? '1.0',\n            'language'    => $params['application']['language'] ?? 'en',\n            'environment' => $environment,\n        ],\n    ],\n];\n```\n\n`$params['application']` berasal dari `config/common/application.php`, yang membaca `app.config.name`, `app.config.version` dan `app.config.language` dari `.env`.\n\n### Contoh Penggunaan\n\n```php\n// src/Api/IndexAction.php\nfinal class IndexAction\n{\n    public function __invoke(\n        ResponseFactory $responseFactory,\n        ApplicationParams $applicationParams,\n    ): ResponseInterface {\n        $data = [\n            'name'     => $applicationParams->name,\n            'version'  => $applicationParams->version,\n            'language' => $applicationParams->language,\n        ];\n\n        if ($applicationParams->environment !== null) {\n            $data['environment'] = $applicationParams->environment;\n        }\n\n        return $responseFactory->success($data);\n    }\n}\n```\n\n---\n\n## ⚙️ Params Group (`config/common/params.php`)\n\nAlih-alih API `ApplicationParams` yang gemuk, proyek ini mengekspos params group spesifik domain. File DI dan closure config membacanya via `$params['group']['key']`:\n\n| Group | Keys | Sumber (.env) |\n|-------|------|---------------|\n| `application` | `name`, `version`, `language` | `app.config.*` |\n| `yiisoft/aliases` | `aliases` (from `common/aliases.php`) | — |\n| `yiisoft/translator` | `locale`, `fallbackLocale` | `app.config.language` |\n| `yiisoft/db` | `driver`, `host`, `port`, `name`, `user`, `password`, `charset` | `db.default.*` |\n| `yiisoft/cache-redis` | `enabled`, `host`, `port`, `database`, `password` | `redis.default.*` |\n| `yiisoft/db-migration` | `newMigrationNamespace`, `sourceNamespaces` | — (`App\\Migration`) |\n| `mongodb/mongodb` | `enabled`, `dsn`, `database`, `connectTimeoutMS`, `socketTimeoutMS`, `readPreference` | `db.mongodb.*` |\n| `app/config` | `code`, `name`, `version`, `language`, `allow_god_mode` | `app.config.*` |\n| `app/optimisticLock` | `enabled`, `disabledValues` | `app.optimistic_lock.*` |\n| `app/pagination` | `defaultPageSize`, `maxPageSize` | `app.pagination.*` |\n| `app/rateLimit` | `maxRequests`, `windowSize` | `app.rateLimit.*` |\n| `app/hsts` | `maxAge`, `includeSubDomains`, `preload` | `app.hsts.*` |\n| `app/time` | `timezone` | `app.time.timezone` |\n| `app/cors` | `maxAge`, `allowCredentials`, `allowedOrigins`, `allowedMethods`, `allowedHeaders`, `exposedHeaders` | `app.cors.*` |\n| `app/jwt` | `secret`, `algorithm`, `issuer`, `audience`, `publicPaths` | `app.jwt.*` |\n| `app/trusted_hosts` | `allowedHosts` | `app.trusted_hosts.allowedHosts` |\n| `app/secureHeaders` | `csp`, `permissions`, `custom` | (hardcoded) |\n| `app/monitoring` | `provider`, `log_file`, `request_id_header`, `logging`, `metrics`, `error_monitoring` | (hardcoded) |\n| `app/enter-md` | `baseUrl`, `secret`, `algorithm`, `serviceUsername` | `app.md.*` |\n\nNilai env ber-encode JSON (mis. `app.cors.allowedOrigins=[\"http://example.com:3000\"]`) di-decode di bagian atas `params.php`.\n\n### Environment Override\n\nOverride per environment berada di `config/environments/{dev,test,prod}/params.php` (mis. `dev/params.php` mengatur `traceLink` untuk link IDE di error renderer). File-file ini digabung oleh `config/configuration.php` berdasarkan `APP_ENV` (nilai valid: `dev`, `test`, `prod` — ditegakkan oleh `App\\Environment`).\n\n### Deteksi Environment\n\n```php\nuse App\\Environment;\n\nEnvironment::isDev();\nEnvironment::isTest();\nEnvironment::isProd();\nEnvironment::appDebug();\n```\n\n---\n\n## 🔧 Contoh Integrasi\n\n### Penggunaan di Action\n```php\nfinal class IndexAction\n{\n    public function __invoke(\n        ResponseFactory $responseFactory,\n        ApplicationParams $applicationParams,\n    ): ResponseInterface {\n        return $responseFactory->success([\n            'name'    => $applicationParams->name,\n            'version' => $applicationParams->version,\n        ]);\n    }\n}\n```\n\n### Penggunaan di Definisi DI\n```php\n// Params groups are consumed inside DI definitions, not via ApplicationParams\nreturn [\n    HstsMiddleware::class => static function () use ($params) {\n        $hsts = $params['app/hsts'] ?? [];\n\n        return new HstsMiddleware(\n            maxAge: (int) ($hsts['maxAge'] ?? 31536000),\n            includeSubDomains: (bool) ($hsts['includeSubDomains'] ?? true),\n            preload: (bool) ($hsts['preload'] ?? false)\n        );\n    },\n];\n```\n\n### Penggunaan di Service\n```php\nfinal class ExampleService\n{\n    public function __construct(\n        private ApplicationParams $params,\n        private LoggerInterface $logger,\n    ) {\n    }\n\n    public function report(): void\n    {\n        $this->logger->info('Running ' . $this->params->name . ' v' . $this->params->version);\n    }\n}\n```\n\n---\n\n## 🚀 Praktik Terbaik\n\n### Akses Parameter\n```php\n// ✅ Inject ApplicationParams for app info (name/version/language/environment)\n$version = $this->params->version;\n\n// ✅ Read params groups inside DI definitions / config closures\n$jwtSecret = $params['app/jwt']['secret'] ?? '';\n\n// ✅ Check the environment through App\\Environment\nif (Environment::isDev()) {\n    // dev-only behaviour\n}\n```\n\n### Konfigurasi\n```php\n// ✅ Environment-based: .env → params.php → $params groups\n// ✅ Per-environment overrides: config/environments/{dev,test,prod}/params.php\n```\n\n### Menambahkan Params Group Baru\n```php\n// 1. Map env vars in config/common/params.php\n'app/my-feature' => [\n    'enabled' => \\filter_var($_ENV['app.my_feature.enabled'] ?? false, FILTER_VALIDATE_BOOLEAN),\n],\n\n// 2. Consume it in a DI definition\nMyMiddleware::class => static fn () => new MyMiddleware(\n    enabled: $params['app/my-feature']['enabled'] ?? false,\n),\n```\n\n---\n\n## 📊 Pertimbangan Performa\n\n- **Initialization**: `params.php` dievaluasi sekali oleh yiisoft/config dan digabung ke dalam container\n- **Penggunaan Memori**: `ApplicationParams` adalah instance readonly tunggal yang dibagikan via DI\n- **Kecepatan Akses**: Akses properti langsung dengan overhead minimal\n- **Konfigurasi**: Variabel environment dimuat sekali saat startup (`src/bootstrap.php` memuat `.env`)\n\n---\n\n## 🎯 Ringkasan\n\nApplication parameters menyediakan manajemen konfigurasi terpusat dan type-safe dengan manfaat utama:\n\n- **🎯 Centralization**: Single source of truth di `config/common/params.php`\n- **🛡️ Type Safety**: Properti readonly `App\\Shared\\ApplicationParams` mencegah kesalahan konfigurasi\n- **🔄 Immutability**: Properti readonly memastikan konsistensi\n- **🌐 Environment Support**: `APP_ENV` + `environments/*/params.php` untuk konfigurasi spesifik environment\n- **📦 Integration**: Integrasi DI yang mulus melalui `$params` group\n- **⚡ Performance**: Akses cepat dengan overhead minimal\n\nDengan mengikuti pola-pola ini, Anda dapat membangun manajemen konfigurasi yang robust dan mudah dipelihara untuk aplikasi Yii3 API Anda! 🚀\n", "05-di-configuration-guide.md": "# Panduan Konfigurasi Dependency Injection\n\n## 📋 Gambaran Umum\n\nPanduan ini membahas file konfigurasi Dependency Injection (DI) di `config/common/di/`. File-file ini mendefinisikan bagaimana service, repository, dan komponen infrastruktur di-wire bersama dalam aplikasi Yii3 API menggunakan arsitektur Domain-Driven Design (DDD).\n\n---\n\n## 🏗️ Gambaran Arsitektur DI\n\n### Struktur Konfigurasi\n\n```\nconfig/common/di/\n├── access-di.php           # Access control and RBAC configuration\n├── application.php         # App\\Shared\\ApplicationParams service\n├── audit.php               # Audit trail (AuditServiceInterface → DatabaseAuditService)\n├── db-mongodb.php          # MongoDB client + MongoDBService\n├── db-mysql.php            # MySQL/MariaDB connection (when db.default.driver=mysql|mariadb)\n├── db-pgsql.php            # PostgreSQL connection (when db.default.driver=pgsql)\n├── db-redis.php            # RedisService + project Redis bindings\n├── error-handler.php       # HtmlRenderer traceLink configuration\n├── hydrator.php            # yiisoft/hydrator container factories\n├── infrastructure-di.php   # ClockInterface, DateTimeProviderInterface + project bindings\n├── json.php                # JsonHandler binding\n├── jwt.php                 # JwtService + JwtMiddleware configuration\n├── logger.php              # PSR-3 LoggerInterface (file/stream/security targets)\n├── middleware-di.php       # Middleware definitions (CORS, rate limit, headers, ...)\n├── monitoring.php          # MonitoringServiceInterface → CustomMonitoringService\n├── optimistic-lock.php     # LockVersionConfig from app/optimisticLock params\n├── repository-di.php       # Delegates to config/common/repository.php\n├── router.php              # RouteCollectionInterface from common/routes.php\n├── security-di.php         # CurrentUser, Actor, AccessChecker, AuthorizerInterface, ...\n├── service-di.php          # Core service bindings + project overrides\n├── translator-di.php       # TranslatorInterface (app/validation/error/success categories)\n└── validator.php           # ValidatorInterface + rule handler resolver\n```\n\nSemua file `config/common/di/*.php` digabungkan ke dalam grup `di` oleh `config/configuration.php` (yang juga menggabungkan `common/repository.php` terlebih dahulu). File `config/web/di/*.php` (`application.php`, `psr17.php`) memperluas `di` untuk aplikasi web.\n\nBeberapa file `*-di.php` juga menggabungkan **file override milik proyek** dari `config/common/`:\n\n| File DI | File override proyek |\n|---------|----------------------|\n| `infrastructure-di.php` | `config/common/infrastructure.php` |\n| `security-di.php` | `config/common/security.php` |\n| `service-di.php` | `config/common/service.php` |\n| `translator-di.php` | `config/common/translator.php` |\n| `db-redis.php` | `config/common/redis.php` |\n| `repository-di.php` | `config/common/repository.php` (definisi lengkap berada di sana) |\n\n---\n\n## 🔧 File Konfigurasi\n\n### access-di.php\n\n**Tujuan**: Konfigurasi access control dan Role-Based Access Control (RBAC)\n\n```php\n<?php\n\ndeclare(strict_types=1);\n\n// Vendor Layer\nuse Yiisoft\\Access\\AccessChecker;\nuse Yiisoft\\Access\\Assignment\\Assignment;\nuse Yiisoft\\Access\\Permission\\Permission;\nuse Yiisoft\\Access\\Rule\\RuleFactory;\n\n// Infrastructure Layer\nuse App\\Infrastructure\\Core\\Security\\Rule\\PermissionMapRule;\n\n$permissionMap = require __DIR__ . '/../access.php';\n\nreturn [\n    Assignment::class => static fn () => new Assignment([\n        'authenticated' => \\array_map(\n            static fn (string $permission) => new Permission($permission, 'permission.map'),\n            \\array_keys($permissionMap)\n        ),\n    ]),\n\n    RuleFactory::class => static fn () => new RuleFactory([\n        'permission.map' => static fn () => new PermissionMapRule($permissionMap),\n    ]),\n\n    AccessChecker::class => static fn ($c) => new AccessChecker(\n        $c->get(Assignment::class),\n        $c->get(RuleFactory::class),\n    ),\n];\n```\n\n**Komponen Utama**:\n- `AccessChecker` (`Yiisoft\\Access\\AccessChecker`): Access checker dari package yang dibangun dari `Assignment` + `RuleFactory`\n- `Assignment`: Penugasan role dan permission\n- `RuleFactory`: Factory rule untuk access control\n- `PermissionMapRule` (`App\\Infrastructure\\Core\\Security\\Rule\\PermissionMapRule`): Rule pemetaan permission yang didukung `config/common/access.php`\n\n**Contoh Penggunaan**:\n```php\n// The project also provides App\\Infrastructure\\Core\\Security\\AccessChecker,\n// used by AccessMiddleware / AuthorizerInterface (RbacAuthorizer):\npublic function can(string $permission): bool\n{\n    return $this->authorizer->can('example.create');   // AuthorizerInterface\n}\n```\n\n---\n\n### jwt.php\n\n**Tujuan**: Konfigurasi autentikasi JWT (JSON Web Token)\n\n```php\n<?php\n\ndeclare(strict_types=1);\n\n// Infrastructure Layer\nuse App\\Infrastructure\\Core\\Security\\ActorProvider;\nuse App\\Infrastructure\\Core\\Security\\CurrentUser;\nuse App\\Infrastructure\\Core\\Security\\JwtService;\nuse App\\Presentation\\Core\\Http\\Middleware\\JwtMiddleware;\n\n// @var array $params\n\nreturn [\n    JwtService::class => [\n        '__construct()' => [\n            'secret'   => $params['app/jwt']['secret'] ?? '',\n            'algo'     => $params['app/jwt']['algorithm'] ?? 'HS256',\n            'issuer'   => $params['app/jwt']['issuer'] ?? null,\n            'audience' => $params['app/jwt']['audience'] ?? null,\n        ],\n    ],\n\n    JwtMiddleware::class => static fn (\n        JwtService $jwtService,\n        ActorProvider $actorProvider,\n        CurrentUser $currentUser\n    ) => new JwtMiddleware(\n        jwtService: $jwtService,\n        actorProvider: $actorProvider,\n        currentUser: $currentUser,\n        publicPaths: $params['app/jwt']['publicPaths'] ?? [],\n    ),\n];\n```\n\n**Komponen Utama**:\n- `JwtService` (`App\\Infrastructure\\Core\\Security\\JwtService`): Pembuatan dan validasi token JWT\n- `JwtMiddleware` (`App\\Presentation\\Core\\Http\\Middleware\\JwtMiddleware`): Middleware autentikasi request (bagian dari stack middleware web di `config/web/di/application.php`)\n\n**Parameter Konfigurasi**:\n```bash\n# Di file .env\napp.jwt.secret=secret-key-harus-panjang-256-bit\napp.jwt.algorithm=HS256\napp.jwt.issuer=https://sso.example.com\napp.jwt.audience=https://sso.example.com\napp.jwt.publicPaths=[\"/\",\"/auth/login\",\"/auth/refresh\"]\n```\n\n**Contoh Penggunaan**:\n```php\n// Decoding and validating a JWT token (throws UnauthorizedException on failure)\n$payload = $this->jwtService->decode($token);\n```\n\n---\n\n### middleware-di.php\n\n**Tujuan**: Definisi DI untuk HTTP middleware yang digunakan oleh pipeline pemrosesan request\n\n```php\n<?php\n\ndeclare(strict_types=1);\n\n// Infrastructure Layer\nuse App\\Infrastructure\\Core\\Monitoring\\ErrorMonitoringMiddleware;\nuse App\\Infrastructure\\Core\\Monitoring\\MetricsMiddleware;\nuse App\\Infrastructure\\Core\\Monitoring\\RequestIdMiddleware;\nuse App\\Infrastructure\\Core\\Monitoring\\StructuredLoggingMiddleware;\nuse App\\Infrastructure\\Core\\Security\\AccessChecker;\nuse App\\Infrastructure\\Core\\Security\\CurrentUser;\nuse App\\Infrastructure\\Core\\Security\\HstsMiddleware;\n// Shared Layer\nuse App\\Presentation\\Core\\Http\\Middleware\\AccessMiddleware;\nuse App\\Presentation\\Core\\Http\\Middleware\\CorsMiddleware;\nuse App\\Presentation\\Core\\Http\\Middleware\\RateLimitMiddleware;\nuse App\\Presentation\\Core\\Http\\Middleware\\RequestParamsMiddleware;\nuse App\\Presentation\\Core\\Http\\Middleware\\SecureHeadersMiddleware;\n// PSR Interfaces\nuse Psr\\Http\\Message\\ResponseFactoryInterface;\n// Vendor Layer\nuse Yiisoft\\Router\\FastRoute\\UrlMatcher;\nuse Yiisoft\\Security\\TrustedHosts\\TrustedHostsMiddleware;\n\n// @var array $params\n\nreturn [\n    // Always available through DI; add to the middleware stack in\n    // config/common/middleware.php if needed for a project.\n    TrustedHostsMiddleware::class => TrustedHostsMiddleware::class,\n\n    // Middleware global untuk semua route\n    RequestParamsMiddleware::class => static function () use ($params) {\n        $pagination = $params['app/pagination'] ?? [];\n\n        return new RequestParamsMiddleware(\n            defaultPageSize: (int) ($pagination['defaultPageSize'] ?? 50),\n            maxPageSize: (int) ($pagination['maxPageSize'] ?? 200),\n        );\n    },\n\n    CorsMiddleware::class => static fn (ResponseFactoryInterface $responseFactory) => new CorsMiddleware($params['app/cors'], $responseFactory),\n\n    RateLimitMiddleware::class => static function () use ($params) {\n        $rateLimit = $params['app/rateLimit'] ?? [];\n\n        return new RateLimitMiddleware(\n            maxRequests: (int) ($rateLimit['maxRequests'] ?? 100),\n            windowSize: (int) ($rateLimit['windowSize'] ?? 60)\n        );\n    },\n    \n    SecureHeadersMiddleware::class => static function () use ($params) {\n        $secureHeaders = $params['app/secureHeaders'] ?? [];\n\n        return new SecureHeadersMiddleware($secureHeaders);\n    },\n    \n    HstsMiddleware::class => static function () use ($params) {\n        $hsts = $params['app/hsts'] ?? [];\n\n        return new HstsMiddleware(\n            maxAge: (int) ($hsts['maxAge'] ?? 31536000),\n            includeSubDomains: (bool) ($hsts['includeSubDomains'] ?? true),\n            preload: (bool) ($hsts['preload'] ?? false)\n        );\n    },\n\n    RequestIdMiddleware::class => static function () use ($params) {\n        $monitoring = $params['app/monitoring'] ?? [];\n\n        return new RequestIdMiddleware($monitoring['request_id_header'] ?? 'X-Request-Id');\n    },\n\n    StructuredLoggingMiddleware::class => static function () use ($params) {\n        $monitoring = $params['app/monitoring'] ?? [];\n\n        return new StructuredLoggingMiddleware($monitoring['logging'] ?? []);\n    },\n\n    MetricsMiddleware::class => static function () use ($params) {\n        $monitoring = $params['app/monitoring'] ?? [];\n\n        return new MetricsMiddleware($monitoring['metrics'] ?? []);\n    },\n\n    ErrorMonitoringMiddleware::class => static function () use ($params) {\n        $monitoring = $params['app/monitoring'] ?? [];\n\n        return new ErrorMonitoringMiddleware($monitoring['error_monitoring'] ?? []);\n    },\n\n    AccessMiddleware::class => static fn (\n        AccessChecker $accessChecker,\n        CurrentUser $currentUser,\n        UrlMatcher $urlMatcher,\n    ) => new AccessMiddleware($accessChecker, $currentUser, $urlMatcher),\n];\n```\n\n**Komponen Utama**:\n- `RequestParamsMiddleware`: Pemrosesan parameter request\n- `CorsMiddleware`: Penanganan CORS\n- `RateLimitMiddleware`: Pembatasan rate request\n- `SecureHeadersMiddleware`: Security header\n- `HstsMiddleware`: HTTP Strict Transport Security\n- `RequestIdMiddleware`: Pelacakan Request ID\n- `StructuredLoggingMiddleware`: Structured logging\n- `MetricsMiddleware`: Metric aplikasi\n- `ErrorMonitoringMiddleware`: Monitoring error\n- `AccessMiddleware`: Access control\n\n**Middleware Stack**:\n\nIni hanyalah definisi DI — urutan eksekusi sebenarnya dirakit di `config/web/di/application.php` (`Application::class` → `MiddlewareDispatcher::withMiddlewares()`):\n\n1. `FormatDataResponseAsJson` + `ContentNegotiator`: Response JSON (dan opsional XML)\n2. `ErrorCatcher` + `ExceptionResponderFactory`: Penangkapan error dan response error API\n3. `TrustedHostMiddleware` (`App\\Presentation\\Core\\Http\\Middleware\\TrustedHostMiddleware`): Allowlist host\n4. `CorsMiddleware`: Penanganan CORS\n5. `JwtMiddleware`: Autentikasi JWT\n6. `RequestIdMiddleware`, `StructuredLoggingMiddleware`, `MetricsMiddleware`: Observability\n7. `RateLimitMiddleware`, `SecureHeadersMiddleware`, `ErrorMonitoringMiddleware`\n8. `RequestBodyParser`, `AccessMiddleware`, `Router`, `NotFoundMiddleware`\n\nMiddleware tambahan dapat dicantumkan di `config/common/middleware.php` (stack milik proyek).\n\n**Contoh Penggunaan**:\n```php\n// Middleware are resolved through the container — e.g. AccessMiddleware gets:\nAccessMiddleware::class => static fn (\n    AccessChecker $accessChecker,\n    CurrentUser $currentUser,\n    UrlMatcher $urlMatcher,\n) => new AccessMiddleware($accessChecker, $currentUser, $urlMatcher),\n```\n\n---\n\n### monitoring.php\n\n**Tujuan**: Konfigurasi monitoring aplikasi dan pelacakan performa\n\n```php\n<?php\n\ndeclare(strict_types=1);\n\n// Infrastructure Layer\nuse App\\Infrastructure\\Core\\Monitoring\\CustomMonitoringService;\nuse App\\Infrastructure\\Core\\Monitoring\\MonitoringServiceInterface;\n// Vendor Layer\nuse Yiisoft\\Di\\Container;\n\nreturn [\n    MonitoringServiceInterface::class => static function (Container $container) use ($params) {\n        $monitoringConfig = $params['app/monitoring'] ?? [];\n\n        return new CustomMonitoringService([\n            'log_file' => $monitoringConfig['log_file'] ?? 'runtime/logs/api.log',\n        ]);\n    },\n];\n```\n\n**Komponen Utama**:\n- `CustomMonitoringService` (`App\\Infrastructure\\Core\\Monitoring\\CustomMonitoringService`): Implementasi monitoring\n- `MonitoringServiceInterface` (`App\\Infrastructure\\Core\\Monitoring\\MonitoringServiceInterface`): Kontrak monitoring\n\n**Fitur**:\n- Pelacakan metric performa (`MetricsMiddleware`, params `app/monitoring`)\n- Monitoring error (`ErrorMonitoringMiddleware`)\n- Logging request (`StructuredLoggingMiddleware`, `RequestIdMiddleware`)\n\n---\n\n### repository-di.php\n\n**Tujuan**: Konfigurasi repository pattern untuk lapisan akses data\n\n`repository-di.php` hanya mendelegasikan ke `config/common/repository.php` milik proyek:\n\n```php\n<?php\n\ndeclare(strict_types=1);\n\n/** @var array $params */\n\nreturn require \\dirname(__DIR__) . '/repository.php';\n```\n\nBinding yang sebenarnya berada di `config/common/repository.php`:\n\n```php\nuse App\\Domain\\AnotherExample\\Repository\\AnotherExampleRepositoryInterface;\nuse App\\Domain\\Example\\Repository\\ExampleRepositoryInterface;\nuse App\\Infrastructure\\Common\\Persistence\\AnotherExample\\AnotherExampleRepository;\nuse App\\Infrastructure\\Common\\Persistence\\Example\\ExampleRepository;\nuse App\\Infrastructure\\Core\\Security\\CurrentUser;\nuse App\\Shared\\Core\\ValueObject\\LockVersionConfig;\nuse Yiisoft\\Definitions\\Reference;\n\nreturn [\n    ExampleRepositoryInterface::class => [\n        'class'                  => ExampleRepository::class,\n        'setLockVersionConfig()' => [Reference::to(LockVersionConfig::class)],\n        'setCurrentUser()'       => [Reference::to(CurrentUser::class)],\n        '__construct()'          => [\n            'params' => $params['app/optimisticLock'] ?? [],\n        ],\n    ],\n    AnotherExampleRepositoryInterface::class => [\n        'class'                  => AnotherExampleRepository::class,\n        'setLockVersionConfig()' => [Reference::to(LockVersionConfig::class)],\n        'setCurrentUser()'       => [Reference::to(CurrentUser::class)],\n        '__construct()'          => [\n            'params' => $params['app/optimisticLock'] ?? [],\n        ],\n    ],\n];\n```\n\n**Komponen Utama**:\n- `ExampleRepository` / `AnotherExampleRepository` (`App\\Infrastructure\\Common\\Persistence\\...`): Implementasi repository\n- `ExampleRepositoryInterface` / `AnotherExampleRepositoryInterface` (`App\\Domain\\...\\Repository\\...`): Kontrak repository\n- `LockVersionConfig` + `CurrentUser` di-inject melalui setter untuk optimistic locking dan field audit\n\n**Fitur**:\n- Abstraksi akses data\n- Optimistic locking via `LockVersionConfig` (params `app/optimisticLock`)\n- Dukungan sync MongoDB\n\n**Contoh Penggunaan**:\n```php\n// Using repository in application service\n$example = $this->repository->findById(id: $id);\n$examples = $this->repository->list(criteria: $criteria); // PaginatedResult\n$this->repository->insert(entity: $example);\n$this->repository->update(entity: $example);\n$this->repository->delete(entity: $example);\n$this->repository->restore(id: $id);\n```\n\n---\n\n### security-di.php\n\n**Tujuan**: Binding security — current user, actor, access checker dan authorizer\n\n```php\n<?php\n\ndeclare(strict_types=1);\n\nuse App\\Domain\\Shared\\Core\\Security\\AuthorizerInterface;\nuse App\\Infrastructure\\Core\\Security\\AccessChecker;\nuse App\\Infrastructure\\Core\\Security\\Actor;\nuse App\\Infrastructure\\Core\\Security\\CurrentUser;\nuse App\\Infrastructure\\Core\\Security\\PermissionChecker;\nuse App\\Infrastructure\\Core\\Security\\RbacAuthorizer;\n\n/** @var array $params */\n\n// Core security bindings. Project-owned bindings may be merged from\n// config/common/security.php and can override these defaults.\n$projectBindings = \\dirname(__DIR__) . '/security.php';\n\nreturn array_merge([\n    CurrentUser::class => [\n        '__construct()' => [\n            'allowGodMode' => $params['app/config']['allow_god_mode'] ?? false,\n        ],\n    ],\n    Actor::class         => static fn (CurrentUser $currentUser) => $currentUser->getActor(),\n    AccessChecker::class => static function (CurrentUser $currentUser) {\n        $accessMap = require \\dirname(__DIR__) . '/access.php';\n\n        return new AccessChecker($currentUser, $accessMap);\n    },\n    PermissionChecker::class => [\n        '__construct()' => [\n            require __DIR__ . '/../access.php',\n        ],\n    ],\n    AuthorizerInterface::class => RbacAuthorizer::class,\n], file_exists($projectBindings) ? require $projectBindings : []);\n```\n\n**Komponen Utama**:\n- `CurrentUser`: Konteks user saat ini; `allow_god_mode` berasal dari `app.config.allow_god_mode`\n- `Actor`: Actor yang diturunkan dari `CurrentUser`\n- `AccessChecker` / `PermissionChecker`: Memeriksa permission terhadap `config/common/access.php`\n- `AuthorizerInterface → RbacAuthorizer`: Kontrak otorisasi untuk sisi domain\n\n**Contoh Penggunaan**:\n```php\n// In an application service / domain service\nif (!$this->auth->can('example.delete')) {\n    throw new ForbiddenException(/* ... */);\n}\n```\n\n---\n\n### service-di.php\n\n**Tujuan**: Placeholder konfigurasi application service\n\n```php\n<?php\n\ndeclare(strict_types=1);\n\n/** @var array $params */\n\n// Core service DI configuration. Add project-wide service bindings here.\n// Project-owned bindings may be merged from config/common/service.php and\n// can override these defaults.\n$projectBindings = \\dirname(__DIR__) . '/service.php';\n\nreturn array_merge([\n    // Service DI configuration\n    // Add your service definitions here\n], file_exists($projectBindings) ? require $projectBindings : []);\n```\n\n**Contoh Penggunaan**:\n```php\n// config/common/service.php — add application services here\nreturn [\n    ExampleServiceInterface::class => ExampleService::class,\n];\n```\n\n---\n\n### translator-di.php\n\n**Tujuan**: Konfigurasi translasi dan lokalisasi untuk dukungan multi-bahasa\n\n```php\n<?php\n\ndeclare(strict_types=1);\n\n// Vendor Layer\nuse Yiisoft\\Translator\\CategorySource;\nuse Yiisoft\\Translator\\IntlMessageFormatter;\nuse Yiisoft\\Translator\\Message\\Php\\MessageSource;\nuse Yiisoft\\Translator\\Translator;\nuse Yiisoft\\Translator\\TranslatorInterface;\n\n/** @var array $params */\n\n// Core translator binding. Project-owned bindings may be merged from\n// config/common/translator.php and can override these defaults.\n$projectBindings = \\dirname(__DIR__) . '/translator.php';\n\nreturn array_merge([\n    TranslatorInterface::class => static function () {\n        $translator = new Translator('en');\n\n        $messageSource = new MessageSource(__DIR__ . '/../../../resources/messages');\n        $formatter     = new IntlMessageFormatter();\n\n        $translator->addCategorySources(\n            new CategorySource('app', $messageSource, $formatter),\n            new CategorySource('validation', $messageSource, $formatter),\n            new CategorySource('error', $messageSource, $formatter),\n            new CategorySource('success', $messageSource, $formatter),\n        );\n\n        return $translator;\n    },\n], file_exists($projectBindings) ? require $projectBindings : []);\n```\n\n**Komponen Utama**:\n- `TranslatorInterface → Translator`: Service translasi (default locale `en`)\n- `MessageSource`: Message source PHP yang membaca `resources/messages/{locale}/{category}.php`\n- `IntlMessageFormatter`: Pemformatan pesan berbasis intl\n- Kategori: `app`, `validation`, `error`, `success`\n\n**Contoh Penggunaan**:\n```php\n// Translating messages\n$translated = $this->translator->translate('Welcome!', [], 'app', 'en');\n$translated = $this->translator->translate('Welcome!', [], 'app', 'id');\n```\n\n---\n\n### File DI Lainnya\n\nReferensi singkat untuk file-file lainnya di `config/common/di/`:\n\n- **`application.php`**: Mem-bind `App\\Shared\\ApplicationParams` (name/version/language/environment) dari `$params['application']` (`config/common/application.php`).\n- **`audit.php`**: `CurrentUserInterface → CurrentUser`; `AuditServiceInterface → DatabaseAuditService` (menulis ke tabel `audit_logs`).\n- **`db-mysql.php` / `db-pgsql.php`**: `ConnectionInterface` di-bind ke `Yiisoft\\Db\\Mysql\\Connection` atau `Yiisoft\\Db\\Pgsql\\Connection` tergantung `$params['yiisoft/db']['driver']`; keduanya meregistrasi `FileCache` (`@runtime/cache`) dan `SchemaCache` yang aktif. File driver yang tidak aktif mengembalikan `[]`.\n- **`db-mongodb.php`**: `MongoDB\\Client` + `MongoDBService` dari params `mongodb/mongodb`; ketika MongoDB dinonaktifkan (atau extension tidak tersedia), `MongoDBService` yang dinonaktifkan yang di-bind.\n- **`db-redis.php`**: `RedisService` (host/port dari env `redis.default.*`) digabung dengan binding proyek dari `config/common/redis.php`, yang dimuat *setelah* `common/repository.php` dan dapat meng-override binding repository.\n- **`error-handler.php`**: Closure `traceLink` `HtmlRenderer` (menggunakan `$params['traceLink']`, mis. `phpstorm://open?...` yang diset di `environments/dev/params.php`, dan remapping path `APP_HOST_PATH`).\n- **`hydrator.php`**: `AttributeResolverFactoryInterface → ContainerAttributeResolverFactory`, `ObjectFactoryInterface → ContainerObjectFactory`.\n- **`json.php`**: Binding `App\\Shared\\Core\\Utility\\JsonHandler`.\n- **`logger.php`**: `LoggerInterface → Yiisoft\\Log\\Logger` dengan `FileTarget`, `StreamTarget` dan `FileTarget` `log.target.security` (`@runtime/logs/security/security.log`, kategori `security`).\n- **`optimistic-lock.php`**: `LockVersionConfig` dari `app/optimisticLock` (`enabled`, `disabledValues`).\n- **`router.php`**: `RouteCollectionInterface` dibangun dari `$config->get('routes')` (`config/common/routes.php`).\n- **`validator.php`**: `RuleHandlerResolverInterface → SimpleRuleHandlerContainer` (dengan `UniqueValueHandler`), `UniqueValueHandler` mendapatkan `ConnectionInterface` + `TranslatorInterface`, `ValidatorInterface → Validator`.\n\n---\n\n## 🔧 Best Practice Konfigurasi\n\n### 1. **Pattern Dependency Injection**\n\n#### **Constructor Injection**\n```php\n// ✅ Preferred pattern\nreturn [\n    ServiceInterface::class => [\n        'class' => Service::class,\n        '__construct()' => [\n            Reference::to(DependencyInterface::class),\n        ],\n    ],\n];\n```\n\n#### **Interface Segregation**\n```php\n// ✅ Separate interfaces for different concerns\ninterface RepositoryInterface { /* ... */ }\ninterface CacheableRepositoryInterface { /* ... */ }\n```\n\n### 2. **Organisasi Konfigurasi**\n\n#### **Konfigurasi Spesifik Environment**\n```php\n// ✅ Use params groups populated from .env (config/common/params.php)\nreturn [\n    JwtService::class => [\n        '__construct()' => [\n            'secret' => $params['app/jwt']['secret'] ?? '',\n            'algo'   => $params['app/jwt']['algorithm'] ?? 'HS256',\n        ],\n    ],\n];\n```\n\n#### **Penggunaan Reference**\n```php\n// ✅ Use references for dependencies\nReference::to(ConnectionInterface::class)\nReference::to(LoggerInterface::class)\n```\n\n### 3. **Pertimbangan Keamanan**\n\n#### **Data Sensitif**\n```php\n// ✅ Store secrets in environment variables, surfaced via params groups\n'secret' => $params['app/jwt']['secret'],\n```\n\n#### **Access Control**\n```php\n// ✅ Configure RBAC properly\nAuthorizerInterface::class => RbacAuthorizer::class,\n```\n\n---\n\n## 📊 Dependensi Konfigurasi\n\n### Grafik Dependensi\n\n```\n┌─────────────────────────────────────────────────────────────────────┐\n│                    Application Layer Services                │\n├─────────────────────────────────────────────────────────────────────┤\n│                    Domain Layer Interfaces                    │\n├─────────────────────────────────────────────────────────────────────┤\n│                Infrastructure Layer Implementations           │\n├─────────────────────────────────────────────────────────────────────┤\n│                    External Dependencies (PSR)              │\n└─────────────────────────────────────────────────────────────────────┘\n```\n\n### Dependensi Utama\n\n#### **Interface PSR**\n- `PSR-3`: Logger Interface\n- `PSR-7`: HTTP Message Interface\n- `PSR-11`: Container Interface\n- `PSR-14`: Event Dispatcher\n- `PSR-17`: HTTP Factories\n- `PSR-20`: Clock Interface\n\n#### **Komponen Yii3**\n- `yiisoft/db`: Abstraksi database\n- `yiisoft/cache`: Sistem caching\n- `yiisoft/translator`: Sistem translasi\n- `yiisoft/access`: Access control\n- `yiisoft/middleware`: Middleware dispatcher\n\n#### **Komponen Kustom**\n- Interface domain layer\n- Implementasi infrastructure\n- Application service\n\n---\n\n## 🚀 Contoh Penggunaan\n\n### 1. **Registrasi Service**\n\n```php\n// In application service (real constructor)\nfinal class ExampleApplicationService\n{\n    public function __construct(\n        private AuthorizerInterface $auth,\n        private DetailInfoFactory $detailInfoFactory,\n        private ExampleRepositoryInterface $repository,\n        private ExampleDomainService $domainService\n    ) {\n    }\n}\n```\n\n### 2. **Penggunaan Repository**\n\n```php\n// In application service\n$example = $this->repository->findById(id: $id);\nif ($example === null) {\n    throw new NotFoundException(translate: Message::create(\n        key: 'resource.not_found',\n        params: ['resource' => Example::RESOURCE, 'field' => 'id', 'value' => $id]\n    ));\n}\n```\n\n### 3. **Integrasi Security**\n\n```php\n// In application service (AuthorizerInterface → RbacAuthorizer)\nif (!$this->auth->can('example.create')) {\n    throw new ForbiddenException(translate: Message::create(key: 'error.forbidden'));\n}\n```\n\n### 4. **Audit Logging**\n\n```php\n// In repository (AuditServiceInterface → DatabaseAuditService)\n$this->auditService->log(\n    tableName: 'example',\n    recordId: $example->getId(),\n    action: 'create',\n    newValues: $example->toArray(),\n    actor: $this->currentUser->getActor(),\n    ipAddress: $ipAddress,\n    userAgent: $userAgent,\n);\n```\n\n---\n\n## 🔍 Troubleshooting\n\n### Masalah Umum\n\n#### **1. **Circular Dependency**\n```php\n// ❌ Avoid circular references\nServiceA -> ServiceB -> ServiceA\n\n// ✅ Use interfaces to break cycles\nServiceA -> ServiceBInterface -> ServiceB\n```\n\n#### **2. **Dependensi yang Hilang**\n```php\n// ❌ Undefined reference\nReference::to(MissingInterface::class)\n\n// ✅ Ensure interface is defined\nReference::to(DependencyInterface::class)\n```\n\n#### **3. **Konflik Konfigurasi**\n```php\n// ❌ Duplicate definitions\nInterface::class => [ /* ... */ ],\nInterface::class => [ /* ... */ ],\n\n// ✅ Use single definition per interface\nInterface::class => [ /* ... */ ],\n```\n\n### Tool Debugging\n\n#### **1. **Inspeksi Container**\n```php\n// Check if service is registered\n$container->has(ServiceInterface::class);\n\n// Get service instance\n$service = $container->get(ServiceInterface::class);\n```\n\n#### **2. **Validasi Konfigurasi**\n```php\n// Validate configuration\n$config = require 'config/common/di/service-di.php';\nif (!is_array($config)) {\n    throw new \\RuntimeException('Invalid configuration');\n}\n```\n\n---\n\n## 📚 Referensi\n\n### Dokumentasi\n- **[yiisoft/di](https://github.com/yiisoft/di)**: Dependency injection container\n- **[yiisoft/definitions](https://github.com/yiisoft/definitions)**: Format definisi (`Reference`, `DynamicReference`, `ReferencesArray`)\n- **[PSR-11 Documentation](https://www.php-fig.org/psr/psr-11/)**: Interface container\n- **[PSR-20 Documentation](https://www.php-fig.org/psr/psr-20/)**: Interface clock\n\n### Panduan Terkait\n- **[Architecture Guide](02-architecture-guide.md)**: Gambaran arsitektur lengkap\n- **[Migration Guide](17-migration-seeding-guide.md)**: Manajemen database\n- **[Quality Guide](21-quality-guide.md)**: Prosedur quality assurance\n\n---\n\n## 🎯 Ringkasan\n\nFile konfigurasi DI menyediakan fondasi yang kuat untuk dependency injection dalam aplikasi Yii3 API. Manfaat utamanya meliputi:\n\n- **🏗️ Clean Architecture**: Pemisahan yang jelas antar lapisan\n- **🔒 Type Safety**: Pengelolaan dependensi berbasis interface\n- **🧪 Testability**: Dependensi mudah di-mock dan diuji\n- **📦 Modularity**: Setiap file konfigurasi menangani concern spesifik\n- **🔧 Flexibility**: Konfigurasi spesifik environment\n- **🛡️ Security**: Access control dan enkripsi yang tepat\n\nDengan mengikuti pattern dan best practice yang diuraikan dalam panduan ini, Anda dapat memelihara konfigurasi dependency injection yang bersih, testable, dan aman untuk aplikasi Yii3 API Anda! 🚀\n", "06-request-guide.md": "# Panduan Pemrosesan Request\n\n## 📋 Gambaran Umum\n\nUtilitas pemrosesan request menyediakan cara terstruktur untuk menangani data HTTP request: parsing query/body, whitelisting, sanitasi, pagination, sorting, dan search criteria. `RequestParamsMiddleware` membangun value object `RequestParams` sekali per request dan menyimpannya di atribut request `payload`; action mengonsumsinya dan mengonversinya menjadi `SearchCriteria` melalui `SearchCriteriaFactory`.\n\n---\n\n## 🏗️ Arsitektur Request\n\n### Struktur Direktori\n\n```\nsrc/Shared/Core/Request/\n├── DataParserInterface.php    # Interface for data parsing (all(), get())\n├── PaginationParams.php       # Pagination value object (page, page_size)\n├── RawParams.php              # Immutable param bag (get/has/with/onlyAllowed/sanitize)\n├── RequestDataParser.php      # Merges query params + parsed body (body wins)\n├── RequestParams.php          # Aggregates raw params, filter, pagination, sort\n└── SortParams.php             # Sort value object (by, dir)\n\nsrc/Shared/Core/Dto/\n├── SearchCriteria.php         # filter + page/pageSize + sortBy/sortDir + allowedSort\n└── PaginatedResult.php        # data + total + page/pageSize + filter/sort meta\n\nsrc/Shared/Core/Middleware/\n└── RequestParamsMiddleware.php  # Builds RequestParams, stores in 'payload' attribute\n\nsrc/Application/Shared/Core/Factory/\n└── SearchCriteriaFactory.php    # RequestParams -> SearchCriteria\n```\n\n### Prinsip Desain\n\n#### **1. **Type Safety**\n- Pengetikan kuat dengan fitur PHP 8+\n- Value object `readonly` (`RawParams`, `PaginationParams`, `SortParams`, `SearchCriteria`)\n- `BadRequestException` untuk input yang tidak valid\n\n#### **2. **Consistency**\n- Satu objek `RequestParams` per request, dibuat oleh middleware\n- Bentuk payload `filter` / `pagination` / `sort` yang seragam\n- `SearchCriteria` adalah objek hand-off tunggal ke layer application/repository\n\n#### **3. **Security**\n- `onlyAllowed()` menolak key parameter yang tidak dikenal\n- `sanitize()` menerapkan `InputSanitizer` ke semua nilai\n- Page size dibatasi (`maxPageSize`)\n\n#### **4. **Performance**\n- Parsing sekali jalan di middleware\n- Objek immutable — aman diteruskan antar layer\n- Lazy: tidak ada validasi yang berjalan sampai sebuah action memilih untuk ikut serta\n\n---\n\n## 📦 Bentuk Payload Request\n\n`RequestParams` memahami parameter nested maupun flat:\n\n```json\n{\n    \"filter\": {\n        \"name\": \"acer\",\n        \"status\": 1\n    },\n    \"pagination\": {\n        \"page\": 1,\n        \"page_size\": 20\n    },\n    \"sort\": {\n        \"by\": \"name\",\n        \"dir\": \"desc\"\n    },\n    \"with_total\": \"1\"\n}\n```\n\nPadanan flat juga berfungsi untuk pagination/sort: `?page=1&page_size=20&by=name&dir=desc`.\nNilai `page`/`page_size` yang non-numerik melempar `BadRequestException`; `page` dikunci ke `>= 1` dan `page_size` ke `1..maxPageSize`.\n\n---\n\n## 📁 Komponen Request\n\n### 1. RequestParams\n\n**Tujuan**: Mengagregasi semua parameter request ke dalam sub-objek bertipe. Dibuat oleh `RequestParamsMiddleware` dan disimpan di atribut request `payload`.\n\n**Lokasi**: `src/Shared/Core/Request/RequestParams.php`\n\n```php\nfinal readonly class RequestParams\n{\n    private const DEFAULT_PAGE_SIZE = 50;\n    private const MAX_PAGE_SIZE     = 200;\n    private const DEFAULT_PAGE      = 1;\n    private const DEFAULT_SORT_DIR  = 'desc';\n\n    public function __construct(\n        DataParserInterface $parser,\n        int $defaultPageSize = self::DEFAULT_PAGE_SIZE,\n        int $maxPageSize = self::MAX_PAGE_SIZE\n    ) {\n        $rawData         = $parser->all();\n        $this->rawParams = new RawParams($rawData);\n        $this->filter    = new RawParams($rawData['filter'] ?? []);\n        // pagination: $rawData['pagination'] or flat page/page_size\n        // sort:       $rawData['sort'] or flat by/dir (default dir 'desc')\n    }\n\n    public function ensureExists(string $resource): void   // 400 when payload is empty\n    public function getRawParams(): RawParams;             // all params\n    public function getFilter(): RawParams;                // the 'filter' sub-array\n    public function getPagination(): PaginationParams;\n    public function getSort(): SortParams;\n    public function getPage(): int;\n    public function getPageSize(): int;\n    public function getOffset(): int;\n    public function get(string $key, mixed $default = null): mixed;\n    public function has(string $key): bool;\n    public function all(): array;\n    public function withTotal(): bool;                     // 'with_total' !== '0'\n\n    /** Pull the RequestParams stored in a request attribute ('payload' by default). */\n    public static function fromRequest(ServerRequestInterface $request, string $attribute = 'payload'): self;\n\n    /** Build directly from an array (tests, non-HTTP usage). */\n    public static function from(array $data, int $defaultPageSize = self::DEFAULT_PAGE_SIZE, int $maxPageSize = self::MAX_PAGE_SIZE): self;\n}\n```\n\n**Contoh Penggunaan**:\n```php\n// In an action — RequestParams comes from the 'payload' attribute\npublic function __invoke(ServerRequestInterface $request): ResponseInterface\n{\n    /** @var RequestParams $payload */\n    $payload = $request->getAttribute('payload');\n    // or: $payload = RequestParams::fromRequest($request);\n\n    $payload->ensureExists(resource: 'Example'); // BadRequestException if empty\n\n    $page   = $payload->getPage();\n    $size   = $payload->getPageSize();\n    $offset = $payload->getOffset();\n    $sort   = $payload->getSort();        // SortParams\n    $filter = $payload->getFilter();      // RawParams of the 'filter' block\n}\n```\n\n---\n\n### 2. RawParams\n\n**Tujuan**: Parameter bag immutable — value object dasar untuk raw params dan filter.\n\n```php\nfinal readonly class RawParams\n{\n    public function __construct(private array $params = []) {}\n\n    public function get(string $key, mixed $default = null): mixed;\n    public function has(string $key): bool;       // array_key_exists\n    public function toArray(): array;\n    public function all(): array;                  // alias of toArray()\n    public function with(string $key, mixed $value): self;  // returns new instance\n    public function merge(array $data): self;                // returns new instance\n\n    public function __get(string $name): mixed;     // $params->name\n    public function __isset(string $name): bool;    // isset($params->name)\n\n    /**\n     * Keep only allowed keys. Throws BadRequestException listing\n     * unknown + allowed keys when extras are present.\n     */\n    public function onlyAllowed(array $allowedKeys): self;\n\n    /** Sanitize all values via InputSanitizer (XSS-safe). */\n    public function sanitize(): self;\n}\n```\n\n**Contoh Penggunaan**:\n```php\n// In an action — typical create/update pipeline\n$params = $payload->getRawParams()\n    ->onlyAllowed(allowedKeys: ['name', 'status', 'lock_version'])\n    ->with('id', $id)          // merge route param\n    ->sanitize();\n\n$name = $params->get('name');\n$lockVersion = $params->get('lock_version');\n```\n\n---\n\n### 3. PaginationParams\n\n**Tujuan**: Value object pagination — `page` + `page_size` dengan offset terhitung.\n\n```php\nfinal readonly class PaginationParams\n{\n    public function __construct(\n        public int $page = 1,\n        public int $page_size = 50\n    ) {}\n\n    public function getLimit(): int;   // = page_size\n    public function getOffset(): int;  // = (page - 1) * page_size\n    public function toArray(): array;  // ['page' => ..., 'page_size' => ...]\n}\n```\n\n**Contoh Penggunaan**:\n```php\n$pagination = $payload->getPagination();\n\n$query->limit($pagination->getLimit())\n      ->offset($pagination->getOffset());\n```\n\n---\n\n### 4. SortParams\n\n**Tujuan**: Value object sort — satu field `by` + arah `dir`.\n\n```php\nfinal readonly class SortParams\n{\n    public function __construct(\n        public ?string $by = null,\n        public string $dir = 'asc'   // RequestParams defaults this to 'desc'\n    ) {}\n\n    public function getSortBy(): ?string;\n    public function getSortDir(): string;   // 'asc' | 'desc'\n    public function toArray(): array;       // ['by' => ..., 'dir' => ...]\n}\n```\n\n**Contoh Penggunaan**:\n```php\n$sort = $payload->getSort();\n\nif ($sort->getSortBy()) {\n    $direction = $sort->getSortDir() === 'desc' ? SORT_DESC : SORT_ASC;\n    $query->orderBy([$sort->getSortBy() => $direction]);\n}\n```\n\n---\n\n### 5. DataParserInterface & RequestDataParser\n\n**Tuj
