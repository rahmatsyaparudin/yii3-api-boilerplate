ewStatus)) {\n            throw new BadRequestException(translate: Message::create(key: 'status.invalid_transition'));\n        }\n\n        $this->status = $newStatus;\n    }\n}\n```\n\n### 2. **Penggunaan di Repository**\n```php\nuse App\\Shared\\Core\\Enums\\RecordStatus;\n\nfinal class ExampleRepository\n{\n    // HasCoreFeatures trait provides scopeWhereNotDeleted():\n    // ['<>', 'status', RecordStatus::DELETED->value]\n    public function findById(int $id): ?Example\n    {\n        $row = (new Query($this->db))\n            ->from(self::TABLE_NAME)\n            ->where(['id' => $id])\n            ->andWhere($this->scopeWhereNotDeleted())\n            ->one();\n\n        return $row ? Example::reconstitute(/* ... */) : null;\n    }\n\n    // Filter by a group of status values\n    public function findByStatuses(array $statuses): array\n    {\n        return (new Query($this->db))\n            ->from(self::TABLE_NAME)\n            ->where(['status' => $statuses])\n            ->all();\n    }\n\n    public function findPublic(): array\n    {\n        return $this->findByStatuses(RecordStatus::searchableStates());\n    }\n}\n```\n\n### 3. **Penggunaan di Validasi**\n```php\n// src/Api/V1/Example/Validation/ExampleInputValidator.php\nprotected function rules(string $context): array\n{\n    return match ($context) {\n        ValidationContext::CREATE => [\n            'status' => [\n                new Required(),\n                new Integer(),\n                new In(RecordStatus::draftOnlyStates()), // new records start as DRAFT\n            ],\n        ],\n        ValidationContext::UPDATE => [\n            'status' => [\n                new Integer(skipOnEmpty: true),\n                new In(RecordStatus::searchableStates()), // any non-deleted status\n            ],\n        ],\n        default => [],\n    };\n}\n```\n\n### 4. **Penggunaan di Action**\n```php\n// src/Api/V1/Example/Action/ExampleCreateAction.php\n$params = $payload->getRawParams()\n    ->onlyAllowed(allowedKeys: self::ALLOWED_KEYS)\n    ->with('status', RecordStatus::DRAFT->value) // force DRAFT on create\n    ->sanitize();\n\n$this->inputValidator->validate(\n    data: $params,\n    context: ValidationContext::CREATE,\n);\n```\n\n---\n\n## 🚀 Best Practices\n\n### 1. **Type Safety**\n```php\n// ✅ Use the enum / value object types\npublic function __construct(\n    private ResourceStatus $status\n) {}\n\n// ❌ Avoid raw ints\npublic function __construct(\n    private int $status\n) {}\n```\n\n### 2. **Validation**\n```php\n// ✅ Validate against enum-provided state lists\nnew In(RecordStatus::searchableStates())\n\n// ❌ Avoid hardcoded lists\nnew In([0, 1, 2, 3, 5, 6, 7])\n```\n\n### 3. **Penggunaan Konstanta**\n```php\n// ✅ Use constants for shared field names\n$version = $params->get(AppConstants::OPTIMISTIC_LOCK);\n$query->andWhere(AppConstants::statusNotDeleted());\n\n// ❌ Avoid magic strings\n$version = $params->get('lock_version');\n$query->andWhere(['<>', 'status', 4]);\n```\n\n### 4. **Transisi Status**\n```php\n// ✅ Use the transition map / ResourceStatus\n$allowed = RecordStatus::STATUS_TRANSITION_MAP[$current->value] ?? [];\nif ($status->canTransitionTo($newStatus)) {\n    // allow transition\n}\n\n// ❌ Avoid manual transition logic\nif ($current === 1 && $new === 0) {\n    // allow transition\n}\n```\n\n---\n\n## 📊 Pertimbangan Performa\n\n### 1. **Penggunaan Memori**\n- Enum hemat memori (singleton per case)\n- Konstanta dimuat sekali\n- Hindari pembuatan objek yang tidak perlu\n\n### 2. **Query Database**\n- Gunakan `->value` enum di query database (`status` adalah kolom smallint)\n- Beri index pada kolom `status` untuk performa\n- Gunakan `searchableStates()` / `statusNotDeleted()` untuk memfilter berdasarkan grup status\n\n### 3. **Caching**\n- `RecordStatus::list()` murah untuk dihitung; cache hanya jika sering dirender\n- Simpan nilai enum (int) di DB, bukan labelnya\n\n---\n\n## 🎯 Ringkasan\n\nEnum menyediakan cara yang type-safe dan self-documenting untuk mendefinisikan konstanta dan nilai status di aplikasi Yii3 API. Manfaat utamanya meliputi:\n\n- **🛡️ Type Safety**: Pengetikan kuat mencegah nilai yang tidak valid\n- **📖 Self-Documentation**: Konstanta bernama sudah menjelaskan dirinya sendiri\n- **🔄 Immutability**: Enum bersifat immutable secara alami\n- **🧪 Testability**: Mudah di-unit test dengan perilaku yang dapat diprediksi\n- **📦 Centralized Management**: Semua konstanta di satu tempat\n- **🚀 Performance**: Penggunaan memori efisien dan akses cepat\n\nDengan mengikuti pola dan best practice yang diuraikan dalam panduan ini, Anda dapat membangun enum yang robust dan mudah dipelihara untuk aplikasi Yii3 API Anda! 🚀\n", "12-value-object-guide.md": "# Panduan Value Object\n\n## 📋 Gambaran Umum\n\nValue Object menyediakan representasi konsep domain yang immutable dan type-safe dengan validasi bawaan. Pada aplikasi Yii3 API ini, Value Object memastikan integritas data dan mencegah state yang tidak valid.\n\n---\n\n## 🏗️ Arsitektur Value Object\n\n### Struktur Direktori\n\n```\nsrc/Shared/Core/ValueObject/\n├── Message.php            # Translation message value object\n└── LockVersionConfig.php  # Optimistic-lock configuration object\n\nsrc/Domain/Shared/Core/ValueObject/\n├── DetailInfo.php         # JSON detail_info payload with change_log helpers\n├── LockVersion.php        # Optimistic locking version (lock_version column)\n├── ResourceStatus.php     # Entity status value object (wraps RecordStatus enum)\n├── SyncFlag.php           # Master/origin sync flag (origin_id + sync_flag + direction)\n└── SyncMdb.php            # MongoDB sync flag (sync_mdb column)\n\nsrc/Domain/Shared/Core/Enum/\n├── SyncStatus.php         # sync_flag status enum (SYNCED → null, NOT_SYNCED → 1)\n└── SyncDirection.php      # Sync direction enum (NONE/MASTER_TO_ORIGIN/ORIGIN_TO_MASTER/BIDIRECTIONAL)\n```\n\n### Prinsip Desain\n\n#### **1. **Immutability**\n- Properti readonly mencegah modifikasi\n- Tidak ada method setter\n- Aman dibagikan ke seluruh aplikasi\n\n#### **2. **Type Safety**\n- Strong typing dengan fitur PHP 8+\n- Validasi di constructor\n- Deteksi error pada compile-time\n\n#### **3. **Value Semantics**\n- Kesetaraan berdasarkan nilai, bukan identitas\n- Tidak ada side effect\n- Perilaku yang dapat diprediksi\n\n#### **4. **Validation**\n- Logika validasi bawaan\n- Konstruksi fail-fast\n- Pesan error yang bermakna\n\n---\n\n## 📁 Komponen Value Object\n\n### 1. Message\n\n**Tujuan**: Value object pesan terjemahan dengan dukungan lokalisasi.\nMembawa `key` terjemahan, `params`, dan `domain` opsional (file pesan:\n`error`, `success`, `validation`, `app`). Translator me-resolve-nya di dalam\n`ResponseFactory` dan HTTP exception.\n\n```php\n<?php\n\ndeclare(strict_types=1);\n\nnamespace App\\Shared\\Core\\ValueObject;\n\nfinal readonly class Message\n{\n    public function __construct(\n        public string $key,\n        public array $params = [],\n        public ?string $domain = null\n    ) {\n    }\n\n    public static function create(\n        string $key,\n        array $params = [],\n        ?string $domain = null,\n    ): self {\n        return new self(domain: $domain, key: $key, params: $params);\n    }\n\n    public function getKey(): string\n    {\n        return $this->key;\n    }\n\n    public function getParams(): array\n    {\n        return $this->params;\n    }\n\n    public function getDomain(): ?string\n    {\n        return $this->domain;\n    }\n}\n```\n\n**Contoh Penggunaan**:\n```php\n// Simple message (domain defaults to 'success' in ResponseFactory::success,\n// 'error' in ResponseFactory::fail, or the exception's default)\n$message = Message::create(key: 'resource.list_retrieved', params: [\n    'resource' => 'Example',\n]);\n\n// Message for a specific domain — keys live in resources/messages/{en,id}/\n$message = Message::create(\n    domain: 'validation',\n    key: 'resource.not_deleted',\n    params: ['resource' => 'Example', 'id' => $id]\n);\n\n// In exception — all HttpException subclasses accept `translate: Message|string|null`\nthrow new NotFoundException(\n    translate: Message::create(\n        key: 'resource.not_found',\n        params: ['resource' => 'Example', 'field' => 'id', 'value' => $id]\n    )\n);\n\n// In response factory\nreturn $this->responseFactory->success(\n    data: $data,\n    translate: Message::create(key: 'resource.created', params: [\n        'resource' => 'Example'\n    ])\n);\n```\n\n---\n\n### 2. LockVersion\n\n**Tujuan**: Versi optimistic-locking yang disimpan di kolom `lock_version`.\nEntity mengeksposnya melalui `getLockVersion()` (disediakan oleh trait `Identifiable`).\n\n```php\nuse App\\Domain\\Shared\\Core\\ValueObject\\LockVersion;\n\nLockVersion::field();            // 'lock_version' (AppConstants::OPTIMISTIC_LOCK)\nLockVersion::create();           // new version starting at 1 (DEFAULT_VALUE)\nLockVersion::fromInt(3);         // from a database value\nLockVersion::fromNullable(null); // defaults to 1 when null\n\n$version->increment();           // new instance with value + 1\n$version->value();               // int value (also toInt() / toString())\n$version->isInitial();           // value === 1\n$version->equals($other);        // value comparison\n$version->isGreaterThan($other);\n```\n\nRepository memverifikasi/menambahnya melalui trait `ManagesPersistence`\n(`verifyLockVersion()`, `upgradeEntityLockVersion()`), yang digerakkan oleh\nparams `app/optimisticLock` dan `LockVersionConfig` (`src/Shared/Core/ValueObject/`).\n\n---\n\n### 3. SyncMdb\n\n**Tujuan**: Penanda sinkronisasi MongoDB untuk kolom `sync_mdb` —\n`null` = tersinkron, `1` = pending.\n\n```php\nuse App\\Domain\\Shared\\Core\\ValueObject\\SyncMdb;\n\nSyncMdb::field();          // 'sync_mdb' (AppConstants::SYNC_MONGODB)\nSyncMdb::create($value);   // validates: only null or 1 allowed\nSyncMdb::fromInt($value);  // alias of create()\nSyncMdb::fromString($raw); // parses ''/numeric strings\nSyncMdb::pending();        // value = 1 (needs sync)\nSyncMdb::synced();         // value = null (synced)\n\n$syncMdb->value();         // ?int raw column value (also toInt())\n$syncMdb->isPending();     // value === 1\n$syncMdb->isSynced();      // value === null\n$syncMdb->isNull();        // same as isSynced()\n$syncMdb->equals($other);\n```\n\nTrait repository `HasMongoDBSync` mengatur `SyncMdb::pending()` saat penulisan\nMongoDB gagal dan `SyncMdb::synced()` saat berhasil.\n\n---\n\n### 4. SyncFlag (+ enum SyncStatus / SyncDirection)\n\n**Tujuan**: State sinkronisasi master/origin untuk entity seperti `AnotherExample`\n(kolom `origin_id` + `sync_flag`). Menggantikan value object `SyncSlave` lama.\n\n```php\nuse App\\Domain\\Shared\\Core\\ValueObject\\SyncFlag;\nuse App\\Domain\\Shared\\Core\\Enum\\SyncDirection;\nuse App\\Domain\\Shared\\Core\\Enum\\SyncStatus;\n\n// Column names\nSyncFlag::fieldOriginId();  // 'origin_id'  (AppConstants::ORIGIN_ID)\nSyncFlag::fieldSyncFlag();  // 'sync_flag'  (AppConstants::SYNC_FLAG)\n\n// Creation\nSyncFlag::create(\n    originId: 5,\n    status: SyncStatus::NOT_SYNCED,          // default; direction auto-resolved\n    direction: SyncDirection::ORIGIN_TO_MASTER // optional explicit direction\n);\nSyncFlag::fromArray($row);        // from a DB row / request array\nSyncFlag::fromEntity($entity);    // from an entity with getOriginId()/getSyncFlagValue()\nSyncFlag::masterToOrigin(5);      // push master → origin\nSyncFlag::originToMaster(5);      // push origin → master (originId required)\nSyncFlag::bidirectional(5);       // both directions\nSyncFlag::synced();               // status SYNCED, direction NONE\n\n// Reading\n$flag->getOriginId();     // ?int\n$flag->getSyncStatus();   // SyncStatus enum\n$flag->getSyncFlag();     // ?int raw column value (null=synced, 1=not synced)\n$flag->getDirection();    // SyncDirection enum\n$flag->isPending();       // status === NOT_SYNCED\n$flag->isSynced();\n$flag->isMasterToOrigin();   // MASTER_TO_ORIGIN or BIDIRECTIONAL\n$flag->isOriginToMaster();   // ORIGIN_TO_MASTER or BIDIRECTIONAL\n$flag->isBidirectional();\n$flag->needsSyncToOrigin();  // pending && master→origin\n$flag->needsSyncToMaster();  // pending && origin→master\n\n// Immutable transitions\n$flag->markForSync();          // status → NOT_SYNCED\n$flag->markSynced();           // status → SYNCED\n$flag->withOriginId(7);        // change origin, direction re-resolved\n$flag->withDirection(SyncDirection::BIDIRECTIONAL);\n$flag->toArray();              // origin_id + sync_flag + direction\n$flag->toDbArray();            // origin_id + sync_flag only (for persistence)\n$flag->equals($other);\n```\n\nKedua enum (keduanya di `App\\Domain\\Shared\\Core\\Enum`):\n\n```php\n// Pure enum — DB value for the sync_flag column\nSyncStatus::SYNCED->dbValue();      // null\nSyncStatus::NOT_SYNCED->dbValue();  // 1\nSyncStatus::fromDbValue(null);      // SyncStatus::SYNCED (throws BadRequestException otherwise)\n$status->label();                   // 'Synced' | 'Not Synced'\n$status->isSynced();  $status->isPending();\n\n// int-backed enum — sync direction\nSyncDirection::NONE->value;             // 0\nSyncDirection::MASTER_TO_ORIGIN->value; // 1\nSyncDirection::ORIGIN_TO_MASTER->value; // 2\nSyncDirection::BIDIRECTIONAL->value;    // 3\nSyncDirection::fromValue(3);            // SyncDirection::BIDIRECTIONAL (throws otherwise)\n$direction->label();                    // 'Master to Origin', ...\n```\n\nDalam kode aplikasi, bangun `SyncFlag` melalui `SyncFlagFactory`\n(`src/Application/Shared/Core/Factory/SyncFlagFactory.php`), yang menerima nilai\nmentah dan juga menawarkan helper `buildPayload()`, `buildSyncLog()`, `mergeIntoDetailInfo()`,\n`shouldPushToOrigin()` / `shouldPushToMaster()`.\n\n---\n\n### 5. ResourceStatus\n\n**Tujuan**: Value object status yang kaya yang membungkus enum `RecordStatus` —\nmengenkapsulasi pemeriksaan state dan aturan transisi alih-alih integer mentah.\n\n```php\nuse App\\Domain\\Shared\\Core\\ValueObject\\ResourceStatus;\n\n// Named constructors\nResourceStatus::draft();      ResourceStatus::active();\nResourceStatus::inactive();   ResourceStatus::restored();   // → INACTIVE\nResourceStatus::deleted();    ResourceStatus::completed();\nResourceStatus::maintenance(); ResourceStatus::approved();  ResourceStatus::rejected();\n\n// From raw values (delegates to RecordStatus)\nResourceStatus::from($command->status);        // int|string\nResourceStatus::tryFrom($command->status);     // ?self — null-safe\n\n// State checks & rules\n$status->value();          // int (RecordStatus value)\n$status->name();           // enum name, e.g. 'ACTIVE'\n$status->label();          // 'Active', ...\n$status->isActive();       // + isDraft/isInactive/isCompleted/isDeleted\n$status->canBeUpdated();   // not in RecordStatus::IMMUTABLE_STATUSES\n$status->canBeDeleted();   // not active\n$status->isLocked();       // ACTIVE/COMPLETED/DELETED/REJECTED\n$status->isValidForCreation(); // active or draft\n$status->canTransitionTo($newStatus); // STATUS_TRANSITION_MAP\n$status->equals($other);\n$status->toArray();        // ['value' => ..., 'name' => ..., 'label' => ...]\n```\n\n---\n\n### 6. DetailInfo\n\n**Tujuan**: Payload JSON `detail_info` generik dengan field audit `change_log`\nbawaan (created/updated/deleted/restored/approved/rejected at+by).\n\n```php\nuse App\\Domain\\Shared\\Core\\ValueObject\\DetailInfo;\n\n// Usually built via DetailInfoFactory (injects clock + current user):\n$detailInfo = $this->detailInfoFactory->create(detailInfo: [])->build();\n\n// Direct creation\nDetailInfo::fromArray(['key' => 'value']);\nDetailInfo::fromJson($row['detail_info']); // tolerant — invalid JSON → empty\n\n// change_log helpers (used by DetailInfoFactory)\nDetailInfo::createdLog($dateTime, $user, $payload);\nDetailInfo::updatedLog($dateTime, $user, $currentLog, $payload);\nDetailInfo::deletedLog($dateTime, $user, $currentLog, $payload);\nDetailInfo::restoredLog($dateTime, $user, $currentLog, $payload);\nDetailInfo::approvedLog($dateTime, $user, $currentLog, $payload);\nDetailInfo::rejectedLog($dateTime, $user, $currentLog, $payload);\n\n// Access\n$detailInfo->get('change_log.created_by', 'default'); // dot-notation\n$detailInfo->has('key');\n$detailInfo->with(['approved_at' => null]);           // merge into change_log\n$detailInfo->toArray();\n$detailInfo->toJson();\n```\n\n---\n\n## 🔧 Contoh Value Object Kustom\n\n### 1. Value Object Email\n\n```php\n<?php\n\ndeclare(strict_types=1);\n\nnamespace App\\Shared\\Common\\ValueObject;\n\nuse App\\Shared\\Core\\Exception\\BadRequestException;\nuse App\\Shared\\Core\\ValueObject\\Message;\n\nfinal readonly class Email\n{\n    public function __construct(\n        public readonly string $value\n    ) {\n        if (!filter_var($value, FILTER_VALIDATE_EMAIL)) {\n            throw new BadRequestException(\n                translate: Message::create(\n                    key: 'format.email',\n                    params: ['field' => 'email']\n                )\n            );\n        }\n\n        if (strlen($value) > 255) {\n            throw new BadRequestException(\n                translate: Message::create(\n                    key: 'length.max',\n                    params: ['field' => 'email', 'max' => 255]\n                )\n            );\n        }\n    }\n\n    public function __toString(): string\n    {\n        return $this->value;\n    }\n\n    public function getLocalPart(): string\n    {\n        return explode('@', $this->value)[0];\n    }\n\n    public function getDomain(): string\n    {\n        return explode('@', $this->value)[1];\n    }\n\n    public function isFromDomain(string $domain): bool\n    {\n        return strtolower($this->getDomain()) === strtolower($domain);\n    }\n\n    public function equals(Email $other): bool\n    {\n        return strtolower($this->value) === strtolower($other->value);\n    }\n}\n```\n\n### 2. Value Object Money\n\n```php\n<?php\n\ndeclare(strict_types=1);\n\nnamespace App\\Shared\\Common\\ValueObject;\n\nuse App\\Shared\\Core\\Exception\\BadRequestException;\nuse App\\Shared\\Core\\ValueObject\\Message;\n\nfinal readonly class Money\n{\n    public function __construct(\n        public readonly int $amount,\n        public readonly string $currency = 'USD'\n    ) {\n        if ($amount < 0) {\n            throw new BadRequestException(\n                translate: Message::create(\n                    key: 'range.min',\n                    params: ['field' => 'amount', 'min' => 0]\n                )\n            );\n        }\n\n        if (!in_array($this->currency, ['USD', 'EUR', 'GBP', 'JPY'], true)) {\n            throw new BadRequestException(\n                translate: Message::create(\n                    key: 'request.invalid_parameter',\n                    params: ['param' => 'currency']\n                )\n            );\n        }\n    }\n\n    public function getFormattedAmount(): string\n    {\n        return number_format($this->amount / 100, 2);\n    }\n\n    public function add(Money $other): Money\n    {\n        $this->assertSameCurrency($other, 'add');\n\n        return new Money($this->amount + $other->amount, $this->currency);\n    }\n\n    public function subtract(Money $other): Money\n    {\n        $this->assertSameCurrency($other, 'subtract');\n\n        $newAmount = $this->amount - $other->amount;\n        if ($newAmount < 0) {\n            throw new BadRequestException(\n                translate: Message::create(\n                    key: 'business.violation',\n                    params: ['reason' => 'Resulting amount cannot be negative']\n                )\n            );\n        }\n\n        return new Money($newAmount, $this->currency);\n    }\n\n    public function multiply(float $multiplier): Money\n    {\n        $newAmount = (int) round($this->amount * $multiplier);\n        return new Money($newAmount, $this->currency);\n    }\n\n    public function isGreaterThan(Money $other): bool\n    {\n        $this->assertSameCurrency($other, 'compare');\n\n        return $this->amount > $other->amount;\n    }\n\n    private function assertSameCurrency(Money $other, string $operation): void\n    {\n        if ($this->currency !== $other->currency) {\n            throw new BadRequestException(\n                translate: Message::create(\n                    key: 'business.violation',\n                    params: ['reason' => \"Cannot {$operation} different currencies\"]\n                )\n            );\n        }\n    }\n\n    public function equals(Money $other): bool\n    {\n        return $this->amount === $other->amount && $this->currency === $other->currency;\n    }\n}\n```\n\n### 3. Value Object Address\n\n```php\n<?php\n\ndeclare(strict_types=1);\n\nnamespace App\\Shared\\Common\\ValueObject;\n\nuse App\\Shared\\Core\\Exception\\BadRequestException;\nuse App\\Shared\\Core\\ValueObject\\Message;\n\nfinal readonly class Address\n{\n    public function __construct(\n        public readonly string $street,\n        public readonly string $city,\n        public readonly string $state,\n        public readonly string $postalCode,\n        public readonly string $country\n    ) {\n        foreach (['street', 'city', 'state', 'postalCode', 'country'] as $field) {\n            if (empty($this->{$field})) {\n                throw new BadRequestException(\n                    translate: Message::create(\n                        key: 'request.missing_parameter',\n                        params: ['param' => $field]\n                    )\n                );\n            }\n        }\n\n        if (strlen($this->country) !== 2) {\n            throw new BadRequestException(\n                translate: Message::create(\n                    key: 'business.violation',\n                    params: ['reason' => 'Country must be 2 characters (ISO 3166-1 alpha-2)']\n                )\n            );\n        }\n    }\n\n    public function getFullAddress(): string\n    {\n        return implode(', ', [\n            $this->street,\n            $this->city,\n            $this->state,\n            $this->postalCode,\n            $this->country\n        ]);\n    }\n\n    public function isInCountry(string $country): bool\n    {\n        return strtoupper($this->country) === strtoupper($country);\n    }\n\n    public function equals(Address $other): bool\n    {\n        return $this->street === $other->street\n            && $this->city === $other->city\n            && $this->state === $other->state\n            && $this->postalCode === $other->postalCode\n            && $this->country === $other->country;\n    }\n}\n```\n\n---\n\n## 🔧 Pola Integrasi\n\n### 1. **Integrasi Entity**\n```php\n// src/Domain/AnotherExample/Entity/AnotherExample.php (simplified) —\n// entities hold value objects, not raw column values\nfinal class AnotherExample\n{\n    use Identifiable, Stateful, Descriptive; // traits provide id/name/status/detailInfo/\n                                           // syncMdb/lockVersion accessors\n\n    protected function __construct(\n        private readonly ?int $id,\n        private string $name,\n        private int $exampleId,\n        private ResourceStatus $status,\n        private DetailInfo $detailInfo,\n        private ?SyncMdb $syncMdb = null,\n        private ?SyncFlag $syncFlag = null,\n        ?LockVersion $lockVersion = null,\n    ) {\n        $this->resource    = self::RESOURCE;\n        $this->lockVersion = $lockVersion ?? LockVersion::create();\n    }\n\n    public function getSyncFlag(): ?SyncFlag\n    {\n        return $this->syncFlag;\n    }\n\n    public function getOriginId(): ?int\n    {\n        return $this->syncFlag?->getOriginId();\n    }\n\n    public function updateSyncFlag(?SyncFlag $syncFlag): void\n    {\n        $this->syncFlag = $syncFlag;\n    }\n}\n```\n\n### 2. **Integrasi Service**\n```php\n// src/Application/AnotherExample/AnotherExampleApplicationService.php (simplified)\npublic function create(CreateAnotherExampleCommand $command): AnotherExampleResponse\n{\n    $detailInfo = $this->detailInfoFactory\n        ->create(detailInfo: $detailInfoPayload)\n        ->build();\n\n    // Build the SyncFlag value object from raw command values\n    $syncFlag = $this->syncFlagFactory->create(\n        originId: $command->originId,\n        syncFlag: $command->syncFlag ?? 1,\n    );\n\n    $data = AnotherExample::create(\n        name: $command->name,\n        status: ResourceStatus::from($command->status), // raw int → VO\n        detailInfo: $detailInfo,\n        exampleId: $command->exampleId,\n        syncFlag: $syncFlag,\n    );\n\n    return AnotherExampleResponse::fromEntity(\n        entity: $this->repository->insert(entity: $data)\n    );\n}\n```\n\n### 3. **Integrasi Action**\n```php\n// src/Api/V1/AnotherExample/Action/AnotherExampleCreateAction.php (simplified)\npublic function __invoke(ServerRequestInterface $request): ResponseInterface\n{\n    /** @var RequestParams $payload */\n    $payload = $request->getAttribute('payload');\n\n    $params = $payload->getRawParams()\n        ->onlyAllowed(allowedKeys: self::ALLOWED_KEYS)\n        ->with('status', RecordStatus::DRAFT->value)\n        ->sanitize();\n\n    $this->inputValidator->validate(data: $params, context: ValidationContext::CREATE);\n\n    $command = CreateAnotherExampleCommand::create(\n        name: (string) $params->get('name'),\n        status: $params->get('status'),\n        exampleId: (int) $params->get('example_id'),\n        detailInfo: $params->get('detail_info'),\n        originId: $params->get('origin_id'),\n        syncFlag: $params->get('sync_flag'),\n    );\n\n    $response = $this->applicationService->create(command: $command);\n\n    return $this->responseFactory->success(\n        data: $response->toArray(),\n        translate: Message::create(key: 'resource.created', params: [\n            'resource' => $this->applicationService->getResource(),\n        ])\n    );\n}\n```\n\n---\n\n## 🚀 Praktik Terbaik\n\n### 1. **Immutability**\n```php\n// ✅ Use readonly properties\nfinal readonly class Email\n{\n    public function __construct(\n        public readonly string $value\n    ) {}\n}\n\n// ❌ Use mutable properties\nclass Email\n{\n    public string $value;\n}\n```\n\n### 2. **Validation**\n```php\n// ✅ Validate in constructor — throw the template's HttpException\n//    subclasses with Message::create, never raw \\InvalidArgumentException\nfinal readonly class Email\n{\n    public function __construct(\n        public readonly string $value\n    ) {\n        if (!filter_var($value, FILTER_VALIDATE_EMAIL)) {\n            throw new BadRequestException(\n                translate: Message::create(\n                    key: 'format.email',\n                    params: ['field' => 'email']\n                )\n            );\n        }\n    }\n}\n\n// ❌ Validate separately\n$email = new Email($value);\nif (!$email->isValid()) {\n    // Validation should be in constructor\n}\n```\n\n### 3. **Equality**\n```php\n// ✅ Value-based equality\npublic function equals(Email $other): bool\n{\n    return strtolower($this->value) === strtolower($other->value);\n}\n\n// ❌ Identity-based equality\npublic function equals(Email $other): bool\n{\n    return $this === $other;\n}\n```\n\n---\n\n## 📊 Pertimbangan Performa\n\n### 1. **Penggunaan Memori**\n- Value object ringan\n- Properti readonly mencegah penyalinan\n- Hindari objek besar dalam value object\n\n### 2. **Overhead Konstruksi**\n- Validasi menambah overhead minimal\n- Fail-fast mencegah state tidak valid\n- Cache objek yang sering digunakan\n\n### 3. **Performa Perbandingan**\n- Perbandingan nilai cepat\n- Gunakan perbandingan bawaan jika memungkinkan\n- Hindari operasi mahal di equals()\n\n---\n\n## 🎯 Ringkasan\n\nValue Object menyediakan representasi konsep domain yang immutable dan type-safe dalam aplikasi Yii3 API. Manfaat utamanya meliputi:\n\n- **🛡️ Type Safety**: Strong typing mencegah state tidak valid\n- **🔄 Immutability**: Properti readonly memastikan integritas data\n- **✅ Validation**: Validasi bawaan di constructor\n- **🧪 Testability**: Mudah di-unit test dengan perilaku yang dapat diprediksi\n- **📦 Encapsulation**: Data dan perilaku bersama-sama\n- **🚀 Performance**: Penggunaan memori dan perbandingan yang efisien\n\nDengan mengikuti pola dan praktik terbaik yang diuraikan dalam panduan ini, Anda dapat membangun value object yang kuat dan mudah dipelihara untuk aplikasi Yii3 API Anda! 🚀\n", "13-error-handling-guide.md": "# Panduan Error Handling\n\n## 📋 Gambaran Umum\n\nUtility error handling menyediakan pemrosesan error terpusat, pemformatan response, dan manajemen exception untuk aplikasi Yii3 API. Komponen-komponen ini memastikan response error yang konsisten dan logging error yang tepat.\n\n---\n\n## 🏗️ Arsitektur Error Handling\n\n### Struktur Direktori\n\n```\nsrc/Shared/Core/ErrorHandler/\n└── ErrorHandlerResponse.php       # ThrowableRendererInterface → JSON ErrorData\n\nsrc/Api/Shared/\n├── ExceptionResponderFactory.php  # Builds Yiisoft ExceptionResponder middleware\n├── NotFoundMiddleware.php         # Terminal 404 responder for unmatched routes\n├── ResponseFactory.php            # success() / fail() / notFound() / failValidation()\n└── Presenter/\n    ├── AsIsPresenter.php\n    ├── CollectionPresenter.php\n    ├── FailPresenter.php\n    ├── OffsetPaginatorPresenter.php\n    ├── PresenterInterface.php\n    ├── SuccessPresenter.php\n    ├── SuccessWithMetaPresenter.php\n    └── ValidationResultPresenter.php\n\nsrc/Infrastructure/Core/Monitoring/\n└── ErrorMonitoringMiddleware.php  # Captures errors/exceptions for monitoring\n```\n\n### Prinsip Desain\n\n#### **1. Consistency**\n- Format response error terstandar: `{code, success: false, message, errors}`\n- HTTP status code yang konsisten digerakkan oleh `HttpException::getHttpStatusCode()`\n- Struktur pesan error yang seragam via value object `Message` yang terlokalisasi\n\n#### **2. Centralization**\n- `Yiisoft\\ErrorHandler\\Middleware\\ErrorCatcher` menangkap throwable yang tidak tertangani\n- `Yiisoft\\ErrorHandler\\Middleware\\ExceptionResponder` (dibangun oleh `ExceptionResponderFactory`) memetakan exception ke response\n- `ErrorHandlerResponse` me-render body error JSON akhir\n\n#### **3. Security**\n- Stack trace (key `trace`) hanya saat `APP_ENV=dev` **dan** `APP_DEBUG=1`\n- Business exception dari `App\\Shared\\Core\\Exception` tidak pernah membocorkan internal\n- Detail sensitif tidak masuk ke response; middleware monitoring mengontrol apa yang di-log\n\n#### **4. Debuggability**\n- `renderVerbose()` / mode dev menambahkan `trace` berisi type, message, code, file, line, dan hingga 10 stack frame\n- `ErrorMonitoringMiddleware` dapat menangkap exception sesuai params `app/monitoring.error_monitoring`\n\n---\n\n## 📁 Komponen Error Handling\n\n### 1. ErrorHandlerResponse\n\n**Lokasi**: `src/Shared/Core/ErrorHandler/ErrorHandlerResponse.php`\n\n**Tujuan**: Me-render `Throwable` apa pun menjadi body error JSON terstandar. Mengimplementasikan `Yiisoft\\ErrorHandler\\ThrowableRendererInterface` dan digunakan oleh middleware `ErrorCatcher` bawaan framework.\n\n```php\nfinal readonly class ErrorHandlerResponse implements ThrowableRendererInterface\n{\n    public function render(\\Throwable $t, ?ServerRequestInterface $request = null): ErrorData;\n    public function renderVerbose(\\Throwable $t, ?ServerRequestInterface $request = null): ErrorData;\n}\n```\n\n**Format response** (`formatErrorResponse()`):\n```json\n{\n    \"code\": 500,\n    \"success\": false,\n    \"message\": \"Something went wrong\",\n    \"errors\": []\n}\n```\n\n- `errors` hanya diisi untuk `ValidationException` (dari `$e->getErrors()`)\n- `renderVerbose()` menambahkan objek `trace`: `{type, message, code, file, line, trace: [...10 frames]}`\n\n**Contoh Penggunaan**:\n```php\n$renderer = new ErrorHandlerResponse();\n$errorData = $renderer->render($exception, $request);\n// $errorData->getBody()    → JSON string\n// $errorData->getHeaders() → ['Content-Type' => 'application/json']\n```\n\n### 2. ExceptionResponderFactory\n\n**Lokasi**: `src/Api/Shared/ExceptionResponderFactory.php`\n\n**Tujuan**: Membangun middleware `Yiisoft\\ErrorHandler\\Middleware\\ExceptionResponder` dengan handler per tipe exception. Terdaftar di middleware stack dalam `config/web/di/application.php`.\n\n```php\nfinal readonly class ExceptionResponderFactory\n{\n    public function __construct(\n        private ResponseFactoryInterface $psrResponseFactory,\n        private ResponseFactory $apiResponseFactory,\n        private TranslatorInterface $translator,\n        private Injector $injector,\n    ) {}\n\n    public function create(): ExceptionResponder\n    {\n        return new ExceptionResponder(\n            [\n                InputValidationException::class => $this->inputValidationException(...),\n                NoChangesException::class       => $this->noChangesException(...),\n                \\Throwable::class               => $this->throwable(...),\n            ],\n            $this->psrResponseFactory,\n            $this->injector,\n        );\n    }\n}\n```\n\n**Pemetaan handler**:\n\n| Exception | Hasil |\n|---|---|\n| `Yiisoft\\Input\\Http\\InputValidationException` | `ResponseFactory::failValidation($result)` → HTTP 422 dengan field error |\n| `NoChangesException` | `ResponseFactory::success(data, translate)` → response HTTP 200 \"no changes\" |\n| `HttpException` (dan subclass-nya) | Error JSON dengan status `$e->getCode()` dan `getTranslateMessage()` yang diterjemahkan |\n| `Yiisoft\\ErrorHandler\\Exception\\UserException` | HTTP 400 dengan pesan exception |\n| `\\Throwable` lainnya | Error JSON HTTP 500 |\n\n**Format response throwable**:\n```json\n{\n    \"code\": 404,\n    \"success\": false,\n    \"message\": \"The requested resource was not found\",\n    \"errors\": []\n}\n```\n\n- Untuk `HttpException`, `message` diterjemahkan via `TranslatorInterface::translate($message->getKey(), $message->getParams(), $message->getDomain() ?? 'error')`.\n- Untuk `ValidationException`, `errors` berisi error per field.\n- Key `trace` ditambahkan hanya saat `APP_ENV=dev` **dan** `APP_DEBUG=1`, dan exception tersebut bukan business exception dari `App\\Shared\\Core\\Exception` (kecuali `ValidationException`, yang boleh menampilkan detail di dev).\n\n### 3. ResponseFactory\n\n**Lokasi**: `src/Api/Shared/ResponseFactory.php`\n\n**Tujuan**: Menghasilkan response API yang konsisten menggunakan class-class presenter. Digunakan oleh `ExceptionResponderFactory` dan oleh action secara langsung.\n\n```php\nfinal readonly class ResponseFactory\n{\n    public function success(\n        array|object|null $data = null,\n        ?array $meta = null,\n        string|Message|null $translate = null,\n        PresenterInterface $presenter = new AsIsPresenter(),\n    ): ResponseInterface;\n\n    public function fail(\n        array|object|null $data = null,\n        PresenterInterface $presenter = new AsIsPresenter(),\n        string|Message|null $translate = null,\n        ?int $httpCode = Status::BAD_REQUEST,\n    ): ResponseInterface;\n\n    public function notFound(string $message = 'Not found.'): ResponseInterface;\n\n    public function failValidation(Result $result): ResponseInterface;\n}\n```\n\n- `success()` — `SuccessPresenter`, atau `SuccessWithMetaPresenter` saat `$meta` diberikan; `Message` diterjemahkan dengan domain default `'success'`\n- `fail()` — `FailPresenter` dengan HTTP code yang diberikan; domain `Message` default ke `'error'`\n- `notFound()` — `fail()` dengan `Message::create(key: 'http.not_found')` dan HTTP 404\n- `failValidation()` — `fail()` dengan `ValidationResultPresenter`, `Message::create(key: 'validation.failed')`, HTTP 422\n\n### 4. NotFoundMiddleware\n\n**Lokasi**: `src/Api/Shared/NotFoundMiddleware.php`\n\nMiddleware terminal yang ditempatkan **setelah** `Router` di stack — mengembalikan `ResponseFactory::notFound()` untuk request apa pun yang mencapainya (yaitu, tidak ada route yang cocok).\n\n### 5. ErrorMonitoringMiddleware\n\n**Lokasi**: `src/Infrastructure/Core/Monitoring/ErrorMonitoringMiddleware.php`\n\nMenangkap exception dan error PHP untuk monitoring sesuai params `app/monitoring.error_monitoring` (`capture_exceptions`, `ignore_exceptions`, `ignore_error_codes` seperti `[404, 422]`, `max_errors_per_request`, `include_stack_trace`).\n\n---\n\n## 🔧 Pola Integrasi\n\n### 1. **Middleware Stack**\n\nPipeline nyata dari `config/web/di/application.php` (yang paling atas dijalankan pertama):\n\n```php\n'withMiddlewares()' => [\n    [\n        FormatDataResponseAsJson::class,\n        static fn () => new ContentNegotiator([\n            'application/json' => new JsonDataResponseFormatter(),\n        ]),\n        ErrorCatcher::class,                                          // catches uncaught throwables\n        static fn (ExceptionResponderFactory $factory) => $factory->create(), // typed exception mapping\n        static fn () => new TrustedHostMiddleware(\n            $params['app/trusted_hosts']['allowedHosts'] ?? [],\n        ),\n        CorsMiddleware::class,\n        JwtMiddleware::class,\n        RequestIdMiddleware::class,\n        StructuredLoggingMiddleware::class,\n        MetricsMiddleware::class,\n        RateLimitMiddleware::class,\n        SecureHeadersMiddleware::class,\n        ErrorMonitoringMiddleware::class,\n        RequestBodyParser::class,\n        AccessMiddleware::class,\n        Router::class,\n        NotFoundMiddleware::class,                                    // 404 for unmatched routes\n    ],\n],\n```\n\n### 2. **Melempar Exception di Kode Aplikasi**\n\nBiarkan middleware yang memformat error — cukup lempar typed exception:\n\n```php\nuse App\\Shared\\Core\\Exception\\NotFoundException;\nuse App\\Shared\\Core\\Exception\\ValidationException;\nuse App\\Shared\\Core\\ValueObject\\Message;\n\nthrow new NotFoundException(\n    translate: Message::create(\n        key: 'resource.not_found',\n        params: ['resource' => 'User', 'field' => 'id', 'value' => $id],\n    ),\n);\n\nthrow new ValidationException(\n    errors: ['email' => ['Invalid email format']],\n);\n```\n\n### 3. **Mengembalikan Error dari Action**\n\nGunakan `ResponseFactory` ketika Anda menginginkan response error terkontrol tanpa melempar exception:\n\n```php\nfinal class ExampleAction\n{\n    public function __construct(private ResponseFactory $responseFactory) {}\n\n    public function __invoke(ServerRequestInterface $request): ResponseInterface\n    {\n        if ($badInput) {\n            return $this->responseFactory->fail(\n                translate: Message::create(key: 'request.invalid_parameter', params: ['param' => 'email']),\n            );\n        }\n\n        return $this->responseFactory->success($result);\n    }\n}\n```\n\n---\n\n## 🚀 Praktik Terbaik\n\n### 1. **Throw, Jangan Format**\n```php\n// ✅ Throw typed exceptions; ExceptionResponder formats them\nthrow new ForbiddenException(translate: Message::create(key: 'access.insufficient_permissions'));\n\n// ❌ Hand-build JSON error payloads inside actions\nreturn $response->withStatus(403)->withBody(...);\n```\n\n### 2. **Informasi Debug**\n```php\n// ✅ Details are gated by APP_ENV=dev + APP_DEBUG=1 automatically\n// ❌ Don't add your own \"debug\" flag or leak traces in production\n```\n\n### 3. **Lokalisasi**\n```php\n// ✅ Use Message value objects so clients get localized messages\ntranslate: Message::create(key: 'resource.not_found', params: [...])\n\n// ❌ Hardcode English strings when a message key exists\n```\n\n---\n\n## 📊 Pertimbangan Performa\n\n### 1. **Pembuatan Response**\n- JSON di-encode sekali dengan `JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE`\n- `trace` dibatasi hingga 10 frame di `ErrorHandlerResponse` dan dihilangkan sepenuhnya di luar mode dev\n\n### 2. **Penggunaan Memori**\n- Tidak ada stack trace di response produksi\n- `ErrorMonitoringMiddleware` membatasi error yang ditangkap via `max_errors_per_request`\n\n### 3. **Overhead Logging**\n- `StructuredLoggingMiddleware` dan `ErrorMonitoringMiddleware` dapat dikonfigurasi via params `app/monitoring` (path yang dikecualikan, status code yang diabaikan)\n\n---\n\n## 🎯 Ringkasan\n\nError handling di boilerplate ini terpusat: middleware `ErrorCatcher` + `ExceptionResponder` mengonversi exception ke envelope JSON standar `{code, success, message, errors}`, `ErrorHandlerResponse` me-render output fallback, dan `ResponseFactory`/presenter memberi action cara yang konsisten untuk mengembalikan success dan failure. Manfaat utamanya meliputi:\n\n- **🔄 Consistency**: Format response error terstandar\n- **🛡️ Security**: Detail debug hanya di mode dev, tidak ada kebocoran dari business exception\n- **🔍 Debuggability**: Data `trace` saat `APP_ENV=dev` dan `APP_DEBUG=1`\n- **📝 Logging**: Middleware monitoring dengan aturan penangkapan yang dapat dikonfigurasi\n- **⚡ Performance**: Pembuatan response error yang efisien\n- **🌐 Localization**: Pesan error yang dapat diterjemahkan via `Message` + `TranslatorInterface`\n\nDengan mengikuti pola dan praktik terbaik yang diuraikan dalam panduan ini, Anda dapat membangun error handling yang robust dan mudah dipelihara untuk aplikasi Yii3 API Anda! 🚀\n", "14-exceptions-guide.md": "# Panduan Exception\n\n## 📋 Gambaran Umum\n\nHierarki exception dalam aplikasi Yii3 API ini menyediakan cara terstruktur untuk menangani berbagai jenis error dan exception. Setiap class exception dirancang untuk menangani skenario error tertentu dengan HTTP status code yang tepat dan pesan error terlokalisasi yang dibawa oleh value object `Message`.\n\n---\n\n## 🏗️ Arsitektur Exception\n\n### Struktur Direktori\n\n```\nsrc/Shared/Core/Exception/\n├── HttpException.php              # Abstract base — status code + Message + errors + data\n├── BadRequestException.php        # 400 Bad Request\n├── UnauthorizedException.php      # 401 Unauthorized\n├── ForbiddenException.php         # 403 Forbidden\n├── NotFoundException.php          # 404 Not Found\n├── ConflictException.php          # 409 Conflict\n├── TooManyRequestsException.php   # 429 Too Many Requests\n├── ValidationException.php        # 422 Unprocessable Entity (carries field errors)\n├── OptimisticLockException.php    # 409 Conflict (optimistic locking failure)\n├── NoChangesException.php         # 200 OK — rendered as success \"no changes\" response\n├── ServiceException.php           # Configurable status (default 200) + data payload\n└── README.md                      # Exception documentation\n```\n\n### Prinsip Desain\n\n#### **1. HTTP Status Mapping**\n- Setiap exception dipetakan ke HTTP status code via `getHttpStatusCode()` (juga diekspos sebagai `getCode()`)\n- Format response error yang konsisten dihasilkan oleh `ExceptionResponderFactory` / `ErrorHandlerResponse`\n- Kepatuhan RESTful API\n\n#### **2. Structured Error Information**\n- Value object `Message` yang terlokalisasi (`key`, `params`, `domain`)\n- Array `errors` opsional untuk detail validasi per field\n- Payload `data` opsional untuk konteks tambahan\n\n#### **3. Localization Support**\n- Setiap exception menerima `Message` atau string biasa (dikonversi menjadi `Message::create($string)`)\n- `domain` default ke kategori terjemahan `error` saat di-render\n- Key pesan default tersedia di `resources/messages/{locale}/error.php` dan `validation.php`\n\n#### **4. Type Safety**\n- Pengetikan kuat dengan fitur PHP 8+\n- Class konkret `final` yang meng-extend `HttpException` abstrak\n- Konstruktor yang ramah named-argument (`translate:`, `errors:`, `data:`, `previous:`)\n\n---\n\n## 📁 Komponen Exception\n\n### 1. HttpException (Base Class)\n\n**Lokasi**: `src/Shared/Core/Exception/HttpException.php`\n\n**Tujuan**: Base abstrak untuk semua HTTP exception; menyimpan status code, `Message`, errors, dan data.\n\n```php\nabstract class HttpException extends \\RuntimeException\n{\n    public function __construct(\n        private readonly int $httpStatusCode,\n        private readonly Message $translateMessage,\n        private readonly ?array $errors = null,\n        private readonly ?array $data = null,\n        ?\\Throwable $previous = null\n    ) {\n        parent::__construct('', $httpStatusCode, $previous); // getCode() === HTTP status\n    }\n\n    public function getHttpStatusCode(): int;\n    public function getTranslateMessage(): Message;\n    public function getDefaultMessageKey(): string;   // $translateMessage->getKey()\n    public function getTranslateParams(): array;      // $translateMessage->getParams()\n    public function getErrors(): ?array;\n    public function getData(): ?array;\n}\n```\n\n**Value object `Message`** (`src/Shared/Core/ValueObject/Message.php`):\n\n```php\nfinal readonly class Message\n{\n    public function __construct(\n        public string $key,\n        public array $params = [],\n        public ?string $domain = null,   // translation category: 'error' (default), 'validation', 'success', 'app'\n    ) {}\n\n    public static function create(string $key, array $params = [], ?string $domain = null): self;\n    public function getKey(): string;\n    public function getParams(): array;\n    public function getDomain(): ?string;\n}\n```\n\n### 2. Exception Konkret\n\nSemua exception konkret bersifat `final` dan menerima `Message|string|null` untuk `translate` — string dibungkus via `Message::create($string)`. Saat `translate` bernilai `null`, key pesan default digunakan.\n\n| Exception | HTTP | Signature | Key default |\n|---|---|---|---|\n| `BadRequestException` | 400 | `(Message\\|string\\|null $translate = null, ?array $errors = null, ?Throwable $previous = null)` | `http.bad_request` |\n| `UnauthorizedException` | 401 | sama seperti di atas | `http.unauthorized` |\n| `ForbiddenException` | 403 | sama seperti di atas | `http.forbidden` |\n| `NotFoundException` | 404 | sama seperti di atas | `http.not_found` |\n| `ConflictException` | 409 | sama seperti di atas | `resource.conflict` |\n| `TooManyRequestsException` | 429 | sama seperti di atas | `http.too_many_requests` |\n| `ValidationException` | 422 | `(?array $errors = null, Message\\|string\\|null $translate = null, ?Throwable $previous = null)` — **errors di posisi pertama** | `validation.failed` |\n| `OptimisticLockException` | 409 | `(Message\\|string\\|null $translate = null, ?array $data = null, ?Throwable $previous = null)` | `optimistic.lock.failed` |\n| `NoChangesException` | 200 | `(Message\\|string\\|null $translate = null, ?array $data = null, ?Throwable $previous = null)` | `resource.conflict` |\n| `ServiceException` | dapat dikonfigurasi (default `Status::OK`) | `(Message\\|string\\|null $translate = null, ?array $data = null, ?int $code = Status::OK, ?Throwable $previous = null)` | `service.error` |\n\n**Catatan**:\n- `NoChangesException` ditangani khusus oleh `ExceptionResponderFactory` — di-render sebagai response **success** (HTTP 200) yang membawa `getData()` dan pesan yang diterjemahkan, bukan sebagai error.\n- `ServiceException` membawa `$data`-nya via `getData()` (diteruskan sebagai slot `errors` secara internal) dan memungkinkan Anda memilih HTTP status apa pun via `code:`.\n- **Tidak ada** `BusinessRuleException` — gunakan `ConflictException`, `ValidationException`, atau `ServiceException` dengan `code` yang sesuai untuk kegagalan business rule.\n\n### Contoh Penggunaan\n\n```php\nuse App\\Shared\\Core\\Exception\\BadRequestException;\nuse App\\Shared\\Core\\Exception\\NotFoundException;\nuse App\\Shared\\Core\\Exception\\ValidationException;\nuse App\\Shared\\Core\\ValueObject\\Message;\n\n// Default localized message\nthrow new BadRequestException();\n\n// Plain string (becomes the message key)\nthrow new NotFoundException(translate: 'User not found');\n\n// Localized message with params\nthrow new NotFoundException(\n    translate: Message::create(\n        key: 'resource.not_found',\n        params: ['resource' => 'User', 'field' => 'id', 'value' => $id],\n    ),\n);\n\n// Validation errors (note: errors is the FIRST parameter)\nthrow new ValidationException(\n    errors: [\n        'email'    => ['Invalid email format'],\n        'password' => ['Password too short'],\n    ],\n);\n\n// Service error with custom status and data payload\nuse Yiisoft\\Http\\Status;\n\nthrow new ServiceException(\n    translate: Message::create(\n        key: 'service.unavailable',\n        params: ['service' => 'Payment Gateway'],\n    ),\n    data: ['provider' => 'stripe', 'error_code' => 'card_declined'],\n    code: Status::SERVICE_UNAVAILABLE,\n    previous: $e,\n);\n\n// Optimistic locking failure\nthrow new OptimisticLockException(\n    translate: Message::create(\n        key: 'optimistic.lock.failed',\n        params: ['resource' => 'User'],\n    ),\n);\n```\n\n---\n\n## 🔧 Pola Exception Handling\n\n### 1. **Biarkan Middleware yang Menangani**\n\nMiddleware `ExceptionResponder` (dibangun oleh `App\\Api\\Shared\\ExceptionResponderFactory`, terdaftar di `config/web/di/application.php`) mengonversi exception ke response JSON — tidak perlu try/catch di action:\n\n```php\nfinal class UpdateAction\n{\n    public function __invoke(int $id, UpdateRequest $request): ResponseInterface\n    {\n        // Just throw — middleware produces {code, success, message, errors}\n        $result = $this->service->update($id, $request);\n\n        return $this->responseFactory->success($result);\n    }\n}\n```\n\n### 2. **Service Layer**\n\n```php\nfinal class ExampleService\n{\n    public function update(int $id, array $data): Example\n    {\n        $example = $this->repository->findById($id);\n\n        if ($example === null) {\n            throw new NotFoundException(\n                translate: Message::create(\n                    key: 'resource.not_found',\n                    params: ['resource' => 'Example', 'field' => 'id', 'value' => $id],\n                ),\n            );\n        }\n\n        if (!$example->canBeUpdated()) {\n            throw new ConflictException(\n                translate: Message::create(\n                    key: 'resource.cannot_update',\n                    params: ['resource' => 'Example', 'current_status' => (string) $example->getStatus(), 'status' => 'active'],\n                ),\n            );\n        }\n\n        $this->repository->update($example);\n        return $example;\n    }\n}\n```\n\n### 3. **Repository / Infrastructure Layer**\n\n```php\nfinal class ExampleRepository\n{\n    public function save(Example $example): void\n    {\n        try {\n            $this->db->createCommand()\n                ->insert('example', $this->mapper->toArray($example))\n                ->execute();\n        } catch (\\Throwable $e) {\n            throw new ServiceException(\n                translate: Message::create(\n                    key: 'service.failed',\n                ),\n                data: ['operation' => 'save', 'error' => $e->getMessage()],\n                code: Status::INTERNAL_SERVER_ERROR,\n                previous: $e,\n            );\n        }\n    }\n}\n```\n\n---\n\n## 🚀 Praktik Terbaik\n\n### 1. **Pembuatan Exception**\n```php\n// ✅ Use specific exception types with Message keys\nthrow new NotFoundException(\n    translate: Message::create(key: 'resource.not_found', params: ['resource' => 'User', 'field' => 'id', 'value' => $id]),\n);\n\n// ❌ Avoid generic exceptions\nthrow new RuntimeException('User not found');\n```\n\n### 2. **Pesan Error**\n```php\n// ✅ Provide context via params\nthrow new ValidationException(\n    errors: ['email' => ['Invalid email format']],\n);\n\n// ❌ Avoid empty context when details exist\nthrow new ValidationException();\n```\n\n### 3. **HTTP Status Code**\n```php\n// ✅ Use appropriate status codes\nthrow new UnauthorizedException();  // 401\nthrow new ForbiddenException();     // 403\nthrow new NotFoundException();      // 404\n\n// ❌ Avoid wrong status codes\nthrow new BadRequestException(translate: 'User not found'); // Should be 404\n```\n\n### 4. **Exception Chaining**\n```php\n// ✅ Chain exceptions for context\nthrow new ServiceException(\n    translate: 'External API call failed',\n    code: Status::BAD_GATEWAY,\n    previous: $e,\n);\n\n// ❌ Lose the original exception\nthrow new ServiceException(translate: 'External API call failed');\n```\n\n---\n\n## 📊 Pertimbangan Performa\n\n### 1. **Overhead Exception**\n- Exception itu mahal — gunakan hanya untuk kasus yang benar-benar exceptional\n- Hindari penggunaan exception untuk flow control\n- Gunakan validasi sebelum business logic\n\n### 2. **Penggunaan Memori**\n- Jaga payload `params`, `errors`, dan `data` tetap ringkas\n- Hindari menyimpan objek besar di dalam exception\n- Gunakan exception chaining dengan bijak\n\n### 3. **Logging**\n- Log exception dengan konteks yang tepat (`getDefaultMessageKey()`, `getTranslateParams()`, `getData()`)\n- `ErrorMonitoringMiddleware` menangkap exception sesuai config `app/monitoring.error_monitoring`\n- Gunakan log level yang sesuai\n\n---\n\n## 🎯 Ringkasan\n\nHierarki exception menyediakan cara terstruktur untuk menangani berbagai jenis error di aplikasi Yii3 API. Manfaat utamanya meliputi:\n\n- **🔍 Type Safety**: Exception konkret `final` yang meng-extend `HttpException`\n- **📡 HTTP Compliance**: Pemetaan HTTP status code yang tepat via `getHttpStatusCode()`\n- **🌐 Localization**: Value object `Message` dengan `key`/`params`/`domain`\n- **🔧 Debugging**: Payload `errors` dan `data`, trace mode-dev di response error\n- **📦 Consistency**: Format error `{code, success, message, errors}` yang seragam\n- **🚀 Performance**: Exception handling yang dioptimalkan\n\nDengan mengikuti pola dan praktik terbaik yang diuraikan dalam panduan ini, Anda dapat membangun exception handling yang robust dan mudah dipelihara untuk aplikasi Yii3 API Anda! 🚀\n", "15-security-guide.md": "# Panduan Security\n\n## 📋 Gambaran Umum\n\nUtilitas security menyediakan fungsi keamanan esensial untuk aplikasi Yii3 API, termasuk input sanitization, autentikasi JWT, otorisasi berbasis permission, dan perlindungan terhadap kerentanan keamanan yang umum.\n\n---\n\n## 🏗️ Arsitektur Security\n\n### Struktur Direktori\n\n```\nsrc/Shared/Core/Security/\n└── InputSanitizer.php              # Static input sanitization (XSS / SQLi / DoS guards)\n\nsrc/Shared/Core/Middleware/\n├── AccessMiddleware.php            # Per-route permission enforcement\n├── CorsMiddleware.php              # CORS handling, rejects disallowed origins\n├── JwtMiddleware.php               # JWT bearer-token authentication\n├── RateLimitMiddleware.php         # In-memory rate limiting\n├── RequestParamsMiddleware.php     # Parses filter/sort/pagination params\n├── SecureHeadersMiddleware.php     # CSP, X-Frame-Options, etc.\n└── TrustedHostMiddleware.php       # Host header validation\n\nsrc/Infrastructure/Core/Security/\n├── AccessChecker.php               # Yiisoft AccessCheckerInterface implementation\n├── Actor.php                       # Authenticated user value (implements ActorInterface)\n├── ActorProvider.php               # Builds an Actor from JWT claims\n├── CurrentUser.php                 # Holds the current Actor (implements CurrentUserInterface)\n├── CurrentUserAwareInterface.php   # Marks classes that need CurrentUser injected\n├── HstsMiddleware.php              # Strict-Transport-Security header\n├── JwtService.php                  # firebase/jwt decode + iss/aud validation\n├── PermissionChecker.php           # Evaluates rules from config/common/access.php\n├── RbacAuthorizer.php              # AuthorizerInterface implementation\n└── Rule/PermissionMapRule.php      # Yiisoft Access rule backed by the access map\n\nsrc/Domain/Shared/Core/Contract/\n├── ActorInterface.php              # getId(), getUsername(), getDept(), hasRole(), isAdmin(), isSuperAdmin()\n├── CurrentUserInterface.php        # getActor(): ActorInterface\n└── DateTimeProviderInterface.php\n\nsrc/Domain/Shared/Core/Security/\n└── AuthorizerInterface.php         # can(string $permission): bool\n```\n\n### Prinsip Desain\n\n#### **1. Defense in Depth**\n- Sanitasi input (`InputSanitizer`) di batas request\n- Autentikasi JWT (`JwtMiddleware`) sebelum action dijalankan\n- Pemeriksaan permission (`AccessMiddleware` + `config/common/access.php`) per route\n- Middleware trusted host, CORS, secure headers, dan rate-limit\n\n#### **2. Fail-Safe Defaults**\n- Permission untuk route yang tidak dikenal default-nya **deny** (`PermissionChecker::can()` mengembalikan `false` untuk permission yang tidak terdaftar)\n- `JwtMiddleware` melempar `UnauthorizedException` ketika header `Authorization` tidak ada atau token tidak valid\n- `TrustedHostMiddleware` melempar `UnauthorizedException` untuk host yang tidak diizinkan\n\n#### **3. Sanitize Input, Escape Output**\n- `InputSanitizer` menghapus konten mencurigakan tetapi **tidak melakukan HTML-encode** — lakukan escape saat output\n- String kosong dinormalisasi menjadi `null`; batas kedalaman/ukuran mencegah DoS lewat payload buatan\n\n#### **4. Configuration over Code**\n- Permission map berada di `config/common/access.php`\n- Secret/path JWT, CORS, rate limit, HSTS, dan trusted host diatur via env melalui `config/common/params.php`\n\n---\n\n## 📁 Komponen Security\n\n### 1. InputSanitizer\n\n**Lokasi**: `src/Shared/Core/Security/InputSanitizer.php`\n\n**Tujuan**: Sanitasi input statis dan rekursif untuk mencegah XSS, pola SQL-injection, dan DoS (nesting terlalu dalam, array/string berukuran berlebihan).\n\n```php\nfinal class InputSanitizer\n{\n    private const MAX_STRING_LENGTH = 65535; // 64KB\n    private const MAX_ARRAY_DEPTH   = 10;\n    private const MAX_ARRAY_SIZE    = 1000;\n\n    public static function process(array $input): array;\n}\n```\n\n**Apa yang dilakukannya**:\n- Melakukan trim pada string, menghapus null byte/karakter kontrol/tak terlihat, mengubah `''` menjadi `null`\n- Memvalidasi encoding UTF-8; melempar `BadRequestException` pada encoding yang tidak valid\n- Mendeteksi pola XSS dan SQL-injection, mencatat warning, dan menghapus konten mencurigakan\n- Menegakkan `MAX_STRING_LENGTH`, `MAX_ARRAY_DEPTH`, `MAX_ARRAY_SIZE` dan memvalidasi key array — pelanggaran melempar `BadRequestException` dengan objek `Message` terlokalisasi (`domain: 'validation'`, key `input_sanitizer.*`)\n\n**Contoh Penggunaan**:\n```php\nuse App\\Shared\\Core\\Security\\InputSanitizer;\n\n// Direct usage\n$sanitized = InputSanitizer::process($request->getParsedBody() ?? []);\n\n// Via RawParams (preferred for request data)\nuse App\\Shared\\Core\\Request\\RawParams;\n\n$params = new RawParams($request->getParsedBody() ?? []);\n$clean  = $params->sanitize()->all();\n```\n\n```php\n// Example: dangerous input is cleaned, not escaped\n$sanitized = InputSanitizer::process([\n    'name' => 'John<script>alert(\"xss\")<\/script>',\n    'bio'  => '',\n]);\n// ['name' => 'John', 'bio' => null]\n```\n\n### 2. Autentikasi JWT\n\n**Komponen**:\n- `App\\Infrastructure\\Core\\Security\\JwtService` — membungkus `firebase/jwt`, memvalidasi `iss`/`aud` bila dikonfigurasi\n- `App\\Infrastructure\\Core\\Security\\ActorProvider` — membangun `Actor` dari claim token (mendukung claim objek `user` bersarang atau `preferred_username`)\n- `App\\Presentation\\Core\\Http\\Middleware\\JwtMiddleware` — middleware PSR-15 yang menegakkan bearer token\n- `App\\Infrastructure\\Core\\Security\\CurrentUser` — menyimpan `Actor` yang ter-resolve untuk request tersebut\n\n```php\n// JwtMiddleware is wired in config/common/di/jwt.php:\nJwtMiddleware::class => static fn (\n    JwtService $jwtService,\n    ActorProvider $actorProvider,\n    CurrentUser $currentUser\n) => new JwtMiddleware(\n    jwtService: $jwtService,\n    actorProvider: $actorProvider,\n    currentUser: $currentUser,\n    publicPaths: $params['app/jwt']['publicPaths'] ?? [],\n);\n```\n\n**Alur**:\n1. Path yang terdaftar di `app/jwt.publicPaths` (env `app.jwt.publicPaths`, JSON array) melewatkan validasi.\n2. Header `Authorization` tidak ada → `UnauthorizedException` (`auth.header_missing`), kecuali god mode mengizinkan bypass.\n3. `Bearer <token>` di-decode oleh `JwtService`; token tidak valid → `UnauthorizedException` (`auth.invalid_token`).\n4. `ActorProvider::fromToken()` memetakan claim ke `Actor`, disimpan di `CurrentUser` dan sebagai atribut request `actor`.\n\n**Parameter JWT** (`config/common/params.php`, dari `.env`):\n```php\n'app/jwt' => [\n    'secret'      => $_ENV['app.jwt.secret'],\n    'algorithm'   => $_ENV['app.jwt.algorithm'] ?? 'HS256',\n    'issuer'      => $_ENV['app.jwt.issuer'] ?? null,\n    'audience'    => $_ENV['app.jwt.audience'] ?? null,\n    'publicPaths' => $publicPaths, // JSON array, e.g. [\"/\", \"/auth/login\"]\n],\n```\n\n### 3. Actor & CurrentUser\n\n```php\n// src/Domain/Shared/Core/Contract/ActorInterface.php\ninterface ActorInterface\n{\n    public function getId(): int;\n    public function getUsername(): string;\n    public function getDept(): string;\n    public function hasRole(string $app, string $role): bool;\n    public function isAdmin(string $app): bool;\n    public function isSuperAdmin(string $app): bool;\n}\n```\n\n- `Actor` (`src/Infrastructure/Core/Security/Actor.php`) — implementasi konkret; role berupa map per-app (`$roles[$app]['roles']`, `['admin']`, `['superadmin']`).\n- `CurrentUser` — `getActor()` mengembalikan actor yang sudah di-set atau fallback `system` actor; `setActor()` membungkus ulang instance `Actor` dengan mempertahankan `allowGodMode`.\n- `CurrentUserAwareInterface` — implementasikan `setCurrentUser(CurrentUser $currentUser)` pada class (mis. repository yang menggunakan `HasCoreFeatures`) yang memerlukan injeksi actor.\n\n### 4. Otorisasi (Permission)\n\n**Permission map** — `config/common/access.php` (milik project):\n\n```php\n$appCode = $params['app/config']['code'] ?? 'default';\n\n$isKasir      = static fn (Actor $actor): bool => $actor->hasRole($appCode, 'kasir');\n$isAdmin      = static fn (Actor $actor): bool => $actor->isAdmin($appCode);\n$isSuperAdmin = static fn (Actor $actor): bool => $actor->isSuperAdmin($appCode);\n\nreturn [\n    '*' => $allowGodMode,                    // wildcard rule (god mode)\n    'example.index'   => static fn (Actor $actor): bool => true, // public\n    'example.view'    => $isKasir,           // single rule\n    'example.data'    => [$isSuperAdmin, $isKasir], // OR logic\n    'example.restore' => $isSuperAdmin,\n];\n```\n\nRule dapat berupa boolean, `callable(Actor): bool`, atau array of callable (logika OR). Permission yang tidak terdaftar ditolak oleh `PermissionChecker`.\n\n**Penegakan**:\n- `AccessMiddleware` membaca `permission` dari route yang cocok (`$route->getArgument('permission')` atau `defaults.permission` route) dan memanggil `AccessChecker::userHasPermission()`; ditolak → `ForbiddenException` (`access.insufficient_permissions`).\n- `AccessChecker` mengevaluasi wildcard `'*'` terlebih dahulu (god mode), lalu rule permission yang bernama.\n- `AuthorizerInterface` (`can(string $permission): bool`) di-bind ke `RbacAuthorizer` di `config/common/di/security-di.php` untuk digunakan di domain/application service.\n\n**God mode**:\n- `app/config.allow_god_mode` (env `app.config.allow_god_mode`) diinjeksikan ke `CurrentUser` via `security-di.php`.\n- Saat aktif, `Actor::isSuperAdmin()` mengembalikan `true` untuk setiap actor, dan `JwtMiddleware` meloloskan request bahkan tanpa token.\n- ⚠️ Hanya untuk development/testing — set `app.config.allow_god_mode=false` di production.\n\n### 5. Security Middleware\n\n| Middleware | Lokasi | Tujuan |\n|---|---|---|\n| `JwtMiddleware` | `src/Shared/Core/Middleware/` | Autentikasi bearer token, bypass public path |\n| `AccessMiddleware` | `src/Shared/Core/Middleware/` | Penegakan `permission` route |\n| `TrustedHostMiddleware` | `src/Shared/Core/Middleware/` | Allowlist host termasuk wildcard `*.example.com` (`app/trusted_hosts.allowedHosts`) |\n| `CorsMiddleware` | `src/Shared/Core/Middleware/` | Header CORS; `ForbiddenException` (`request.origin_not_allowed`) untuk origin tidak valid (`app/cors`) |\n| `RateLimitMiddleware` | `src/Shared/Core/Middleware/` | `TooManyRequestsException` (`rate_limit.exceeded`) melewati batas `app/rateLimit` |\n| `SecureHeadersMiddleware` | `src/Shared/Core/Middleware/` | CSP, `X-Frame-Options`, `X-Content-Type-Options`, `Referrer-Policy`, `Permissions-Policy` (`app/secureHeaders`) |\n| `HstsMiddleware` | `src/Infrastructure/Core/Security/` | `Strict-Transport-Security` (`app/hsts`) |\n| `RequestParamsMiddleware` | `src/Shared/Core/Middleware/` | Menormalkan parameter filter/sort/pagination (`app/pagination`) |\n\nDefinisi DI untuk middleware ini berada di `config/common/di/middleware-di.php` dan `config/common/di/jwt.php`. Tambahkan class middleware ke `config/common/middleware.php` agar benar-benar dieksekusi pada setiap request.\n\n---\n\n## 🔧 Konfigurasi Security\n\n### 1. **Environment Variable** (`.env`)\n\n```env\napp.config.allow_god_mode=false          # JANGAN PERNAH true di production\napp.jwt.secret=change-me\napp.jwt.algorithm=HS256\napp.jwt.issuer=your-issuer\napp.jwt.audience=your-audience\napp.jwt.publicPaths=[\"/\",\"/auth/login\",\"/auth/refresh\"]\napp.trusted_hosts.allowedHosts=[\"example.com\",\"*.example.com\"]\napp.cors.allowedOrigins=[\"https://app.example.com\"]\napp.rateLimit.maxRequests=100\napp.rateLimit.windowSize=60\n```\n\n### 2. **Konfigurasi DI**\n\n```php\n// config/common/di/security-di.php (excerpt)\nreturn array_merge([\n    CurrentUser::class => [\n        '__construct()' => [\n            'allowGodMode' => $params['app/config']['allow_god_mode'] ?? false,\n        ],\n    ],\n    Actor::class         => static fn (CurrentUser $currentUser) => $currentUser->getActor(),\n    AccessChecker::class => static function (CurrentUser $currentUser) {\n        $accessMap = require \\dirname(__DIR__) . '/access.php';\n        return new AccessChecker($currentUser, $accessMap);\n    },\n    PermissionChecker::class => [\n        '__construct()' => [require __DIR__ . '/../access.php'],\n    ],\n    AuthorizerInterface::class => RbacAuthorizer::class,\n], /* project overrides from config/common/security.php */);\n```\n\n---\n\n## 🚀 Best Practices\n\n### 1. **Sanitasi Input**\n```php\n// ✅ Sanitize request data\n$clean = InputSanitizer::process($request->getParsedBody() ?? []);\n// or\n$clean = (new RawParams($request->getParsedBody() ?? []))->sanitize()->all();\n\n// ❌ Trust user input\n$name = $_POST['name'];\n```\n\n### 2. **Lindungi Route dengan Permission**\n```php\n// ✅ Declare a permission on the route and add a rule in config/common/access.php\n// ❌ Check roles manually inside every action\n```\n\n### 3. **Periksa Otorisasi di Service**\n```php\n// ✅ Inject AuthorizerInterface and call can('example.delete')\n// ❌ Trust that the middleware already checked everything\n```\n\n### 4. **Pastikan God Mode Mati di Production**\n```php\n// ✅ app.config.allow_god_mode=false in production .env\n// ❌ Ship with god mode enabled — it bypasses JWT and all permission checks\n```\n\n---\n\n## 📊 Pertimbangan Security\n\n### 1. **Kerentanan Umum**\n- **SQL Injection**: `InputSanitizer` mendeteksi dan menghapus pola mencurigakan; selalu gunakan parameterized query via `Query`/`QueryConditionApplier`\n- **XSS**: dideteksi dan dihapus saat input; tetap lakukan escape saat output\n- **Host Header Injection**: allowlist `TrustedHostMiddleware`\n- **Rate Limiting / DoS**: `RateLimitMiddleware` + batas kedalaman/ukuran sanitizer\n- **File Upload**: tidak ada upload sanitizer bawaan — validasi tipe/ukuran di action Anda sebelum penyimpanan\n\n### 2. **Perlindungan Data**\n- **Sanitasi**: `InputSanitizer::process()` / `RawParams::sanitize()`\n- **Validasi**: `AbstractValidator` + rule di `src/Shared/Core/Validation/`\n- **Lokalisasi error**: value object `Message` yang di-resolve via `resources/messages/{locale}/`\n\n### 3. **Monitoring**\n- `RequestIdMiddleware`, `StructuredLoggingMiddleware`, `MetricsMiddleware`, `ErrorMonitoringMiddleware` di bawah `src/Infrastructure/Core/Monitoring/` (dikonfigurasi via parameter `app/monitoring`)\n\n---\n\n## 🎯 Ringkasan\n\nSecurity di boilerplate ini berlapis: sanitasi input di batas request, autentikasi dengan JWT, otorisasi per route via permission map `access.php`, dan perkuat respons dengan middleware host/CORS/headers/rate-limit. Manfaat utamanya meliputi:\n\n- **🛡️ Perlindungan**: Pertahanan terhadap serangan umum\n- **🔍 Validasi**: Validasi input komprehensif dan batas sanitasi\n- **🔑 Autentikasi**: JWT dengan validasi issuer/audience\n- **🚦 Otorisasi**: Permission map berbasis konfigurasi dengan override god mode untuk dev\n- **🚀 Performa**: Pemrosesan security yang efisien dan statis\n\nDengan mengikuti pola dan best practice yang diuraikan dalam panduan ini, Anda dapat membangun aplikasi yang aman dan robust dengan Yii3 API framework! 🚀\n", "16-middleware-guide.md": "# Panduan Middleware\n\n## 📋 Gambaran Umum\n\nKomponen middleware menyediakan cara untuk memfilter request HTTP yang masuk ke aplikasi Anda. Dalam aplikasi Yii3 API ini, middleware menangani cross-cutting concern seperti autentikasi, CORS, rate limiting, security header, monitoring, dan pemrosesan parameter request.\n\nSemua middleware aplikasi melempar subclass `HttpException` bertipe (`UnauthorizedException`, `ForbiddenException`, `TooManyRequestsException`, `BadRequestException`) alih-alih membangun response secara inline — exception dirender oleh responder `ExceptionResponderFactory` yang terdaftar di middleware dispatcher.\n\n---\n\n## 🏗️ Arsitektur Middleware\n\n### Struktur Direktori\n\n```\nsrc/Shared/Core/Middleware/\n├── AccessMiddleware.php          # RBAC permission check (route 'permission' default)\n├── CorsMiddleware.php            # Cross-Origin Resource Sharing\n├── JwtMiddleware.php             # JWT authentication\n├── RateLimitMiddleware.php       # Sliding-window rate limiting (in-memory)\n├── RequestParamsMiddleware.php   # Builds RequestParams -> 'payload' attribute\n├── SecureHeadersMiddleware.php   # Security headers (CSP, Permissions-Policy, ...)\n└── TrustedHostMiddleware.php     # Trusted host validation (wildcard support)\n\nsrc/Infrastructure/Core/Security/\n└── HstsMiddleware.php            # Strict-Transport-Security header\n\nsrc/Infrastructure/Core/Monitoring/\n├── RequestIdMiddleware.php       # X-Request-Id assignment/propagation\n├── StructuredLoggingMiddleware.php  # Per-request structured logging\n├── MetricsMiddleware.php         # Request metrics collection\n└── ErrorMonitoringMiddleware.php # Error/exception capture\n\nsrc/Api/Shared/\n└── NotFoundMiddleware.php        # 404 for unmatched routes (after Router)\n```\n\n### Prinsip Desain\n\n#### **1. **Single Responsibility**\n- Setiap middleware menangani satu concern spesifik\n- Pemisahan tanggung jawab yang jelas\n- Mudah diuji dan dipelihara\n\n#### **2. **Composability**\n- Middleware dapat dirangkai satu sama lain\n- Pipeline pemrosesan request yang fleksibel\n- Urutan eksekusi yang dapat dikonfigurasi\n\n#### **3. **Kepatuhan PSR**\n- Interface pesan HTTP PSR-7\n- Interface middleware PSR-15\n- Implementasi yang terstandarisasi\n\n#### **4. **Error Berbasis Exception**\n- Middleware melempar subclass `HttpException` dengan key terjemahan `Message`\n- Satu exception responder merender response error JSON yang konsisten\n\n---\n\n## 📁 Komponen Middleware\n\n### 1. TrustedHostMiddleware\n\n**Tujuan**: Memvalidasi `Host` request terhadap allow-list, mencegah host-header injection. Mendukung host persis dan wildcard subdomain `*.`.\n\n**Lokasi**: `src/Shared/Core/Middleware/TrustedHostMiddleware.php`\n\n```php\nfinal class TrustedHostMiddleware implements MiddlewareInterface\n{\n    public function __construct(\n        private readonly array $allowedHosts,\n    ) {}\n\n    public function process(ServerRequestInterface $request, RequestHandlerInterface $handler): ResponseInterface\n    {\n        $host = $request->getUri()->getHost();\n\n        if ($host === '' || !$this->isAllowedHost($host)) {\n            throw new UnauthorizedException(\n                translate: Message::create(key: 'security.host_not_allowed', params: ['host' => $host])\n            );\n        }\n\n        return $handler->handle($request);\n    }\n\n    private function isAllowedHost(string $host): bool { /* iterate allowedHosts */ }\n\n    private function matchHost(string $host, string $allowedHost): bool\n    {\n        // exact match, or '*.example.com' suffix match (does not match the bare domain)\n    }\n}\n```\n\n**Konfigurasi**: `allowedHosts` berasal dari params `app/trusted_hosts` (env `app.trusted_hosts.allowedHosts`, array JSON). Didaftarkan inline di `config/web/di/application.php`.\n\n> Catatan: `Yiisoft\\Security\\TrustedHosts\\TrustedHostsMiddleware` juga didefinisikan di `config/common/di/middleware-di.php` sebagai alternatif dari vendor; stack aplikasi saat ini menggunakan `App\\...\\TrustedHostMiddleware` kustom.\n\n---\n\n### 2. CorsMiddleware\n\n**Tujuan**: Penanganan CORS — memvalidasi `Origin`, menjawab preflight `OPTIONS` dengan `204`, dan menambahkan header CORS ke response.\n\n**Lokasi**: `src/Shared/Core/Middleware/CorsMiddleware.php`\n\n```php\nfinal class CorsMiddleware implements MiddlewareInterface\n{\n    public function __construct(\n        private array $config,                      // see keys below\n        private ResponseFactoryInterface $responseFactory,\n    ) {}\n\n    public function process(ServerRequestInterface $request, RequestHandlerInterface $handler): ResponseInterface\n    {\n        $origin = $request->getHeaderLine('Origin');\n\n        if ($origin === '') {\n            return $handler->handle($request);\n        }\n\n        if (!$this->isOriginAllowed($origin)) {\n            throw new ForbiddenException(\n                translate: Message::create(key: 'request.origin_not_allowed', params: ['origin' => $origin])\n            );\n        }\n\n        $allowOrigin = $this->getAllowOriginValue($origin);\n\n        if (\\strtoupper($request->getMethod()) === 'OPTIONS') {\n            $response = $this->responseFactory->createResponse(Status::NO_CONTENT);\n            return $this->addCorsHeaders($request, $response, $allowOrigin);\n        }\n\n        return $this->addCorsHeaders($request, $handler->handle($request), $allowOrigin);\n    }\n}\n```\n\n**Key konfigurasi** (params `app/cors`, diisi dari env var `app.cors.*`):\n- `allowedOrigins` — list atau `['*']` (dipaksa menjadi `['*']` di env dev)\n- `allowedMethods` — default `['GET','POST','PUT','PATCH','DELETE','OPTIONS']`\n- `allowedHeaders` — default `['Content-Type','Authorization']`\n- `exposedHeaders` — dikirim sebagai `Access-Control-Expose-Headers`\n- `maxAge` — default `3600`\n- `allowCredentials` — jika true, `Access-Control-Allow-Origin` menggemakan origin alih-alih `*`\n\n---\n\n### 3. JwtMiddleware\n\n**Tujuan**: Autentikasi JWT. Melewati public path yang dikonfigurasi; mendekode token `Bearer` via `JwtService`, membangun `Actor` via `ActorProvider`, dan menyimpannya di `CurrentUser` + atribut request `actor`.\n\n**Lokasi**: `src/Shared/Core/Middleware/JwtMiddleware.php`\n\n```php\nfinal class JwtMiddleware implements MiddlewareInterface\n{\n    public function __construct(\n        private JwtService $jwtService,\n        private ActorProvider $actorProvider,\n        private CurrentUser $currentUser,\n        private array $publicPaths = ['/', '/auth/login', '/auth/refresh'],\n    ) {}\n\n    public function process(ServerRequestInterface $request, RequestHandlerInterface $handler): ResponseInterface\n    {\n        $path = $request->getUri()->getPath();\n\n        if ($this->isPublicPath($path)) {\n            return $handler->handle($request);\n        }\n\n        $authHeader = $request->getHeaderLine('Authorization');\n        if ($authHeader === '') {\n            // GodMode super-admin bypass, else:\n            throw new UnauthorizedException(translate: Message::create(key: 'auth.header_missing'));\n        }\n\n        $token = \\str_replace('Bearer ', '', $authHeader);\n\n        try {\n            $claims = $this->jwtService->decode($token);\n            $actor  = $this->actorProvider->fromToken($claims);\n\n            $this->currentUser->setActor($actor);\n            $request = $request->withAttribute('actor', $actor);\n        } catch (\\Exception $e) {\n            // GodMode bypass, else:\n            throw new UnauthorizedException(\n                translate: Message::create(key: 'auth.invalid_token', params: ['error' => $e->getMessage()])\n            );\n        }\n\n        return $handler->handle($request);\n    }\n}\n```\n\n**DI** (`config/common/di/jwt.php`): `publicPaths` berasal dari params `app/jwt` (env `app.jwt.publicPaths`). `JwtService` mendapatkan `secret`/`algorithm`/`issuer`/`audience` dari params yang sama.\n\n---\n\n### 4. RequestParamsMiddleware\n\n**Tujuan**: Menggabungkan query param + body yang sudah di-parse ke dalam objek `RequestParams` dan menyimpannya sebagai atribut request `payload` (plus `paginationConfig`). Dipasang ke route group `/v1` — lihat `config/common/routes.php`.\n\n**Lokasi**: `src/Shared/Core/Middleware/RequestParamsMiddleware.php`\n\n```php\nfinal class RequestParamsMiddleware implements MiddlewareInterface\n{\n    public function __construct(\n        private int $defaultPageSize = 50,\n        private int $maxPageSize = 200\n    ) {}\n\n    public function process(ServerRequestInterface $request, RequestHandlerInterface $handler): ResponseInterface\n    {\n        // Anonymous DataParserInterface merging query + body (body wins)\n        $parser = new class($request) implements DataParserInterface { /* ... */ };\n\n        $params = new RequestParams($parser, $this->defaultPageSize, $this->maxPageSize);\n\n        $request = $request->withAttribute('paginationConfig', [\n            'defaultPageSize' => $this->defaultPageSize,\n            'maxPageSize'     => $this->maxPageSize,\n        ]);\n        $request = $request->withAttribute('payload', $params);\n\n        return $handler->handle($request);\n    }\n}\n```\n\n**Konfigurasi**: params `app/pagination` (env `app.pagination.defaultPageSize` / `app.pagination.maxPageSize`); factory DI di `config/common/di/middleware-di.php`. Action di hilir membaca `$request->getAttribute('payload')`. Lihat Panduan Request Processing untuk alur lengkapnya.\n\n---\n\n### 5. RateLimitMiddleware\n\n**Tujuan**: Rate limiting sliding-window di memori, dikunci berdasarkan IP klien dan grup path (`/v1/example*` → `example:{ip}`, `/v1/auth*` → `auth:{ip}`, lainnya → `global:{ip}`).\n\n**Lokasi**: `src/Shared/Core/Middleware/RateLimitMiddleware.php`\n\n```php\nfinal class RateLimitMiddleware implements MiddlewareInterface\n{\n    private array $storage = [];\n\n    public function __construct(int $maxRequests = 100, int $windowSize = 60) {}\n\n    public function process(ServerRequestInterface $request, RequestHandlerInterface $handler): ResponseInterface\n    {\n        $clientIp = $this->getClientIp($request); // X-Forwarded-For > X-Real-IP > Client-IP > REMOTE_ADDR\n        $key      = $this->getCacheKey($clientIp, $request);\n\n        // slide the window, count requests\n        if ($currentCount >= $this->maxRequests) {\n            throw new TooManyRequestsException(\n                translate: Message::create(key: 'rate_limit.exceeded', params: [/* seconds, limit, reset, retry_after */])\n            );\n        }\n\n        $response = $handler->handle($request);\n\n        return $response\n            ->withHeader('X-RateLimit-Limit', (string) $this->maxRequests)\n            ->withHeader('X-RateLimit-Remaining', (string) \\max(0, $this->maxRequests - $currentCount - 1))\n            ->withHeader('X-RateLimit-Reset', (string)
