uan**: Abstraksi atas \"dari mana data mentah berasal\".\n\n```php\ninterface DataParserInterface\n{\n    public function all(): array;\n    public function get(string $key, mixed $default = null): mixed;\n}\n```\n\n`RequestDataParser` mengimplementasikannya untuk request PSR-7 — menggabungkan query params dan parsed body, dengan body yang didahulukan:\n\n```php\nfinal readonly class RequestDataParser implements DataParserInterface\n{\n    public function __construct(private ServerRequestInterface $request)\n    {\n        $this->data = $this->parse(); // array_merge($query, $body)\n    }\n\n    public function get(string $key, mixed $default = null): mixed;\n    public function all(): array;\n}\n```\n\n**Contoh Penggunaan**:\n```php\n// Standalone usage (outside the middleware pipeline)\n$parser = new RequestDataParser(request: $request);\n$params = new RequestParams(parser: $parser);\n\n// RequestParams::from() wraps an array in an anonymous DataParserInterface\n$params = RequestParams::from(['filter' => ['status' => 1], 'page' => 2]);\n```\n\n> **Catatan**: `RequestParamsMiddleware` tidak menggunakan `RequestDataParser` — middleware membangun `DataParserInterface` anonim secara inline yang melakukan penggabungan query+body yang sama.\n\n---\n\n### 6. RequestParamsMiddleware\n\n**Tujuan**: Membangun `RequestParams` sekali per request dan menyimpannya di atribut request.\n\n**Lokasi**: `src/Shared/Core/Middleware/RequestParamsMiddleware.php`\n\n```php\nfinal class RequestParamsMiddleware implements MiddlewareInterface\n{\n    public function __construct(\n        private int $defaultPageSize = 50,\n        private int $maxPageSize = 200\n    ) {}\n\n    public function process(ServerRequestInterface $request, RequestHandlerInterface $handler): ResponseInterface\n    {\n        // anonymous DataParserInterface merging query + body (body wins)\n        $parser = new class($request) implements DataParserInterface { /* ... */ };\n\n        $params = new RequestParams($parser, $this->defaultPageSize, $this->maxPageSize);\n\n        $request = $request->withAttribute('paginationConfig', [\n            'defaultPageSize' => $this->defaultPageSize,\n            'maxPageSize'     => $this->maxPageSize,\n        ]);\n        $request = $request->withAttribute('payload', $params);\n\n        return $handler->handle($request);\n    }\n}\n```\n\nDidaftarkan per-route-group di `config/common/routes.php` dan dikonfigurasi melalui params `app/pagination` di `config/common/di/middleware-di.php`:\n\n```php\nGroup::create('/v1')\n    ->middleware(RequestParamsMiddleware::class)\n    ->routes(/* ... */);\n```\n\n```php\nRequestParamsMiddleware::class => static function () use ($params) {\n    $pagination = $params['app/pagination'] ?? [];\n\n    return new RequestParamsMiddleware(\n        defaultPageSize: (int) ($pagination['defaultPageSize'] ?? 50),\n        maxPageSize: (int) ($pagination['maxPageSize'] ?? 200),\n    );\n},\n```\n\n---\n\n### 7. SearchCriteria & SearchCriteriaFactory\n\n**Tujuan**: `SearchCriteria` adalah DTO yang diserahkan ke application service/repository; `SearchCriteriaFactory` membangunnya dari `RequestParams` dengan whitelist kolom yang dapat di-sort.\n\n**Lokasi**: `src/Shared/Core/Dto/SearchCriteria.php`, `src/Application/Shared/Core/Factory/SearchCriteriaFactory.php`\n\n```php\nfinal readonly class SearchCriteria\n{\n    public function __construct(\n        public array $filter,\n        public int $page,\n        public int $pageSize = 10,\n        public string $sortBy = 'id',\n        public string $sortDir = 'desc',\n        public ?int $offset = null,                       // manual offset override\n        private array $allowedSort = ['id' => 'id'],      // client key => db column\n    ) {}\n\n    public function calculateOffset(): int;  // (page - 1) * pageSize\n\n    /**\n     * Order clause for the query builder: maps sortBy through allowedSort,\n     * falls back to the first allowed column when the key is unknown,\n     * and converts dir to SORT_ASC/SORT_DESC.\n     */\n    public function getOrderClause(): array;\n}\n```\n\n```php\nfinal class SearchCriteriaFactory\n{\n    public function createFromRequest(\n        RequestParams $params,\n        array $allowedSort,\n        int $defaultPageSize = 15\n    ): SearchCriteria {\n        $pagination = $params->getPagination();\n        $sort       = $params->getSort();\n\n        return new SearchCriteria(\n            filter: $params->getFilter()->toArray(),\n            page: $pagination->page ?? 1,\n            pageSize: $pagination->page_size ?? $defaultPageSize,\n            sortBy: $sort->by ?? \\array_key_first($allowedSort),\n            sortDir: $sort->dir ?? 'desc',\n            allowedSort: $allowedSort\n        );\n    }\n}\n```\n\n---\n\n## 🔧 Pola Integrasi\n\n### 1. **List Endpoint** (`ExampleDataAction`)\n\n```php\nfinal class ExampleDataAction\n{\n    private const ALLOWED_KEYS = ['id', 'name', 'status'];\n    private const ALLOWED_SORT = [\n        'id'     => 'id',\n        'name'   => 'name',\n        'status' => 'status',\n    ];\n\n    public function __construct(\n        private SearchCriteriaFactory $factory,\n        private ExampleInputValidator $inputValidator,\n        private ExampleApplicationService $applicationService,\n        private ResponseFactory $responseFactory,\n    ) {}\n\n    public function __invoke(ServerRequestInterface $request): ResponseInterface\n    {\n        /** @var RequestParams $payload */\n        $payload = $request->getAttribute('payload');\n\n        // Whitelist the filter keys, then validate with the SEARCH context\n        $filter = $payload->getFilter()\n            ->onlyAllowed(allowedKeys: self::ALLOWED_KEYS)\n            ->with('status', RecordStatus::DRAFT->value);\n\n        $this->inputValidator->validate(\n            data: $filter,\n            context: ValidationContext::SEARCH,\n        );\n\n        $criteria = $this->factory->createFromRequest(\n            params: $payload,\n            allowedSort: self::ALLOWED_SORT\n        );\n\n        $result = $this->applicationService->list(criteria: $criteria);\n\n        return $this->responseFactory->success(\n            data: $result->data,\n            translate: Message::create(key: 'resource.list_retrieved', params: [\n                'resource' => $this->applicationService->getResource(),\n            ]),\n            meta: $result->getMeta(),\n        );\n    }\n}\n```\n\n### 2. **Integrasi Service**\n\n```php\nfinal class ExampleApplicationService\n{\n    public function list(SearchCriteria $criteria): PaginatedResult\n    {\n        return $this->repository->list(criteria: $criteria);\n    }\n}\n```\n\n### 3. **Integrasi Repository**\n\n```php\nfinal class ExampleRepository\n{\n    public function list(SearchCriteria $criteria): PaginatedResult\n    {\n        $query = (new Query($this->db))\n            ->from(self::TABLE_NAME)\n            ->where($this->scopeWhereNotDeleted());\n\n        // Apply filters via QueryConditionApplier\n        $this->queryConditionApplier->apply($query, $criteria->filter);\n\n        $total = (clone $query)->count();\n\n        $data = $query\n            ->orderBy($criteria->getOrderClause())\n            ->offset($criteria->offset ?? $criteria->calculateOffset())\n            ->limit($criteria->pageSize)\n            ->all();\n\n        return new PaginatedResult(\n            data: $data,\n            total: $total,\n            page: $criteria->page,\n            pageSize: $criteria->pageSize,\n            filter: $criteria->filter,\n        );\n    }\n}\n```\n\n---\n\n## 🚀 Best Practices\n\n### 1. **Selalu Melalui Payload**\n```php\n// ✅ Use the middleware-built RequestParams\n$payload = $request->getAttribute('payload');\n$params  = $payload->getRawParams()->onlyAllowed(self::ALLOWED_KEYS)->sanitize();\n\n// ❌ Re-parse query/body manually in the action\n$data = $request->getQueryParams();\n```\n\n### 2. **Whitelist Sebelum Digunakan**\n```php\n// ✅ Reject unknown keys early\n$params = $payload->getRawParams()->onlyAllowed(['name', 'status']);\n\n// ❌ Trust whatever the client sent\n$params = $payload->getRawParams();\n```\n\n### 3. **Whitelist Kolom yang Dapat Di-sort**\n```php\n// ✅ Map client keys to DB columns — unknown sorts fall back safely\n$criteria = $this->factory->createFromRequest($payload, allowedSort: [\n    'id' => 'id', 'name' => 'name', 'created_at' => 'created_at',\n]);\n\n// ❌ Pass the raw sort field into orderBy (SQL injection risk)\n$query->orderBy([$sort->getSortBy() => SORT_ASC]);\n```\n\n### 4. **Sanitasi Input**\n```php\n// ✅ Sanitize values that will be persisted\n$params = $payload->getRawParams()->onlyAllowed(self::ALLOWED_KEYS)->sanitize();\n```\n\n---\n\n## 📊 Pertimbangan Performa\n\n### 1. **Penggunaan Memori**\n- Value object `readonly` — tidak perlu defensive copying\n- Params di-parse sekali di middleware, dipakai ulang oleh semua layer\n\n### 2. **Overhead Validasi**\n- `onlyAllowed()` gagal cepat pada key yang tidak dikenal\n- `page_size` dibatasi oleh `maxPageSize` untuk mencegah query berat\n\n### 3. **Performa Parsing**\n- Satu `array_merge` query + body per request\n- `SearchCriteria::getOrderClause()` me-resolve kolom dalam O(1)\n\n---\n\n## 🎯 Ringkasan\n\nUtilitas pemrosesan request menyediakan cara yang terstruktur dan type-safe untuk menangani data HTTP request di aplikasi Yii3 API. Manfaat utamanya meliputi:\n\n- **🛡️ Type Safety**: Value object `readonly` mencegah runtime error\n- **✅ Validation**: `onlyAllowed()` + input validator + `ensureExists()`\n- **🔄 Consistency**: Satu `RequestParams` di `payload`, satu `SearchCriteria` ke service\n- **🧪 Testability**: `RequestParams::from()` membangun params dari array biasa\n- **📦 Modularity**: Setiap komponen memiliki satu tanggung jawab\n- **🚀 Performance**: Parse sekali, teruskan objek immutable antar layer\n\nDengan mengikuti pola dan best practice yang diuraikan dalam panduan ini, Anda dapat membangun pemrosesan request yang robust dan mudah dipelihara untuk aplikasi Yii3 API Anda! 🚀\n", "07-validation-guide.md": "# Panduan Validasi\n\n## 📋 Gambaran Umum\n\nValidasi input di aplikasi ini dibangun di atas [`yiisoft/validator`](https://github.com/yiisoft/validator). Setiap modul API mendefinisikan sebuah `*InputValidator` yang meng-extend `App\\Shared\\Core\\Validation\\AbstractValidator` dan mendeklarasikan kumpulan rule per context (`CREATE`, `UPDATE`, `DELETE`, `SEARCH`, ...) menggunakan rule object Yiisoft. Saat gagal, sebuah `ValidationException` (HTTP 422) dengan daftar error yang ternormalisasi akan dilempar.\n\n---\n\n## 🏗️ Arsitektur Validasi\n\n### Struktur Direktori\n\n```\nsrc/Shared/Core/Validation/\n├── AbstractValidator.php              # Base validator wrapping Yiisoft\\Validator\n├── ValidationContextInterface.php     # Context constants (CREATE/UPDATE/DELETE/SEARCH/APPROVE/REJECT)\n└── Rules/\n    ├── HasNoDependencies.php          # Custom rule: record must not be referenced elsewhere\n    ├── HasNoDependenciesHandler.php   # Rule handler (DB check)\n    ├── UniqueValue.php                # Custom rule: value must be unique in a table column\n    └── UniqueValueHandler.php         # Rule handler (DB check)\n\nsrc/Shared/Common/Context/\n└── ValidationContext.php              # Concrete context class (implements the interface constants)\n\nsrc/Api/V1/{Module}/Validation/\n└── {Module}InputValidator.php         # Per-module validators, e.g. ExampleInputValidator\n```\n\n### Prinsip Desain\n\n#### **1. **Context Awareness**\n- Rule validasi dipilih berdasarkan konstanta `ValidationContext`\n- Rule berbeda per operasi (create vs update vs search)\n- Context kustom dapat ditambahkan per modul\n\n#### **2. **Fail-Fast**\n- `validate()` melempar `ValidationException` pada payload invalid pertama\n- Rule group `StopOnError` menghentikan rule sebuah field pada error pertama\n\n#### **3. **Error Handling**\n- Error dinormalisasi menjadi `[['field' => ..., 'message' => ...], ...]`\n- `ValidationException` secara otomatis dipetakan ke HTTP 422\n- Value object `Message` menyediakan key lokalisasi\n\n#### **4. **Performance**\n- Rule adalah objek biasa — murah untuk dibuat per request\n- `skipOnEmpty` melewati rule mahal untuk nilai yang tidak ada\n- `StopOnError` menghindari menjalankan rule berat (mis. lookup DB) ketika pengecekan murah sudah gagal\n\n---\n\n## 📁 Komponen Validasi\n\n### 1. AbstractValidator\n\n**Tujuan**: Base class untuk semua input validator. Membungkus `Yiisoft\\Validator\\ValidatorInterface`, menyediakan entry point `validate()` dan menormalisasi error.\n\n**Lokasi**: `src/Shared/Core/Validation/AbstractValidator.php`\n\n```php\n<?php\n\ndeclare(strict_types=1);\n\nnamespace App\\Shared\\Core\\Validation;\n\nuse App\\Shared\\Core\\Exception\\ValidationException;\nuse App\\Shared\\Core\\Request\\RawParams;\nuse App\\Shared\\Core\\ValueObject\\LockVersionConfig;\nuse Yiisoft\\Validator\\Result;\nuse Yiisoft\\Validator\\ValidatorInterface;\n\nabstract class AbstractValidator\n{\n    protected array $data = [];\n    protected mixed $id   = null;\n\n    public function __construct(\n        protected LockVersionConfig $lockVersionConfig,\n        protected ValidatorInterface $validator\n    ) {\n    }\n\n    /**\n     * Validate $data against the rule set for $context.\n     * Throws ValidationException (HTTP 422) when invalid.\n     */\n    final public function validate(string $context, RawParams $data): void\n    {\n        $this->data = $data->toArray();\n        $this->id   = $this->data['id'] ?? null;\n\n        $result = $this->validator->validate($this->data, $this->rules($context));\n\n        if (!$result->isValid()) {\n            throw new ValidationException($this->formatErrors($result));\n        }\n    }\n\n    /** Normalizes Yiisoft errors to [['field' => 'a.b', 'message' => '...'], ...] */\n    private function formatErrors(Result $result): array { /* ... */ }\n\n    /** Whether optimistic locking is enabled for this validator (via LockVersionConfig). */\n    protected function isOptimisticLockEnabled(): bool { /* ... */ }\n    protected function shouldValidateOptimisticLock(): bool { /* ... */ }\n\n    abstract protected function rules(string $context): array;\n}\n```\n\n**Poin penting**:\n\n- Signature `validate()`: `validate(string $context, RawParams $data): void` — perhatikan urutan argumennya: **context dulu, lalu objek `RawParams`** (action meneruskan `RawParams` yang sudah difilter, mis. `$params` dari `RequestParams`).\n- `$this->data` menampung array payload; `$this->id` adalah `$data['id'] ?? null` — gunakan di rule seperti `UniqueValue(ignoreId: $this->data['id'] ?? null)` untuk mengecualikan record yang sedang di-update.\n- `shouldValidateOptimisticLock()` membaca `LockVersionConfig` (params `app/optimisticLock`: `enabled` + `disabledValues`) — gunakan bersama `new Required(when: fn () => $this->shouldValidateOptimisticLock())` untuk `lock_version`.\n\n---\n\n### 2. ValidationContext\n\n**Tujuan**: Konstanta yang memilih kumpulan rule mana yang diterapkan validator.\n\n**Lokasi**: `src/Shared/Core/Validation/ValidationContextInterface.php` dan `src/Shared/Common/Context/ValidationContext.php`\n\n```php\nnamespace App\\Shared\\Core\\Validation;\n\ninterface ValidationContextInterface\n{\n    public const SEARCH  = 'search';\n    public const CREATE  = 'create';\n    public const UPDATE  = 'update';\n    public const DELETE  = 'delete';\n    public const APPROVE = 'approve';\n    public const REJECT  = 'reject';\n}\n```\n\n```php\nnamespace App\\Shared\\Common\\Context;\n\nuse App\\Shared\\Core\\Validation\\ValidationContextInterface;\n\nfinal class ValidationContext implements ValidationContextInterface\n{\n    // Constants are inherited from the interface.\n    // Add module-specific contexts here when needed, e.g.:\n    // public const CREATE_DO = 'create_do';\n}\n```\n\nGunakan `App\\Shared\\Common\\Context\\ValidationContext` di validator dan action:\n\n```php\n$this->inputValidator->validate(\n    data: $params,\n    context: ValidationContext::CREATE,\n);\n```\n\n---\n\n### 3. Custom Rule\n\nDua custom rule `Yiisoft\\Validator\\RuleInterface` tersedia di `src/Shared/Core/Validation/Rules/`:\n\n#### UniqueValue\n\nMemeriksa bahwa nilai sebuah kolom belum ada di tabel.\n\n```php\nfinal class UniqueValue implements RuleInterface\n{\n    public function __construct(\n        public string $table,\n        public string $column,\n        public mixed $ignoreId = null,     // exclude this id (for updates)\n        public string $idColumn = 'id',\n        public string $message = 'Data ini sudah ada di database.',\n    ) {}\n\n    public function getName(): string    { return 'uniqueValue'; }\n    public function getHandler(): string { return UniqueValueHandler::class; }\n}\n```\n\n#### HasNoDependencies\n\nMemeriksa (saat delete) bahwa tidak ada baris tabel lain yang mereferensikan record tersebut. `map` berbentuk `table => [fk columns]`.\n\n```php\n#[\\Attribute(\\Attribute::TARGET_PROPERTY)]\nfinal class HasNoDependencies implements RuleInterface\n{\n    public function __construct(\n        public array $map,\n        public string $message = 'Data sedang digunakan di modul lain.',\n    ) {}\n\n    public function getName(): string    { return 'hasNoDependencies'; }\n    public function getHandler(): string { return HasNoDependenciesHandler::class; }\n}\n```\n\n**Registrasi handler** (`config/common/di/validator.php`):\n\n```php\nreturn [\n    RuleHandlerResolverInterface::class => static fn (ContainerInterface $container) =>\n        new SimpleRuleHandlerContainer([\n            UniqueValueHandler::class => $container->get(UniqueValueHandler::class),\n        ]),\n\n    UniqueValueHandler::class => [\n        '__construct()' => [\n            'db'         => Reference::to(ConnectionInterface::class),\n            'translator' => Reference::to(TranslatorInterface::class),\n        ],\n    ],\n\n    ValidatorInterface::class => Validator::class,\n];\n```\n\n---\n\n### 4. Module Input Validator\n\n**Tujuan**: Validator konkret per modul yang mendeklarasikan rule per context.\n\n**Contoh** (diringkas dari `src/Api/V1/Example/Validation/ExampleInputValidator.php`):\n\n```php\n<?php\n\ndeclare(strict_types=1);\n\nnamespace App\\Api\\V1\\Example\\Validation;\n\nuse App\\Shared\\Common\\Context\\ValidationContext;\nuse App\\Shared\\Core\\Enums\\RecordStatus;\nuse App\\Shared\\Core\\Validation\\AbstractValidator;\nuse App\\Shared\\Core\\Validation\\Rules\\UniqueValue;\nuse Yiisoft\\Validator\\Rule\\In;\nuse Yiisoft\\Validator\\Rule\\Integer;\nuse Yiisoft\\Validator\\Rule\\Length;\nuse Yiisoft\\Validator\\Rule\\Required;\nuse Yiisoft\\Validator\\Rule\\StopOnError;\nuse Yiisoft\\Validator\\Rule\\StringValue;\n\nfinal class ExampleInputValidator extends AbstractValidator\n{\n    protected function rules(string $context): array\n    {\n        return match ($context) {\n            ValidationContext::CREATE => [\n                'name' => [\n                    new StopOnError([\n                        new Required(),\n                        new StringValue(),\n                        new Length(min: 3, max: 255),\n                        new UniqueValue(\n                            table: 'example',\n                            column: 'name',\n                            ignoreId: null\n                        ),\n                    ]),\n                ],\n                'status' => [\n                    new Required(),\n                    new Integer(),\n                    new In(RecordStatus::draftOnlyStates()),\n                ],\n            ],\n            ValidationContext::UPDATE => [\n                'id' => [\n                    new Required(),\n                    new Integer(min: 1),\n                ],\n                'name' => [\n                    new StopOnError([\n                        new StringValue(skipOnEmpty: true),\n                        new Length(min: 3, max: 255, skipOnEmpty: true),\n                        new UniqueValue(\n                            table: 'example',\n                            column: 'name',\n                            ignoreId: $this->data['id'] ?? null // exclude current record\n                        ),\n                    ]),\n                ],\n                'status' => [\n                    new Integer(skipOnEmpty: true),\n                    new In(RecordStatus::searchableStates()),\n                ],\n                'lock_version' => [\n                    new Required(when: fn () => $this->shouldValidateOptimisticLock()),\n                    new Integer(min: 1, skipOnEmpty: true),\n                ],\n            ],\n            ValidationContext::DELETE => [\n                'id' => [\n                    new Required(),\n                    new Integer(min: 1),\n                    // Optionally guard the delete:\n                    // new HasNoDependencies(map: ['other_table' => ['example_id']]),\n                ],\n            ],\n            ValidationContext::SEARCH => [\n                'id'        => [new Integer(skipOnEmpty: true)],\n                'name'      => [\n                    new StringValue(skipOnEmpty: true),\n                    new Length(min: 1, max: 100, skipOnEmpty: true),\n                ],\n                'status'    => [new Integer(skipOnEmpty: true)],\n                'sync_mdb'  => [new Integer(skipOnEmpty: true)],\n                'page'      => [new Integer(min: 1, skipOnEmpty: true)],\n                'page_size' => [new Integer(min: 1, max: 200, skipOnEmpty: true)],\n                'sort_by'   => [new StringValue(skipOnEmpty: true)],\n                'sort_dir'  => [new In(['asc', 'desc'], skipOnEmpty: true)],\n            ],\n            default => [],\n        };\n    }\n}\n```\n\n---\n\n## 🔧 Pola Integrasi\n\n### 1. **Validasi di Action**\n\nAction menerima objek `RequestParams` dari atribut request `payload` (diset oleh `RequestParamsMiddleware`), mempersempitnya dengan `onlyAllowed()`, lalu memvalidasinya.\n\n**Create** (`src/Api/V1/Example/Action/ExampleCreateAction.php`):\n\n```php\nfinal class ExampleCreateAction\n{\n    private const ALLOWED_KEYS = ['name', 'status', 'sync_mdb'];\n\n    public function __invoke(ServerRequestInterface $request): ResponseInterface\n    {\n        /** @var RequestParams $payload */\n        $payload = $request->getAttribute('payload');\n\n        $params = $payload->getRawParams()\n            ->onlyAllowed(allowedKeys: self::ALLOWED_KEYS)\n            ->with('status', RecordStatus::DRAFT->value)\n            ->sanitize();\n\n        // Throws ValidationException (HTTP 422) on failure\n        $this->inputValidator->validate(\n            data: $params,\n            context: ValidationContext::CREATE,\n        );\n\n        $command = CreateExampleCommand::create(\n            name: (string) $params->get('name'),\n            status: $params->get('status'),\n            detailInfo: $params->get('detail_info')\n        );\n\n        $response = $this->applicationService->create(command: $command);\n        // ...\n    }\n}\n```\n\n**Update** (`ExampleUpdateAction.php`) — menggabungkan `id` dari route ke dalam payload agar `UniqueValue` dapat mengecualikan record saat ini:\n\n```php\n$id      = $currentRoute->getArgument('id');\n$payload = $request->getAttribute('payload');\n\n$payload->ensureExists(resource: $resource); // 400 when payload is empty\n\n$params = $payload->getRawParams()\n    ->onlyAllowed(allowedKeys: ['name', 'status', 'lock_version'])\n    ->with('id', $id)\n    ->sanitize();\n\n$this->inputValidator->validate(\n    data: $params,\n    context: ValidationContext::UPDATE,\n);\n```\n\n**Search** (`ExampleDataAction.php`) — memvalidasi blok `filter`, bukan raw params:\n\n```php\n$filter = $payload->getFilter()\n    ->onlyAllowed(allowedKeys: ['id', 'name', 'status'])\n    ->with('status', RecordStatus::DRAFT->value);\n\n$this->inputValidator->validate(\n    data: $filter,\n    context: ValidationContext::SEARCH,\n);\n```\n\n### 2. **Validasi Optimistic Lock**\n\n`lock_version` hanya wajib diisi ketika optimistic locking diaktifkan untuk validator (`LockVersionConfig`, params `app/optimisticLock`):\n\n```php\n'lock_version' => [\n    new Required(when: fn () => $this->shouldValidateOptimisticLock()),\n    new Integer(min: 1, skipOnEmpty: true),\n],\n```\n\n### 3. **Proteksi Delete**\n\nMencegah penghapusan record yang masih direferensikan:\n\n```php\nValidationContext::DELETE => [\n    'id' => [\n        new Required(),\n        new Integer(min: 1),\n        new HasNoDependencies(\n            map: [\n                'other_table'   => ['example_id'],\n                'another_table' => ['example_id'],\n            ],\n            message: 'Data tidak bisa dihapus karena masih digunakan di tabel lain.'\n        ),\n    ],\n],\n```\n\n---\n\n## 🚀 Best Practices\n\n### 1. **Desain Validator**\n```php\n// ✅ Extend AbstractValidator and declare rules per context\nfinal class ProductInputValidator extends AbstractValidator\n{\n    protected function rules(string $context): array\n    {\n        return match ($context) {\n            ValidationContext::CREATE => [/* ... */],\n            default => [],\n        };\n    }\n}\n\n// ❌ Ad-hoc validation scattered in actions\nif (strlen($data['name']) < 3) { /* ... */ }\n```\n\n### 2. **Field Opsional**\n```php\n// ✅ Use skipOnEmpty for optional fields\n'name' => [\n    new StringValue(skipOnEmpty: true),\n    new Length(min: 3, max: 255, skipOnEmpty: true),\n],\n```\n\n### 3. **Stop On Error**\n```php\n// ✅ Wrap a field's rules in StopOnError to fail fast\n//    (avoids hitting the DB in UniqueValue when Required already failed)\n'name' => [\n    new StopOnError([\n        new Required(),\n        new StringValue(),\n        new UniqueValue(table: 'example', column: 'name'),\n    ]),\n],\n```\n\n### 4. **Error Handling**\n```php\n// ✅ Let validate() throw — the exception responder renders HTTP 422\n$this->inputValidator->validate(data: $params, context: ValidationContext::CREATE);\n\n// ❌ Catching and re-wrapping validation errors manually\ntry { /* validate */ } catch (ValidationException $e) { /* wrap */ }\n```\n\n---\n\n## 📊 Pertimbangan Performa\n\n### 1. **Overhead Validasi**\n- Gunakan `StopOnError` agar pengecekan DB `UniqueValue`/`HasNoDependencies` hanya berjalan ketika rule murah lolos\n- Gunakan `skipOnEmpty` untuk melewati rule pada field opsional yang tidak diisi\n\n### 2. **Penggunaan Memori**\n- Rule object dibuat per pemanggilan `rules()` — jaga agar tetap ringan\n- `validate()` hanya menyimpan array payload di `$this->data`\n\n### 3. **Kecepatan Pemrosesan**\n- Letakkan rule murah (`Required`, `Integer`, `Length`) sebelum rule mahal di dalam `StopOnError`\n- Batasi filter `SEARCH` dengan `onlyAllowed()` sebelum memvalidasi\n\n---\n\n## 🎯 Ringkasan\n\nValidasi di aplikasi ini digerakkan oleh context dan dibangun di atas `yiisoft/validator`. Poin utamanya:\n\n- **🔍 Extensibility**: Modul baru menambahkan `*InputValidator` yang meng-extend `AbstractValidator`\n- **📝 Context Awareness**: Kumpulan rule dikunci oleh konstanta `ValidationContext`\n- **🌐 Localization**: Error mengalir melalui key translasi `ValidationException`/`Message`\n- **🧪 Testability**: Rule berupa array deklaratif — mudah di-assert per context\n- **📦 Composability**: Gabungkan rule bawaan Yiisoft dengan custom `UniqueValue`/`HasNoDependencies`\n- **⚡ Performance**: `StopOnError` + `skipOnEmpty` menjaga validasi tetap murah\n\nDengan mengikuti pola dan best practice yang diuraikan dalam panduan ini, Anda dapat membangun validasi yang robust dan mudah dipelihara untuk aplikasi Yii3 API Anda! 🚀\n", "08-input-validator-guide.md": "# Panduan Input Validator\n\n## Overview\n\nInput Validator memvalidasi parameter request sebelum data masuk ke application service. Boilerplate ini memakai `AbstractValidator` bersama `Yiisoft\\Validator\\ValidatorInterface` dan `ValidationContext` untuk memilih rules berdasarkan operasi.\n\nLokasi validator per modul:\n\n```text\nsrc/Api/V1/{Module}/Validation/{Module}InputValidator.php\n```\n\n## API Utama\n\n`AbstractValidator::validate()` memiliki signature:\n\n```php\nfinal public function validate(string $context, RawParams $data): void\n```\n\nMethod ini tidak mengembalikan object validator dan tidak menyediakan `fails()`, `errors()`, atau `validated()`. Jika validasi gagal, method ini melempar `ValidationException` berisi daftar error yang sudah diformat.\n\n## Struktur Dasar\n\n```php\n<?php\n\ndeclare(strict_types=1);\n\nnamespace App\\Api\\V1\\Example\\Validation;\n\nuse App\\Shared\\Common\\Context\\ValidationContext;\nuse App\\Shared\\Core\\Enums\\RecordStatus;\nuse App\\Shared\\Core\\Validation\\AbstractValidator;\nuse App\\Shared\\Core\\Validation\\Rules\\UniqueValue;\nuse Yiisoft\\Validator\\Rule\\In;\nuse Yiisoft\\Validator\\Rule\\Integer;\nuse Yiisoft\\Validator\\Rule\\Length;\nuse Yiisoft\\Validator\\Rule\\Required;\nuse Yiisoft\\Validator\\Rule\\StopOnError;\nuse Yiisoft\\Validator\\Rule\\StringValue;\n\nfinal class ExampleInputValidator extends AbstractValidator\n{\n    protected function rules(string $context): array\n    {\n        return match ($context) {\n            ValidationContext::CREATE => [\n                'name' => [\n                    new StopOnError([\n                        new Required(),\n                        new StringValue(),\n                        new Length(min: 3, max: 255),\n                        new UniqueValue(\n                            table: 'example',\n                            column: 'name',\n                            ignoreId: null,\n                        ),\n                    ]),\n                ],\n                'status' => [\n                    new Required(),\n                    new Integer(),\n                    new In(RecordStatus::draftOnlyStates()),\n                ],\n            ],\n\n            ValidationContext::UPDATE => [\n                'id' => [\n                    new Required(),\n                    new Integer(min: 1),\n                ],\n                'name' => [\n                    new StopOnError([\n                        new StringValue(skipOnEmpty: true),\n                        new Length(min: 3, max: 255, skipOnEmpty: true),\n                        new UniqueValue(\n                            table: 'example',\n                            column: 'name',\n                            ignoreId: $this->data['id'] ?? null,\n                        ),\n                    ]),\n                ],\n                'lock_version' => [\n                    new Required(\n                        when: fn () => $this->shouldValidateOptimisticLock()\n                    ),\n                    new Integer(min: 1, skipOnEmpty: true),\n                ],\n            ],\n\n            ValidationContext::DELETE => [\n                'id' => [\n                    new Required(),\n                    new Integer(min: 1),\n                ],\n            ],\n\n            ValidationContext::SEARCH => [\n                'page' => [new Integer(min: 1, skipOnEmpty: true)],\n                'page_size' => [new Integer(min: 1, max: 200, skipOnEmpty: true)],\n                'sort_dir' => [new In(['asc', 'desc'], skipOnEmpty: true)],\n            ],\n\n            default => [],\n        };\n    }\n}\n```\n\n## Cara Penggunaan di Action\n\nValidator menerima `RawParams`, bukan array mentah. Pada action, request payload biasanya sudah tersedia lewat attribute `payload`.\n\n```php\n/** @var \\App\\Shared\\Core\\Request\\RequestParams $payload */\n$payload = $request->getAttribute('payload');\n\n$params = $payload->getRawParams()\n    ->onlyAllowed(allowedKeys: self::ALLOWED_KEYS)\n    ->with('status', RecordStatus::DRAFT->value)\n    ->sanitize();\n\n$this->inputValidator->validate(\n    data: $params,\n    context: ValidationContext::CREATE,\n);\n```\n\nKarena `validate()` mengembalikan `void`, lanjutkan proses setelah method itu berjalan tanpa exception:\n\n```php\n$this->inputValidator->validate(\n    data: $params,\n    context: ValidationContext::CREATE,\n);\n\n$command = CreateExampleCommand::create(\n    name: (string) $params->get('name'),\n    status: $params->get('status'),\n    detailInfo: $params->get('detail_info'),\n);\n```\n\n## Context yang Tersedia\n\n`ValidationContext` mewarisi konstanta dari `ValidationContextInterface`:\n\n- `ValidationContext::SEARCH` — `search`\n- `ValidationContext::CREATE` — `create`\n- `ValidationContext::UPDATE` — `update`\n- `ValidationContext::DELETE` — `delete`\n- `ValidationContext::APPROVE` — `approve`\n- `ValidationContext::REJECT` — `reject`\n\nContext kustom dapat ditambahkan di `ValidationContext` atau langsung memakai string context yang cocok dengan cabang `match` pada validator.\n\n## Error Handling\n\nTidak perlu mengecek `$validator->fails()`. Jika rules gagal, `AbstractValidator` melempar:\n\n```php\nApp\\Shared\\Core\\Exception\\ValidationException\n```\n\nFormat error yang dihasilkan berupa array item:\n\n```php\n[\n    'field' => 'name',\n    'message' => 'Name is required.',\n]\n```\n\nException ini dipetakan ke HTTP `422 Unprocessable Entity` dan biasanya ditangani oleh error-handling middleware/application layer. Tangani manual hanya jika action memerlukan respons khusus:\n\n```php\ntry {\n    $this->inputValidator->validate(\n        data: $params,\n        context: ValidationContext::CREATE,\n    );\n} catch (ValidationException $e) {\n    // Custom handling jika benar-benar diperlukan.\n    throw $e;\n}\n```\n\n## Rules yang Umum Dipakai\n\n### Rules Yii Validator\n\n- `new Required()` — field wajib ada.\n- `new Required(when: fn () => ...)` — wajib secara kondisional.\n- `new Integer(min: 1, max: 200, skipOnEmpty: true)` — integer dengan batas optional.\n- `new StringValue(skipOnEmpty: true)` — nilai harus string.\n- `new Length(min: 3, max: 255, skipOnEmpty: true)` — panjang string.\n- `new In([...], skipOnEmpty: true)` — nilai harus termasuk daftar yang diizinkan.\n- `new StopOnError([...])` — hentikan rules berikutnya setelah error pertama.\n\n### Rules Internal\n\n#### `UniqueValue`\n\n```php\nnew UniqueValue(\n    table: 'example',\n    column: 'name',\n    ignoreId: $this->data['id'] ?? null,\n    idColumn: 'id',\n    message: 'Nama sudah digunakan.',\n)\n```\n\nRule ini memastikan nilai belum dipakai oleh record lain. Untuk operasi update, isi `ignoreId` dengan ID record yang sedang diupdate.\n\n#### `HasNoDependencies`\n\n```php\nnew HasNoDependencies(\n    map: [\n        'another_example' => ['example_id'],\n    ],\n    message: 'Data tidak bisa dihapus karena masih digunakan.',\n)\n```\n\nRule ini cocok untuk validasi `DELETE` ketika record tidak boleh memiliki dependensi pada tabel lain.\n\n## Contoh Context\n\n### CREATE\n\n```php\nValidationContext::CREATE => [\n    'name' => [\n        new StopOnError([\n            new Required(),\n            new StringValue(),\n            new Length(min: 3, max: 255),\n            new UniqueValue(table: 'example', column: 'name'),\n        ]),\n    ],\n    'status' => [\n        new Required(),\n        new Integer(),\n        new In(RecordStatus::draftOnlyStates()),\n    ],\n],\n```\n\n### UPDATE\n\n```php\nValidationContext::UPDATE => [\n    'id' => [\n        new Required(),\n        new Integer(min: 1),\n    ],\n    'name' => [\n        new StopOnError([\n            new StringValue(skipOnEmpty: true),\n            new Length(min: 3, max: 255, skipOnEmpty: true),\n            new UniqueValue(\n                table: 'example',\n                column: 'name',\n                ignoreId: $this->data['id'] ?? null,\n            ),\n        ]),\n    ],\n    'status' => [\n        new Integer(skipOnEmpty: true),\n        new In(RecordStatus::searchableStates()),\n    ],\n    'lock_version' => [\n        new Required(\n            when: fn () => $this->shouldValidateOptimisticLock()\n        ),\n        new Integer(min: 1, skipOnEmpty: true),\n    ],\n],\n```\n\n### SEARCH\n\n```php\nValidationContext::SEARCH => [\n    'id' => [new Integer(skipOnEmpty: true)],\n    'name' => [\n        new StringValue(skipOnEmpty: true),\n        new Length(min: 1, max: 100, skipOnEmpty: true),\n    ],\n    'status' => [new Integer(skipOnEmpty: true)],\n    'page' => [new Integer(min: 1, skipOnEmpty: true)],\n    'page_size' => [new Integer(min: 1, max: 200, skipOnEmpty: true)],\n    'sort_by' => [new StringValue(skipOnEmpty: true)],\n    'sort_dir' => [new In(['asc', 'desc'], skipOnEmpty: true)],\n],\n```\n\n### Field Sinkronisasi\n\nUntuk modul yang memakai `origin_id` dan `sync_flag`, contoh pada `AnotherExampleInputValidator` adalah:\n\n```php\n'origin_id' => [\n    new Integer(min: 1, skipOnEmpty: true),\n],\n'sync_flag' => [\n    new Integer(skipOnEmpty: true),\n    new In([1], skipOnEmpty: true),\n],\n```\n\nDalam model saat ini, `sync_flag = null` berarti sudah tersinkron dan `sync_flag = 1` berarti belum tersinkron. Nilai `null` tetap dapat dipakai untuk record yang datang dari master/cloud dan tidak perlu dikirim ulang.\n\n## Contoh Lengkap di Create Action\n\n```php\nfinal class ExampleCreateAction\n{\n    private const ALLOWED_KEYS = ['name', 'status', 'sync_mdb'];\n\n    public function __construct(\n        private ExampleInputValidator $inputValidator,\n        private ExampleApplicationService $applicationService,\n        private ResponseFactory $responseFactory,\n    ) {\n    }\n\n    public function __invoke(ServerRequestInterface $request): ResponseInterface\n    {\n        /** @var \\App\\Shared\\Core\\Request\\RequestParams $payload */\n        $payload = $request->getAttribute('payload');\n\n        $params = $payload->getRawParams()\n            ->onlyAllowed(allowedKeys: self::ALLOWED_KEYS)\n            ->with('status', RecordStatus::DRAFT->value)\n            ->sanitize();\n\n        $this->inputValidator->validate(\n            data: $params,\n            context: ValidationContext::CREATE,\n        );\n\n        $command = CreateExampleCommand::create(\n            name: (string) $params->get('name'),\n            status: $params->get('status'),\n            detailInfo: $params->get('detail_info'),\n        );\n\n        $response = $this->applicationService->create(command: $command);\n\n        return $this->responseFactory->success(\n            data: $response->toArray(),\n            translate: Message::create(\n                key: 'resource.created',\n                params: [\n                    'resource' => $this->applicationService->getResource(),\n                ],\n            ),\n        );\n    }\n}\n```\n\n## Best Practices\n\n- Validasi dilakukan setelah `onlyAllowed()` agar parameter tidak dikenal ditolak lebih dulu.\n- Gunakan `sanitize()` sebelum validasi untuk input user.\n- Gunakan `StopOnError` untuk rangkaian rules yang mahal, misalnya sebelum `UniqueValue`.\n- Gunakan `skipOnEmpty: true` untuk field optional pada update/search.\n- Gunakan `ignoreId` pada `UniqueValue` saat update.\n- Jangan membuat method `fails()`, `errors()`, atau `validated()` kecuali API `AbstractValidator` diubah; exception adalah mekanisme error saat ini.\n", "09-dto-guide.md": "# Panduan Data Transfer Objects (Dto)\n\n## 📋 Gambaran Umum\n\nData Transfer Objects (DTO) adalah struktur data sederhana yang digunakan untuk mentransfer data antar proses atau layer. Dalam aplikasi Yii3 API ini, DTO menyediakan cara yang bersih untuk menstrukturkan data bagi komunikasi API dan transfer data internal.\n\n---\n\n## 🏗️ Arsitektur DTO\n\n### Struktur Direktori\n\n```\nsrc/Shared/Core/Dto/\n├── PaginatedResult.php    # Paginated query results\n└── SearchCriteria.php     # Search and filtering criteria\n\nsrc/Application/Example/\n├── Command/\n│   ├── CreateExampleCommand.php   # Create use-case input\n│   └── UpdateExampleCommand.php   # Update use-case input\n└── Dto/\n    └── ExampleResponse.php        # Example response DTO\n\nsrc/Application/AnotherExample/\n├── Command/\n│   ├── CreateAnotherExampleCommand.php\n│   └── UpdateAnotherExampleCommand.php\n└── Dto/\n    ├── AnotherExampleResponse.php     # Response DTO\n    └── AnotherExampleDetailInfo.php   # detail_info payload DTO\n```\n\n### Prinsip Desain\n\n#### **1. **Immutability**\n- DTO bersifat immutable menggunakan readonly properties PHP 8+\n- Mencegah perubahan state yang tidak disengaja\n- Memastikan integritas data\n\n#### **2. **Type Safety**\n- Strong typing dengan fitur PHP 8+\n- Mencegah runtime error\n- Memungkinkan auto-completion di IDE\n\n#### **3. **Validation**\n- Validasi bawaan di constructor\n- Type hint menegakkan tipe data\n- Metode validasi opsional\n\n#### **4. **Serialization**\n- Konversi mudah ke/dari array\n- Dukungan serialisasi JSON\n- Pemformatan respons API\n\n---\n\n## 📁 Komponen DTO\n\n### 1. PaginatedResult\n\n**Tujuan**: Struktur standar untuk hasil query terpaginasi\n\n```php\n<?php\n\ndeclare(strict_types=1);\n\nnamespace App\\Shared\\Core\\Dto;\n\n/**\n * Data Transfer Object for paginated results (trimmed — see source for full docs).\n */\nfinal readonly class PaginatedResult\n{\n    /**\n     * @param array $data   The paginated data items\n     * @param int   $total    Total number of items across all pages\n     * @param int   $page     Current page number (1-based)\n     * @param int   $pageSize Number of items per page\n     * @param array $filter   Applied filters as key-value pairs\n     * @param array $sort     Applied sorting as field-direction pairs\n     */\n    public function __construct(\n        public array $data,\n        public int $total,\n        public int $page,\n        public int $pageSize,\n        public array $filter = [],\n        public array $sort = []\n    ) {\n        if ($this->pageSize <= 0) {\n            $this->pageSize = 10;\n        }\n    }\n\n    /**\n     * Calculate the total number of pages (returns 1 for empty results).\n     */\n    public function getTotalPages(): int\n    {\n        return $this->total === 0 ? 1 : (int) \\ceil($this->total / $this->pageSize);\n    }\n\n    /**\n     * Metadata for API responses: applied filter, sort and pagination info.\n     */\n    public function getMeta(): array\n    {\n        return [\n            'filter'     => $this->filter,\n            'sort'       => $this->sort,\n            'pagination' => [\n                'total'     => $this->total,\n                'display'   => \\count($this->data),\n                'page'      => $this->page,\n                'page_size' => $this->pageSize,\n            ],\n        ];\n    }\n}\n```\n\n**Contoh Penggunaan**:\n```php\n// In repository — ExampleRepository::list()\nreturn new PaginatedResult(\n    data: $rows,\n    total: $total,\n    page: $criteria->page,\n    pageSize: $criteria->pageSize,\n    filter: $criteria->filter,\n    sort: [\n        'by'  => $criteria->sortBy,\n        'dir' => $criteria->sortDir,\n    ]\n);\n\n// In action — hand the meta block to ResponseFactory\n$result = $this->applicationService->list(criteria: $criteria);\n\nreturn $this->responseFactory->success(\n    data: $result->data,\n    translate: Message::create(\n        key: 'resource.list_retrieved',\n        params: ['resource' => $resource]\n    ),\n    meta: $result->getMeta(),\n);\n```\n\n---\n\n### 2. SearchCriteria\n\n**Tujuan**: Struktur standar untuk parameter pencarian, filtering, dan pagination\n\n```php\n<?php\n\ndeclare(strict_types=1);\n\nnamespace App\\Shared\\Core\\Dto;\n\n/**\n * Data Transfer Object for search criteria (trimmed — see source for full docs).\n */\nfinal readonly class SearchCriteria\n{\n    /**\n     * @param array    $filter      Search filters as key-value pairs\n     * @param int      $page        Current page number (1-based)\n     * @param int      $pageSize    Number of items per page (default: 10)\n     * @param string   $sortBy      Field to sort by (default: 'id')\n     * @param string   $sortDir     Sort direction 'asc' or 'desc' (default: 'desc')\n     * @param int|null $offset      Manual offset override (optional)\n     * @param array    $allowedSort Allowed sortable fields with column mapping\n     */\n    public function __construct(\n        public array $filter,\n        public int $page,\n        public int $pageSize = 10,\n        public string $sortBy = 'id',\n        public string $sortDir = 'desc',\n        public ?int $offset = null,\n        private array $allowedSort = ['id' => 'id'],\n    ) {\n    }\n\n    /**\n     * Calculate the database offset: (page - 1) * pageSize.\n     */\n    public function calculateOffset(): int\n    {\n        return ($this->page - 1) * $this->pageSize;\n    }\n\n    /**\n     * Order clause for the query builder, e.g. ['name' => SORT_ASC].\n     * Falls back to the first allowed sort column when $sortBy is not allowed.\n     */\n    public function getOrderClause(): array\n    {\n        $column    = $this->allowedSort[$this->sortBy] ?? \\array_values($this->allowedSort)[0];\n        $direction = \\strtolower($this->sortDir) === 'desc' ? SORT_DESC : SORT_ASC;\n\n        return [$column => $direction];\n    }\n}\n```\n\n`SearchCriteria` biasanya tidak dibuat secara manual — action membangunnya melalui\n`SearchCriteriaFactory` (`src/Application/Shared/Core/Factory/SearchCriteriaFactory.php`)\ndari payload `RequestParams` yang di-parse oleh `RequestParamsMiddleware`:\n\n```php\nfinal class SearchCriteriaFactory\n{\n    public function createFromRequest(\n        RequestParams $params,\n        array $allowedSort,\n        int $defaultPageSize = 15\n    ): SearchCriteria {\n        $pagination = $params->getPagination();\n        $sort       = $params->getSort();\n\n        return new SearchCriteria(\n            filter: $params->getFilter()->toArray(),\n            page: $pagination->page ?? 1,\n            pageSize: $pagination->page_size ?? $defaultPageSize,\n            sortBy: $sort->by ?? \\array_key_first($allowedSort),\n            sortDir: $sort->dir ?? 'desc',\n            allowedSort: $allowedSort\n        );\n    }\n}\n```\n\n**Contoh Penggunaan**:\n```php\n// In action (see ExampleDataAction)\n/** @var RequestParams $payload */\n$payload = $request->getAttribute('payload');\n\n$criteria = $this->factory->createFromRequest(\n    params: $payload,\n    allowedSort: ['id' => 'id', 'name' => 'name', 'status' => 'status']\n);\n\n$result = $this->applicationService->list(criteria: $criteria);\n\n// In repository (see ExampleRepository::list)\n$query = (new Query($this->db))\n    ->select(['id', 'name', 'status', 'detail_info', SyncMdb::field(), LockVersion::field()])\n    ->from(self::TABLE_NAME)\n    ->where($this->scopeWhereNotDeleted());\n\n// Whitelisted exact-match filters + 'name' LIKE search\n$this->queryConditionApplier->filterByExactMatch(\n    query: $query,\n    filters: $criteria->filter,\n    allowedColumns: ['id', 'status', SyncMdb::field()]\n);\n\n$total = (clone $query)->count();\n\n$query->orderBy($criteria->getOrderClause())\n    ->limit($criteria->pageSize)\n    ->offset($criteria->calculateOffset());\n```\n\n---\n\n## 🔧 Pola Integrasi\n\n### 1. **Penggunaan di Action**\n```php\n// src/Api/V1/Example/Action/ExampleDataAction.php (simplified)\nfinal class ExampleDataAction\n{\n    private const ALLOWED_KEYS = ['id', 'name', 'status'];\n    private const ALLOWED_SORT = ['id' => 'id', 'name' => 'name', 'status' => 'status'];\n\n    public function __construct(\n        private SearchCriteriaFactory $factory,\n        private ExampleInputValidator $inputValidator,\n        private ExampleApplicationService $applicationService,\n        private ResponseFactory $responseFactory,\n    ) {}\n\n    public function __invoke(ServerRequestInterface $request): ResponseInterface\n    {\n        /** @var RequestParams $payload */\n        $payload = $request->getAttribute('payload');\n\n        $filter = $payload->getFilter()\n            ->onlyAllowed(allowedKeys: self::ALLOWED_KEYS)\n            ->with('status', RecordStatus::DRAFT->value);\n\n        $this->inputValidator->validate(data: $filter, context: ValidationContext::SEARCH);\n\n        $criteria = $this->factory->createFromRequest(\n            params: $payload,\n            allowedSort: self::ALLOWED_SORT\n        );\n\n        $result = $this->applicationService->list(criteria: $criteria);\n\n        return $this->responseFactory->success(\n            data: $result->data,\n            translate: Message::create(key: 'resource.list_retrieved', params: [\n                'resource' => $this->applicationService->getResource(),\n            ]),\n            meta: $result->getMeta(),\n        );\n    }\n}\n```\n\n### 2. **Penggunaan di Service**\n```php\n// src/Application/Example/ExampleApplicationService.php\npublic function list(SearchCriteria $criteria): PaginatedResult\n{\n    return $this->repository->list(criteria: $criteria);\n}\n```\n\n### 3. **Penggunaan di Repository**\n```php\n// src/Infrastructure/Common/Persistence/Example/ExampleRepository.php (simplified)\npublic function list(SearchCriteria $criteria): PaginatedResult\n{\n    $query = (new Query($this->db))\n        ->select(['id', 'name', 'status', 'detail_info', SyncMdb::field(), LockVersion::field()])\n        ->from(self::TABLE_NAME)\n        ->where($this->scopeWhereNotDeleted());\n\n    $this->queryConditionApplier->filterByExactMatch(\n        query: $query,\n        filters: $criteria->filter,\n        allowedColumns: ['id', 'status', SyncMdb::field()]\n    );\n\n    if (!empty($criteria->filter['name'])) {\n        $this->queryConditionApplier->orLike(\n            query: $query,\n            operator: 'ilike',\n            conditions: ['name' => $criteria->filter['name']]\n        );\n    }\n\n    $total = (clone $query)->count();\n\n    $query->orderBy($criteria->getOrderClause())\n        ->limit($criteria->pageSize)\n        ->offset($criteria->calculateOffset());\n\n    return new PaginatedResult(\n        data: \\iterator_to_array($this->streamRows(query: $query, jsonKeys: [])),\n        total: $total,\n        page: $criteria->page,\n        pageSize: $criteria->pageSize,\n        filter: $criteria->filter,\n        sort: ['by' => $criteria->sortBy, 'dir' => $criteria->sortDir]\n    );\n}\n```\n\n### 4. **DTO di Application Layer (Command & Response)**\n\nCommand membawa input yang sudah divalidasi ke application service; response DTO membawa\ndata entity kembali ke API layer:\n\n```php\n// src/Application/Example/Command/CreateExampleCommand.php\nfinal readonly class CreateExampleCommand\n{\n    public function __construct(\n        public string $name,\n        public int $status,\n        public ?array $detailInfo,\n    ) {}\n\n    public static function create(\n        string $name,\n        int $status,\n        ?array $detailInfo = null,\n    ): self {\n        return new self(name: $name, status: $status, detailInfo: $detailInfo);\n    }\n}\n\n// src/Application/Example/Dto/ExampleResponse.php\nfinal readonly class ExampleResponse\n{\n    public function __construct(\n        public int $id,\n        public string $name,\n        public int $status,\n        public array $detail_info,\n        public ?int $sync_mdb,\n        public int $lock_version,\n    ) {}\n\n    public static function fromEntity(Example $entity): self { /* ... */ }\n\n    public function toArray(): array\n    {\n        return \\get_object_vars($this);\n    }\n}\n```\n\n`AnotherExample` menambahkan `example_id`, `origin_id` dan `sync_flag` pada command/response\nDTO miliknya (lihat `CreateAnotherExampleCommand`, `AnotherExampleResponse`,\n`AnotherExampleDetailInfo`).\n\n---\n\n## 🚀 Best Practices\n\n### 1. **Immutability**\n```php\n// ✅ Use readonly properties\nfinal readonly class CreateUserRequest\n{\n    public function __construct(\n        public readonly string $name,\n        public readonly string $email\n    ) {}\n}\n\n// ❌ Avoid mutable properties\nclass CreateUserRequest\n{\n    public string $name;\n    public string $email;\n}\n```\n\n### 2. **Validation**\n```php\n// ✅ Validate in constructor\nfinal readonly class Email\n{\n    public function __construct(\n        public readonly string $value\n    ) {\n        if (!filter_var($value, FILTER_VALIDATE_EMAIL)) {\n            throw new InvalidArgumentException('Invalid email address');\n        }\n    }\n}\n\n// ❌ Avoid external validation\n$email = new Email($input);\nif (!$email->isValid()) {\n    // Validation should be in constructor\n}\n```\n\n### 3. **Type Safety**\n```php\n// ✅ Use specific types\nfinal readonly class CreateUserRequest\n{\n    public function __construct(\n        public readonly string $name,\n        public readonly int $age,\n        public readonly bool $active\n    ) {}\n}\n\n// ❌ Avoid generic types\nfinal readonly class CreateUserRequest\n{\n    public function __construct(\n        public readonly $name,\n        public readonly $age,\n        public readonly $active\n    ) {}\n}\n```\n\n### 4. **Serialization**\n```php\n// ✅ Provide toArray method\npublic function toArray(): array\n{\n    return [\n        'name' => $this->name,\n        'email' => $this->email,\n    ];\n}\n\n// ❌ Avoid direct property access\necho json_encode($dto);\n```\n\n---\n\n## 📊 Pertimbangan Performa\n\n### 1. **Penggunaan Memori**\n- DTO ringan dan efisien dalam penggunaan memori\n- Gunakan readonly properties untuk mencegah penyalinan\n- Hindari pembuatan objek yang tidak perlu\n\n### 2. **Serialisasi**\n- Implementasikan metode toArray() yang efisien\n- Gunakan serialisasi JSON untuk respons API\n- Cache data hasil serialisasi bila diperlukan\n\n### 3. **Validasi**\n- Validasi di constructor agar fail fast\n- Gunakan fungsi bawaan PHP untuk validasi\n- Hindari logika validasi yang kompleks di DTO\n\n---\n\n## 🎯 Ringkasan\n\nDTO menyediakan cara yang bersih dan type-safe untuk mentransfer data antar layer dalam aplikasi Yii3 API. Manfaat utamanya meliputi:\n\n- **🛡️ Type Safety**: Strong typing mencegah runtime error\n- **🔄 Immutability**: Readonly properties memastikan integritas data\n- **🧪 Testability**: Mudah di-unit test dengan perilaku yang dapat diprediksi\n- **📦 Modularity**: Setiap DTO memiliki satu tanggung jawab\n- **🚀 Performance**: Transfer data yang ringan dan efisien\n\nDengan mengikuti pola dan best practice yang diuraikan dalam panduan ini, Anda dapat membangun DTO yang robust dan mudah dipelihara untuk aplikasi Yii3 API Anda! 🚀\n", "10-query-guide.md": "# Panduan Query Building\n\n## 📋 Gambaran Umum\n\nUtility query building menyediakan cara terstruktur untuk membangun dan mengeksekusi query database di aplikasi Yii3 API. Komponen-komponen ini memastikan konstruksi query yang konsisten dan mencegah SQL injection.\n\n---\n\n## 🏗️ Arsitektur Query\n\n### Struktur Direktori\n\n```\nsrc/Shared/Core/Query/\n└── QueryConditionApplier.php    # Static condition helpers for Yiisoft\\Db\\Query\\Query\n\nsrc/Shared/Core/Dto/\n├── SearchCriteria.php           # filter + page/pageSize + sort DTO\n└── PaginatedResult.php          # data + total + page meta DTO\n\nsrc/Shared/Core/Request/\n├── RequestParams.php            # filter/sort/pagination request params\n├── PaginationParams.php\n├── SortParams.php\n├── RawParams.php                # raw params + sanitize() via InputSanitizer\n├── DataParserInterface.php      # parser contract\n└── RequestDataParser.php        # request body/query parser implementation\n\nsrc/Application/Shared/Core/Factory/\n└── SearchCriteriaFactory.php    # Builds SearchCriteria from RequestParams\n```\n\n### Prinsip Desain\n\n#### **1. Type Safety**\n- Pengetikan kuat dengan fitur PHP 8+\n- Parameter binding via `Query::andWhere()` mencegah SQL injection\n- DTO `readonly` untuk criteria dan result\n\n#### **2. Flexibility**\n- Method kondisi static yang composable — padu padankan `andWhere`/`orLike`/`andIn`/`andRange`\n- Column whitelisting untuk filter yang digerakkan oleh request\n\n#### **3. Security**\n- `filterByExactMatch()` / `filterByLike()` hanya menerapkan kolom yang di-whitelist\n- Nilai kosong (`null`/`''`) dilewati secara otomatis\n- Kondisi terparameterisasi di seluruh kode\n\n#### **4. Performance**\n- Overhead minimal — wrapper tipis di atas `Query::andWhere()`\n- Repository melakukan streaming baris dan meng-clone query untuk `count()`\n\n---\n\n## 📁 Komponen Query\n\n### QueryConditionApplier\n\n**Lokasi**: `src/Shared/Core/Query/QueryConditionApplier.php`\n\n**Tujuan**: Helper static yang menerapkan filter kondisional ke objek `Yiisoft\\Db\\Query\\Query`. Semua method menerima dan mengembalikan instance `Query` (objek di-mutate; nilai kembalian disediakan untuk kemudahan chaining).\n\n```php\nfinal class QueryConditionApplier\n{\n    // Whitelisted filters\n    public static function filterByExactMatch(Query $query, array $filters, array $allowedColumns): Query;\n    public static function filterByLike(\n        Query $query,\n        array $filters,\n        array $allowedColumns,\n        string $operator = 'like',\n        bool $autoWrap = true,   // wraps value in %...% when it has no '%'\n    ): Query;\n\n    // Equality\n    public static function andWhere(Query $query, array $conditions): Query;\n    public static function orWhere(Query $query, array $conditions): Query;   // AND (a = x OR b = y)\n\n    // LIKE / ILIKE\n    public static function andLike(Query $query, string $operator, array $conditions): Query;\n    public static function orLike(Query $query, string $operator, array $conditions): Query; // AND (a LIKE x OR b LIKE y)\n\n    // IN\n    public static function andIn(Query $query, array $conditions): Query;     // column => array of values\n    public static function orIn(Query $query, array $conditions): Query;      // AND (a IN (...) OR b IN (...))\n\n    // Ranges (min/max → >= / <=)\n    public static function andRange(Query $query, array $ranges): Query;      // column => ['min' => ..., 'max' => ...]\n\n    private static function isFilled(mixed $value): bool; // $value !== null && $value !== ''\n}\n```\n\n**Catatan perilaku**:\n- `andWhere`, `orWhere`, `andLike`, `orLike` melewatkan nilai di mana `isFilled()` bernilai false (`null` atau `''`)\n- `andIn`/`orIn` melewatkan non-array dan array kosong\n- `andRange` menerapkan `>=` untuk `min` dan `<=` untuk `max`, masing-masing opsional\n- `orWhere`/`orLike`/`orIn` membungkus grup OR dalam satu klausa `andWhere(['or', ...])`\n- `filterByExactMatch`/`filterByLike` meng-intersect `$filters` dengan `array_flip($allowedColumns)` — key yang tidak di-whitelist diabaikan\n\n**Contoh Penggunaan**:\n```php\nuse App\\Shared\\Core\\Query\\QueryConditionApplier;\nuse Yiisoft\\Db\\Query\\Query;\n\n// Whitelisted exact-match filters (safe for request input)\nQueryConditionApplier::filterByExactMatch(\n    query: $query,\n    filters: $criteria->filter,\n    allowedColumns: ['id', 'status', 'sync_mdb'],\n);\n\n// Case-insensitive multi-field search → AND (name ILIKE %x% OR email ILIKE %x%)\nQueryConditionApplier::orLike($query, 'ilike', [\n    'name'  => \"%{$search}%\",\n    'email' => \"%{$search}%\",\n]);\n\n// IN filter → AND status IN (1, 2)\nQueryConditionApplier::andIn($query, [\n    'status' => [RecordStatus::ACTIVE->value, RecordStatus::DRAFT->value],\n]);\n\n// Date/price ranges → created_at >= min AND created_at <= max\nQueryConditionApplier::andRange($query, [\n    'created_at' => ['min' => '2024-01-01', 'max' => '2024-12-31'],\n]);\n```\n\n### SearchCriteria\n\n**Lokasi**: `src/Shared/Core/Dto/SearchCriteria.php`\n\n```php\nfinal readonly class SearchCriteria\n{\n    public function __construct(\n        public array $filter,\n        public int $page,\n        public int $pageSize = 10,\n        public string $sortBy = 'id',\n        public string $sortDir = 'desc',\n        public ?int $offset = null,\n        private array $allowedSort = ['id' => 'id'],\n    ) {}\n\n    public function calculateOffset(): int;   // ($page - 1) * $pageSize\n    public function getOrderClause(): array;  // ['column' => SORT_ASC|SORT_DESC]\n}\n```\n\n- `getOrderClause()` memetakan `sortBy` melalui `allowedSort` (whitelist → kolom asli); field yang tidak dikenal jatuh kembali ke kolom pertama yang diizinkan. `sortDir` bernilai `'desc'` → `SORT_DESC`, selain itu → `SORT_ASC`.\n- Payload request yang diharapkan: `{ \"filter\": {...}, \"pagination\": {\"page\": 1, \"page_size\": 10}, \"sort\": {\"by\": \"name\", \"dir\": \"desc\"} }`\n\n### PaginatedResult\n\n**Lokasi**: `src/Shared/Core/Dto/PaginatedResult.php`\n\n```php\nfinal readonly class PaginatedResult\n{\n    public function __construct(\n        public array $data,\n        public int $total,\n        public int $page,\n        public int $pageSize,\n        public array $filter = [],\n        public array $sort = []\n    ) {}\n\n    public function getTotalPages(): int; // ceil(total / pageSize), min 1\n    public function getMeta(): array;\n    // ['filter' => ..., 'sort' => ..., 'pagination' => ['total', 'display', 'page', 'page_size']]\n}\n```\n\n### SearchCriteriaFactory\n\n**Lokasi**: `src/Application/Shared/Core/Factory/SearchCriteriaFactory.php`\n\n```php\nfinal class SearchCriteriaFactory\n{\n    public function createFromRequest(\n        RequestParams $params,\n        array $allowedSort,\n        int $defaultPageSize = 15\n    ): SearchCriteria;\n}\n```\n\nMembangun `SearchCriteria` dari `RequestParams` (dihasilkan oleh `RequestParamsMiddleware`): `filter` dari `getFilter()->toArray()`, `page`/`pageSize` dari `getPagination()`, `sortBy`/`sortDir` dari `getSort()` (dir default `'desc'`).\n\n---\n\n## 🔧 Pola Integrasi\n\n### 1. **Penggunaan Repository** (pola nyata dari `ExampleRepository`)\n\n```php\nuse App\\Shared\\Core\\Dto\\PaginatedResult;\nuse App\\Shared\\Core\\Dto\\SearchCriteria;\nuse App\\Shared\\Core\\Query\\QueryConditionApplier;\nuse Yiisoft\\Db\\Connection\\ConnectionInterface;\nuse Yiisoft\\Db\\Query\\Query;\n\nfinal class ExampleRepository implements ExampleRepositoryInterface\n{\n    public function __construct(\n        private ConnectionInterface $db,\n        private QueryConditionApplier $queryConditionApplier,\n    ) {}\n\n    public function list(SearchCriteria $criteria): PaginatedResult\n    {\n        $query = (new Query($this->db))\n            ->select(['id', 'name', 'status', 'detail_info', 'sync_mdb', 'lock_version'])\n            ->from(self::TABLE_NAME)\n            ->where($this->scopeWhereNotDeleted());\n\n        $filter = $criteria->filter;\n\n        // Whitelisted exact-match filters\n        $this->queryConditionApplier->filterByExactMatch(\n            query: $query,\n            filters: $filter,\n            allowedColumns: ['id', 'status', 'sync_mdb'],\n        );\n\n        // Optional text search on a single column\n        if (!empty($filter['name'])) {\n            $this->queryConditionApplier->orLike(\n                query: $query,\n                operator: 'ilike',\n                conditions: ['name' => $filter['name']],\n            );\n        }\n\n        $total = (clone $query)->count();\n\n        $query->orderBy($criteria->getOrderClause())\n            ->limit($criteria->pageSize)\n            ->offset($criteria->calculateOffset());\n\n        return new PaginatedResult(\n            data: \\iterator_to_array($this->streamRows(query: $query, jsonKeys: [])),\n            total: $total,\n            page: $criteria->page,\n            pageSize: $criteria->pageSize,\n            filter: $criteria->filter,\n            sort: ['by' => $criteria->sortBy, 'dir' => $criteria->sortDir],\n        );\n    }\n}\n```\n\n### 2. **Penggunaan Action / Service**\n\n```php\n// Action: RequestParams is set as the 'payload' attribute by RequestParamsMiddleware\nfinal class ExampleDataAction\n{\n    public function __invoke(ServerRequestInterface $request): ResponseInterface\n    {\n        /** @var RequestParams $payload */\n        $payload = $request->getAttribute('payload');\n\n        $criteria = $this->searchCriteriaFactory->createFromRequest(\n            params: $payload,\n            allowedSort: ['id' => 'id', 'name' => 'name', 'status' => 'status'],\n        );\n\n        $result = $this->service->list(criteria: $criteria); // → repository->list($criteria)\n\n        return $this->responseFactory->success(\n            data: $result->data,\n            meta: $result->getMeta(),\n        );\n    }\n}\n```\n\n### 3. **Menyusun Kondisi Secara Manual**\n\n```php\n$query = (new Query($this->db))->from('example');\n\nQueryConditionApplier::andWhere($query, ['status' => RecordStatus::ACTIVE->value]);\nQueryConditionApplier::orLike($query, 'ilike', ['name' => \"%{$term}%\", 'detail_info' => \"%{$term}%\"]);\nQueryConditionApplier::andIn($query, ['id' => $ids]);\nQueryConditionApplier::andRange($query, ['created_at' => ['min' => $from, 'max' => $to]]);\n\n$rows = $query->all();\n```\n\n---\n\n## 🚀 Praktik Terbaik\n\n### 1. **Whitelist Filter Request**\n```php\n// ✅ Only whitelisted columns can be filtered from request input\nQueryConditionApplier::filterByExactMatch($query, $criteria->filter, ['id', 'status']);\n\n// ❌ Passing raw request filters without a whitelist\n$query->andWhere($criteria->filter);\n```\n\n### 2. **Parameter Binding**\n```php\n// ✅ Use parameterized conditions via the applier / Query::andWhere\nQueryConditionApplier::orLike($query, 'ilike', ['name' => \"%{$term}%\"]);\n\n// ❌ Manual string concatenation\n$query->andWhere(\"name LIKE '%\" . $term . \"%'\");\n```\n\n### 3. **Sorting via allowedSort**\n```php\n// ✅ Map sort fields through SearchCriteria::getOrderClause() (whitelist)\n$query->orderBy($criteria->getOrderClause());\n\n// ❌ Trusting the client's sort field directly\n$query->orderBy([$request->get('sort') => SORT_ASC]);\n```\n\n---\n\n## 📊 Pertimbangan Performa\n\n### 1. **Optimasi Query**\n- Gunakan index yang sesuai untuk field yang difilter\n- Lakukan count dengan query yang di-clone *sebelum* menerapkan limit/offset: `(clone $query)->count()`\n- Select hanya kolom yang dibutuhkan\n\n### 2. **Penerapan Kondisi**\n- Whitelist filter; lewati nilai kosong secara otomatis via `isFilled`\n- Utamakan `andIn` daripada banyak pemeriksaan equality `orWhere`\n\n### 3. **Penggunaan Memori**\n- Repository melakukan streaming baris (`streamRows()`) alih-alih memuat semuanya\n- Jaga `pageSize` tetap terbatas — `app/pagination.maxPageSize` membatasinya via `RequestParamsMiddleware`\n\n---\n\n## 🎯 Ringkasan\n\nUtility query building menyediakan cara yang terstruktur dan type-safe untuk membangun query database di aplikasi Yii3 API. Manfaat utamanya meliputi:\n\n- **🛡️ Security**: Kondisi terparameterisasi + whitelist kolom mencegah SQL injection\n- **🔧 Flexibility**: Helper static yang composable (exact match, LIKE/ILIKE, IN, range)\n- **📝 Type Safety**: DTO readonly `SearchCriteria`/`PaginatedResult`\n- **🧪 Testability**: Method static murni yang mudah di-unit test\n- **⚡ Performance**: Clone-untuk-count, streaming baris, ukuran halaman terbatas\n- **🔄 Reusability**: Digunakan bersama antar repository via `QueryConditionApplier` yang di-inject\n\nDengan mengikuti pola dan praktik terbaik yang diuraikan dalam panduan ini, Anda dapat membangun query building yang robust dan mudah dipelihara untuk aplikasi Yii3 API Anda! 🚀\n", "11-enums-guide.md": "# Panduan Enum\n\n## 📋 Gambaran Umum\n\nEnumeration (Enum) menyediakan cara untuk mendefinisikan sekumpulan konstanta bernama yang merepresentasikan sekumpulan nilai tetap. Di aplikasi Yii3 API ini, enum digunakan untuk mendefinisikan nilai status record, state sinkronisasi, dan konstanta field-name/pattern bersama yang dipakai lintas layer.\n\n---\n\n## 🏗️ Arsitektur Enum\n\n### Struktur Direktori\n\n```\nsrc/Shared/Core/Enums/\n├── AppConstants.php    # Application-wide constants (field names, patterns, filters)\n└── RecordStatus.php     # Record status enumeration\n\nsrc/Domain/Shared/Core/Enum/\n├── SyncStatus.php       # sync_flag status: SYNCED (db null) / NOT_SYNCED (db 1)\n└── SyncDirection.php    # sync direction: NONE / MASTER_TO_ORIGIN / ORIGIN_TO_MASTER / BIDIRECTIONAL\n```\n\n> Lihat `docs/22-sync-flag-guide.md` untuk detail lengkap modul sinkronisasi (`origin_id`/`sync_flag`).\n\n### Prinsip Desain\n\n#### **1. **Type Safety**\n- Fitur enum PHP 8.1+ untuk pengetikan kuat\n- Mencegah nilai yang tidak valid\n- Memungkinkan auto-completion di IDE\n\n#### **2. **Immutability**\n- Enum bersifat immutable secara alami\n- Mencegah perubahan state yang tidak disengaja\n- Menjamin konsistensi\n\n#### **3. **Self-Documentation**\n- Konstanta bernama sudah menjelaskan dirinya sendiri\n- Mengurangi magic number dan magic string\n- Meningkatkan keterbacaan kode\n\n#### **4. **Extensibility**\n- Mudah menambahkan nilai baru\n- Perubahan yang backward compatible\n- Pengelolaan terpusat\n\n---\n\n## 📁 Komponen Enum\n\n### 1. AppConstants\n\n**Tujuan**: Konstanta terpusat lingkup aplikasi — field name untuk sinkronisasi/optimistic locking, pattern validasi desimal, dan kondisi query \"not deleted\" yang dapat dipakai ulang.\n\n**Lokasi**: `src/Shared/Core/Enums/AppConstants.php`\n\n```php\n<?php\n\ndeclare(strict_types=1);\n\nnamespace App\\Shared\\Core\\Enums;\n\nfinal class AppConstants\n{\n    // Synchronization / Locking field names\n    public const OPTIMISTIC_LOCK = 'lock_version'; // optimistic locking version field\n    public const SYNC_MONGODB    = 'sync_mdb';     // MongoDB sync identifier\n    public const SYNC_MASTER     = 'sync_master';  // master sync flag\n    public const SYNC_FLAG       = 'sync_flag';    // sync flag field (null: synced, 1: not synced)\n    public const ORIGIN_ID       = 'origin_id';    // origin instance id\n    public const MASTER_ID       = 'master_id';    // master record id\n\n    // Validation patterns\n    public const DECIMAL_PATTERN = '/^\\d+(\\.\\d{1,2})?$/';\n\n    /**\n     * Query condition for \"status is not deleted\".\n     * Generates: ['<>', 'status', RecordStatus::DELETED->value]\n     */\n    public static function statusNotDeleted(): array\n    {\n        return ['<>', 'status', RecordStatus::DELETED->value];\n    }\n}\n```\n\n**Contoh Penggunaan**:\n```php\nuse App\\Shared\\Core\\Enums\\AppConstants;\n\n// Optimistic locking — read the version field by its constant name\n$lockVersion = $params->get(AppConstants::OPTIMISTIC_LOCK);\n\n// Decimal validation pattern\nif (!preg_match(AppConstants::DECIMAL_PATTERN, $amount)) {\n    throw new ValidationException(errors: ['amount' => ['Invalid decimal format']]);\n}\n\n// Exclude soft-deleted rows in repository queries\n$query->andWhere(AppConstants::statusNotDeleted());\n// Equivalent to: ['<>', 'status', 4]\n```\n\n---\n\n### 2. RecordStatus\n\n**Tujuan**: Enum int-backed untuk nilai status record. Disimpan di kolom `status` (smallint) dan dibungkus oleh value object `ResourceStatus` di domain entity.\n\n**Lokasi**: `src/Shared/Core/Enums/RecordStatus.php`\n\n```php\n<?php\n\ndeclare(strict_types=1);\n\nnamespace App\\Shared\\Core\\Enums;\n\nenum RecordStatus: int\n{\n    case INACTIVE    = 0;\n    case ACTIVE      = 1;\n    case DRAFT       = 2;\n    case COMPLETED   = 3;\n    case DELETED     = 4;\n    case MAINTENANCE = 5;\n    case APPROVED    = 6;\n    case REJECTED    = 7;\n\n    /**\n     * Immutable statuses that cannot be changed once set.\n     */\n    public const IMMUTABLE_STATUSES = [\n        self::ACTIVE->value,\n        self::COMPLETED->value,\n        self::DELETED->value,\n    ];\n\n    /**\n     * Allowed status transitions.\n     * Key: current status value. Value: allowed target status values.\n     */\n    public const STATUS_TRANSITION_MAP = [\n        self::DRAFT->value => [\n            self::DRAFT->value,\n            self::INACTIVE->value,\n            self::ACTIVE->value,\n            self::DELETED->value,\n            self::MAINTENANCE->value,\n        ],\n        self::ACTIVE->value => [\n            self::COMPLETED->value,\n            self::APPROVED->value,\n            self::REJECTED->value,\n        ],\n        self::INACTIVE->value => [\n            self::INACTIVE->value,\n            self::ACTIVE->value,\n            self::DRAFT->value,\n            self::DELETED->value,\n        ],\n        self::MAINTENANCE->value => [\n            self::MAINTENANCE->value,\n            self::INACTIVE->value,\n            self::ACTIVE->value,\n            self::DRAFT->value,\n            self::DELETED->value,\n        ],\n        self::APPROVED->value => [\n            self::APPROVED->value,\n            self::COMPLETED->value,\n            self::REJECTED->value,\n        ],\n        self::DELETED->value => [\n            self::INACTIVE->value,\n        ],\n    ];\n\n    /**\n     * Human-readable label: 'Inactive', 'Active', 'Draft', 'Completed',\n     * 'Deleted', 'Maintenance', 'Approved', 'Rejected'\n     */\n    public function label(): string\n    {\n        return match ($this) {\n            self::INACTIVE    => 'Inactive',\n            self::ACTIVE      => 'Active',\n            self::DRAFT       => 'Draft',\n            self::COMPLETED   => 'Completed',\n            self::DELETED     => 'Deleted',\n            self::MAINTENANCE => 'Maintenance',\n            self::APPROVED    => 'Approved',\n            self::REJECTED    => 'Rejected',\n        };\n    }\n\n    /** Only the ACTIVE value — for filtering active-only records. */\n    public static function activeOnlyStates(): array\n    {\n        return [self::ACTIVE->value];\n    }\n\n    /** Only the DRAFT value — for filtering draft records. */\n    public static function draftOnlyStates(): array\n    {\n        return [self::DRAFT->value];\n    }\n\n    /** Map of status value => label (e.g. for dropdown options). */\n    public static function list(): array\n    {\n        return \\array_reduce(\n            self::cases(),\n            static function (array $carry, self $status) {\n                $carry[$status->value] = $status->label();\n\n                return $carry;\n            },\n            []\n        );\n    }\n\n    /** All status values except DELETED — safe for public search/list endpoints. */\n    public static function searchableStates(): array\n    {\n        $states = [];\n        foreach (self::cases() as $status) {\n            if ($status !== self::DELETED) {\n                $states[] = $status->value;\n            }\n        }\n\n        return $states;\n    }\n}\n```\n\n**Contoh Penggunaan**:\n```php\nuse App\\Shared\\Core\\Enums\\RecordStatus;\n\n// Creating status (int-backed)\n$status = RecordStatus::ACTIVE;\n$status = RecordStatus::from(1);        // RecordStatus::ACTIVE\n$status = RecordStatus::tryFrom(2);     // RecordStatus::DRAFT (null if invalid)\n\n// Status information\n$label = $status->label();              // \"Active\"\n\n// Status groups for queries and validation rules\nRecordStatus::activeOnlyStates();       // [1]\nRecordStatus::draftOnlyStates();        // [2]\nRecordStatus::searchableStates();       // [0, 1, 2, 3, 5, 6, 7] — no DELETED\nRecordStatus::list();                   // [0 => 'Inactive', 1 => 'Active', ...]\n\n// In Yiisoft Validator rules (see ExampleInputValidator)\nnew In(RecordStatus::draftOnlyStates())    // CREATE: only draft allowed\nnew In(RecordStatus::searchableStates())   // UPDATE: any non-deleted status\n\n// Transition validation\n$allowed = RecordStatus::STATUS_TRANSITION_MAP[$current->value] ?? [];\nif (!in_array($newStatus->value, $allowed, true)) {\n    throw new BadRequestException(translate: Message::create(key: 'status.invalid_transition'));\n}\n\n// Immutability check\n$isFinal = in_array($status->value, RecordStatus::IMMUTABLE_STATUSES, true);\n```\n\n> **Catatan**: Domain entity tidak mengekspos `RecordStatus` secara langsung. Entity membungkusnya dalam\n> `App\\Domain\\Shared\\Core\\ValueObject\\ResourceStatus`, yang menambahkan perilaku bisnis\n> (`canTransitionTo()`, `canBeDeleted()`, `isLocked()`, `isActive()`, `isDeleted()`,\n> `restored()`, dll.) di atas enum. Gunakan `ResourceStatus` di dalam domain layer\n> dan `RecordStatus` untuk nilai DB, rule validasi, dan daftar filter.\n\n---\n\n### 3. SyncStatus\n\n**Tujuan**: Enum murni (non-backed) yang merepresentasikan state kolom `sync_flag` untuk sinkronisasi master–origin. Representasi DB: `null` = synced, `1` = not synced (default `1`).\n\n**Lokasi**: `src/Domain/Shared/Core/Enum/SyncStatus.php`\n\n```php\n<?php\n\ndeclare(strict_types=1);\n\nnamespace App\\Domain\\Shared\\Core\\Enum;\n\nenum SyncStatus\n{\n    case SYNCED;\n    case NOT_SYNCED;\n\n    /** Value stored in the sync_flag column: SYNCED => null, NOT_SYNCED => 1. */\n    public function dbValue(): ?int\n    {\n        return match ($this) {\n            self::SYNCED     => null,\n            self::NOT_SYNCED => 1,\n        };\n    }\n\n    /** Build SyncStatus from the raw sync_flag value. Throws BadRequestException otherwise. */\n    public static function fromDbValue(?int $value): self\n    {\n        return match ($value) {\n            null    => self::SYNCED,\n            1       => self::NOT_SYNCED,\n            default => throw new BadRequestException(/* ... */),\n        };\n    }\n\n    public function label(): string     // 'Synced' / 'Not Synced'\n    public function isSynced(): bool    // $this === self::SYNCED\n    public function isPending(): bool   // $this === self::NOT_SYNCED\n}\n```\n\n**Contoh Penggunaan**:\n```php\nuse App\\Domain\\Shared\\Core\\Enum\\SyncStatus;\n\n// From a DB row\n$status = SyncStatus::fromDbValue($row['sync_flag']);\n\nif ($status->isPending()) {\n    // record still needs to be synchronized\n}\n\n// Writing to DB\n$syncFlag = SyncStatus::NOT_SYNCED->dbValue(); // 1\n$syncFlag = SyncStatus::SYNCED->dbValue();     // null\n```\n\n---\n\n### 4. SyncDirection\n\n**Tujuan**: Enum int-backed yang mendeskripsikan arah sinkronisasi record antara instance master dan origin.\n\n**Lokasi**: `src/Domain/Shared/Core/Enum/SyncDirection.php`\n\n```php\n<?php\n\ndeclare(strict_types=1);\n\nnamespace App\\Domain\\Shared\\Core\\Enum;\n\nenum SyncDirection: int\n{\n    case NONE             = 0;\n    case MASTER_TO_ORIGIN = 1;\n    case ORIGIN_TO_MASTER = 2;\n    case BIDIRECTIONAL    = 3;\n\n    /** Build from raw value. Throws BadRequestException for values outside 0–3. */\n    public static function fromValue(int $value): self\n    {\n        return self::tryFrom($value) ?? throw new BadRequestException(/* ... */);\n    }\n\n    public function label(): string\n    {\n        return match ($this) {\n            self::NONE             => 'None',\n            self::MASTER_TO_ORIGIN => 'Master to Origin',\n            self::ORIGIN_TO_MASTER => 'Origin to Master',\n            self::BIDIRECTIONAL    => 'Bidirectional',\n        };\n    }\n}\n```\n\n**Contoh Penggunaan**:\n```php\nuse App\\Domain\\Shared\\Core\\Enum\\SyncDirection;\n\n$direction = SyncDirection::fromValue((int) $row['sync_direction']);\n\nif ($direction === SyncDirection::ORIGIN_TO_MASTER) {\n    // push this record's changes up to the master\n}\n```\n\n---\n\n## 🔧 Pola Integrasi\n\n### 1. **Penggunaan di Entity**\n```php\nuse App\\Domain\\Shared\\Core\\ValueObject\\ResourceStatus;\nuse App\\Shared\\Core\\Enums\\RecordStatus;\n\nfinal class Example\n{\n    private function __construct(\n        private readonly ?int $id,\n        private string $name,\n        private ResourceStatus $status, // VO wrapping RecordStatus\n    ) {}\n\n    public static function create(string $name, ResourceStatus $status, /* ... */): self\n    {\n        // guardInitialStatus() restricts which statuses are valid at creation\n        return new self(id: null, name: $name, status: $status /* ... */);\n    }\n\n    public function changeStatus(ResourceStatus $newStatus): void\n    {\n        if (!$this->status->canTransitionTo($n
