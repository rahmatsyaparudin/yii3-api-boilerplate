datableData);\n}\n```\n\n---\n\n### 2. FieldMapper\n\n**Tujuan**: Helper stateless untuk transformasi field baris database secara generik — mengganti nama key dan menormalisasi nilai nol.\n\n```php\nuse App\\Shared\\Core\\Utility\\FieldMapper;\n\n// Rename keys: old key => new key\n$row = FieldMapper::rename($row, ['full_name' => 'name', 'mail' => 'email']);\n\n// Turn 0 / '0' into null for the listed columns\n$row = FieldMapper::nullWhenZero($row, ['parent_id', 'dept_id']);\n\n// Rename, then null-when-zero, in one call\n$row = FieldMapper::map(\n    row: $row,\n    rename: ['full_name' => 'name'],\n    nullWhenZero: ['parent_id'],\n);\n```\n\n**Method Signatures**:\n```php\npublic static function rename(array $row, array $map): array\npublic static function nullWhenZero(array $row, array $columns): array\npublic static function map(array $row, array $rename, array $nullWhenZero = []): array\n```\n\n**Catatan**:\n- `rename` hanya mengganti nama key yang benar-benar ada di baris.\n- `nullWhenZero` hanya mengonversi nilai strict `0` atau `'0'` — `false`, `''`, dan key yang tidak ada dibiarkan utuh.\n- `map` menerapkan `rename` terlebih dahulu, lalu `nullWhenZero` terhadap nama kolom yang **sudah diganti**.\n\n---\n\n### 3. JsonHandler\n\n**Tujuan**: Encoding, decoding, dan transformasi data kolom JSON. Berbeda dengan `Arrays` dan `FieldMapper`, `JsonHandler` adalah class **instance** — panggil method-nya pada objek.\n\n```php\nuse App\\Shared\\Core\\Utility\\JsonHandler;\n\n$jsonHandler = new JsonHandler();\n```\n\n#### **Field casting**\n\n```php\n// Decode the listed JSON columns on a single row or a list of rows\n$rows = $jsonHandler->handle($rows, ['detail_info', 'sync_mdb']);\n\n// castFields() is an alias of handle()\n$rows = $jsonHandler->castFields($rows, ['detail_info']);\n```\n\n`handle(array $data, array $jsonFields): array` mendeteksi data berupa list-of-rows (ketika `$data[0]` adalah array) dan memproses setiap baris; setiap field yang terdaftar dan berisi string JSON di-decode menjadi array.\n\n#### **Encoding / decoding**\n\n```php\n// Safe decode: returns $fallback on null, empty string, or invalid JSON\n$data = $jsonHandler->decode($jsonString, fallback: []);\n\n// Encode with JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE\n$json = $jsonHandler->encode($data);\n\n// Full JSON validation\n$isValid = $jsonHandler->isValid($jsonString);\n\n// Quick shape check without full parsing (faster than isValid)\n$maybe = $jsonHandler->looksLikeJson($value); // '{...}' or '[...]'\n```\n\n#### **Transformation helpers**\n\n```php\n// Deep-merge new data into an existing JSON document\n$updated = $jsonHandler->merge($existingJson, ['profile' => ['theme' => 'dark']]);\n\n// Nested array => dot-notation flat array\n$flat = $jsonHandler->flatten(['user' => ['id' => 1]]); // ['user.id' => 1]\n\n// Dot-notation flat array => nested array\n$nested = $jsonHandler->expand(['user.id' => 1]); // ['user' => ['id' => 1]]\n\n// Read a value from a JSON string via dot notation\n$theme = $jsonHandler->get($json, 'profile.theme', 'light');\n\n// Normalize mixed input into an array (decodes JSON strings, wraps scalars)\n$arr = $jsonHandler->wrap($value);\n```\n\n#### **Safety helpers**\n\n```php\n// Recursively mask sensitive keys before logging\n$safe = $jsonHandler->mask($data); // masks password, token, secret, key\n$safe = $jsonHandler->mask($data, ['api_key', 'credit_card']);\n\n// Recursively remove null / '' / [] values (e.g. before persisting to MongoDB)\n$clean = $jsonHandler->filter($data);\n\n// Deep-search a value inside a JSON document\n$found = $jsonHandler->contains($json, 'dark');\n\n// Pretty-printed JSON string\n$pretty = $jsonHandler->pretty($data);\n```\n\n**Method Signatures**:\n```php\npublic function handle(array $data, array $jsonFields): array\npublic function castFields(array $data, array $jsonFields): array\npublic function decode(?string $value, array $fallback = []): array\npublic function encode(mixed $value): string\npublic function isValid(string $value): bool\npublic function merge(string $existingJson, array $newData): string\npublic function flatten(array $array, string $prefix = ''): array\npublic function expand(array $flatArray): array\npublic function get(string $json, string $path, mixed $default = null): mixed\npublic function mask(array $data, array $sensitiveKeys = ['password', 'token', 'secret', 'key']): array\npublic function pretty(mixed $value): string\npublic function contains(string $json, mixed $needle): bool\npublic function filter(array $data): array\npublic function looksLikeJson(mixed $value): bool\npublic function wrap(mixed $value): array\n```\n\n**Catatan**:\n- `decode`, `encode`, dan `merge` tidak pernah melempar exception — input yang tidak valid mengembalikan fallback (`[]` secara default) sehingga caller mendapat perilaku fail-safe.\n- `merge` menggunakan `array_replace_recursive`, sehingga nested key digabungkan, bukan ditimpa sepenuhnya.\n- `mask` mengubah setiap key menjadi huruf kecil sebelum membandingkan, sehingga `Password`, `TOKEN`, dll. semuanya ikut di-mask.\n\n---\n\n## 🔧 Pola Integrasi\n\n### 1. **Integrasi Entity — dirty checking**\n\n```php\nuse App\\Domain\\Shared\\Core\\Concerns\\Entity\\Stateful;\nuse App\\Shared\\Core\\Utility\\Arrays;\n\nfinal class Example\n{\n    use Stateful;\n\n    public function update(array $data): void\n    {\n        // Skip no-op updates — hasFieldChanges() strips immutable fields\n        if (!$this->hasFieldChanges($data)) {\n            return;\n        }\n\n        // Or inspect the actual changed fields yourself\n        $dirty = Arrays::getDirtyData($data, $this->toArray(), ['detail_info.change_log']);\n    }\n}\n```\n\n### 2. **Integrasi Repository — kolom JSON**\n\n```php\nuse App\\Shared\\Core\\Utility\\FieldMapper;\nuse App\\Shared\\Core\\Utility\\JsonHandler;\nuse Yiisoft\\Db\\Query\\Query;\n\nfinal class ExampleRepository\n{\n    public function __construct(\n        private ConnectionInterface $db,\n        private JsonHandler $jsonHandler,\n    ) {}\n\n    public function findById(int $id): ?array\n    {\n        $row = (new Query($this->db))\n            ->from(self::TABLE_NAME)\n            ->where(['id' => $id])\n            ->one();\n\n        if ($row === null) {\n            return null;\n        }\n\n        // Decode JSON columns and normalize field names\n        $row = $this->jsonHandler->handle($row, ['detail_info', 'sync_mdb']);\n\n        return FieldMapper::map(\n            row: $row,\n            rename: ['full_name' => 'name'],\n            nullWhenZero: ['parent_id'],\n        );\n    }\n}\n```\n\n### 3. **Integrasi Service — audit diff**\n\n```php\nuse App\\Shared\\Core\\Utility\\Arrays;\n\nfinal class ExampleService\n{\n    public function update(Example $entity, array $data): void\n    {\n        $before = $entity->toArray();\n\n        $entity->update($data);\n\n        // Record what actually changed for the audit trail\n        $changes = Arrays::getDifferences($entity->toArray(), $before);\n    }\n}\n```\n\n---\n\n## 🚀 Praktik Terbaik\n\n### 1. **Change Detection**\n```php\n// ✅ Use the utility methods\nif (!Arrays::hasDirtyData($payload, $existing, ['detail_info.change_log'])) {\n    return; // nothing changed\n}\n\n// ❌ Manual comparison\n$changed = false;\nforeach ($payload as $key => $value) {\n    if (($existing[$key] ?? null) !== $value) {\n        $changed = true;\n    }\n}\n```\n\n### 2. **JSON Field Processing**\n```php\n// ✅ Use JsonHandler for JSON columns\n$rows = $this->jsonHandler->handle($rows, ['detail_info', 'sync_mdb']);\n\n// ❌ Manual per-row decoding without fallbacks\nforeach ($rows as &$row) {\n    $row['detail_info'] = json_decode($row['detail_info'], true); // null on bad JSON\n}\n```\n\n### 3. **Data Transformation**\n```php\n// ✅ Use FieldMapper for row normalization\n$row = FieldMapper::map($row, ['full_name' => 'name'], ['parent_id']);\n\n// ❌ Manual renaming\n$row['name'] = $row['full_name'];\nunset($row['full_name']);\nif ($row['parent_id'] === 0) {\n    $row['parent_id'] = null;\n}\n```\n\n---\n\n## 📊 Pertimbangan Performa\n\n### 1. **Penggunaan Memori**\n- `Arrays::getDirtyData` / `getDifferences` hanya mengiterasi `$after` — jaga payload update tetap kecil.\n- `JsonHandler::handle` memetakan baris tanpa menyalin field yang tidak berubah.\n\n### 2. **Kecepatan Pemrosesan**\n- Utamakan `JsonHandler::looksLikeJson()` daripada `isValid()` ketika Anda hanya butuh pemeriksaan bentuk — method ini melewatkan parsing penuh.\n- Gunakan `JsonHandler::get()` untuk membaca satu nilai, alih-alih men-decode seluruh dokumen sendiri.\n\n### 3. **Pemrosesan JSON**\n- `decode()` tidak pernah melempar exception — selalu berikan `fallback` yang bermakna alih-alih memeriksa exception.\n- Gunakan `filter()` sebelum menyimpan JSON ke MongoDB untuk membuang nilai null/kosong.\n\n---\n\n## 🎯 Ringkasan\n\nFungsi-fungsi utility menyediakan fungsionalitas esensial yang dapat digunakan kembali untuk aplikasi Yii3 API. Manfaat utamanya meliputi:\n\n- **🔄 Reusability**: Fungsi generik untuk tugas-tugas umum\n- **🛡️ Type Safety**: Pengetikan kuat dan validasi\n- **⚡ Performance**: Algoritma yang dioptimalkan\n- **🧪 Testability**: Mudah di-unit test\n- **📦 Modularity**: Fungsi yang fokus dan single-purpose\n- **🚀 Efficiency**: Overhead minimal dan eksekusi cepat\n\nKetiga utility mencakup concern yang berbeda:\n\n| Utility | Gaya | Tujuan |\n|---|---|---|\n| `Arrays` | static | Deteksi dirty-data dan diffing array |\n| `FieldMapper` | static | Penggantian nama field baris dan normalisasi nol-ke-null |\n| `JsonHandler` | instance | Casting, encoding, dan transformasi kolom JSON |\n\nDengan mengikuti pola dan praktik terbaik yang diuraikan dalam panduan ini, Anda dapat membangun fungsi utility yang efisien dan mudah dipelihara untuk aplikasi Yii3 API Anda! 🚀\n", "21-quality-guide.md": "# Panduan Quality Assurance\n\n## 📋 Gambaran Umum\n\nScript `quality` (aplikasi Symfony Console kecil di root project) adalah tool quality assurance yang komprehensif dan dirancang untuk project Yii3 API. Tool ini menyediakan pemeriksaan otomatis untuk code style, static analysis, testing, dan security audit guna memastikan kualitas kode yang tinggi dan kemudahan pemeliharaan.\n\n## 🚀 Quick Start\n\n### Menjalankan Semua Quality Check\n```bash\n# Jalankan seluruh rangkaian quality check\nphp quality quality:check\n\n# Jalankan dengan opsi tertentu\nphp quality quality:check --fix          # Perbaiki otomatis masalah code style\nphp quality quality:check --coverage      # Generate laporan test coverage\nphp quality quality:check --report        # Generate laporan analisis detail\n```\n\n### Menjalankan Test\n```bash\n# Jalankan semua suite Codeception\nphp quality test:run\n\n# Jalankan jenis test tertentu\nphp quality test:run --unit                    # Jalankan hanya suite Unit\nphp quality test:run --integration             # Jalankan suite Functional\nphp quality test:run --coverage                # Generate laporan coverage\nphp quality test:run --filter=testSomething    # Filter test berdasarkan nama\n```\n\n### Command yang Tersedia\n```bash\n# Daftar semua command yang tersedia\nphp quality list\n\n# Bantuan untuk command tertentu\nphp quality quality:check --help\nphp quality test:run --help\n```\n\n### Pemeriksaan Individual\n```bash\n# Pemeriksaan code style\nvendor/bin/php-cs-fixer check --diff --verbose --allow-risky=yes\n\n# Static analysis\nvendor/bin/psalm\n\n# Test (Codeception; suite Unit yang dijalankan quality:check)\nvendor/bin/codecept run Unit\n\n# Security audit\ncomposer audit\n```\n\nDi Windows, awali command `vendor/bin/*` dengan `php` (mis. `php vendor\\bin\\psalm`).\n\n## 🔧 Konfigurasi\n\n### Opsi yang Tersedia\n\nOpsi `quality:check`:\n\n| Opsi | Singkat | Deskripsi |\n|--------|-------|-------------|\n| `--fix` | `-f` | Perbaiki otomatis masalah code style |\n| `--coverage` | `-c` | Generate laporan test coverage |\n| `--report` | `-r` | Generate laporan analisis detail |\n\nOpsi `test:run`:\n\n| Opsi | Singkat | Deskripsi |\n|--------|-------|-------------|\n| `--unit` | `-u` | Jalankan hanya suite Unit |\n| `--integration` | `-i` | Jalankan hanya suite Functional |\n| `--coverage` | `-c` | Generate laporan coverage |\n| `--filter` | — | Filter test berdasarkan nama |\n\n### Apa yang Dijalankan `quality:check`\n\n1. `vendor/bin/php-cs-fixer check|fix --diff --verbose --allow-risky=yes`\n2. `vendor/bin/psalm`\n3. `vendor/bin/codecept run Unit` (dengan `APP_ENV=test`; menambahkan `--coverage-html`/`--coverage-text` dengan `--coverage`, plus `--coverage-xml` dengan `--report`)\n4. `composer audit`\n\n## 📊 Quality Check\n\n### 1. Pemeriksaan Code Style (PHP CS Fixer)\n\n**Tujuan**: Memastikan format kode dan kepatuhan gaya yang konsisten.\n\n**Apa yang diperiksa**:\n- Standar coding PSR-12\n- Konvensi Yii3 framework\n- Pemformatan kode (spasi, line ending, dll.)\n- Organisasi import\n- Urutan method/property\n\n**Konfigurasi**: `.php-cs-fixer.php`\n\n```php\n// Rule sets enabled in .php-cs-fixer.php\n'@PER-CS2x0' => true,\n'@PSR12' => true,\n'@Symfony' => true,\n'@PHP8x0Migration' => true,\n'@PHP8x0Migration:risky' => true,\n'@PHP8x1Migration' => true,\n'strict_comparison' => true,\n'declare_strict_types' => true,\n'no_unused_imports' => true,\n// ...see .php-cs-fixer.php for the full list\n```\n\nFinder memindai `config/`, `src/`, `tests/` plus `public/index.php`; file cache-nya adalah `runtime/cache/.php-cs-fixer.cache`.\n\n### 2. Static Analysis (Psalm)\n\n**Tujuan**: Pemeriksaan tipe dan deteksi error sebelum runtime.\n\n**Apa yang diperiksa**:\n- Type safety dan kebenaran tipe\n- Pelanggaran null safety\n- Kepatuhan interface\n- Validasi signature method\n- Potensi runtime error\n\n**Konfigurasi**: `psalm.xml`\n\n```xml\n<psalm\n  errorLevel=\"1\"\n  errorBaseline=\"psalm-baseline.xml\"\n  findUnusedBaselineEntry=\"true\"\n  findUnusedCode=\"false\"\n  cacheDirectory=\"/app/runtime/cache/psalm\"\n>\n  <projectFiles>\n    <directory name=\"src\" />\n    <file name=\"public/index.php\"/>\n    <file name=\"yii\"/>\n  <\/projectFiles>\n<\/psalm>\n```\n\nBaseline berisi issue yang sudah diketahui disimpan di `psalm-baseline.xml`; sejumlah issue bertipe mixed disuppress via `<issueHandlers>` di `psalm.xml`.\n\n### 3. Unit Test (Codeception)\n\n**Tujuan**: Memvalidasi fungsionalitas aplikasi dan mencegah regresi.\n\n`quality:check` menjalankan `vendor/bin/codecept run Unit` dengan `APP_ENV=test`. Setup test lengkap didefinisikan di `codeception.yml` (namespace `App\\Tests`) dengan suite di bawah `tests/`: `Unit`, `Functional`, `Api`, `Console`.\n\n**Apa yang diuji**:\n- Logika aplikasi\n- Operasi repository\n- Fungsionalitas service layer\n- Endpoint API\n- Logika domain\n\n**Laporan Coverage**:\n- Laporan coverage HTML: `tests/coverage/html/`\n- Ringkasan coverage teks: `tests/coverage/coverage.txt`\n- Clover XML: `tests/coverage/clover.xml`\n\n### 4. Security Audit (Composer)\n\n**Tujuan**: Mengidentifikasi kerentanan keamanan pada dependency.\n\n**Apa yang diperiksa**:\n- Kerentanan CVE yang diketahui\n- Dependency yang usang\n- Security advisory\n- Kepatuhan lisensi\n\n### Tool QA Tambahan\n\nTidak termasuk dalam `quality:check`, tetapi sudah dikonfigurasi di project (juga tersedia sebagai target `make` saat menggunakan Docker):\n\n```bash\n# Rector — refactoring otomatis (rector.php: src/ + tests/, PHP 8.2 sets)\nvendor/bin/rector --dry-run  # pratinjau perubahan\nvendor/bin/rector            # terapkan perubahan\n\n# Infection — mutation testing (infection.json.dist)\nvendor/bin/infection\n\n# Composer Dependency Analyser (composer-dependency-analyser.php)\nvendor/bin/composer-dependency-analyser --config=composer-dependency-analyser.php\n```\n\n## 📈 Laporan dan Output\n\n### Format Output Standar\n\n```\nRunning Quality Assurance Checks...\n\n1. Checking code style...\nRunning: php vendor\\bin\\php-cs-fixer check --diff --verbose --allow-risky=yes\n...\n\n2. Running static analysis...\nRunning: php vendor\\bin\\psalm\n...\n\n3. Running unit tests...\nRunning: php vendor\\bin\\codecept run Unit\n...\n\n4. Running security audit...\nRunning: composer audit\n...\n\n✅ All quality checks passed!\n```\n\n(Atau `❌ Some quality checks failed!` beserta exit code non-zero ketika ada langkah yang gagal.)\n\n### Laporan Detail\n\n#### Laporan Coverage (`--coverage`)\n```bash\nphp quality quality:check --coverage\n```\nMenghasilkan:\n- **Laporan HTML**: `tests/coverage/html/` — visualisasi coverage interaktif\n- **Ringkasan Teks**: `tests/coverage/coverage.txt` — statistik coverage\n\n#### Laporan Analisis (`--report`)\n```bash\nphp quality quality:check --report\n```\nMenghasilkan:\n- **Clover XML**: `tests/coverage/clover.xml` — data integrasi CI/CD\n\n## 🛠️ Penanganan Error\n\n### Masalah Umum dan Solusinya\n\n#### Error Code Style\n```bash\n# Perbaiki otomatis sebagian besar masalah style\nphp quality quality:check --fix\n\n# Perbaikan manual untuk masalah yang kompleks\nvendor/bin/php-cs-fixer fix --diff --verbose --allow-risky=yes\n```\n\n#### Error Psalm\n```bash\n# Bersihkan cache dan jalankan ulang\nvendor/bin/psalm --clear-cache\nvendor/bin/psalm\n\n# Periksa file tertentu\nvendor/bin/psalm src/Infrastructure/Common/Persistence/Example/ExampleRepository.php\n```\n\n#### Kegagalan Test\n```bash\n# Jalankan suite atau test tertentu\nvendor/bin/codecept run Unit\nvendor/bin/codecept run Unit --filter=ExampleTest\n\n# Jalankan dengan coverage\nvendor/bin/codecept run --coverage-html\n```\n\n#### Masalah Security\n```bash\n# Update dependency\ncomposer update\n\n# Periksa kerentanan\ncomposer audit\n```\n\n## 🏗️ Dampak pada Struktur Project\n\n### Quality Gate\n\nScript quality menegakkan quality gate untuk:\n\n#### Kualitas Kode\n- **Type Safety**: Semua kode harus lulus analisis Psalm\n- **Kepatuhan Style**: Kode harus mengikuti standar PSR-12\n- **Test Coverage**: Persyaratan coverage minimum\n\n#### Security\n- **Keamanan Dependency**: Tidak ada kerentanan yang diketahui\n- **Kepatuhan Lisensi**: Hanya lisensi yang kompatibel\n\n#### Performa\n- **Performa Test**: Test harus berjalan dalam batas waktu\n- **Penggunaan Memori**: Tidak ada memory leak di test\n\n### Integrasi CI/CD\n\n#### Contoh GitHub Actions\n```yaml\nname: Quality Check\non: [push, pull_request]\njobs:\n  quality:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v3\n      - uses: shivammathur/setup-php@v2\n      - run: composer install\n      - run: php quality quality:check --report\n      - name: Upload coverage reports\n        uses: actions/upload-artifact@v3\n        with:\n          name: coverage-reports\n          path: tests/coverage/\n```\n\n## 📚 Best Practices\n\n### Alur Kerja Development\n\n#### 1. Sebelum Commit\n```bash\n# Selalu jalankan quality check sebelum commit\nphp quality quality:check\n```\n\n#### 2. Pengembangan Fitur\n```bash\n# Jalankan pemeriksaan tertentu selama development\nvendor/bin/psalm --no-cache\nvendor/bin/php-cs-fixer check\n```\n\n#### 3. Sebelum Release\n```bash\n# Rangkaian quality lengkap dengan laporan\nphp quality quality:check --coverage --report\n```\n\n### Standar Kualitas Kode\n\n#### Type Safety\n```php\n// ✅ Use strict types\ndeclare(strict_types=1);\n\n// ✅ Type annotations\npublic function process(array $data): array<string, mixed>\n{\n    return array_map(fn($item) => (string) $item, $data);\n}\n\n// ✅ Null safety\npublic function find(int $id): ?Example\n{\n    return $this->repository->findById($id);\n}\n```\n\n#### Error Handling\n```php\n// ✅ Proper exception handling\ntry {\n    $result = $this->service->process($data);\n} catch (ValidationException $e) {\n    $this->logger->error('Validation failed', ['error' => $e->getMessage()]);\n    throw $e;\n}\n```\n\n#### Dokumentasi\n```php\n/**\n * Example service for processing data\n *\n * @param array<string, mixed> $data Input data to process\n * @return array<string, mixed> Processed data\n * @throws ValidationException When data is invalid\n */\npublic function process(array $data): array<string, mixed>\n{\n    // Implementation\n}\n```\n\n## 🔧 Kustomisasi\n\n### Menambahkan Pemeriksaan Baru\n\n#### 1. Rule Psalm Kustom\n```xml\n<!-- psalm.xml -->\n<issueHandlers>\n    <CustomRule errorLevel=\"error\" />\n<\/issueHandlers>\n```\n\n#### 2. Test Codeception Tambahan\n```php\n// tests/Unit/CustomTest.php\nfinal class CustomTest extends \\Codeception\\Test\\Unit\n{\n    public function testCustomLogic(): void\n    {\n        $this->assertTrue(true);\n    }\n}\n```\n\n#### 3. Security Scanner\n```bash\n# Tambahkan tool security tambahan\ncomposer require --dev enshrined/security-scanner\n```\n\n### File Konfigurasi\n\n#### `.php-cs-fixer.php`\n```php\n<?php\n$finder = (new PhpCsFixer\\Finder())\n    ->in([__DIR__ . '/config', __DIR__ . '/src', __DIR__ . '/tests'])\n    ->append([__DIR__ . '/public/index.php']);\n\nreturn (new PhpCsFixer\\Config())\n    ->setCacheFile(__DIR__ . '/runtime/cache/.php-cs-fixer.cache')\n    ->setRules([\n        '@PER-CS2x0' => true,\n        '@PSR12' => true,\n        '@Symfony' => true,\n    ])\n    ->setFinder($finder);\n```\n\n#### `psalm.xml`\n```xml\n<?xml version=\"1.0\"?>\n<psalm errorLevel=\"1\" errorBaseline=\"psalm-baseline.xml\" findUnusedBaselineEntry=\"true\">\n    <projectFiles>\n        <directory name=\"src\"/>\n        <file name=\"public/index.php\"/>\n        <file name=\"yii\"/>\n    <\/projectFiles>\n    <issueHandlers>\n        <MixedAssignment errorLevel=\"suppress\"/>\n        <InvalidArrayOffset errorLevel=\"suppress\"/>\n    <\/issueHandlers>\n<\/psalm>\n```\n\n## 🎯 Metrik Kualitas\n\n### Target Metrik\n\n| Metrik | Target | Cara memeriksa |\n|--------|---------|--------|\n| Psalm Errors | 0 | `vendor/bin/psalm` |\n| Test Coverage | setinggi yang praktis | `php quality quality:check --coverage` |\n| Security Issues | 0 | `composer audit` |\n| Style Issues | 0 | `vendor/bin/php-cs-fixer check` |\n\n### Memantau Tren Kualitas\n\n```bash\n# Lacak dari waktu ke waktu\nphp quality quality:check --report > quality-report-$(date +%Y-%m-%d).txt\n```\n\n## 🚨 Troubleshooting\n\n### Masalah Umum\n\n#### Masalah Memori\n```bash\n# Naikkan PHP memory limit\nphp -d memory_limit=1G quality quality:check\n```\n\n#### Masalah Performa\n```bash\n# Jalankan pemeriksaan secara paralel\nvendor/bin/psalm --threads=4\n```\n\n#### Masalah Cache\n```bash\n# Bersihkan cache tool\nrm -rf runtime/cache/*\nvendor/bin/psalm --clear-cache\ncomposer install\n```\n\n### Mendapatkan Bantuan\n\n```bash\n# Tampilkan command dan opsi yang tersedia\nphp quality list\nphp quality quality:check --help\n\n# Periksa versi\nphp --version\ncomposer show yiisoft/yii-console\ncomposer show vimeo/psalm\n```\n\n## 📞 Sumber Daya\n\n### Dokumentasi\n- [Psalm Documentation](https://psalm.dev/)\n- [PHP CS Fixer](https://cs.symfony.com/)\n- [Codeception](https://codeception.com/) (test runner; PHPUnit di baliknya)\n- [Rector](https://github.com/rectorphp/rector), [Infection](https://infection.github.io/), [Composer Dependency Analyser](https://github.com/shipmonk-rnd/composer-dependency-analyser)\n- [Composer Audit](https://github.com/composer/composer/blob/main/src/Composer/Command/AuditCommand.php)\n\n### Khusus Yii3\n- [Yii3 Documentation](https://www.yiiframework.com/doc/guide/)\n- [Yii3 Best Practices](https://www.yiiframework.com/doc/guide/)\n\n### Standar Kualitas\n- [PSR-12](https://www.php-fig.org/psr/psr-12/)\n- [PHP Standards](https://www.php-fig.org/standards/)\n- [Clean Code](https://clean-code-developer.com/)\n\n---\n\n## 🎉 Kesimpulan\n\nScript quality adalah tool esensial untuk menjaga kualitas kode, keamanan, dan reliabilitas di project Yii3 API. Penggunaan rutin memastikan:\n\n- **Kualitas Kode yang Konsisten**: Semua kode mengikuti standar yang ditetapkan\n- **Type Safety**: Error tertangkap sebelum runtime\n- **Security**: Dependency diaudit secara berkala\n- **Test Coverage**: Kode diuji secara menyeluruh\n- **Maintainability**: Kode tetap bersih dan terorganisir\n\nJadikan quality check sebagai bagian rutin dari workflow development Anda demi codebase yang robust dan mudah dipelihara! 🚀\n", "22-sync-flag-guide.md": "# Panduan Sync Flag (`origin_id` + `sync_flag`)\n\n## Overview\n\nModul `SyncFlag` adalah fondasi sinkronisasi antar-instance (master ↔ origin/store) dengan topologi **hub-and-spoke**: store tidak pernah sync langsung satu sama lain — semua lewat cloud/master sebagai relay.\n\nDua kolom yang dibawa setiap record yang ikut sync:\n\n| Kolom | Tipe | Default | Arti |\n|-------|------|---------|------|\n| `origin_id` | `integer`, nullable | `null` | Id origin/store tujuan pengiriman berikutnya |\n| `sync_flag` | `smallint`, nullable | `1` | `null` = synced, `1` = not synced (pending) |\n\nDitambah `direction` (tidak dipersist sebagai kolom; di-derive atau dibawa di payload queue).\n\n## Komponen\n\n```\nsrc/Domain/Shared/Core/Enum/SyncStatus.php       — SYNCED (null) / NOT_SYNCED (1)\nsrc/Domain/Shared/Core/Enum/SyncDirection.php    — NONE / MASTER_TO_ORIGIN / ORIGIN_TO_MASTER / BIDIRECTIONAL\nsrc/Domain/Shared/Core/ValueObject/SyncFlag.php  — VO immutable\nsrc/Application/Shared/Core/Factory/SyncFlagFactory.php — factory + payload/log builder\n```\n\n### `SyncStatus`\n\n```php\nuse App\\Domain\\Shared\\Core\\Enum\\SyncStatus;\n\nSyncStatus::SYNCED->dbValue();      // null\nSyncStatus::NOT_SYNCED->dbValue();  // 1\nSyncStatus::fromDbValue(null);      // SyncStatus::SYNCED\nSyncStatus::fromDbValue(7);         // BadRequestException (sync_flag.invalid_value)\n```\n\n### `SyncDirection`\n\n```php\nuse App\\Domain\\Shared\\Core\\Enum\\SyncDirection;\n\nSyncDirection::MASTER_TO_ORIGIN->value;  // 1\nSyncDirection::fromValue(9);             // BadRequestException (sync_flag.invalid_direction)\n```\n\n### `SyncFlag` (Value Object)\n\n```php\nuse App\\Domain\\Shared\\Core\\Enum\\SyncStatus;\nuse App\\Domain\\Shared\\Core\\ValueObject\\SyncFlag;\n\n// Direction auto-resolve bila tidak diberikan:\n//   sync_flag=null           -> SyncDirection::NONE\n//   sync_flag=1, no origin   -> SyncDirection::MASTER_TO_ORIGIN\n//   sync_flag=1, origin set  -> SyncDirection::ORIGIN_TO_MASTER\n$sync = SyncFlag::create(originId: null, status: SyncStatus::NOT_SYNCED);\n\n$sync = SyncFlag::masterToOrigin();     // broadcast ke semua origin\n$sync = SyncFlag::masterToOrigin(5);    // ke origin #5\n$sync = SyncFlag::originToMaster(5);    // origin #5 -> master\n$sync = SyncFlag::bidirectional(5);     // dua arah\n$sync = SyncFlag::synced();             // tidak perlu sync\n\n$sync = SyncFlag::fromArray($row);      // dari request/DB array\n$sync = SyncFlag::fromEntity($entity);  // dari entity (lihat kontrak di bawah)\n\n$sync->isPending();            // sync_flag = 1\n$sync->isSynced();             // sync_flag = null\n$sync->needsSyncToOrigin();    // pending && master->origin\n$sync->needsSyncToMaster();    // pending && origin->master\n$sync->markForSync();          // instance baru, sync_flag=1\n$sync->markSynced();           // instance baru, sync_flag=null\n$sync->withOriginId(5);        // instance baru, origin_id diganti (direction re-resolve)\n$sync->toArray();              // origin_id + sync_flag + direction\n$sync->toDbArray();            // origin_id + sync_flag saja\n```\n\n### `SyncFlagFactory`\n\n```php\nuse App\\Application\\Shared\\Core\\Factory\\SyncFlagFactory;\n\nfinal class ExampleApplicationService\n{\n    public function __construct(\n        private SyncFlagFactory $syncFlagFactory,\n    ) {}\n\n    public function create(CreateExampleCommand $command): void\n    {\n        // Boundary tetap int mentah — default sync_flag = 1\n        $sync = $this->syncFlagFactory->create(\n            originId: $command->originId,\n            syncFlag: $command->syncFlag ?? 1,\n        );\n\n        if ($this->syncFlagFactory->shouldPushToOrigin($sync)) {\n            // Payload queue: table, record_id, origin_id, direction,\n            // operation, payload, synced_at, created_at, created_by\n            $payload = $this->syncFlagFactory->buildMasterToOriginPayload(\n                storeIdDestination: $sync->getOriginId(),\n                table: 'example',\n                recordId: $id,\n                operation: 'INSERT',\n                data: $command->data,\n            );\n        }\n    }\n}\n```\n\n## Kontrak `fromEntity()`\n\nEntity yang ingin di-hydrate ke `SyncFlag` cukup expose getter berikut (semua opsional):\n\n| Method | Return | Keterangan |\n|--------|--------|------------|\n| `getOriginId()` | `?int` | id origin |\n| `getSyncFlagValue()` | `?int` | nilai db mentah (`null`/`1`) — **diprioritaskan** |\n| `getSyncFlag()` | `SyncFlag\\|?int` | alternatif bila `getSyncFlagValue` tidak ada |\n| `getSyncDirection()` | `SyncDirection\\|?int` | arah eksplisit |\n\n## Implementasi ke Tabel/Entity Baru\n\nReferensi lengkap ada di modul `another_example`. Langkahnya:\n\n**1. Migration**\n\n```php\n'origin_id' => $cb::integer()->null()->comment('origin instance id where the record comes from or goes to'),\n'sync_flag' => $cb::smallint()->null()->defaultValue(1)->comment('null: synced, 1: not synced'),\n```\n\n**2. Entity** — tambah properti `?SyncFlag` + accessor:\n\n```php\nprivate ?SyncFlag $syncFlag = null,   // di constructor, create(), reconstitute()\n\npublic function getSyncFlag(): ?SyncFlag       => $this->syncFlag;\npublic function getSyncFlagValue(): ?int       => $this->syncFlag?->getSyncFlag();\npublic function getOriginId(): ?int            => $this->syncFlag?->getOriginId();\npublic function setSyncFlag(SyncFlag $v): self { $this->syncFlag = $v; return $this; }\npublic function updateSyncFlag(?SyncFlag $v): void { $this->syncFlag = $v; }\n```\n\n**3. Repository** — persist & hydrate:\n\n```php\n// mapEntityToTable()\nSyncFlag::fieldOriginId() => $entity->getOriginId(),\nSyncFlag::fieldSyncFlag() => $entity->getSyncFlagValue(),\n\n// reconstitute dari row\nsyncFlag: SyncFlag::fromArray($row),\n\n// list(): tambah ke ->select() dan allowedColumns filterByExactMatch\nSyncFlag::fieldOriginId(),\nSyncFlag::fieldSyncFlag(),\n```\n\n**4. API** — tambah `origin_id`, `sync_flag` ke `ALLOWED_KEYS` di create action, map ke command, tambah rule di validator:\n\n```php\n// CREATE (opsional; kosong = default)\n'origin_id' => [new Integer(min: 1, skipOnEmpty: true)],\n'sync_flag' => [new Integer(skipOnEmpty: true), new In([1], skipOnEmpty: true)],\n\n// SEARCH (sebagai filter)\n'origin_id' => [new Integer(skipOnEmpty: true)],\n'sync_flag' => [new Integer(skipOnEmpty: true)],\n```\n\n**5. Service** — bangun via factory, oper ke `Entity::create(syncFlag: ...)`.\n\n**6. Response DTO** — expose `origin_id` + `sync_flag`.\n\n## Alur Sync Antar Store (via Cloud)\n\n```\nStore A ──(ORIGIN_TO_MASTER)──► Cloud ──(MASTER_TO_ORIGIN)──► Store B\n```\n\n1. **Store A** buat record tujuan B: `origin_id = B`, `sync_flag = 1` → push ke cloud.\n2. **Cloud** simpan apa adanya (`origin_id = B`, `sync_flag = 1` = pending untuk B).\n3. **Store B** pull: filter `origin_id = B AND sync_flag = 1` → apply lokal dengan `sync_flag = null`.\n4. **B ack ke cloud** → cloud set `sync_flag = null`.\n\n### Aturan penting\n\n- **`origin_id` ditulis ulang setiap hop** — artinya \"tujuan pengiriman berikutnya\". Saat B update dan push balik, `origin_id` harus diganti `A`. Kalau tidak, record akan terkirim balik ke B (**echo loop**).\n- **Applier selalu tulis `sync_flag = null`** secara eksplisit saat apply — kalau tidak, record hasil sync akan ter-flag `1` lagi dan ter-push balik.\n- **Ack oleh penerima**, bukan oleh cloud saat melayani pull — supaya data tidak hilang kalau penerima gagal apply setelah download.\n\n## Batasan & Pengembangan Lanjutan\n\nSkema sekarang cukup untuk **point-to-point A ↔ B**. Untuk kebutuhan lebih kompleks perlu tambahan:\n\n- **Broadcast / multi-hop** → tabel `sync_queue` (satu record → banyak baris antrian per tujuan) atau kolom `store_id_origin` + `store_id_destination`.\n- **Korelasi lintas store** (id lokal beda-beda: A=100, B=200, cloud=300) → `uuid` per record, atau registry `(store_id, table, local_id)` di cloud.\n- **Provenance/kepemilikan** → field `doc_role` (`LOCAL`/`INTERSTORE`/`COPY`): hanya `LOCAL` yang boleh di-edit user; copy bersifat read-only kecuali oleh sync applier; agregasi dedupe by `uuid`.\n\n## Referensi API\n\n### `SyncFlag` — `src/Domain/Shared/Core/ValueObject/SyncFlag.php`\n\nValue object untuk mengelola atribut `origin_id`, `sync_flag`, dan arah\nsinkronisasi.\n\n- `origin_id` : integer, id origin tempat record berasal atau dituju. Default `null`.\n- `sync_flag` : smallint, `null` = synced, `1` = not synced. Default `1`.\n\n**Factory method**\n\n- `SyncFlag::create(?int $originId = null, SyncStatus $status = SyncStatus::NOT_SYNCED, ?SyncDirection $direction = null)`\n- `SyncFlag::fromArray(array $data)`\n- `SyncFlag::fromEntity(object $entity)`\n- `SyncFlag::masterToOrigin(?int $originId = null)`\n- `SyncFlag::originToMaster(int $originId)`\n- `SyncFlag::bidirectional(int $originId)`\n- `SyncFlag::synced()`\n\n**Method baca & predikat**\n\n- `getOriginId()`, `getSyncStatus()`, `getSyncFlag()` (nilai db `null`/`1`), `getDirection()` (`SyncDirection`)\n- `isPending()`, `isSynced()`\n- `isMasterToOrigin()`, `isOriginToMaster()`, `isBidirectional()`\n- `needsSyncToOrigin()`, `needsSyncToMaster()`\n\n**Mutasi immutable**\n\n- `markForSync()` — tandai record harus disync (`sync_flag = 1`)\n- `markSynced()` — tandai record sudah selesai disync (`sync_flag = null`)\n- `withOriginId(?int $originId)` — ganti origin id\n- `withDirection(SyncDirection $direction)` — ganti arah\n\n**Serialisasi**\n\n- `toArray()` — output `origin_id`, `sync_flag`, `direction`\n- `toDbArray()` — output hanya `origin_id` dan `sync_flag`\n- `equals(SyncFlag $other)` — bandingkan dua value object\n\n### `SyncStatus` — `App\\Domain\\Shared\\Core\\Enum\\SyncStatus` (pure enum)\n\n- `SYNCED` — db value `null`\n- `NOT_SYNCED` — db value `1`\n- `dbValue()` / `fromDbValue(?int $value)` — konversi nilai kolom `sync_flag`; `fromDbValue` throw `BadRequestException` bila nilai tidak valid\n\n### `SyncDirection` — `App\\Domain\\Shared\\Core\\Enum\\SyncDirection` (backed int)\n\n- `NONE = 0`\n- `MASTER_TO_ORIGIN = 1`\n- `ORIGIN_TO_MASTER = 2`\n- `BIDIRECTIONAL = 3`\n- `SyncDirection::fromValue(int $value)` — throw `BadRequestException` bila nilai tidak valid\n\n### `SyncFlagFactory` — `src/Application/Shared/Core/Factory/SyncFlagFactory.php`\n\nFactory layer untuk membuat dan mengolah `SyncFlag` dari berbagai sumber, plus helper payload & log.\n\n**Factory dari input**\n\n- `create(?int $originId = null, ?int $syncFlag = 1, ?int $direction = null)`\n- `fromRequest(array $data)`\n- `fromRecord(array $row)`\n- `fromEntity(object $entity)`\n\n**Preset arah sinkronisasi**\n\n- `masterToOrigin(?int $originId = null)`\n- `originToMaster(int $originId)`\n- `bidirectional(int $originId)`\n- `synced()`\n\n**Status sync**\n\n- `markForSync(SyncFlag $syncFlag)`\n- `markSynced(SyncFlag $syncFlag)`\n\n**Predicate push**\n\n- `shouldPushToOrigin(SyncFlag $syncFlag)`\n- `shouldPushToMaster(SyncFlag $syncFlag)`\n\n**Helper payload & log**\n\n- `buildPayload(SyncFlag $syncFlag, string $table, int $recordId, string $operation, array $data = [])`\n- `buildMasterToOriginPayload(...)`\n- `buildOriginToMasterPayload(...)`\n- `mergeIntoDetailInfo(SyncFlag $syncFlag, array $detailInfo = [])`\n- `buildSyncLog(SyncFlag $syncFlag, string $table, int $recordId, string $operation)`\n\n### Integrasi Validator\n\nMessage key untuk validasi `sync_flag` (dipakai oleh\n`SyncStatus::fromDbValue()` dan `SyncDirection::fromValue()` saat\nmenerima nilai di luar rentang yang diizinkan):\n\n- `validation.sync_flag.invalid_value`\n- `validation.sync_flag.invalid_direction`\n", "23-system_service-token.md": "# System Module\n\n## Service Token — bearer auth untuk service eksternal\n\n`service_tokens` adalah alternatif JWT untuk integrasi machine-to-machine\n(POS, script internal, dsb). Perilakunya SSO-like: token yang diterbitkan\nlangsung bisa dipakai sebagai `Authorization: Bearer <token>` — request\notomatis berjalan atas nama user penerbit (permissions, audit, changelog\n`detail_info` semua melihat user tersebut).\n\n### Cara kerja\n\n1. `POST /v1/system/service-token/create` mengeluarkan secret acak\n   (64 hex chars). **Plaintext hanya ditampilkan sekali** di\n   `data.token` — yang disimpan di DB hanya `SHA-256(token)`.\n2. Request selanjutnya: `Authorization: Bearer <plaintext>`.\n   `ServiceTokenAuthMiddleware` — entry **terpisah** yang berjalan\n   *sebelum* `JwtMiddleware` — mendeteksi token opaque (bukan format\n   JWT `x.y.z`), melakukan lookup hash → jika ACTIVE dan belum\n   `expires_at`, request berlanjut dengan `Actor` milik penerbit,\n   `last_used_at` di-stamp, dan attribute `actor` diset agar\n   `JwtMiddleware` skip.\n3. Token JWT tetap diproses normal oleh `JwtMiddleware` (entry\n   terpisah, tidak diubah): bearer berbentuk JWT, token yang tidak\n   ditemukan, atau tanpa header jatuh ke validasi JWT seperti biasa.\n   **Opt-in**: fitur dikontrol `app.service_token.enabled` di `.env`\n   (default `false`) — saat off, `ServiceTokenAuthMiddleware` langsung\n   skip ke `JwtMiddleware` tanpa query DB sama sekali.\n4. **Revoke instan**: tidak ada caching lookup — `DELETE` atau update\n   `status` berlaku pada request berikutnya.\n5. **Fail-safe saat fitur belum terinstall**: kalau tabel\n   `service_tokens` belum ada (`migrate:module serviceToken` belum\n   dijalankan) atau DB error, `authenticate()` menangkap exception DB\n   dan return `null` → request fallback ke JWT. Tidak ada 500; endpoint\n   lain jalan normal. Hanya endpoint manajemen\n   `/v1/system/service-token/*` yang error — wajar, fiturnya memang\n   belum terinstall. Dan saat `app.service_token.enabled=false`,\n   middleware bahkan tidak menyentuh DB.\n\n### Penggunaan — pengganti SSO untuk sistem tanpa akun SSO\n\n**Masalahnya:** auth utama omnichannel pakai JWT dari SSO — artinya\nsetiap klien harus punya akun SSO dan lewat flow login (username +\npassword → token JWT). Sistem eksternal seperti POS kasir, script cron,\natau service pihak ketiga **tidak punya akun SSO** — mereka tidak bisa\nlogin sebagai user, hanya butuh \"kunci API\" yang berjalan atas nama\nsatu user internal.\n\n**Solusinya:** admin/user internal login sekali (SSO/JWT normal) lalu\nmenerbitkan service token lewat `POST /v1/system/service-token/create`.\nToken itu diserahkan ke sistem eksternal dan disimpan di config/env\nmereka — selamanya dipakai sebagai `Authorization: Bearer <token>`,\ntanpa login, tanpa refresh.\n\n```\nAdmin (SSO/JWT)                Omnichannel                    Sistem eksternal\n      │                              │                                │\n      │── POST /service-token/create │                                │\n      │   {name:\"POS Cabang A\"}│                                │\n      │◄─────────── data.token ──────│                                │\n      │        (plaintext, sekali)   │                                │\n      │                              │                                │\n      │────── serahkan token ────────┼───────────────────────────────►│\n      │                              │                                │\n      │                              │◄── GET /v1/report/... ─────────│\n      │                              │     Authorization: Bearer xyz   │\n      │                              │     → jalan sebagai user admin  │\n      │                              │── response ────────────────────►│\n```\n\n**Perbandingan dengan SSO/JWT:**\n\n| | SSO / JWT | Service Token |\n|---|---|---|\n| Siapa pakai | Manusia (login UI/SSO) | Sistem/script eksternal |\n| Perlu akun SSO | Ya | Tidak — cukup token |\n| Login flow | Username + password → JWT | Tidak ada — bearer langsung |\n| Expiry | Pendek (perlu refresh/login ulang) | `expires_at` opsional, bisa permanen |\n| Identitas request | User yg login | User penerbit token (`user_id`/`username`) |\n| Revoke | Tunggu JWT expired | Instan — soft delete row |\n| Rotasi | Login ulang | `PUT {id}` + `regenerate: true` |\n\n**Contoh pemakaian di sisi eksternal:**\n\n```bash\n# POS / script cukup simpan satu env var:\nOMNI_TOKEN=c9f2...<64 hex>\n\n# lalu semua request pakai header yang sama, tanpa login:\ncurl -H \"Authorization: Bearer $OMNI_TOKEN\" \\\n     \"{{url}}/v1/report/inventory/headquarter\"\n```\n\n```php\n// PHP client\n$client = new GuzzleHttp\\Client([\n    'base_uri' => 'https://omnichannel.example.com',\n    'headers'  => ['Authorization' => 'Bearer ' . $_ENV['OMNI_TOKEN']],\n]);\n$client->get('/v1/report/sales/headquarter');\n```\n\n**Lifecycle rekomendasi:**\n\n- Satu token per sistem/instalasi (`username` = identitasnya, unique) —\n  jangan dipakai bersama supaya `last_used_at` dan audit tetap bermakna.\n- Rotasi berkala lewat `regenerate` (bearer lama mati saat itu juga —\n  update config eksternal dengan `data.token` baru).\n- Kalau sistem dilepas/dicurigai bocor: `DELETE {id}` — efek langsung,\n  tanpa menunggu expiry.\n- Terbitkan token hanya dari akun dengan scope wewenang yang memang\n  dibutuhkan sistem eksternal — token mewarisi identitas penuh\n  penerbitnya.\n\n### Tabel `service_tokens`\n\n| Kolom | Tipe | Keterangan |\n|---|---|---|\n| `id` | int PK | |\n| `user_id` | int | ID user internal penerbit (diisi dari actor saat create) |\n| `username` | varchar(100), **unique** | Identitas service — dikirim saat create (bukan username penerbit). Unique di semua row termasuk deleted |\n| `name` | varchar(100) | Nama layanan, mis. `POS Kasir Cabang A` |\n| `token` | varchar(500), unique | **SHA-256 hash**, bukan plaintext |\n| `abilities` | text (JSON) | Scope izin, mis. `[\"read:products\"]` — disimpan untuk pemakaian authorization lanjutan |\n| `whitelist_host` | json | Host/IP caller yang boleh pakai token. `[]` (default) = allow all. Entry: `10.0.0.5`, `192.168.1.*`, `*.pos.local`, `*` |\n| `last_used_at` | datetime NULL | Di-stamp tiap auth sukses |\n| `expires_at` | datetime NULL | NULL = tidak pernah kadaluarsa |\n| `status` | int | `1` active, `2` deleted (soft delete) |\n| `detail_info` | json | Changelog standar (created/updated/deleted by/at) |\n| `created_at` | datetime | |\n\n### Endpoints — `/v1/system/service-token`\n\n| Method | Path | Permission | Keterangan |\n|---|---|---|---|\n| POST | `/data` | `system.service-token.list` | List + pagination |\n| GET | `/{id}` | `system.service-token.view` | Detail satu token |\n| POST | `/create` | `system.service-token.create` | Issue token baru |\n| PUT | `/{id}` | `system.service-token.update` | Update + rotate |\n| DELETE | `/{id}` | `system.service-token.delete` | Revoke (soft delete) |\n\n#### `POST /create`\n\n```json\n{\n  \"username\": \"pos_cabang_a\",\n  \"name\": \"Aplikasi Kasir Cabang A\",\n  \"abilities\": [\"read:products\", \"write:transactions\"],\n  \"whitelist_host\": [\"103.10.20.30\", \"192.168.1.*\"],\n  \"expires_at\": \"2026-12-31 23:59:59\"\n}\n```\n\n- `whitelist_host` opsional, default `[]` = allow all. Kalau diisi,\n  bearer hanya bisa dipakai dari host/IP yang cocok (exact, `*` =\n  semua, atau wildcard prefix/suffix seperti `192.168.1.*` /\n  `*.pos.local`). Host client dideteksi dari `X-Forwarded-For` (hop\n  pertama) atau `REMOTE_ADDR`; kalau host tidak terdeteksi dan\n  whitelist non-empty → token ditolak (fail closed).\n- `username` **wajib dan unique** — ini identitas service (bukan username\n  penerbit). Duplikat → 409 `service_token.duplicate`. Berlaku di semua\n  row termasuk yang deleted, jadi nama yang sama tidak bisa dibuat ulang —\n  re-activate lewat `PUT {id}` + `status: 1` (atau `status: 0` inactive).\n- `name` wajib (max 100). `abilities` opsional — array string atau\n  JSON/CSV. `expires_at` opsional (`Y-m-d` atau `Y-m-d H:i[:s]`).\n- `user_id` **tidak** dikirim — diisi dari actor yang login (penerbit).\n\nResponse (satu-satunya saat plaintext terlihat):\n\n```json\n{\n  \"data\": {\n    \"id\": 3,\n    \"user_id\": 101,\n    \"username\": \"budi_santoso\",\n    \"name\": \"Aplikasi Kasir Cabang A\",\n    \"token\": \"c9f2...<64 hex>\",\n    \"abilities\": [\"read:products\", \"write:transactions\"],\n    \"expires_at\": \"2026-12-31 23:59:59\"\n  }\n}\n```\n\nSimpan `data.token` — tidak bisa diambil lagi. Kalau hilang: `PUT` dengan\n`regenerate: true` (rotasi) atau buat token baru.\n\n#### `POST /data`\n\n```json\n{\n  \"filter\": { \"username\": \"budi\", \"status\": 1 },\n  \"page\": 1, \"page_size\": 20,\n  \"sort\": { \"by\": \"id\", \"dir\": \"asc\" }\n}\n```\n\n`filter` exact: `id`, `user_id`, `status`; LIKE: `username`, `name`.\nSortable: `id`, `user_id`, `username`, `name`, `last_used_at`,\n`expires_at`, `created_at`, `status`. Hash tidak pernah muncul di\nlist/view.\n\n#### `PUT /{id}`\n\n```json\n{ \"username\": \"...\", \"name\": \"...\", \"abilities\": [...], \"expires_at\": \"...\", \"regenerate\": true, \"status\": 1 }\n```\n\n- `username` bisa di-rename — tetap unique (duplikat → 409).\n- `regenerate: true` me-rotate secret — bearer lama langsung mati,\n  plaintext baru dikembalikan sekali di `data.token`.\n- `status`: `1` active (re-activate), `0` inactive, `4` deleted.\n- `expires_at` kosong tidak meng-clear expiry (field kosong = tidak\n  berubah); untuk menghapus expiry, hapus & buat ulang token.\n\n### Security notes\n\n- Lookup pakai SHA-256 — kebocoran DB tidak membocorkan secret (asumsi\n  entropy 256-bit, tidak perlu bcrypt/argon).\n- Token opaque (bukan JWT) → middleware tahu harus lookup DB, bukan\n  decode JWT.\n- `abilities` saat ini metadata saja — belum dienforce per-scope;\n  token berperilaku penuh sebagai user penerbit. Batasi penerbitan ke\n  user yang memang boleh di-impersonate.\n- Tabel `service_tokens` belum dimigrasi / DB error saat lookup →\n  auth fallback ke JWT (bukan 500). Endpoint `/v1/system/service-token/*`\n  sendiri tetap error karena tabelnya memang belum ada — jalankan\n  `migrate:module serviceToken` untuk mengaktifkan fitur.\n- Aktivasi: `app.service_token.enabled=true` di `.env` (default\n  `false` → middleware skip langsung ke JWT).\n", "24-skeleton-guide.md": "# Complete Shared Classes Installation\n\n## Quick Start\n\nAfter creating a project from this boilerplate, run:\n\n```bash\ncomposer skeleton:update\ncomposer skeleton:copy-examples\n```\n\n## What it does\n\n### `composer skeleton:update`\n1. **Copy Shared classes** - Copy all Shared infrastructure from vendor to project\n2. **Copy Infrastructure classes** - Copy Infrastructure components from vendor to project\n3. **Copy Domain Shared classes** - Copy Domain Shared components from vendor to project\n4. **Copy Application Shared classes** - Copy Application Shared components from vendor to project\n5. **Copy API Shared classes** - Copy API Shared components from vendor to project\n6. **Copy Config files** - Copy configuration files from vendor to project\n7. **Copy Message files** - Copy translation files from vendor to project\n8. **Copy API files** - Copy API core files from vendor to project\n9. **Update composer.json** - Add required packages for Yii3 API functionality\n10. **Create directories** - Set up complete directory structure for all layers\n\n### `composer skeleton:version`\n1. **Compare versions** - Compare the project's `scripts/skeleton.version` with the version shipped by the package in vendor/\n2. **Report status** - Shows whether the project is up to date or an update is available (`X → Y`), with a hint to run `composer skeleton:update`\n\n### `composer skeleton:copy-examples`\n1. **Copy example files** - Copy example configuration and code files\n2. **Setup environment** - Create .env from .env.example\n3. **Copy example entities** - Copy Example entity across all layers\n4. **Copy migrations** - Copy example database migrations\n5. **Create flag file** - Prevent re-copying unless forced\n\n## Directory Structure\n\nThe script creates the following structure:\n\n### Shared Classes (`src/Shared/`)\n```\nsrc/Shared/\n├── Common/        # Common shared helpers\n└── Core/\n    ├── Dto/           # Data Transfer Objects\n    ├── Enums/         # Enumerations  \n    ├── ErrorHandler/  # Error handling utilities\n    ├── Exception/     # Custom exceptions\n    ├── Middleware/    # HTTP middleware\n    ├── Query/         # Query builders and utilities\n    ├── Repository/    # Repository base classes\n    ├── Request/       # Request handling classes\n    ├── Security/      # Security utilities\n    ├── Utility/       # General utilities\n    ├── Validation/    # Validation classes\n    └── ValueObject/   # Value objects\n```\n\n### Infrastructure Classes (`src/Infrastructure/`)\n```\nsrc/Infrastructure/\n├── Core/          # Core infrastructure\n│   ├── Audit/         # Audit logging components\n│   ├── Clock/         # Time/clock utilities\n│   ├── Concerns/      # Infrastructure traits\n│   ├── Database/      # Database implementations\n│   ├── Monitoring/    # Monitoring and logging\n│   ├── RateLimit/     # Rate limiting components\n│   ├── Security/      # Security infrastructure\n│   ├── Seeder/        # Seeder base classes\n│   └── Time/          # Time management\n└── Common/        # Common infrastructure\n    └── Persistence/   # Database persistence (empty directory)\n```\n\n### Domain Shared Classes (`src/Domain/Shared/`)\n```\nsrc/Domain/Shared/\n├── Core/          # Core domain shared components\n│   ├── Audit/         # Domain audit components\n│   ├── Concerns/      # Domain traits\n│   ├── Contract/      # Domain contracts and interfaces\n│   ├── Security/      # Domain security components\n│   └── ValueObject/   # Domain value objects\n└── Common/        # Common domain shared helpers\n```\n\n### Application Shared Classes (`src/Application/Shared/`)\n```\nsrc/Application/Shared/\n├── Core/\n│   └── Factory/       # Application factory classes\n└── Common/        # Common application shared helpers\n```\n\n### API Files (`src/`)\n```\nsrc/\n├── bootstrap.php                  # Bootstrap: loads vendor autoload + .env\n├── Api/                          # API layer\n│   ├── IndexAction.php           # API index action\n│   └── Shared/                   # API shared components\n│       ├── Presenter/            # API response presenters\n│       │   ├── FailPresenter.php\n│       │   ├── SuccessPresenter.php\n│       │   └── SuccessWithMetaPresenter.php\n│       ├── ExceptionResponderFactory.php  # Exception response factory\n│       └── ResponseFactory.php    # HTTP response factory\n└── Api/V1/                       # API version 1\n    ├── Example/                   # Example API endpoints\n    │   ├── Action/                # API actions\n    │   ├── Validation/            # API validation\n    │   └── ...\n    └── System/                    # System module endpoints\n        └── Token/                 # Service Token (opaque bearer, JWT alternative)\n            ├── Action/\n            └── Validation/\n```\n\n### Example Entity Structure\n```\nsrc/\n├── Api/V1/Example/              # Example API endpoints\n├── Application/Example/          # Example application services\n├── Domain/Example/              # Example domain entities\n└── Infrastructure/Common/Persistence/Example/  # Example repositories\n```\n\n### System — Service Token & Cache Structure\n```\nsrc/\n├── Api/V1/System/ServiceToken/   # Service Token endpoints (/v1/system/service-token/*)\n├── Api/V1/System/Cache/          # Cache purge endpoint (/v1/system/cache/purge)\n├── Application/System/ServiceToken/  # Issue/rotate/revoke + authenticate()\n├── Application/System/Cache/     # CacheApplicationService — purgeAll()\n├── Domain/System/ServiceToken/   # ServiceToken entity + repository contract\n├── Infrastructure/Common/Persistence/System/  # ServiceTokenRepository\n├── Migration/ServiceToken/       # service_tokens table (migrate:module serviceToken)\n└── Presentation/Core/Http/Middleware/ServiceTokenAuthMiddleware.php  # Bearer dispatcher\n```\n\n### Config Files (`config/`)\n```\nconfig/\n├── common/                        # Common configurations\n│   ├── middleware.php             # Middleware configuration\n│   └── di/                      # Dependency injection\n│       ├── access-di.php         # Access control DI\n│       ├── audit.php             # Audit configuration\n│       ├── db-pgsql.php          # PostgreSQL database DI\n│       ├── json.php              # JSON handler DI\n│       ├── jwt.php               # JWT configuration\n│       ├── middleware.php        # Middleware DI\n│       ├── monitoring.php        # Monitoring configuration\n│       └── security.php          # Security configuration\n└── web/                          # Web configurations\n    └── di/                      # Web dependency injection\n        └── application.php      # Web application DI\n```\n\n### Message Files (`resources/messages/`)\n```\nresources/messages/\n├── en/                           # English translations\n│   ├── error.php                 # Error messages\n│   ├── success.php               # Success messages\n│   └── validation.php           # Validation messages\n└── id/                           # Indonesian translations\n    ├── error.php                 # Error messages\n    ├── success.php               # Success messages\n    └── validation.php           # Validation messages\n```\n\n## Environment Configuration\n\nThe monitoring middlewares (`RequestIdMiddleware`, `StructuredLoggingMiddleware`,\n`MetricsMiddleware`, `ErrorMonitoringMiddleware`) can be overridden from `.env`.\nAll keys are optional — `config/common/params-core.php` provides the defaults\nshown below.\n\n| Key | Default | Description |\n| --- | --- | --- |\n| `app.monitoring.request_id_header` | `X-Request-Id` | Header name carrying the request ID |\n| `app.monitoring.logging.enabled` | `true` | Enable/disable structured request/response logging |\n| `app.monitoring.logging.log_level` | `warning` | Minimum level yang dicatat: `debug`, `info`, `warning`, `error` |\n| `app.monitoring.logging.include_request_body` | `false` | Include the sanitized request body in logs (passwords/tokens are redacted) |\n| `app.monitoring.logging.include_response_body` | `false` | Include the response body in logs |\n| `app.monitoring.logging.max_log_size` | `10000` | Max characters per logged value before truncation |\n| `app.monitoring.logging.exclude_paths` | `[\"/health\",\"/metrics\"]` | JSON array of path prefixes excluded from logging |\n| `app.monitoring.metrics.enabled` | `true` | Enable/disable request metrics collection |\n| `app.monitoring.error_monitoring.enabled` | `true` | Enable/disable error & exception capture |\n\nNote: the level of each log entry is derived automatically from the HTTP status\ncode (`>=500` → error, `>=400` → warning, otherwise info); `log_level` then\nfilters out entries below the configured minimum.\n\n`DatabaseCache` (`App\\Infrastructure\\Core\\Cache\\DatabaseCache`) dikontrol lewat\nkey `app.cache.*` — semua opsional, default dari `config/common/params-core.php`:\n\n| Key | Default | Description |\n| --- | --- | --- |\n| `app.cache.enabled` | `true` | `false` → semua operasi cache pass-through |\n| `app.cache.driver` | `auto` | `auto` \\| `redis` \\| `file` \\| `psr` |\n| `app.cache.default_ttl` | `3600` | TTL default (detik) |\n| `app.cache.key_prefix` | `app` | Prefix semua cache key |\n| `redis.default.enabled` | `false` | Nyalakan agar `driver=auto` memilih RedisCache |\n| `redis.default.host` | `127.0.0.1` | Host Redis (client Predis) |\n| `redis.default.port` | `6379` | Port Redis |\n| `redis.default.db` | `0` | Logical database index |\n| `redis.default.password` | — | Password Redis (opsional) |\n\n## Manual Setup\n\nIf you prefer to set up manually:\n\n1. Copy Shared classes from vendor:\n   ```bash\n   cp -r vendor/rahmatsyaparudin/yii3-api-boilerplate/src/Shared src/\n   ```\n\n2. Copy Infrastructure classes from vendor:\n   ```bash\n   cp -r vendor/rahmatsyaparudin/yii3-api-boilerplate/src/Infrastructure src/\n   ```\n\n3. Copy Domain Shared classes from vendor:\n   ```bash\n   cp -r vendor/rahmatsyaparudin/yii3-api-boilerplate/src/Domain/Shared src/Domain/\n   ```\n\n4. Copy Application Shared classes from vendor:\n   ```bash\n   cp -r vendor/rahmatsyaparudin/yii3-api-boilerplate/src/Application/Shared src/Application/\n   ```\n\n5. Copy API Shared classes from vendor:\n   ```bash\n   cp -r vendor/rahmatsyaparudin/yii3-api-boilerplate/src/Api/Shared src/Api/\n   ```\n\n6. Copy API files from vendor:\n   ```bash\n   cp vendor/rahmatsyaparudin/yii3-api-boilerplate/src/bootstrap.php src/\n   cp vendor/rahmatsyaparudin/yii3-api-boilerplate/src/Api/IndexAction.php src/Api/\n   ```\n\n7. Copy Config files from vendor:\n   ```bash\n   cp vendor/rahmatsyaparudin/yii3-api-boilerplate/config/common/middleware.php config/common/\n   cp -r vendor/rahmatsyaparudin/yii3-api-boilerplate/config/common/di config/common/di/\n   cp vendor/rahmatsyaparudin/yii3-api-boilerplate/config/web/di/application.php config/web/di/\n   ```\n\n8. Copy Message files from vendor:\n   ```bash\n   cp -r vendor/rahmatsyaparudin/yii3-api-boilerplate/resources/messages resources/\n   ```\n\n9. Copy Example files from vendor:\n   ```bash\n   cp vendor/rahmatsyaparudin/yii3-api-boilerplate/.env.example .env\n   cp vendor/rahmatsyaparudin/yii3-api-boilerplate/resources/messages/en/app.php resources/messages/en/\n   cp vendor/rahmatsyaparudin/yii3-api-boilerplate/resources/messages/id/app.php resources/messages/id/\n   cp vendor/rahmatsyaparudin/yii3-api-boilerplate/config/common/access.php config/common/\n   cp vendor/rahmatsyaparudin/yii3-api-boilerplate/config/common/params.php config/common/\n   cp vendor/rahmatsyaparudin/yii3-api-boilerplate/config/common/routes.php config/common/\n   cp vendor/rahmatsyaparudin/yii3-api-boilerplate/config/common/redis.php config/common/\n   cp vendor/rahmatsyaparudin/yii3-api-boilerplate/config/common/infrastructure.php config/common/\n   cp -r vendor/rahmatsyaparudin/yii3-api-boilerplate/config/common/di/repository.php config/common/di/\n   cp -r vendor/rahmatsyaparudin/yii3-api-boilerplate/config/common/di/service.php config/common/di/\n   cp -r vendor/rahmatsyaparudin/yii3-api-boilerplate/config/common/di/translator.php config/common/di/\n   cp -r vendor/rahmatsyaparudin/yii3-api-boilerplate/src/Api/V1/Example src/Api/V1/\n   cp -r vendor/rahmatsyaparudin/yii3-api-boilerplate/src/Application/Example src/Application/\n   cp -r vendor/rahmatsyaparudin/yii3-api-boilerplate/src/Domain/Example src/Domain/\n   cp -r vendor/rahmatsyaparudin/yii3-api-boilerplate/src/Infrastructure/Common/Persistence/Example src/Infrastructure/Common/Persistence/\n   cp -r vendor/rahmatsyaparudin/yii3-api-boilerplate/src/Migration src/\n   ```\n\n10. Create required directories:\n    ```bash\n    mkdir -p src/Shared/Core/{Dto,Enums,ErrorHandler,Exception,Middleware,Query,Repository,Request,Security,Utility,Validation,ValueObject}\n    mkdir -p src/Shared/Common/Context\n    mkdir -p src/Infrastructure/Core/{Audit,Clock,Concerns,Database,Monitoring,RateLimit,Security,Seeder,Time}\n    mkdir -p src/Infrastructure/Common/Persistence\n    mkdir -p src/Domain/Shared/Core/{Audit,Concerns,Contract,Security,ValueObject}\n    mkdir -p src/Domain/Shared/Common\n    mkdir -p src/Application/Shared/Core/Factory\n    mkdir -p src/Application/Shared/Common\n    mkdir -p src/Api/Shared/Presenter\n    mkdir -p config/common/di\n    mkdir -p config/web/di\n    mkdir -p resources/messages/{en,id}\n    ```\n\n## Available Commands\n\nAfter installation:\n\n```bash\n# Start development server\ncomposer run serve\n\n# Run migrations\ncomposer run migrate\n\n# Generate CRUD for entities\nphp yii simple-generate crud Product\n\n# Generate complete project from template\nphp yii template:generate my-api /tmp\n\n# Copy example files (if not already copied)\ncomposer skeleton:copy-examples\n\n# Force re-copy examples (remove flag file first)\nrm .skeleton_examples_copied && composer skeleton:copy-examples\n```\n\n## Next Steps\n\nAfter installing all Shared classes, Config files, Message files, and Examples:\n\n1. Install required packages:\n   ```bash\n   composer update\n   ```\n\n2. Configure your `.env` file with your database settings\n\n3. Run database migrations:\n   ```bash\n   php yii migrate\n   ```\n\n4. Start development with:\n   ```bash\n   php yii serve\n   ```\n\nYour project now has complete Shared infrastructure, example entities, and all required packages ready for development!\n\n## Workflow Summary\n\n```bash\n# 1. Create project from boilerplate\ncomposer create-project rahmatsyaparudin/yii3-api-boilerplate my-api\ncd my-api\n\n# 2. Install shared infrastructure\ncomposer skeleton:update\n\n# 3. Copy example files and entities\ncomposer skeleton:copy-examples\n\n# 4. Install required packages\ncomposer update\n\n# 5. Setup and run\nphp yii migrate\nphp yii serve\n```\n\nThis gives you a complete Yii3 API project with:\n- ✅ Shared infrastructure across all layers\n- ✅ Example entity implementation (Example CRUD)\n- ✅ Service Token module (opaque bearer auth for external services)\n- ✅ Complete configuration files\n- ✅ Translation files\n- ✅ Database migrations\n- ✅ All required Yii3 packages\n- ✅ Ready-to-run API endpoints\n", "25-new-module-guide.md": "# Checklist Setelah Membuat Module Baru\n\nGuide ini merangkum apa yang sudah otomatis dibuat oleh `skeleton-generate-module` dan langkah-langkah manual yang masih harus dilakukan sampai modul baru benar-benar siap dipakai.\n\n## 1. Generate Modul\n\n```bash\n# via composer script\ncomposer skeleton:generate-module -- --module=Product --table=product_management\n\n# atau langsung\nphp scripts/skeleton-generate-module.php --module=Product --table=product_management\n\n# migrasi di koneksi non-default (blok env db.<nama>.*)\nphp scripts/skeleton-generate-module.php --module=AuditLog --db=audit\n```\n\n## 2. Yang Sudah Otomatis\n\nGenerator membuat file dan mengupdate konfigurasi berikut — tidak perlu disentuh manual:\n\n| Item | Lokasi |\n|---|---|\n| Action + InputValidator | `src/Api/V1/<Module>/` |\n| Application service, Command, DTO | `src/Application/<Module>/` |\n| Entity, repository interface, domain service | `src/Domain/<Module>/` |\n| Implementasi repository | `src/Infrastructure/Common/Persistence/<Module>/` |\n| File migrasi | `src/Migration/<Module>/` |\n| Seeder + fixture | `src/Seeder/` |\n| Route `/v1/<module>/*` | `config/common/routes.php` |\n| Permission `<module>.*` | `config/common/access.php` |\n| Binding repository | `config/common/repository.php` |\n| Mapping migrasi | `config/common/migration.php` (`moduleConnections`) |\n| DI seeder | `config/common/di/seed.php` |\n\n## 3. Checklist Manual\n\nUrut dari yang wajib sampai opsional.\n\n### 3.1 Sesuaikan migrasi SEBELUM dijalankan\n\nFile migrasi di `src/Migration/<Module>/` masih menyalin kolom dari modul Example (`name`, `status`, `detail_info`, `sync_mdb`, `lock_version`, `deleted_at`, dst.). Edit kolom, tipe data, index, dan foreign key sesuai kebutuhan bisnis **sebelum** migrasi dijalankan:\n\n```bash\n./yii migrate:module <module>\n```\n\n> Tanpa mapping di `moduleConnections` command akan gagal — generator sudah mendaftarkannya otomatis (default koneksi `default`, atau nilai `--db`).\n\n### 3.2 Sesuaikan aturan validasi\n\n`src/Api/V1/<Module>/Validation/<Module>InputValidator.php` masih memakai aturan contoh (`name` required + unique, `status` in enum, `lock_version` saat update). Sesuaikan per `ValidationContext` (`CREATE`, `UPDATE`, `DELETE`, `RESTORE`) dengan field modulmu.\n\n### 3.3 Review permission di `config/common/access.php`\n\nRule yang di-generate menyalin closure role milik Example (`$isKasir`, `$isSuperAdmin`, dst.). Sesuaikan siapa yang boleh mengakses tiap permission `<module>.index/.view/.data/.create/.update/.delete/.restore`.\n\n### 3.4 Sesuaikan entity & business logic\n\n- `src/Domain/<Module>/Entity/<Module>.php` — tambah/ubah field domain, factory method `create()`, guard status awal.\n- `src/Domain/<Module>/Service/<Module>DomainService.php` — business rule (unique check, dependency check, dst.).\n- `src/Application/<Module>/` — Command dan `Dto/<Module>Response.php` agar field request/response sesuai.\n\n### 3.5 detail_info (opsional)\n\nKalau modul butuh struktur `detail_info` khusus (misal embed data parent seperti AnotherExample), buat factory custom sendiri — lihat `AnotherExampleDetailInfoFactory` sebagai referensi. Kalau cukup `DetailInfo` generik, tidak ada yang perlu diubah.\n\n### 3.6 Sesuaikan seeder (opsional, dev only)\n\nEdit `src/Seeder/Fixtures/<module>.yaml` agar field fixture cocok dengan entity, lalu:\n\n```bash\n./yii seed --module=<module>          # hanya jalan saat APP_ENV=dev\n```\n\n### 3.7 Tambah translation key (opsional)\n\nPesan error/success custom modul masuk ke `resources/messages/{en,id}/app.php` (file project — tidak pernah ditimpa `skeleton:update`). Jangan taruh di `error.php`/`success.php`/`validation.php` karena itu milik skeleton.\n\n### 3.8 Optimistic lock (opsional)\n\nEntity hasil generate sudah membawa `LockVersion`. Kalau modul ini tidak butuh optimistic locking, tambahkan nama validatornya:\n\n```bash\napp.optimistic_lock.disabled.values=[\"<module>\"]\n```\n\n### 3.9 Public path (opsional)\n\nEndpoint hasil generate dilindungi JWT secara default. Kalau ada endpoint yang harus publik, tambahkan path-nya ke `app.jwt.publicPaths` di `.env`.\n\n### 3.10 Test\n\nTambahkan test minimal:\n\n- `tests/Unit/` — entity/domain service\n- `tests/Api/` — endpoint create/list/view/update/delete\n\n### 3.11 Postman collection\n\nTambahkan request modul ke `docs-guide/Yii3-API.postman_collection.json` beserta deskripsinya, agar ikut tampil di viewer dokumentasi.\n\n## 4. Verifikasi\n\n```bash\n# lint file yang berubah\nphp -l src/Api/V1/<Module>/Action/<Module>CreateAction.php\n\n# quality check\nphp quality quality:check\n\n# smoke test endpoint\ncurl -X POST http://localhost:8080/v1/<module>/create \\\n  -H \"Content-Type: application/json\" \\\n  -H \"Authorization: Bearer <token>\" \\\n  -d '{\"name\": \"Test\", \"status\": 1}'\n```\n", "26-system-cache.md": "# System Module\n\n## Cache Purge — clear semua cache yang tergenerate\n\n`POST /v1/system/cache/purge` membersihkan semua store cache yang mungkin\nterisi oleh aplikasi, dalam satu request. Berguna setelah deploy, saat\nmengubah konfigurasi/schema DB, atau untuk memastikan tidak ada data\nstale — tanpa perlu menghapus `runtime/cache` manual atau me-restart\nserver.\n\n### Store yang dibersihkan\n\nSetiap store dicoba secara independen — satu kegagalan tidak menghentikan\nyang lain — dan hasilnya dilaporkan per store di `data.results`.\n\n| Key | Store | Keterangan |\n|---|---|---|\n| `psr_cache` | `Psr\\SimpleCache\\CacheInterface` | Binding PSR-16 project — default `ArrayCache`; bila project rebind ke FileCache/RedisCache, itulah yang di-clear. |\n| `yii_cache` | `Yiisoft\\Cache\\CacheInterface` | Wrapper `getOrSet` — store PSR di baliknya di-clear (umumnya store yang sama dengan `psr_cache`, dilaporkan terpisah untuk project yang mem-bind `Cache` ke handler berbeda). |\n| `file_cache` | `FileCache` | Isi `@runtime/cache` — **termasuk DB schema cache** (`SchemaCache` membungkus FileCache). |\n| `redis` | `RedisService` | `flushDB` pada logical database yang dikonfigurasi (`redis.default.*`). Di-skip bila `redis.default.enabled=false` atau Redis tidak terjangkau. |\n| `database_cache` | `DatabaseCache` | Store cache data DB (`@runtime/cache/db` default; `RedisCache` bila `app.cache.driver` resolve ke redis). Di-skip bila `app.cache.enabled=false`. |\n| `opcache` | Zend OPcache | `opcache_reset()` — di-skip bila extension tidak ter-load atau disabled. |\n| `stat_cache` | realpath/stat | `clearstatcache(true)` — selalu dijalankan. |\n\nStatus per store:\n\n- `purged` — berhasil dibersihkan.\n- `skipped` — store tidak terpasang/disabled (bukan error); alasan di `detail`.\n- `failed` — exception saat purge; pesan error di `detail`. Endpoint\n  tetap return 200 — periksa `detail` untuk store yang gagal.\n\n### Endpoint\n\n| Method | Path | Permission | Keterangan |\n|---|---|---|---|\n| POST | `/v1/system/cache/purge` | `system.cache.purge` | Purge semua store cache |\n\nTidak ada request body.\n\nResponse:\n\n```json\n{\n  \"success\": true,\n  \"message\": \"Cache has been cleared successfully\",\n  \"data\": {\n    \"results\": {\n      \"psr_cache\":  { \"status\": \"purged\",  \"detail\": null },\n      \"yii_cache\":  { \"status\": \"purged\",  \"detail\": null },\n      \"file_cache\": { \"status\": \"purged\",  \"detail\": null },\n      \"redis\":      { \"status\": \"skipped\", \"detail\": \"redis disabled or unreachable\" },\n      \"opcache\":    { \"status\": \"skipped\", \"detail\": \"Zend OPcache extension not loaded\" },\n      \"stat_cache\": { \"status\": \"purged\",  \"detail\": null }\n    },\n    \"duration_ms\": 1\n  }\n}\n```\n\n### Catatan\n\n- **`flushDB` Redis membersihkan seluruh logical database** yang dipakai\n  `RedisService` (`redis.default.db`) — termasuk key non-cache bila ada\n  yang menaruh data lain di database yang sama. Pisahkan database Redis\n  untuk keperluan lain bila ingin purge terbatas pada cache.\n- Endpoint tetap di balik JWT/service token + permission\n  `system.cache.purge` — pertimbangkan membatasinya ke admin di\n  `config/common/access.php` untuk production.\n- Tidak ada cache HTTP/response yang di-clear (app tidak memakai\n  response cache); `rate_limits` disimpan di tabel DB, bukan cache, dan\n  sengaja tidak disentuh.\n\n### Struktur kode\n\n```\nsrc/\n├── Api/V1/System/Cache/Action/CachePurgeAction.php     # POST /v1/system/cache/purge\n└── Application/System/Cache/CacheApplicationService.php # purgeAll() per-store + report\n```\n\nTidak ada layer Domain — operasi ini murni orkestrasi infrastructure,\ntidak punya entity/business state. Untuk cache data aplikasi (bukan\npurge), lihat `DatabaseCache` di `docs-guide/27-database-cache.md`.\n", "27-database-cache.md": "# DatabaseCache\n\n## Managed cache untuk data yang dibaca dari database\n\n`App\\Infrastructure\\Core\\Cache\\DatabaseCache` adalah Core component\n(ikut `skeleton:update`) untuk me-manage cache hasil baca database —\ngenerate, renew, refresh, invalidate — tanpa perlu wiring apa pun di\nproject consumer. Cukup inject dan atur lewat `.env`.\n\n### Cara pakai\n\n```php\nuse App\\Infrastructure\\Core\\Cache\\DatabaseCache;\n\nfinal class ProductApplicationService\n{\n    public function __construct(\n        private ProductRepositoryInterface $repository,\n        private DatabaseCache $cache,\n    ) {\n    }\n\n    public function view(int $id): array\n    {\n        // Cache hit → skip query; miss → jalankan callback lalu simpan.\n        return $this->cache->remember(\n            key: \"product:{$id}\",\n            callback: fn () => $this->repository->findById($id)?->toArray(),\n            ttl: 600,\n        );\n    }\n\n    public function update(int $id, array $input): void\n    {\n        // ... update repository ...\n\n        // Invalidate — request berikutnya membaca ulang dari DB.\n        $this->cache->forget(key: \"product:{$id}\");\n\n        // Atau langsung regenerate sekarang.\n        $this->cache->refresh(\n            key: \"product:{$id}\",\n            callback: fn () => $this->repository->findById($id)?->toArray(),\n        );\n    }\n}\n```\n\n### API\n\n| Method | Keterangan |\n|---|---|\n| `remember(key, callback, ttl?)` | Get-or-set. `ttl` null → `default_ttl`; `ttl <= 0` → selamanya. |\n| `rememberForever(key, callback)` | `remember` dengan `ttl=0` (tanpa expiry). |\n| `refresh(key, callback, ttl?)` | Paksa regenerate + simpan ulang. |\n| `get(key, default?)` | Ambil nilai; miss/error → `default`. |\n| `set(key, value, ttl?)` | Simpan nilai. |\n| `has(key)` | Cek keberadaan key. |\n| `forget(key)` | Hapus satu key. |\n| `forgetMultiple(keys)` | Hapus banyak key (loop `forget`). |\n| `clear()` | Flush seluruh store DatabaseCache. |\n| `isEnabled()` | `app.cache.enabled`. |\n\nCatatan:\n\n- **Nilai di-JSON-encode** — cocok untuk array, scalar, dan output DTO\n  `toArray()`. Yang dibaca kembali adalah array, bukan object aslinya.\n- **Key otomatis diberi prefix** `key_prefix` dan karakter reserved\n  PSR-16 (`{}()/\\@:`) dinormalisasi menjadi `.` — `product:5` tersimpan\n  sebagai `app.product.5` (default prefix `app`).\n- **Fail-safe**: semua operasi store dibungkus try/catch. Cache mati =\n  `remember`/`refresh` langsung jalankan callback, `get` return default —\n  request tidak pernah gagal karena cache.\n- `enabled=false` → semua operasi pass-through (callback langsung,\n  `get` → default, mutator → `false`).\n\n### Konfigurasi (`.env` / `app/cache` params)\n\n| Key | Default | Keterangan |\n|---|---|---|\n| `app.cache.enabled` | `true` | `false` → semua operasi no-op/pass-through |\n| `app.cache.driver` | `auto` | `auto` \\| `redis` \\| `file` \\| `psr` |\n| `app.cache.default_ttl` | `3600` | Detik; dipakai saat `ttl` tidak diberikan |\n| `app.cache.key_prefix` | `app` | Prefix semua key |\n\nDriver:\n\n| `driver` | Store yang dipakai |\n|---|---|\n| `auto` | `redis.default.enabled=true` **dan** Redis bisa di-connect (probe `Predis`) → `RedisCache`; selain itu → `FileCache` di `@runtime/cache/db`. |\n| `redis` | `Yiisoft\\Cache\\Redis\\RedisCache` (via `Predis\\Client` dari `redis.default.*`). Paksa — tanpa probe. |\n| `file` | `FileCache` di `@runtime/cache/db` (terpisah dari schema cache di `@runtime/cache`). |\n| `psr` | Store `Psr\\SimpleCache\\CacheInterface` yang di-bind project (default vendor: `ArrayCache` — in-memory per request, umumnya tidak berguna untuk cache antar-request). |\n\nSemua store berwujud `Psr\\SimpleCache\\CacheInterface` — pindah backend\nhanya mengubah `.env`, tanpa mengubah kode.\n\nOverride binding secara total (misalnya Redis dengan parameter custom)\nbisa dilakukan di `config/common/redis.php` atau file DI project:\n`DatabaseCache::class` adalah PSR-16-agnostic.\n\n```php\n// config/common/redis.php\nDatabaseCache::class => static fn (Aliases $aliases) => new DatabaseCache(\n    store: new FileCache($aliases->get('@runtime/cache/db')),\n    enabled: true,\n    defaultTtl: 7200,\n    keyPrefix: 'tenant1',\n),\n```\n\n### Terkait\n\n- `POST /v1/system/cache/purge` — report `database_cache` di respons\n  membersihkan store ini secara eksplisit (selain store global lainnya).\n- `redis.default.*` — koneksi Redis yang dipakai `driver=auto|redis`\n  (client `Predis`, independen dari `RedisService` yang pakai ext redis).\n", "28-column-contract.md": "# ColumnContract\n\n## Kontrak kolom standar untuk migration\n\n`App\\Shared\\Core\\Enums\\ColumnContract` adalah titik pusat untuk\n**default value** dan **comment** kolom-kolom konvensional (`id`,\n`status`, `detail_info`, `origin_id`, `sync_flag`, `sync_mdb`,\n`lock_version`). Tujuannya: semua migration konsisten, self-documenting,\ndan kalau konvensi berubah cukup edit satu file.\n\n### Cara pakai\n\n```php\nuse App\\Shared\\Core\\Enums\\ColumnContract;\n\n$b->createTable(self::TABLE_NAME, [\n    'id'          => $cb::integer()->notNull()->extra(ColumnContract::PG_PRIMARY_KEY_IDENTITY),\n    'name'        => $cb::string(255)->notNull(),\n    'status'      => $cb::smallint()->notNull()->defaultValue(ColumnContract::statusDefault())->comment(ColumnContract::statusComment()),\n    'detail_info' => $cb::json()->notNull()->defaultValue(ColumnContract::DETAILINFO_DEFAULT)->comment(ColumnContract::DETAILINFO_COMMENT),\n    'origin_id'    => $cb::integer()->null()->comment(ColumnContract::ORIGIN_ID_COMMENT),\n    'sync_flag'    => $cb::smallint()->null()->defaultValue(ColumnContract::SYNC_FLAG_DEFAULT)->comment(ColumnContract::SYNC_FLAG_COMMENT),\n    'sync_mdb'     => $cb::smallint()->null()->comment(ColumnContract::SYNC_MDB_COMMENT),\n    'lock_version' => $cb::integer()->notNull()->defaultValue(ColumnContract::LOCK_VERSION_DEFAULT)->comment(ColumnContract::LOCK_VERSION_COMMENT),\n]);\n```\n\n### API — Defaults\n\n| Konstanta / Method | Isi |\n|---|---|\n| `PG_PRIMARY_KEY_IDENTITY` | `'PRIMARY KEY GENERATED BY DEFAULT AS IDENTITY'` — clause `extra()` untuk kolom `id` di PostgreSQL. |\n| `MYSQL_TIMESTAMP_AUTO_UPDATE` | `'DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP'` — clause `extra()` untuk kolom timestamp di MySQL (auto set saat insert + refresh saat update, cocok untuk `updated_at`). |\n| `INNODB_COLLATION_UTF8MB4` | `'CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci ENGINE=InnoDB'` — table-level options untuk `CREATE TABLE` di MySQL (charset, collation, engine). |\n| `statusDefault(string $status = 'draft')` | Nilai default kolom `status`. Tanpa argumen → `DRAFT` (2). Terima nama status *case-insensitive*, mis. `statusDefault('active')`. Lempar `InvalidArgumentException` untuk nama tak dikenal. |\n| `DETAILINFO_DEFAULT` | Payload awal `detail_info`: `['change_log' => ['created_at' => null, 'created_by' => null, 'updated_at' => null, 'updated_by' => null, 'deleted_at' => null, 'deleted_by' => null]]`. |\n| `SYNC_FLAG_DEFAULT` | `1` (not synced). |\n| `LOCK_VERSION_DEFAULT` | `1` (optimistic locking). |\n\n### API — Comments\n\n| Method | Teks comment |\n|---|---|\n| `statusComment()` | Legend status dari `RecordStatus::describe()` — `\"0: Inactive, 1: Active, 2: Draft, ...\"`. Selalu sinkron dengan enum. Tetap method karena hasilnya di-generate. |\n| `DETAILINFO_COMMENT` | Struktur `change_log` + catatan key spesifik modul. |\n| `ORIGIN_ID_COMMENT` | `'origin instance id where the record comes from or goes to'` |\n| `SYNC_FLAG_COMMENT` | `'null: synced, 1: not synced'` |\n| `SYNC_MDB_COMMENT` | `'null: sync to MDB, 1: not sync to MDB'` |\n| `LOCK_VERSION_COMMENT` | `'Optimistic locking version'` |\n\n### Menyimpang dari konvensi\n\nKalau sebuah kolom sengaja beda (mis. `service_tokens.status` mulai dari\n`ACTIVE`, bukan `DRAFT`), tetap lewat `ColumnContract` supaya intent-nya\nkelihatan eksplisit:\n\n```php\n'status' => $cb::smallint()->notNull()->defaultValue(ColumnContract::statusDefault('active'))->comment(ColumnContract::statusComment()),\n```\n\n### Menambah konvensi baru\n\n`ColumnContract` ada di `src/Shared/Core/` (frozen, di-sync via\n`composer skeleton:update`) — penambahan kolom konvensional baru\n(`xxxDefault()` / `XXX_DEFAULT` / `xxxComment()`) dilakukan di\nboilerplate upstream, bukan patch lokal.\n\n### Terkait\n\n- `RecordStatus::describe()` — sumber legend `statusComment()`; lihat\n  `11-enums-guide.md`.\n- `DetailInfo` / `ChangeLogged` — pemilik struktur `change_log` yang\n  dicerminkan `DETAILINFO_DEFAULT`; lihat `12-value-object-guide.md`.\n- `17-migration-seeding-guide.md` — panduan migration umum.\n", "Yii3-API.postman_collection.json": "{\n    \"info\": {\n        \"_postman_id\": \"yii3-api-boilerplate\",\n        \"name\": \"Yii3 API\",\n        \"description\": \"Yii3 API boilerplate collection. Auth dan variable disimpan di level collection sehingga semua request mewarisinya. Set variable {{bearer-token}} dengan JWT dari SSO, atau service token (bila app.service_token.enabled=true).\",\n        \"schema\": \"https://schema.getpostman.com/json/collection/v2.1.0/collection.json\"\n    },\n    \"auth\": {\n        \"type\": \"bearer\",\n        \"bearer\": [\n            { \"key\": \"token\", \"value\": \"{{bearer-token}}\", \"type\": \"string\" }\n        ]\n    },\n    \"item\": [\n        {\n            \"name\": \"Local\",\n            \"item\": [\n                {\n                    \"name\": \"Index\",\n                    \"request\": {\n                        \"method\": \"GET\",\n                        \"description\": \"Health check root API (environment Local).\\n\\nMengembalikan info dasa
