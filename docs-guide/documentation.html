($now + $this->windowSize));\n    }\n}\n```\n\n**Konfigurasi**: params `app/rateLimit` (env `app.rateLimit.maxRequests` / `app.rateLimit.windowSize`). Penyimpanannya berupa array PHP per proses — untuk setup production multi-proses, ganti/perluas dengan `App\\Infrastructure\\Core\\RateLimit\\DatabaseRateLimiter`.\n\n---\n\n### 6. SecureHeadersMiddleware\n\n**Tujuan**: Menambahkan security header ke setiap response. Konfigurasinya berupa satu array dengan bagian `csp`, `permissions`, dan `custom`.\n\n**Lokasi**: `src/Shared/Core/Middleware/SecureHeadersMiddleware.php`\n\n```php\nfinal class SecureHeadersMiddleware implements MiddlewareInterface\n{\n    public function __construct(array $config = [])\n    {\n        $this->headers = \\array_merge([\n            'X-Content-Type-Options'    => 'nosniff',\n            'X-Frame-Options'           => 'SAMEORIGIN',\n            'X-XSS-Protection'          => '1; mode=block',\n            'Referrer-Policy'           => 'strict-origin-when-cross-origin',\n            'Content-Security-Policy'   => $this->buildCsp($config['csp'] ?? []),\n            'Strict-Transport-Security' => 'max-age=31536000; includeSubDomains',\n            'Permissions-Policy'        => $this->buildPermissionsPolicy($config['permissions'] ?? []),\n        ], $config['custom'] ?? []);\n    }\n\n    public function process(ServerRequestInterface $request, RequestHandlerInterface $handler): ResponseInterface\n    {\n        $response = $handler->handle($request);\n\n        foreach ($this->headers as $name => $value) {\n            if ($value !== null && \\is_string($value)) {\n                $response = $response->withHeader($name, $value);\n            }\n        }\n\n        return $response;\n    }\n}\n```\n\n**Konfigurasi**: params `app/secureHeaders` di `config/common/params.php` — directive `csp` (default: `default-src 'self'`, `script-src 'self' 'unsafe-inline'`, `style-src 'self' 'unsafe-inline'`, `img-src 'self' data: https:`, `connect-src 'self'`), daftar fitur `permissions`, dan override header `custom`.\n\n> `HstsMiddleware` khusus (`src/Infrastructure/Core/Security/HstsMiddleware.php`) juga tersedia untuk konfigurasi HSTS mandiri (params `app/hsts`: `maxAge`, `includeSubDomains`, `preload`).\n\n---\n\n### 7. AccessMiddleware\n\n**Tujuan**: Otorisasi RBAC. Membaca requirement `permission` dari route (`defaults['permission']` atau argumen `CurrentRoute`) dan memeriksanya via `Yiisoft\\Access\\AccessCheckerInterface`.\n\n**Lokasi**: `src/Shared/Core/Middleware/AccessMiddleware.php`\n\n```php\nfinal class AccessMiddleware implements MiddlewareInterface\n{\n    public function __construct(\n        private AccessCheckerInterface $accessChecker,\n        private CurrentUser $currentUser,\n        private UrlMatcher $urlMatcher,\n    ) {}\n\n    public function process(ServerRequestInterface $request, RequestHandlerInterface $handler): ResponseInterface\n    {\n        $currentRoute = $request->getAttribute(CurrentRoute::class);\n\n        if ($currentRoute === null) {\n            // Router hasn't run yet — match manually via UrlMatcher\n            $result     = $this->urlMatcher->match($request);\n            $permission = $result->route()?->getData('defaults')['permission'] ?? null;\n        } else {\n            $permission = $currentRoute->getArgument('permission') ?? null;\n        }\n\n        if ($permission === null) {\n            return $handler->handle($request); // route has no permission requirement\n        }\n\n        $actor = $this->currentUser->getActor();\n\n        if ($actor === null) {\n            throw new ForbiddenException(translate: Message::create(key: 'access.insufficient_permissions'));\n        }\n\n        $allowed = $this->accessChecker->userHasPermission(\n            $actor->getId() ?? null,\n            $permission,\n            ['actor' => $actor]\n        );\n\n        if (!$allowed) {\n            throw new ForbiddenException(translate: Message::create(key: 'access.insufficient_permissions'));\n        }\n\n        return $handler->handle($request);\n    }\n}\n```\n\n**Deklarasi permission route** (`config/common/routes.php`):\n\n```php\nRoute::post('/example/create')\n    ->action(ExampleV1\\ExampleCreateAction::class)\n    ->name('v1/example/create')\n    ->defaults(['permission' => 'example.create']),\n```\n\n---\n\n### 8. Middleware Monitoring & Utilitas\n\nBerada di `src/Infrastructure/Core/Monitoring/` dan `src/Api/Shared/`; dikonfigurasi via params `app/monitoring` di `config/common/params.php` dan factory DI di `config/common/di/middleware-di.php`:\n\n- **`RequestIdMiddleware`** — menetapkan/meneruskan `X-Request-Id` (nama header dapat dikonfigurasi).\n- **`StructuredLoggingMiddleware`** — mencatat setiap request/response; opsi: `enabled`, `log_level`, `include_request_body`, `include_response_body`, `max_log_size`, `exclude_paths`, `exclude_status_codes`.\n- **`MetricsMiddleware`** — melacak jumlah request, waktu response, status code, memori; opsi di bawah `metrics`.\n- **`ErrorMonitoringMiddleware`** — menangkap exception/error; opsi di bawah `error_monitoring` (`ignore_error_codes`, `include_stack_trace`, ...).\n- **`NotFoundMiddleware`** (`src/Api/Shared/NotFoundMiddleware.php`) — handler 404 terminal yang ditempatkan setelah `Router`.\n\n---\n\n## 🔧 Konfigurasi Middleware\n\n### 1. **Stack Aplikasi**\n\nPipeline sebenarnya berada di `config/web/di/application.php` (`Application` → `MiddlewareDispatcher::withMiddlewares()`), terluar lebih dulu:\n\n```php\n'withMiddlewares()' => [\n    [\n        FormatDataResponseAsJson::class,\n        static fn () => new ContentNegotiator([\n            'application/json' => new JsonDataResponseFormatter(),\n        ]),\n        ErrorCatcher::class,\n        static fn (ExceptionResponderFactory $factory) => $factory->create(),\n        static fn () => new TrustedHostMiddleware(\n            $params['app/trusted_hosts']['allowedHosts'] ?? [],\n        ),\n        CorsMiddleware::class,\n        JwtMiddleware::class,\n        RequestIdMiddleware::class,\n        StructuredLoggingMiddleware::class,\n        MetricsMiddleware::class,\n        RateLimitMiddleware::class,\n        SecureHeadersMiddleware::class,\n        ErrorMonitoringMiddleware::class,\n        RequestBodyParser::class,\n        AccessMiddleware::class,\n        Router::class,\n        NotFoundMiddleware::class,\n    ],\n],\n```\n\nMiddleware level route dipasang via group di `config/common/routes.php`:\n\n```php\nGroup::create('/v1')\n    ->middleware(RequestParamsMiddleware::class)\n    ->routes(/* ... */);\n```\n\n`config/common/middleware.php` mengembalikan stack common tambahan (saat ini `[]`) untuk penambahan spesifik proyek.\n\n### 2. **Konfigurasi DI**\n\nFactory middleware berada di `config/common/di/middleware-di.php` (digerakkan params) dan `config/common/di/jwt.php`:\n\n```php\n// config/common/di/middleware-di.php (excerpt)\nRequestParamsMiddleware::class => static function () use ($params) {\n    $pagination = $params['app/pagination'] ?? [];\n    return new RequestParamsMiddleware(\n        defaultPageSize: (int) ($pagination['defaultPageSize'] ?? 50),\n        maxPageSize: (int) ($pagination['maxPageSize'] ?? 200),\n    );\n},\n\nCorsMiddleware::class => static fn (ResponseFactoryInterface $responseFactory) =>\n    new CorsMiddleware($params['app/cors'], $responseFactory),\n\nRateLimitMiddleware::class => static function () use ($params) {\n    $rateLimit = $params['app/rateLimit'] ?? [];\n    return new RateLimitMiddleware(\n        maxRequests: (int) ($rateLimit['maxRequests'] ?? 100),\n        windowSize: (int) ($rateLimit['windowSize'] ?? 60)\n    );\n},\n\nSecureHeadersMiddleware::class => static fn () =>\n    new SecureHeadersMiddleware($params['app/secureHeaders'] ?? []),\n\nAccessMiddleware::class => static fn (\n    AccessChecker $accessChecker,\n    CurrentUser $currentUser,\n    UrlMatcher $urlMatcher,\n) => new AccessMiddleware($accessChecker, $currentUser, $urlMatcher),\n```\n\n```php\n// config/common/di/jwt.php (excerpt)\nJwtMiddleware::class => static fn (\n    JwtService $jwtService,\n    ActorProvider $actorProvider,\n    CurrentUser $currentUser\n) => new JwtMiddleware(\n    jwtService: $jwtService,\n    actorProvider: $actorProvider,\n    currentUser: $currentUser,\n    publicPaths: $params['app/jwt']['publicPaths'] ?? [],\n),\n```\n\n---\n\n## 🚀 Praktik Terbaik\n\n### 1. **Urutan Middleware**\n```php\n// ✅ Correct order (outermost first) — as wired in config/web/di/application.php\n// 1. ErrorCatcher / ExceptionResponder   // must wrap everything\n// 2. TrustedHostMiddleware               // host validation\n// 3. CorsMiddleware                      // preflight before auth\n// 4. JwtMiddleware                       // authentication\n// 5. Monitoring (RequestId, Logging, Metrics)\n// 6. RateLimitMiddleware                 // throttle authenticated traffic\n// 7. SecureHeadersMiddleware\n// 8. RequestBodyParser\n// 9. AccessMiddleware                    // needs actor from JwtMiddleware\n// 10. Router -> NotFoundMiddleware\n\n// ❌ Wrong order\n// JwtMiddleware before CorsMiddleware — preflight OPTIONS would 401\n```\n\n### 2. **Error Handling**\n```php\n// ✅ Throw typed exceptions — the exception responder renders JSON\nthrow new UnauthorizedException(translate: Message::create(key: 'auth.header_missing'));\n\n// ❌ Build ad-hoc error responses inside middleware\n$response = new Response();\n$response->getBody()->write(json_encode(['error' => 'x']));\nreturn $response->withStatus(401);\n```\n\n### 3. **Performa**\n```php\n// ✅ Early returns / cheap checks first\nif ($origin === '') {\n    return $handler->handle($request); // no CORS work needed\n}\n\n// ❌ Heavy work before deciding the middleware applies\n```\n\n---\n\n## 📊 Pertimbangan Performa\n\n### 1. **Overhead Middleware**\n- Jaga middleware tetap ringan\n- Penyimpanan `RateLimitMiddleware` berada di memori (per proses) — ganti dengan `DatabaseRateLimiter` untuk limit bersama\n- Middleware monitoring dikendalikan konfigurasi (flag `enabled`)\n\n### 2. **Urutan Eksekusi**\n- Tempatkan penolak murah (host, preflight CORS, rate limit) di awal\n- `AccessMiddleware` berjalan setelah `RequestBodyParser` dan sebelum `Router` — ia dapat kembali ke `UrlMatcher` ketika `CurrentRoute` belum diset\n\n### 3. **Penggunaan Memori**\n- Hindari menyimpan objek besar di state middleware\n- `$this->storage` di `RateLimitMiddleware` bertambah per proses — batasi di worker yang berjalan lama\n\n---\n\n## 🎯 Ringkasan\n\nMiddleware menyediakan cara yang bersih dan composable untuk menangani cross-cutting concern dalam aplikasi Yii3 API. Manfaat utamanya meliputi:\n\n- **🔧 Modularitas**: Setiap middleware menangani satu concern\n- **🔄 Reusability**: Middleware dapat dipakai ulang di berbagai route dan group\n- **🧪 Testability**: Mudah melakukan unit test pada komponen individual\n- **⚡ Performa**: Pipeline pemrosesan request yang efisien\n- **🛡️ Keamanan**: Penanganan keamanan terpusat dengan exception bertipe\n- **📦 Composability**: Stack global di `config/web/di/application.php`, stack group di `config/common/routes.php`\n\nDengan mengikuti pola dan praktik terbaik yang diuraikan dalam panduan ini, Anda dapat membangun middleware yang tangguh dan mudah dipelihara untuk aplikasi Yii3 API Anda! 🚀\n", "17-migration-seeding-guide.md": "# Panduan Migration dan Seeding\n\n## 📋 Gambaran Umum\n\nPanduan ini membahas migration database dan seeding data di proyek Yii3 API. Panduan ini menjelaskan cara mengelola perubahan skema database, mengisi data awal, dan menjaga konsistensi data di berbagai environment.\n\n---\n\n## 🏗️ Gambaran Arsitektur\n\n### Struktur Migration\n\n```\nsrc/\n└── Migration/                                    # Database migrations (grouped per module)\n    ├── Auditable/\n    │   ├── M20240101000000CreateAuditLogsTable.php\n    │   └── M20240101000001CreateRateLimitsTable.php\n    └── Example/\n        ├── M20240101000000CreateExampleTable.php          # example table\n        └── M20260910104729CreateAnotherExampleTable.php   # another_example table\n```\n\nMigration diberi namespace per modul: `App\\Migration\\Example`, `App\\Migration\\Auditable`, dst. (lihat pengaturan `yiisoft/db-migration` di `config/common/params-core.php`). Setiap modul dipetakan ke koneksi database di `config/common/migration.php` → `moduleConnections` — `migrate:module` akan gagal tanpa pemetaan.\n\n### Struktur Seeding\n\n```\nsrc/\n├── Console/                     # Console commands\n│   └── Core/                    # Skeleton console commands (frozen)\n│       ├── MigrateModuleCommand.php # Per-module migrations (migrate:module)\n│       └── SeederCommand.php        # Flexible seeding command (seed)\n├── Seeder/                      # Seed classes\n│   ├── SeedExampleData.php          # Seeds the example table\n│   ├── SeedAnotherExampleData.php   # Seeds the another_example table\n│   ├── Fixtures/                    # nelmio/alice YAML fixtures\n│   │   ├── example.yaml\n│   │   └── anotherexample.yaml\n│   └── Faker/                       # Custom Faker providers\n│       └── SeedDataPoolFaker.php\n└── Infrastructure/Core/Seeder/\n    └── AbstractSeederData.php   # Base class that loads fixtures and inserts entities\n```\n\n---\n\n## 🔄 Migration Database\n\n### Praktik Terbaik Migration\n\n#### 1. **Separation of Concerns**\n```php\n// ✅ GOOD: Separate table creation from data seeding\nsrc/Migration/Example/M20240101000000CreateExampleTable.php  // Table structure only\nsrc/Seeder/SeedExampleData.php                               // Data seeding only\n\n// ❌ AVOID: Mix structure and data in one migration\nM20240101000000CreateExampleWithSeed.php  // Combined approach\n```\n\n#### 2. **Konvensi Penamaan**\n```php\n// ✅ Format: M{YYYYMMDDHHMMSS}{Description}, placed in a per-module namespace\nsrc/Migration/Example/M20240101000000CreateExampleTable.php     // namespace App\\Migration\\Example\nsrc/Migration/Example/M20240101010000UpdateExampleFields.php    // Update fields\nsrc/Migration/Auditable/M20240101000000CreateAuditLogsTable.php // namespace App\\Migration\\Auditable\n```\n\n#### 3. **Migration Reversible**\n```php\n// ✅ Always implement RevertibleMigrationInterface\nfinal class M20240101000000CreateExampleTable implements RevertibleMigrationInterface\n{\n    public function up(MigrationBuilder $b): void\n    {\n        $b->createTable('example', [...]);\n    }\n    \n    public function down(MigrationBuilder $b): void\n    {\n        $b->dropTable('example');\n    }\n}\n```\n\n### Membuat Migration Baru\n\n#### 1. **Membuat Migration**\n```bash\n# Buat migration baru untuk tabel \"user\" di namespace default (App\\Migration)\n./yii migrate:create user --command=table\n\n# Buat di dalam namespace modul (direktori harus sudah ada: src/Migration/Example)\n./yii migrate:create user --command=table --namespace=App\\\\Migration\\\\Example\n\n# Buat field secara inline\n./yii migrate:create user --command=table --fields=\"name:string(255):notNull(),status:smallint:notNull():defaultValue(1)\"\n```\n\nNilai `--command` yang tersedia: `create`, `table`, `dropTable`, `addColumn`, `dropColumn`, `junction`.\n\n#### 2. **Template Migration**\n```php\n<?php\n\ndeclare(strict_types=1);\n\nnamespace App\\Migration\\Example;\n\n// PSR Interfaces\nuse Psr\\Clock\\ClockInterface;\n// Vendor Layer\nuse Yiisoft\\Db\\Migration\\MigrationBuilder;\nuse Yiisoft\\Db\\Migration\\RevertibleMigrationInterface;\n\n/**\n * Creates user table.\n */\nfinal class M20240101120000CreateUserTable implements RevertibleMigrationInterface\n{\n    private const TABLE_NAME = 'user';\n\n    public function __construct(\n        private ClockInterface $clock\n    ) {\n    }\n\n    public function up(MigrationBuilder $b): void\n    {\n        $cb = $b->columnBuilder();\n\n        $b->createTable(self::TABLE_NAME, [\n            'id'            => $cb::integer()->notNull()->extra('PRIMARY KEY GENERATED BY DEFAULT AS IDENTITY'),\n            'username'      => $cb::string(255)->notNull(),\n            'email'         => $cb::string(255)->notNull(),\n            'password_hash' => $cb::string(255)->notNull(),\n            'status'        => $cb::smallint()->notNull()->defaultValue(1),\n            'detail_info'   => $cb::json()->notNull()->defaultValue(['change_log' => []]),\n            'lock_version'  => $cb::integer()->notNull()->defaultValue(1)->comment('Optimistic locking version'),\n        ]);\n\n        // Create indexes\n        $b->createIndex('user', 'idx_user_status', 'status');\n    }\n\n    public function down(MigrationBuilder $b): void\n    {\n        $b->dropTable(self::TABLE_NAME);\n    }\n}\n```\n\n### Menjalankan Migration\n\n#### 1. **Perintah Dasar Migration**\n```bash\n# Terapkan semua migration yang pending\n./yii migrate:up\n\n# Terapkan hanya N migration pending pertama\n./yii migrate:up --limit=3\n\n# Terapkan migration dari namespace atau path tertentu\n./yii migrate:up --namespace=App\\\\Migration\\\\Example\n./yii migrate:up --path=@src/Migration/Example\n\n# Lewati prompt konfirmasi\n./yii migrate:up --force-yes\n```\n\n#### 2. **Migration per Modul**\n\nSetiap folder modul harus dipetakan ke sebuah koneksi di `config/common/migration.php` → `moduleConnections` (mis. `'Auditable' => 'audit'` menggunakan env key `db.audit.*`). Tanpa pemetaan, `migrate:module` akan gagal. Riwayat dilacak per database — tabel `{{%migration}}` dibuat di database milik modul itu sendiri.\n\n```bash\n# Terapkan migration pending milik satu modul pada koneksi yang dipetakan\n./yii migrate:module example\n./yii migrate:module auditable --limit=1 --force-yes\n\n# Timpa koneksi yang dipetakan untuk eksekusi ini\n./yii migrate:module auditable --db=audit\n```\n\n> **Catatan:** `migrate:module` hanya bisa *apply* — tidak ada mode `down`.\n> Untuk revert migration milik satu modul, gunakan `migrate:down` dengan\n> `--namespace` atau `--path`:\n\n```bash\n# Revert N migration terakhir milik satu modul (default limit = 1)\n./yii migrate:down --namespace=\"App\\Migration\\ServiceToken\"\n./yii migrate:down --namespace=\"App\\Migration\\ServiceToken\" --limit=2\n\n# Revert semua migration milik satu modul\n./yii migrate:down --namespace=\"App\\Migration\\ServiceToken\" --all\n\n# Alternatif: pakai path folder modul\n./yii migrate:down --path=src/Migration/ServiceToken --all\n```\n\nNamespace mengikuti `App\\Migration\\<Module>` (`Example`, `Auditable`,\n`ServiceToken`, dst.). Karena `migrate:down` membaca tabel riwayat\n`{{%migration}}`, pastikan perintah dijalankan terhadap koneksi database\nyang sama dengan saat migration-nya di-apply — untuk modul non-default\n(mis. `Auditable` → `audit`), cek `moduleConnections` dulu.\n\n#### 3. **Manajemen Migration**\n```bash\n# Tampilkan riwayat migration\n./yii migrate:history\n\n# Tampilkan migration yang pending\n./yii migrate:new\n\n# Rollback migration terakhir\n./yii migrate:down\n\n# Rollback 3 migration terakhir / semua migration\n./yii migrate:down --limit=3\n./yii migrate:down --all\n\n# Revert lalu terapkan ulang migration terakhir\n./yii migrate:redo\n```\n\n#### 4. **Migration Spesifik Environment**\n```bash\n# Environment development\nAPP_ENV=dev ./yii migrate:up\n\n# Environment production\nAPP_ENV=prod ./yii migrate:up\n\n# Environment test\nAPP_ENV=test ./yii migrate:up\n```\n\n---\n\n## 🌱 Seeding Data\n\nSeeding ditangani oleh perintah console `seed` (`src/Console/Core/SeederCommand.php`) bersama class seeder per modul di `src/Seeder/` yang meng-extend `App\\Infrastructure\\Core\\Seeder\\AbstractSeederData`. Fixture ditulis dalam YAML menggunakan sintaks `__factory` dari [nelmio/alice](https://github.com/nelmio/alice).\n\n### Perintah Console untuk Seeding\n\n#### 1. **Seeding Dasar**\n```bash\n# Jalankan semua seeder yang ditemukan di src/Seeder/ (default: 10 record masing-masing)\n./yii seed\n\n# Jalankan seeder modul tertentu (resolve ke App\\Seeder\\SeedExampleData)\n./yii seed --module=example\n./yii seed --module=anotherexample\n\n# Jalankan seeder dengan jumlah kustom\n./yii seed --module=example --count=20\n```\n\n#### 2. **Opsi Perintah**\n```bash\n# Tampilkan bantuan\n./yii help seed\n\n# Opsi yang tersedia:\n#   --module, -m   Modul spesifik yang akan di-seed (mis. example, product)\n#   --count, -c    Jumlah record yang akan di-seed (default: 10)\n```\n\n#### 3. **Implementasi Perintah** (`src/Console/Core/SeederCommand.php`)\n```php\nfinal class SeederCommand extends Command\n{\n    protected function configure(): void\n    {\n        $this\n            ->setName('seed')\n            ->setDescription('Seed all available seeders or specific module')\n            ->addOption('module', 'm', InputOption::VALUE_OPTIONAL, 'Specific module to seed (e.g., example, product)', null)\n            ->addOption('count', 'c', InputOption::VALUE_OPTIONAL, 'Number of records to seed (default: 10)', 10);\n    }\n\n    protected function execute(InputInterface $input, OutputInterface $output): int\n    {\n        // Seeding is restricted to the development environment\n        if (!\\in_array($_ENV['APP_ENV'] ?? '', ['dev', 'development'], true)) {\n            $output->writeln('<error>Seeding is only allowed in development environment!<\/error>');\n            return Command::FAILURE;\n        }\n\n        // --module resolves to App\\Seeder\\Seed{Module}Data via the container;\n        // without --module every src/Seeder/Seed*Data.php file is run.\n        $seeder = $this->container->get('App\\\\Seeder\\\\Seed' . \\ucfirst($module) . 'Data');\n        $seeder->run($count);\n        // ...\n    }\n}\n```\n\n### Class Seeder\n\nSetiap seeder meng-extend `AbstractSeederData`, mendeklarasikan file fixture dan class entity-nya melalui konstanta, serta mengimplementasikan `insertEntity()`:\n\n```php\n// src/Seeder/SeedExampleData.php\nnamespace App\\Seeder;\n\nfinal class SeedExampleData extends AbstractSeederData\n{\n    protected const YAML_FILE    = 'example.yaml';        // src/Seeder/Fixtures/example.yaml\n    protected const ENTITY_CLASS = Example::class;        // App\\Domain\\Example\\Entity\\Example\n\n    public function __construct(\n        ConnectionInterface $db,\n        ClockInterface $clock,\n        DetailInfoFactory $detailInfoFactory,\n        Aliases $aliases,\n        ExampleRepositoryInterface $repository\n    ) {\n        parent::__construct($db, $clock, $detailInfoFactory, $aliases);\n        $this->repository = $repository;\n    }\n\n    protected function insertEntity(object $entity, mixed $detailInfo): void\n    {\n        $newEntity = Example::create(\n            $entity->getName(),\n            $entity->getStatus(),\n            $detailInfo\n        );\n\n        $this->repository->insert($newEntity);\n    }\n}\n```\n\n`AbstractSeederData::run($count)` memeriksa environment, memuat fixture YAML melalui `NativeLoader`, memfilter objek berdasarkan `ENTITY_CLASS`, membangun `DetailInfo` via `DetailInfoFactory`, lalu memanggil `insertEntity()` untuk setiap entity (dipotong hingga `$count`).\n\n### File Fixture (nelmio/alice)\n\nFixture berada di `src/Seeder/Fixtures/*.yaml` dan menggunakan `__factory` untuk memanggil constructor statis. Referensi ke fixture lain menggunakan `@name`:\n\n```yaml\n# src/Seeder/Fixtures/example.yaml\nApp\\Domain\\Shared\\Core\\ValueObject\\ResourceStatus:\n  status_draft:\n    __factory:\n      'App\\Domain\\Shared\\Core\\ValueObject\\ResourceStatus::from': [2]\n  status_active:\n    __factory:\n      'App\\Domain\\Shared\\Core\\ValueObject\\ResourceStatus::from': [1]\n\nApp\\Domain\\Shared\\Core\\ValueObject\\DetailInfo:\n  info_empty:\n    __factory:\n      'App\\Domain\\Shared\\Core\\ValueObject\\DetailInfo::fromArray': [[]]\n\nApp\\Domain\\Example\\Entity\\Example:\n  example_{1..5}:\n    __factory:\n      'App\\Domain\\Example\\Entity\\Example::create':\n        - '<seedDataPoolRandom()>'   # $name\n        - '@status_draft'            # $status\n        - '@info_empty'              # $detailInfo\n        - null                       # $syncMdb\n```\n\n### Provider Faker Kustom\n\n`AbstractSeederData` secara otomatis mendaftarkan setiap subclass `Faker\\Provider\\Base` yang ditemukan di `src/Seeder/Faker/`. Provider harus mengimplementasikan `SeederProviderInterface`:\n\n```php\n// src/Seeder/Faker/SeedDataPoolFaker.php\nnamespace App\\Seeder\\Faker;\n\nfinal class SeedDataPoolFaker extends Base implements SeederProviderInterface\n{\n    protected static array $brands = ['Item Name 1', 'Item Name 2', /* ... */];\n\n    public function seedDataPoolRandom(): string\n    {\n        return self::randomElement(self::$brands);\n    }\n}\n```\n\nGunakan di fixture sebagai `<seedDataPoolRandom()>`. Formatter Faker standar seperti `<company()>` atau `<sentence()>` juga bisa digunakan.\n\n### Pembersihan Data\n\nSeeder tidak menyediakan jalur `down()`/truncate. Untuk melakukan seed ulang pada suatu tabel, kosongkan (truncate) tabel tersebut secara manual sebelum menjalankan `./yii seed` lagi:\n\n```bash\n# Contoh: kosongkan tabel lalu seed ulang\n./yii migrate:down --limit=1 && ./yii migrate:up   # buat ulang struktur tabel\n./yii seed --module=example --count=20\n```\n\n---\n\n## 🔧 Konfigurasi\n\n### Konfigurasi Migration\n\n#### 1. **Pengaturan Migration**\n```php\n// config/common/params.php\nreturn [\n    // ...\n    'yiisoft/db-migration' => [\n        'newMigrationNamespace' => 'App\\\\Migration',\n        'sourceNamespaces'      => ['App\\\\Migration'],\n    ],\n];\n```\n\nSemua migration dimuat berdasarkan namespace, sehingga setiap class di bawah `App\\Migration\\*` (mis. `App\\Migration\\Example`, `App\\Migration\\Auditable`) ditemukan secara otomatis.\n\n#### 2. **Konfigurasi Database**\n```php\n// config/common/di/db-pgsql.php (used when db.default.driver=pgsql)\n$dsn = new Dsn('pgsql', $db['host'], $db['name'], $db['port']);\n\nreturn [\n    FileCache::class => [\n        'class'         => FileCache::class,\n        '__construct()' => [\n            'cachePath' => DynamicReference::to(static fn (Aliases $aliases) => $aliases->get('@runtime/cache')),\n        ],\n    ],\n    SchemaCache::class => [\n        'class'         => SchemaCache::class,\n        '__construct()' => [Reference::to(FileCache::class)],\n        'setEnabled()'  => [true],\n    ],\n    ConnectionInterface::class => static fn (SchemaCache $schemaCache) => new Connection(\n        new Driver($dsn, $db['user'] ?? '', $db['password'] ?? ''),\n        $schemaCache,\n    ),\n];\n```\n\n`config/common/di/db-mysql.php` menyediakan binding yang setara ketika `db.default.driver=mysql` (atau `mariadb`). Detail koneksi berasal dari grup `yiisoft/db` di `params.php`, yang diisi dari variabel `db.default.*` di `.env`.\n\n### Konfigurasi Seeding\n\nTidak diperlukan file DI khusus — seeder adalah class biasa yang di-resolve melalui container (autowiring), dan `SeederCommand` didaftarkan sebagai perintah console:\n\n#### 1. **Perintah Console**\n```php\n// config/console/commands.php\nuse App\\Console;\n\nreturn [\n    'hello'          => Console\\HelloCommand::class,\n    'migrate:module' => Console\\MigrateModuleCommand::class,\n    'seed'           => Console\\SeederCommand::class,\n];\n```\n\n#### 2. **Parameter Console**\n```php\n// config/console/params.php\nreturn [\n    'yiisoft/yii-console' => [\n        'commands' => require __DIR__ . '/commands.php',\n    ],\n];\n```\n\n---\n\n## 🚀 Alur Kerja Development\n\n### 1. **Setup Proyek**\n```bash\n# 1. Instal dependency\ncomposer install\n\n# 2. Buat database\ncreatedb yii3_api\n\n# 3. Jalankan migration\n./yii migrate:up\n\n# 4. Seed data (hanya development)\n./yii seed --module=example\n\n# 5. Jalankan development server\n./yii serve\n```\n\n### 2. **Siklus Development**\n```bash\n# Selama development\n./yii migrate:up                    # Terapkan migration baru\n./yii seed --module=example          # Refresh data seed\n./yii serve                         # Jalankan server\n```\n\n### 3. **Alur Kerja Testing**\n```bash\n# Environment test\nAPP_ENV=test ./yii migrate:up        # Buat skema test\ncomposer test                        # Jalankan test suite Codeception\n```\n\n### 4. **Deployment Production**\n```bash\n# Environment production\nAPP_ENV=prod ./yii migrate:up         # Terapkan migration saja\n# Tidak ada seeding di production (perintah seed menolak berjalan di luar dev)\n```\n\n---\n\n## 🛡️ Keamanan Environment\n\n### Pembatasan Environment\n\n#### 1. **Seeding Hanya untuk Development**\n```php\n// ✅ Environment check in SeederCommand (and again in AbstractSeederData::run())\nif (!\\in_array($_ENV['APP_ENV'] ?? '', ['dev', 'development'], true)) {\n    $output->writeln('<error>Seeding is only allowed in development environment!<\/error>');\n    return Command::FAILURE;\n}\n```\n\n#### 2. **Variabel Environment**\n```bash\n# .env.example\nAPP_ENV=dev\nAPP_DEBUG=1\n\n# .env.production\nAPP_ENV=prod\nAPP_DEBUG=0\n```\n\n#### 3. **Deteksi Environment**\n```php\n// ✅ Valid environments are restricted to dev/test/prod (src/Environment.php)\nuse App\\Environment;\n\nif (!Environment::isDev()) {\n    // Block seeding\n}\n```\n\n### Tindakan Pengamanan\n\n#### 1. **Prompt Konfirmasi**\n```php\n// ✅ Add confirmation for destructive operations\n$io = new SymfonyStyle($input, $output);\nif (!$io->confirm('This will reseed the example table. Continue?', false)) {\n    return Command::SUCCESS;\n}\n```\n\n#### 2. **Backup Sebelum Seeding**\n```php\n// ✅ Create backup before destructive operations (inside a custom seeder/command)\n$backupTable = 'example_backup_' . date('Y_m_d_His');\n$this->db->createCommand()->renameTable('example', $backupTable)->execute();\n```\n\n---\n\n## 📊 Praktik Terbaik\n\n### Praktik Terbaik Migration\n\n#### 1. **Single Responsibility**\n```php\n// ✅ One migration, one purpose\nM20240101000000CreateExampleTable.php   // Create table\nM20240101010000AddExampleFields.php     // Add fields\nM20240101020000CreateExampleIndex.php   // Create index\n\n// ❌ Avoid: Multiple operations in one migration\nM20240101000000CreateExampleWithFieldsAndIndex.php\n```\n\n#### 2. **Migration Idempotent**\n```php\n// ✅ Check before creating (via the schema of the underlying connection)\nif ($b->getDb()->getSchema()->getTableSchema('example') === null) {\n    $b->createTable('example', [...]);\n}\n```\n\n#### 3. **Keamanan Rollback**\n```php\n// ✅ Always implement down() method\npublic function down(MigrationBuilder $b): void\n{\n    // Reverse all operations from up()\n    $b->dropTable('example');\n}\n```\n\n### Praktik Terbaik Seeding\n\n#### 1. **Kesadaran Environment**\n```php\n// ✅ Handled automatically: both SeederCommand and AbstractSeederData::run()\n// refuse to run when APP_ENV is not dev/development\n```\n\n#### 2. **Konsistensi Data**\n```php\n// ✅ Insert through the repository (inside insertEntity())\nprotected function insertEntity(object $entity, mixed $detailInfo): void\n{\n    $newEntity = Example::create($entity->getName(), $entity->getStatus(), $detailInfo);\n    $this->repository->insert($newEntity);\n}\n```\n\n#### 3. **Error Handling**\n```php\n// ✅ SeederCommand already wraps seeder->run() in try/catch\ntry {\n    $seeder = $this->container->get($seederClass);\n    $seeder->run($count);\n} catch (\\Exception $e) {\n    $output->writeln(\"<error>❌ Error seeding {$module}: {$e->getMessage()}<\/error>\");\n}\n```\n\n---\n\n## 🔍 Troubleshooting\n\n### Masalah Umum Migration\n\n#### 1. **Konflik Migration**\n```bash\n# Periksa migration mana yang sudah diterapkan / pending\n./yii migrate:history\n./yii migrate:new\n```\n\n#### 2. **Masalah Koneksi Database**\n```bash\n# Periksa variabel db.default.* di file .env Anda\n# lalu jalankan ulang:\n./yii migrate:new   # gagal lebih awal jika koneksi tidak bisa dibuat\n```\n\n#### 3. **Masalah Rollback Migration**\n```bash\n# Lewati prompt konfirmasi (gunakan dengan hati-hati)\n./yii migrate:down --force-yes\n\n# Periksa riwayat migration\n./yii migrate:history\n```\n\n### Masalah Umum Seeding\n\n#### 1. **Error Environment**\n```bash\n# Periksa environment saat ini\necho $APP_ENV\n\n# Set environment secara manual\nexport APP_ENV=dev\n./yii seed --module=example\n```\n\n#### 2. **Seeder Tidak Ditemukan**\n```bash\n# \"Seeder not found: App\\Seeder\\SeedXxxData\" berarti class-nya belum ada.\n# Buat src/Seeder/SeedXxxData.php yang meng-extend AbstractSeederData, lalu:\n./yii seed --module=xxx --count=1\n```\n\n#### 3. **Masalah Fixture**\n```bash\n# \"Fixture file not found\" -> buat file YAML di src/Seeder/Fixtures/\n# \"No entities found in fixtures\" -> blok __factory di YAML harus menghasilkan\n# instance dari ENTITY_CLASS milik seeder.\n```\n\n---\n\n## 📚 Topik Lanjutan\n\n### 1. **Migration Kondisional**\n```php\npublic function up(MigrationBuilder $b): void\n{\n    // Only run in specific conditions\n    if (\\App\\Environment::isProd()) {\n        return; // Skip in production\n    }\n    \n    // Migration logic\n}\n```\n\n### 2. **Transformasi Data**\n```php\nuse App\\Shared\\Core\\Enums\\RecordStatus;\n\npublic function up(MigrationBuilder $b): void\n{\n    // Transform existing data\n    $b->update('example', [\n        'status' => RecordStatus::ACTIVE->value\n    ], ['status' => RecordStatus::DRAFT->value]);\n}\n```\n\n### 3. **Operasi Batch**\n```php\npublic function up(MigrationBuilder $b): void\n{\n    // Process in batches for large datasets\n    $batchSize = 1000;\n    $offset = 0;\n    \n    do {\n        $rows = $this->generateBatch($offset, $batchSize);\n        $b->insertBatch('example', $rows);\n        \n        $offset += $batchSize;\n    } while (count($rows) === $batchSize);\n}\n```\n\n---\n\n## 🎯 Ringkasan\n\n### Poin Penting\n\n1. **Pisahkan Tanggung Jawab**: Gunakan migration untuk skema, seed untuk data\n2. **Keamanan Environment**: Batasi seeding hanya untuk development\n3. **Operasi Reversible**: Selalu implementasikan logika rollback\n4. **Seeding Fleksibel**: Gunakan perintah console untuk seeding yang dapat dipakai ulang\n5. **Error Handling**: Terapkan error handling dan logging yang baik\n\n### Alur Kerja yang Direkomendasikan\n\n```bash\n# Development\n./yii migrate:up                    # Terapkan perubahan skema\n./yii seed --module=example          # Refresh data seed\n./yii serve                         # Jalankan development\n\n# Testing\nAPP_ENV=test ./yii migrate:up        # Skema test\ncomposer test                        # Jalankan test\n\n# Production\nAPP_ENV=prod ./yii migrate:up         # Hanya skema production\n# Tidak ada seeding di production\n```\n\n---\n\n## 📞 Sumber Daya\n\n### Dokumentasi\n- **[yiisoft/db-migration](https://github.com/yiisoft/db-migration)**: Dokumentasi package migration\n- **[yiisoft/yii-console](https://github.com/yiisoft/yii-console)**: Package aplikasi console\n- **[nelmio/alice](https://github.com/nelmio/alice)**: Library generator fixture yang digunakan oleh seeder\n\n### Tools\n- **[MigrationBuilder](../vendor/yiisoft/db-migration/src/MigrationBuilder.php)**: Operasi skema/data yang tersedia\n- **[AbstractSeederData](../src/Infrastructure/Core/Seeder/AbstractSeederData.php)**: Base class seeder\n\n### Contoh\n- **[Project Examples](../src/Migration/)**: Contoh migration dalam proyek ini\n- **[Seed Examples](../src/Seeder/)**: Seeder, fixture, dan provider Faker dalam proyek ini\n- **[Console Examples](../src/Console/)**: Contoh perintah console\n\n---\n\n## 🎉 Kesimpulan\n\nManajemen migration dan seeding yang tepat sangat penting untuk menjaga konsistensi data dan mendukung alur kerja development. Dengan mengikuti pola dan praktik terbaik yang diuraikan dalam panduan ini, Anda dapat memastikan manajemen skema database yang andal serta seeding data yang aman di berbagai environment.\n\nManfaat utama dari pendekatan ini:\n\n- **🏗️ Arsitektur Bersih**: Pemisahan tanggung jawab untuk migration dan seeding\n- **🔒 Keamanan Environment**: Seeding khusus development dengan pemeriksaan yang tepat\n- **🔄 Operasi Reversible**: Dukungan rollback penuh untuk semua perubahan\n- **🚀 Seeding Fleksibel**: Perintah console yang dapat dipakai ulang dengan opsi\n- **📊 Data Konsisten**: Pengisian data yang andal di berbagai environment\n\nTerapkan praktik-praktik ini dalam proyek Yii3 API Anda untuk manajemen database yang tangguh! 🚀\n", "18-localization-guide.md": "# Panduan Lokalisasi dan Internasionalisasi\n\n## 📋 Gambaran Umum\n\nPanduan ini membahas sistem lokalisasi dan internasionalisasi (i18n) pada aplikasi Yii3 API. Sistem ini menggunakan `yiisoft/translator` dengan message source berbasis array PHP, mendukung multi-bahasa, dan menyediakan file pesan terstruktur untuk berbagai jenis pesan aplikasi.\n\n---\n\n## 🏗️ Struktur Lokalisasi\n\n### Struktur Direktori\n\n```\nresources/messages/\n├── en/                    # English messages\n│   ├── app.php            # Project-owned application messages\n│   ├── error.php          # Error messages (skeleton-managed)\n│   ├── success.php        # Success messages (skeleton-managed)\n│   └── validation.php     # Validation messages (skeleton-managed)\n└── id/                    # Indonesian messages\n    ├── app.php            # Project-owned application messages\n    ├── error.php          # Error messages (skeleton-managed)\n    ├── success.php        # Success messages (skeleton-managed)\n    └── validation.php     # Validation messages (skeleton-managed)\n```\n\n> ⚠️ `error.php`, `success.php`, dan `validation.php` **dihasilkan oleh skeleton** dan akan ditimpa oleh `composer skeleton:update`. Tambahkan pesan khusus proyek hanya ke `app.php`.\n\n### Bahasa yang Didukung\n\n- **Inggris (en)**: Bahasa default, digunakan untuk pengembangan dan pengguna internasional\n- **Indonesia (id)**: Bahasa lokal untuk pengguna Indonesia\n\n### Kategori Terjemahan\n\nSetiap nama file adalah kategori yang didaftarkan melalui `CategorySource`:\n\n| Kategori | File | Tujuan |\n|---|---|---|\n| `app` | `app.php` | Pesan aplikasi milik proyek |\n| `error` | `error.php` | Pesan error/exception |\n| `success` | `success.php` | Pesan sukses |\n| `validation` | `validation.php` | Pesan aturan validasi |\n\n---\n\n## 📁 File Pesan\n\n### 1. Pesan Aplikasi (app.php)\n\n**Tujuan**: Pesan milik proyek — satu-satunya file yang boleh Anda edit.\n\n#### Versi Inggris (`resources/messages/en/app.php`)\n```php\n<?php\n\ndeclare(strict_types=1);\n\n/**\n * Application messages (English)\n *\n * THIS IS A PROJECT-OWNED FILE. Add custom messages here.\n * Messages in `error.php`, `success.php`, and `validation.php` are managed by\n * the skeleton and will be overwritten by `composer skeleton:update`.\n */\nreturn [\n    /*\n     * Add your application-specific error, success, or validation messages here.\n     * Example: 'validation.custom_rule' => 'The {field} is invalid.',\n     */\n\n    'success' => 'Success',\n];\n```\n\n**Contoh Penggunaan**:\n```php\n// In an action or service — TranslatorInterface is injectable\n$successMessage = $this->translator->translate('success', [], 'app');\n```\n\n---\n\n### 2. Pesan Error (error.php)\n\n**Tujuan**: Pesan error sistem dan penanganan exception. Key datar dengan awalan titik (flat, dot-prefixed).\n\n#### Versi Inggris (`resources/messages/en/error.php`) — key aktual meliputi:\n\n```php\nreturn [\n    // HTTP Prefix (Generic API Errors)\n    'http.bad_request' => 'The request is invalid or malformed',\n    'http.unauthorized' => 'Authentication is required or has failed',\n    'http.forbidden' => 'You do not have permission to access this resource',\n    'http.not_found' => 'The requested resource was not found',\n    'http.method_not_allowed' => 'The HTTP method is not allowed for this endpoint',\n    'http.unsupported_media_type' => 'The requested media type is not supported',\n    'http.too_many_requests' => 'Too many requests. Please try again later',\n    'http.internal_error' => 'An internal server error occurred',\n    'http.service_unavailable' => 'The service is temporarily unavailable',\n    'http.missing_request_params' => 'Missing request parameters.',\n\n    // Security Prefix\n    'security.host_not_allowed' => 'Access denied: Host not allowed',\n\n    // Auth Prefix (Infrastructure Level)\n    'auth.header_missing' => 'Authorization header is missing',\n    'auth.invalid_token' => 'Access token is invalid or has expired',\n    'auth.invalid_issuer' => 'The token issuer is invalid',\n    'auth.invalid_audience' => 'The token audience is invalid',\n    'auth.missing_claim' => 'The token is missing a required claim: {claim}',\n    'auth.invalid_secret' => 'The token secret is invalid',\n\n    // Request Prefix\n    'request.invalid_json' => 'The request body contains invalid JSON',\n    'request.invalid_body' => 'The request body is invalid or malformed',\n    'request.missing_parameter' => 'Required parameter is missing: {param}',\n    'request.invalid_parameter' => 'The parameter value is invalid: {param}',\n    'request.host_not_allowed' => 'The host is not allowed: {host}',\n    'request.origin_not_allowed' => 'The origin is not allowed: {origin}',\n\n    // Filtering / Sorting / Pagination / Route\n    'filter.invalid_keys' => 'The request contains unsupported filter field(s): {keys}',\n    'filter.not_allowed' => 'Filtering by the field \"{filter}\" is not allowed',\n    'sort.invalid_field' => 'The specified sort field \"{field}\" is invalid or not allowed',\n    'sort.invalid_direction' => 'The sort direction \"{direction}\" is invalid. Use \"asc\" or \"desc\"',\n    'pagination.invalid_page' => 'The page number must be a valid positive integer',\n    'pagination.invalid_limit' => 'The page size value is invalid',\n    'pagination.invalid_page_size' => 'The page size value is invalid',\n    'pagination.invalid_parameter' => 'Invalid \"{parameter}\" parameter',\n    'route.field_required' => 'Invalid request. {resource} {field} is required in the URL',\n    'route.parameter_missing' => '{resource} {parameter} parameter is required in the URL',\n\n    // Validation\n    'validation.failed' => 'Validation failed. Please review the provided data',\n    'validation.invalid_payload' => 'The {resource} payload is invalid',\n\n    // Data type / Format / Range & Length / File\n    'type.string' => 'The {field} field must be a string',\n    'type.integer' => 'The {field} field must be an integer',\n    'type.numeric' => 'The {field} field must be a numeric value',\n    'type.boolean' => 'The {field} field must be a boolean value',\n    'type.array' => 'The {field} field must be an array',\n    'type.object' => 'The {field} field must be an object',\n    'format.email' => 'The {field} field must be a valid email address',\n    'format.url' => 'The {field} field must be a valid URL',\n    'format.uuid' => 'The {field} field must be a valid UUID',\n    'format.date' => 'The {field} field must be a valid date',\n    'format.datetime' => 'The {field} field must be a valid date and time',\n    'format.json' => 'The {field} field must contain valid JSON',\n    'range.min' => 'The {field} field must be greater than or equal to {min}',\n    'range.max' => 'The {field} field must be less than or equal to {max}',\n    'length.min' => 'The {field} field must contain at least {min} characters',\n    'length.max' => 'The {field} field must not exceed {max} characters',\n    'file.invalid' => 'The uploaded file is invalid',\n    'file.too_large' => 'The uploaded file exceeds the maximum allowed size',\n    'file.invalid_type' => 'The uploaded file type is not allowed',\n\n    // Resource (Business Logic)\n    'resource.not_found' => '{resource} data with {field}: {value} was not found',\n    'resource.conflict' => 'A conflict occurred with the {resource}',\n    'resource.already_exists' => 'The {resource} already exists',\n    'resource.cannot_update' => 'Cannot update {resource}. Status change from \"{current_status}\" to \"{status}\" is not allowed',\n    'resource.update_not_allowed_by_status' => 'Data changes are not allowed for {resource} when its status is \"{current_status}\"',\n    'resource.status_already_set' => 'Cannot update {resource}. The status is already \"{current_status}\"',\n    'resource.modification_denied_on_deleted' => 'Action prohibited: The requested operation cannot be performed because the {resource} is marked as \"{status}\".',\n    'resource.not_deleted' => 'Cannot restore data with id: {id} because it is not deleted',\n\n    // Access & Rate Limit\n    'operation.not_allowed' => 'This operation is not allowed',\n    'access.denied' => 'Access to this resource is denied',\n    'access.insufficient_permissions' => 'You do not have sufficient permissions to perform this action',\n    'access.auth_required' => 'Authentication is required to access this resource',\n    'rate_limit.exceeded' => 'Too many requests. Please try again after {seconds} seconds',\n    'rate_limit.try_again' => 'Please try again in {seconds} seconds',\n\n    'business.violation' => 'Business rule violation: {reason}',\n    'business.limit_reached' => 'Limit {resource} reached',\n    'business.requirement_unmet' => 'Requirement not met: {reason}',\n\n    'service.error' => 'Failed to process request: {reason}',\n    'service.unavailable' => 'Service \"{service}\" is unavailable',\n    'service.failed' => 'The service process failed',\n\n    'factory.detail_info.uninitialized_state' => 'Internal error: The factory state is uninitialized. You must call {methods} before performing this operation.',\n\n    // Optimistic Locking\n    'optimistic.lock.failed' => '{resource} data has been modified by another user. Please refresh and try again.',\n    'lock_version.invalid_negative' => 'Lock version cannot be negative: {value}',\n\n    // Seeder\n    'seeder.missing_entity_class' => 'ENTITY_CLASS constant must be defined in {class}',\n    'seeder.missing_yaml_file' => 'YAML_FILE constant must be defined in {class}',\n];\n```\n\n#### Versi Indonesia (`resources/messages/id/error.php`)\n\nMencerminkan file Inggris key-per-key dengan teks Bahasa Indonesia, mis.:\n\n```php\nreturn [\n    'http.bad_request' => 'Permintaan tidak valid atau formatnya salah',\n    'http.not_found' => 'Sumber daya yang diminta tidak ditemukan',\n    'auth.header_missing' => 'Header otorisasi tidak ditemukan',\n    'auth.missing_claim' => 'Token tidak memiliki klaim yang diperlukan: {claim}',\n    // ... same flat dot-prefixed keys as en/error.php\n];\n```\n\n**Contoh Penggunaan**:\n```php\n// Via TranslatorInterface\n$message = $this->translator->translate('http.not_found', [], 'error');\n// en: \"The requested resource was not found\"\n// id: \"Sumber daya yang diminta tidak ditemukan\"\n\n$message = $this->translator->translate('auth.missing_claim', ['claim' => 'user.username'], 'error');\n// en: \"The token is missing a required claim: user.username\"\n```\n\n---\n\n### 3. Pesan Sukses (success.php)\n\n**Tujuan**: Pesan sukses dan umpan balik positif.\n\n#### Versi Inggris (`resources/messages/en/success.php`) — key aktual meliputi:\n\n```php\nreturn [\n    // General Success\n    'success' => 'Success',\n    'ok' => 'OK',\n    'completed' => '{resource} completed successfully',\n    'processed' => '{resource} processed successfully',\n\n    // Global CRUD Operations\n    'resource.created' => '{resource} has been created successfully.',\n    'resource.updated' => '{resource} has been updated successfully.',\n    'resource.deleted' => '{resource} has been deleted successfully.',\n    'resource.restored' => '{resource} has been restored successfully.',\n    'resource.list_retrieved' => '{resource} list retrieved successfully.',\n    'resource.details_retrieved' => '{resource} details retrieved successfully.',\n    'resource.no_changes_detected' => 'No changes detected for {resource}. The submitted data is identical to the current record.',\n\n    // Specific Operations (non-CRUD)\n    'user.activated' => 'User {name} has been activated successfully',\n    'user.deactivated' => 'User {name} has been deactivated successfully',\n    'user.password_changed' => 'Password has been changed successfully',\n    'user.profile_updated' => 'Profile has been updated successfully',\n\n    // Authentication\n    'auth.login_success' => 'Login successful',\n    'auth.logout_success' => 'Logout successful',\n    'auth.password_reset_sent' => 'Password reset link has been sent to your email',\n    'auth.password_reset_success' => 'Your password has been reset successfully',\n    'auth.email_verified' => 'Email address has been verified successfully',\n    'auth.account_created' => 'Your account has been created successfully',\n\n    // Data / File / Settings / System / Notification / Report / Bulk / API groups also exist\n    'data.imported' => 'Data has been imported successfully',\n    'file.uploaded' => 'File has been uploaded successfully',\n    'settings.updated' => 'Settings have been updated successfully',\n    'system.cache_cleared' => 'Cache has been cleared successfully',\n    'notification.sent' => 'Notification has been sent successfully',\n    'report.generated' => 'Report has been generated successfully',\n    'bulk.created' => '{resource} have been created successfully',\n    'api.request_processed' => 'API request has been processed successfully',\n];\n```\n\n**Contoh Penggunaan**:\n```php\n$message = $this->translator->translate('resource.created', ['resource' => 'Example'], 'success');\n// en: \"Example has been created successfully.\"\n// id: \"Example telah berhasil dibuat.\"\n\n$message = $this->translator->translate('auth.login_success', [], 'success');\n// en: \"Login successful\"\n// id: \"Login berhasil\"\n```\n\n---\n\n### 4. Pesan Validasi (validation.php)\n\n**Tujuan**: Pesan validasi form dan validasi data yang digunakan oleh validator di `src/Shared/Core/Validation/`.\n\n#### Versi Inggris (`resources/messages/en/validation.php`) — kelompok key aktual:\n\n```php\nreturn [\n    // Required\n    'required' => 'The {resource} field is required',\n    'required.if' => 'The {resource} field is required when {other} is {value}',\n    'required.unless' => 'The {resource} field is required unless {other} is {value}',\n    'required.with' => 'The {resource} field is required when {other} is present',\n    'required.without' => 'The {resource} field is required when {other} is not present',\n    'filled' => 'The {resource} field must have a value',\n    'present' => 'The {resource} field must be present',\n    'not_found' => 'The {resource} data was not found',\n    'entity_required' => 'The {resource} entity is required',\n    'name_required' => 'The {resource} name is required',\n\n    // String / Number prefixes\n    'string.min' => 'The {field} field must be at least {min} characters',\n    'string.max' => 'The {field} field must not exceed {max} characters',\n    'string.between' => 'The {field} field must be between {min} and {max} characters',\n    'number.integer' => 'The {field} field must be an integer',\n    'number.min' => 'The {field} field must be at least {min}',\n    'number.max' => 'The {field} field must not exceed {max}',\n\n    // Format\n    'format.email' => 'The {field} field must be a valid email address',\n    'format.url' => 'The {field} field must be a valid URL',\n    'format.uuid' => 'The {field} field must be a valid UUID',\n    'format.regex' => 'The {field} field format is invalid',\n\n    // Date & Time\n    'date.invalid' => 'The {field} field must be a valid date',\n    'date.before' => 'The {field} field must be a date before {date}',\n    'date.after' => 'The {field} field must be a date after {date}',\n\n    // File / Image\n    'file.invalid' => 'The {resource} must be a valid file',\n    'file.mimes' => 'The {resource} must be a file of type: {types}',\n    'image.invalid' => 'The {resource} must be an image',\n    'image.dimensions' => 'The {resource} has invalid image dimensions',\n\n    // Comparison / Boolean / Array\n    'compare.same' => 'The {resource} must match {other}',\n    'compare.confirmed' => 'The {resource} confirmation does not match',\n    'boolean.invalid' => 'The {resource} field must be true or false',\n    'array.min' => 'The {resource} must have at least {min} items',\n    'array.distinct' => 'The {resource} field has duplicate values',\n\n    // Permission / Existence\n    'action_not_allowed' => 'You do not have permission to {action} this {resource}',\n    'exists.invalid' => 'The selected {resource} does not exist',\n    'exists.unique' => 'The {resource} has already been taken',\n    'exists.already_exists' => 'The {resource} with value \"{value}\" already exists',\n    'exists.cannot_delete_active' => 'Cannot delete {resource} while it is still active',\n\n    // Special\n    'special.nullable' => 'The {resource} field may be null',\n    'special.prohibited' => 'The {resource} field is prohibited',\n\n    // Status\n    'status.forbid_update' => '{resource} data with status \"{status}\" cannot be updated',\n    'status.invalid_transition' => 'Cannot update {resource} from status \"{from}\" to \"{to}\"',\n    'status.cannot_delete' => 'Cannot delete {resource} with status \"{status}\"',\n\n    // Restore\n    'resource.restored' => '{resource} has been restored successfully',\n    'resource.restore_failed' => 'Failed to restore {resource}: {error}',\n    'resource.not_deleted' => '{resource} data is not in \"Deleted\" status',\n\n    // Sync (note the post-rename keys: sync_flag, NOT sync_slave)\n    'sync_mdb.invalid_value' => 'Invalid sync_mdb value \"{value}\". Allowed values: {allowed_values}',\n    'sync_mdb.invalid_format' => 'Invalid sync_mdb format \"{value}\". Expected a numeric value or null',\n    'sync_flag.invalid_value' => 'Invalid sync_flag value \"{value}\". Allowed values: {allowed_values}',\n    'sync_flag.invalid_direction' => 'Invalid sync direction \"{value}\". Allowed values: {allowed_values}',\n\n    // Request / Input Sanitizer\n    'request.unknown_parameters' => 'Unknown parameters: {unknown_keys}. Allowed parameters: {allowed_keys}',\n    'input_sanitizer.input_structure_too_deep' => 'Input structure is too deep. Current depth is {depth}, but the maximum allowed is {max_depth}.',\n    'input_sanitizer.input_too_long' => 'Input is too long. Current length is {length}, but the maximum allowed is {max_length}.',\n    'input_sanitizer.invalid_encoding' => 'Input contains invalid encoding. Current encoding is {encoding}.',\n    'input_sanitizer.array_too_large' => 'The array exceeds the maximum allowed size of {max_size} elements.',\n    'input_sanitizer.float_overflow' => 'Value is out of range. It must be between {min_value} and {max_value}.',\n    'input_sanitizer.integer_overflow' => 'Value is out of range. It must be between {min_value} and {max_value}.',\n    'input_sanitizer.invalid_array_key_type' => 'The array key {key} has an invalid type. Keys must be strings or integers.',\n    'input_sanitizer.invalid_array_key_length' => 'The array key is too long. Maximum allowed length for a key is {max_length} characters,',\n    'input_sanitizer.invalid_array_key' => 'The array key {key} contains invalid characters or format.',\n];\n```\n\n**Contoh Penggunaan**:\n```php\n$message = $this->translator->translate('required', ['resource' => 'name'], 'validation');\n// en: \"The name field is required\"\n// id: \"Field name wajib diisi\"\n\n$message = $this->translator->translate('string.min', ['field' => 'name', 'min' => 3], 'validation');\n// en: \"The name field must be at least 3 characters\"\n```\n\n---\n\n## 🔧 Konfigurasi Translator\n\n### Konfigurasi DI\n\n**File**: `config/common/di/translator-di.php` (konten aktual)\n\n```php\n<?php\n\ndeclare(strict_types=1);\n\nuse Yiisoft\\Translator\\CategorySource;\nuse Yiisoft\\Translator\\IntlMessageFormatter;\nuse Yiisoft\\Translator\\Message\\Php\\MessageSource;\nuse Yiisoft\\Translator\\Translator;\nuse Yiisoft\\Translator\\TranslatorInterface;\n\n/** @var array $params */\n\n// Core translator binding. Project-owned bindings may be merged from\n// config/common/translator.php and can override these defaults.\n$projectBindings = \\dirname(__DIR__) . '/translator.php';\n\nreturn array_merge([\n    TranslatorInterface::class => static function () {\n        $translator = new Translator('en');\n\n        $messageSource = new MessageSource(__DIR__ . '/../../../resources/messages');\n        $formatter     = new IntlMessageFormatter();\n\n        $translator->addCategorySources(\n            new CategorySource('app', $messageSource, $formatter),\n            new CategorySource('validation', $messageSource, $formatter),\n            new CategorySource('error', $messageSource, $formatter),\n            new CategorySource('success', $messageSource, $formatter),\n        );\n\n        return $translator;\n    },\n], file_exists($projectBindings) ? require $projectBindings : []);\n```\n\n### Override Proyek\n\n**File**: `config/common/translator.php` — mengembalikan array yang di-merge di atas default; dapat me-rebind `TranslatorInterface::class` (mis. `static fn () => new Translator('id')`).\n\n### Params Locale\n\n`config/common/params.php` mengekspos locale yang dikonfigurasi di bawah `yiisoft/translator` (dari env var `app.config.language`):\n\n```php\n'yiisoft/translator' => [\n    'locale'         => $_ENV['app.config.language'],\n    'fallbackLocale' => $_ENV['app.config.language'],\n],\n```\n\n### API `TranslatorInterface` (yiisoft/translator)\n\n```php\n$translator->translate(\n    string|\\Stringable $id,\n    array $parameters = [],\n    ?string $category = null,   // 'app' | 'error' | 'success' | 'validation'\n    ?string $locale = null,     // 'en' | 'id' | ... (null = default locale)\n): string;\n\n$translator->setLocale('id');              // change default locale (mutates)\n$translator->getLocale();                  // current default locale\n$translator->withLocale('id');             // new instance with locale\n$translator->withDefaultCategory('error'); // new instance with default category\n```\n\n---\n\n## 🚀 Contoh Penggunaan\n\n### Terjemahan Dasar\n\n```php\n// Simple translation\n$message = $translator->translate('success', [], 'app');\n\n// Error messages\n$error = $translator->translate('http.not_found', [], 'error');\n\n// Success messages\n$success = $translator->translate('resource.created', ['resource' => 'Example'], 'success');\n\n// Validation messages\n$validation = $translator->translate('required', ['resource' => 'name'], 'validation');\n```\n\n### Terjemahan dengan Parameter\n\n```php\n$tooShort = $translator->translate('string.min', [\n    'field' => 'name',\n    'min' => 3\n], 'validation');\n// en: \"The name field must be at least 3 characters\"\n\n$resourceCreated = $translator->translate('resource.created', [\n    'resource' => 'Example'\n], 'success');\n// en: \"Example has been created successfully.\"\n// id: \"Example telah berhasil dibuat.\"\n```\n\n### Value Object Message\n\nException dan `ResponseFactory` membawa objek `App\\Shared\\Core\\ValueObject\\Message` yang diterjemahkan secara lazy saat render:\n\n```php\nuse App\\Shared\\Core\\ValueObject\\Message;\n\n$message = Message::create(\n    key: 'resource.not_found',\n    params: ['resource' => 'Example', 'field' => 'id', 'value' => 123],\n    domain: 'error', // category; null falls back to the renderer's default ('error')\n);\n\n// Rendered as:\n$translator->translate($message->getKey(), $message->getParams(), $message->getDomain() ?? 'error');\n```\n\n---\n\n## 🌐 Deteksi dan Pergantian Bahasa\n\n### Get/Set Locale\n\n```php\n$currentLocale = $translator->getLocale();   // e.g. \"en\" or \"id\"\n$translator->setLocale('id');                // set to Indonesian\n$translator->setLocale('en');                // set to English\n```\n\n### Locale per Panggilan\n\n```php\n// Translate to a specific locale without changing the default\n$message = $translator->translate('http.not_found', [], 'error', 'id');\n\n// Or create a derived translator\n$idTranslator = $translator->withLocale('id');\n$message = $idTranslator->translate('http.not_found', [], 'error');\n```\n\n### Bahasa dari Request\n\n```php\n// Get language from Accept-Language header\n$acceptLanguage = $request->getHeaderLine('Accept-Language');\n// Example: \"en-US,en;q=0.9,id;q=0.8\"\n\nif (str_contains($acceptLanguage, 'id')) {\n    $translator->setLocale('id');\n}\n```\n\n---\n\n## 📝 Menambahkan Bahasa Baru\n\n### 1. **Buat Direktori Bahasa**\n\n```bash\nmkdir resources/messages/fr\n```\n\n### 2. **Buat File Pesan**\n\n```php\n<?php\n// resources/messages/fr/app.php\nreturn [\n    'success' => 'Succès',\n    // ... other translations mirroring the en/ key structure\n];\n```\n\n### 3. **Atur Locale Default**\n\n```env\n# .env\napp.config.language=fr\n```\n\nParams `yiisoft/translator` (`locale`/`fallbackLocale`) membaca nilai ini; translator juga dapat diganti saat runtime melalui `setLocale()`/`withLocale()`, atau binding dapat di-override di `config/common/translator.php`.\n\n---\n\n## 🔍 Praktik Terbaik\n\n### 1. **Organisasi Pesan**\n\n```php\n// ✅ Good: Dot-prefixed, grouped by context\n'resource.not_found' => '{resource} data with {field}: {value} was not found',\n'resource.already_exists' => 'The {resource} already exists',\n'status.invalid_transition' => 'Cannot update {resource} from status \"{from}\" to \"{to}\"',\n\n// ❌ Avoid: Deeply nested arrays (message sources use flat keys)\n```\n\n### 2. **Penggunaan Parameter**\n\n```php\n// ✅ Good: Use parameters for dynamic values\n'string.min' => 'The {field} field must be at least {min} characters',\n\n// ❌ Avoid: Hardcoded values\n'string.min' => 'The name field must be at least 3 characters',\n```\n\n### 3. **Penamaan Konsisten**\n\n```php\n// ✅ Good: Consistent naming convention (prefix.context)\n'resource.created' => '{resource} has been created successfully.',\n'resource.updated' => '{resource} has been updated successfully.',\n'resource.deleted' => '{resource} has been deleted successfully.',\n\n// ❌ Avoid: Inconsistent naming\n'create_success' => 'Resource created successfully',\n'update_done' => 'Resource updated successfully',\n```\n\n### 4. **Hormati Batas Skeleton**\n\n```php\n// ✅ Good: Add project keys to resources/messages/{locale}/app.php\n// ❌ Avoid: Editing error.php / success.php / validation.php —\n//    they are regenerated by `composer skeleton:update`\n```\n\n---\n\n## 🛠️ Pemeliharaan\n\n### 1. **Jaga Locale Tetap Sinkron**\n\nSaat menambahkan key ke `en/app.php`, tambahkan key yang sama ke `id/app.php` (dan locale lainnya) — himpunan key harus tetap identik.\n\n### 2. **Konsistensi Placeholder**\n\nPastikan `{placeholders}` cocok di semua locale — `IntlMessageFormatter` melakukan substitusi berdasarkan nama:\n\n```php\n// en/app.php\n'greeting' => 'Hello, {name}!',\n// id/app.php — same placeholder names\n'greeting' => 'Halo, {name}!',\n```\n\n### 3. **Key yang Hilang**\n\n`translate()` mengembalikan message ID sumber apa adanya saat terjemahan tidak ditemukan — waspadai key mentah seperti `http.not_found` yang muncul di response, yang menandakan entri pesan yang hilang.\n\n---\n\n## 📊 Pertimbangan Performa\n\n### 1. **Pemuatan Pesan**\n- `MessageSource` memuat file pesan array PHP per kategori/locale — pembacaan file dibatasi pada `resources/messages/{locale}/{category}.php`\n\n### 2. **Formatting**\n- `IntlMessageFormatter` menangani substitusi `{placeholder}`; jaga array parameter tetap kecil\n\n### 3. **Instance**\n- Utamakan instance turunan `withLocale()`/`withDefaultCategory()` dibanding mengubah state bersama di tengah request\n\n---\n\n## 🎯 Ringkasan\n\nSistem lokalisasi menyediakan dukungan internasionalisasi yang komprehensif untuk aplikasi Yii3 API. Manfaat utamanya meliputi:\n\n- **🌐 Dukungan Multi-Bahasa**: Inggris dan Indonesia dengan ekstensi mudah untuk bahasa lain\n- **📝 Pesan Terstruktur**: Terorganisir berdasarkan kategori (`app`, `error`, `success`, `validation`)\n- **🔧 Konfigurasi Fleksibel**: Binding DI di `config/common/di/translator-di.php`, override proyek di `config/common/translator.php`\n- **🔗 Integrasi Exception**: Value object `Message` membawa `key`/`params`/`domain` hingga ke lapisan response\n- **🛡️ Type Safe**: `TranslatorInterface` dengan array parameter\n- **📊 Maintainable**: Pesan inti yang dikelola skeleton + `app.php` milik proyek\n\nDengan mengikuti pola dan praktik terbaik yang diuraikan dalam panduan ini, Anda dapat membuat sistem lokalisasi yang kuat dan mudah dipelihara untuk aplikasi Yii3 API Anda! 🚀\n", "19-shared-components-guide.md": "# Panduan Shared Components\n\n## 📋 Gambaran Umum\n\nPanduan ini mencakup shared components di `src/Shared/` (ditambah kode shared kernel di `src/Domain/Shared/` dan `src/Infrastructure/Core/`). Komponen-komponen ini menyediakan fungsionalitas yang dapat digunakan kembali di seluruh layer aplikasi, mengikuti prinsip Domain-Driven Design (DDD) dan mendorong reusabilitas kode.\n\n---\n\n## 🏗️ Gambaran Umum Arsitektur Shared\n\n### Struktur Direktori\n\n```\nsrc/Shared/\n├── ApplicationParams.php   # readonly app name/version/language/environment DTO\n├── Common/\n│   └── Context/\n│       └── ValidationContext.php   # implements ValidationContextInterface\n└── Core/\n    ├── Dto/                # SearchCriteria, PaginatedResult\n    ├── Enums/              # AppConstants, RecordStatus\n    ├── ErrorHandler/       # ErrorHandlerResponse (ThrowableRendererInterface)\n    ├── Exception/          # HttpException + final concrete exceptions\n    ├── Middleware/         # PSR-15 middleware (JWT, CORS, rate limit, ...)\n    ├── Query/              # QueryConditionApplier (static helpers)\n    ├── Request/            # RawParams, RequestParams, PaginationParams, SortParams, ...\n    ├── Security/           # InputSanitizer (static)\n    ├── Utility/            # Arrays, FieldMapper, JsonHandler\n    ├── Validation/         # AbstractValidator, ValidationContextInterface, Rules/\n    └── ValueObject/        # Message, LockVersionConfig\n\nsrc/Domain/Shared/Core/\n├── Audit/                  # AuditServiceInterface\n├── Concerns/\n│   ├── Entity/             # Identifiable, Stateful, Descriptive, ChangeLogged\n│   └── Service/            # DomainValidator (guard* / ensure* helpers)\n├── Contract/               # ActorInterface, CurrentUserInterface, DateTimeProviderInterface\n├── Enum/                   # SyncStatus, SyncDirection\n├── Security/               # AuthorizerInterface\n└── ValueObject/            # DetailInfo, LockVersion, ResourceStatus, SyncFlag, SyncMdb\n\nsrc/Infrastructure/Core/\n├── Concerns/               # HasCoreFeatures, HasMongoDBSync, ManagesPersistence, Auditable\n└── Security/               # Actor, CurrentUser, JwtService, AccessChecker, ...\n```\n\n### Kategori Komponen\n\n#### **1. Data Management**\n- **Dto/**: `SearchCriteria`, `PaginatedResult` untuk endpoint list\n- **ValueObject/**: Value object immutable (`Message`, `LockVersion`, `ResourceStatus`, `DetailInfo`, `SyncFlag`, `SyncMdb`, `LockVersionConfig`)\n- **Query/**: Helper kondisi static `QueryConditionApplier`\n\n#### **2. Request & Response**\n- **Request/**: `RawParams`, `RequestParams`, `PaginationParams`, `SortParams`, `RequestDataParser`\n- **Middleware/**: Middleware PSR-15 untuk request pipeline\n\n#### **3. Error Handling**\n- **Exception/**: Hierarki `HttpException`\n- **ErrorHandler/**: Renderer JSON `ErrorHandlerResponse`\n\n#### **4. Business Logic**\n- **Enums/**: Enum `RecordStatus`, konstanta `AppConstants`\n- **Domain Enum/**: `SyncStatus`, `SyncDirection`\n- **Validation/**: `AbstractValidator`, `ValidationContextInterface`, rule kustom (`UniqueValue`, `HasNoDependencies`)\n\n#### **5. Infrastructure**\n- **Security/**: `InputSanitizer` (pembersihan input)\n- **Utility/**: `Arrays`, `FieldMapper`, `JsonHandler`\n- **Concerns/**: Trait entity/repository (`HasCoreFeatures`, `ManagesPersistence`, `HasMongoDBSync`, `Auditable`)\n\n---\n\n## 📚 Panduan Komponen Individual\n\n### 1. [Data Transfer Objects (Dto)](09-dto-guide.md)\nTujuan: Struktur data untuk komunikasi API dan transfer data antar layer.\n\n### 2. [Enumerations (Enums)](11-enums-guide.md)\nTujuan: Enumerasi dan konstanta bersama yang digunakan di seluruh aplikasi.\n\n### 3. [Error Handling](13-error-handling-guide.md)\nTujuan: Utility error handling dan manajemen exception.\n\n### 4. [Exceptions](14-exceptions-guide.md)\nTujuan: Class exception kustom untuk berbagai skenario error.\n\n### 5. [Middleware](16-middleware-guide.md)\nTujuan: Komponen middleware HTTP untuk pipeline pemrosesan request.\n\n### 6. [Query Building](10-query-guide.md)\nTujuan: Utility query building untuk operasi database.\n\n### 7. [Request Processing](06-request-guide.md)\nTujuan: Pemrosesan request HTTP dan utility validasi.\n\n### 8. [Security](15-security-guide.md)\nTujuan: Utility keamanan dan helper autentikasi.\n\n### 9. [Utilities](20-utility-guide.md)\nTujuan: Fungsi utility umum dan class helper.\n\n### 10. [Validation](07-validation-guide.md)\nTujuan: Rule validasi dan utility validasi data.\n\n### 11. [Value Objects](12-value-object-guide.md)\nTujuan: Value object immutable dengan validasi bawaan.\n\n### 12. [Application Parameters](04-application-params-guide.md)\nTujuan: Manajemen dan konfigurasi parameter aplikasi.\n\n---\n\n## 🔧 Pola Penggunaan\n\n### 1. **Dependency Injection**\n```php\n// Shared components are designed for DI injection\nfinal class ExampleApplicationService\n{\n    public function __construct(\n        private AuthorizerInterface $auth,\n        private ExampleRepositoryInterface $repository,\n    ) {}\n}\n```\n\n### 2. **Static Utilities**\n```php\n// Some utilities provide static methods\nuse App\\Shared\\Core\\Query\\QueryConditionApplier;\nuse App\\Shared\\Core\\Security\\InputSanitizer;\nuse App\\Shared\\Core\\Utility\\Arrays;\n\n$clean    = InputSanitizer::process($input);\n$filtered = Arrays::removeNulls($data);\nQueryConditionApplier::filterByExactMatch($query, $filters, $allowedColumns);\n```\n\n### 3. **Value Objects**\n```php\n// Immutable value objects / enums\nuse App\\Domain\\Shared\\Core\\ValueObject\\ResourceStatus;\nuse App\\Shared\\Core\\Enums\\RecordStatus;\nuse App\\Shared\\Core\\ValueObject\\Message;\n\n$status  = ResourceStatus::active();           // VO wrapping RecordStatus::ACTIVE\n$message = Message::create(key: 'resource.not_found', params: ['resource' => 'Example']);\n$state   = RecordStatus::ACTIVE;               // backed enum case\n```\n\n### 4. **Exception Handling**\n```php\n// Custom exceptions carry a Message value object\nuse App\\Shared\\Core\\Exception\\NotFoundException;\n\nthrow new NotFoundException(\n    translate: Message::create(\n        key: 'resource.not_found',\n        params: ['resource' => 'User', 'field' => 'id', 'value' => $id],\n    ),\n);\n```\n\n---\n\n## 🎯 Prinsip Desain\n\n### 1. **Single Responsibility**\n- Setiap komponen memiliki satu tujuan yang jelas dan terdefinisi\n- Komponen fokus dan mudah dipelihara\n\n### 2. **Reusability**\n- Komponen dirancang untuk digunakan kembali di berbagai layer\n- Tidak ada coupling ke logika domain tertentu\n\n### 3. **Type Safety**\n- Pengetikan kuat dengan fitur PHP 8+\n- Value object memastikan integritas data\n\n### 4. **Immutability**\n- Value object dan DTO bersifat `readonly`\n- Mencegah perubahan state yang tidak disengaja\n\n### 5. **Testability**\n- Komponen mudah diuji\n- Dependency injection memungkinkan mocking\n\n---\n\n## 📊 Contoh Integrasi\n\n### 1. **Integrasi Action**\n```php\nfinal class ExampleDataAction\n{\n    public function __construct(\n        private SearchCriteriaFactory $factory,\n        private ExampleApplicationService $applicationService,\n        private ResponseFactory $responseFactory,\n    ) {}\n\n    public function __invoke(ServerRequestInterface $request): ResponseInterface\n    {\n        /** @var RequestParams $payload — set by RequestParamsMiddleware */\n        $payload = $request->getAttribute('payload');\n\n        $criteria = $this->factory->createFromRequest(\n            params: $payload,\n            allowedSort: ['id' => 'id', 'name' => 'name'],\n        );\n\n        $result = $this->applicationService->list(criteria: $criteria);\n\n        return $this->responseFactory->success(\n            data: $result->data,\n            meta: $result->getMeta(),\n        );\n    }\n}\n```\n\n### 2. **Integrasi Service**\n```php\nfinal class ExampleApplicationService\n{\n    public function __construct(\n        private AuthorizerInterface $auth,\n        private ExampleRepositoryInterface $repository,\n        private ExampleDomainService $domainService,\n    ) {}\n\n    public function delete(int $id): ExampleResponse\n    {\n        $this->domainService->guardPermission(\n            id: $id,\n            authorizer: $this->auth,\n            permission: 'example.delete',\n            resource: $this->getResource(),\n        );\n        // ...\n    }\n}\n```\n\n### 3. **Integrasi Repository**\n```php\nfinal class ExampleRepository implements ExampleRepositoryInterface, CurrentUserAwareInterface\n{\n    use HasCoreFeatures;\n    use HasMongoDBSync;\n    use ManagesPersistence;\n\n    public function findById(int $id, ?int $status = null): ?Example\n    {\n        $row = (new Query($this->db))\n            ->from(self::TABLE_NAME)\n            ->where(['id' => $id])\n            ->andWhere($this->scopeWhereNotDeleted())\n            ->andWhere($this->scopeByStatus($status))\n            ->one();\n\n        return $row ? Example::reconstitute(/* ... */) : null;\n    }\n}\n```\n\n---\n\n## 🚀 Praktik Terbaik\n\n### 1. **Penggunaan Komponen**\n```php\n// ✅ Use dependency injection\npublic function __construct(\n    private ExampleRepositoryInterface $repository\n) {}\n\n// ❌ Avoid manual instantiation of services\n$repository = new ExampleRepository($db);\n```\n\n### 2. **Error Handling**\n```php\n// ✅ Use custom exceptions\nthrow new NotFoundException(translate: Message::create(key: 'resource.not_found', params: [...]));\n\n// ❌ Avoid generic exceptions\nthrow new RuntimeException('User not found');\n```\n\n### 3. **Validation**\n```php\n// ✅ Use value objects and validators\n$status = ResourceStatus::from($input);       // throws on invalid value\n$validator->validate($data, ValidationContextInterface::CREATE);\n\n// ❌ Avoid scattered manual checks\nif (!filter_var($input, FILTER_VALIDATE_EMAIL)) {\n    throw new ValidationException();\n}\n```\n\n### 4. **Data Transfer**\n```php\n// ✅ Use typed DTOs / commands for API communication\nfinal readonly class CreateExampleCommand\n{\n    public function __construct(\n        public string $name,\n        public int $status,\n    ) {}\n}\n\n// ❌ Avoid passing raw associative arrays between layers\n$data = ['name' => $name, 'status' => $status];\n```\n\n---\n\n## 📚 Dokumentasi Terkait\n\n- **[Architecture Guide](02-architecture-guide.md)**: Gambaran umum arsitektur lengkap\n- **[DI Configuration Guide](05-di-configuration-guide.md)**: Setup dependency injection\n- **[Migration & Seeding Guide](17-migration-seeding-guide.md)**: Migrasi database dan seeder\n- **[Quality Guide](21-quality-guide.md)**: Tooling dan standar kualitas kode\n- **[Setup Guide](01-setup-guide.md)**: Setup proyek dan konfigurasi environment\n\n---\n\n## 🎯 Ringkasan\n\nShared components menyediakan fondasi yang kuat untuk membangun kode yang mudah dipelihara, dapat diuji, dan dapat digunakan kembali di aplikasi Yii3 API. Manfaat utamanya meliputi:\n\n- **🔄 Reusability**: Komponen dapat digunakan di berbagai layer\n- **🛡️ Type Safety**: Pengetikan kuat mencegah runtime error\n- **🧪 Testability**: Mudah di-unit test dengan dependency injection\n- **📦 Modularity**: Setiap komponen memiliki single responsibility\n- **🔧 Maintainability**: Separation of concerns yang jelas\n- **🚀 Performance**: Dioptimalkan untuk kasus penggunaan umum\n\nDengan mengikuti pola dan praktik terbaik yang diuraikan dalam panduan ini, Anda dapat membangun shared components yang robust dan mudah dipelihara untuk aplikasi Yii3 API Anda! 🚀\n", "20-utility-guide.md": "# Panduan Utility\n\n## 📋 Gambaran Umum\n\nFungsi-fungsi utility menyediakan fungsionalitas bermanfaat yang dapat digunakan kembali untuk operasi-operasi umum di seluruh aplikasi Yii3 API. Utility ini menyederhanakan operasi yang kompleks dan memastikan perilaku yang konsisten di seluruh codebase.\n\n---\n\n## 🏗️ Arsitektur Utility\n\n### Struktur Direktori\n\n```\nsrc/Shared/Core/Utility/\n├── Arrays.php        # Dirty-checking and array diff utilities\n├── FieldMapper.php   # Row field renaming/normalization helpers\n└── JsonHandler.php   # JSON field encoding, decoding, and transformation\n```\n\nSemua utility berada di namespace `App\\Shared\\Core\\Utility` dan digunakan bersama di setiap layer aplikasi.\n\n### Prinsip Desain\n\n#### **1. **Reusability**\n- Fungsi-fungsi utility generik\n- Tidak ada coupling ke domain tertentu\n- Mudah digunakan di berbagai konteks\n\n#### **2. **Performance**\n- Algoritma yang dioptimalkan\n- Penggunaan memori minimal\n- Pemrosesan data yang efisien\n\n#### **3. **Type Safety**\n- Pengetikan kuat dengan fitur PHP 8+\n- Validasi parameter yang tepat\n- Return type yang jelas\n\n#### **4. **Error Handling**\n- Penanganan error yang graceful\n- Pesan error yang bermakna\n- Perilaku fail-safe (`JsonHandler` mengembalikan fallback yang aman alih-alih melempar exception)\n\n---\n\n## 📁 Komponen Utility\n\n### 1. Arrays\n\n**Tujuan**: Diffing array dan deteksi \"dirty data\" yang digunakan untuk memutuskan apakah sebuah update benar-benar mengubah sesuatu.\n\n`Arrays` adalah class `final` yang hanya berisi method **static**:\n\n```php\nuse App\\Shared\\Core\\Utility\\Arrays;\n\n// Remove null values (shallow)\n$clean = Arrays::removeNulls($data);\n\n// Check if $after differs from $before, ignoring excluded fields\n$changed = Arrays::hasDirtyData($after, $before, ['detail_info.change_log']);\n\n// Get only the fields that actually changed\n$dirty = Arrays::getDirtyData($after, $before, ['sync_mdb']);\n\n// Keys of $data minus the excluded keys\n$updatable = Arrays::getUpdatableKeys($data, ['id', 'status', 'syncMdb']);\n\n// Shorthand: any changes at all?\n$hasChanges = Arrays::hasChanges($after, $before);\n\n// Differences with old/new values\n$diff = Arrays::getDifferences($after, $before);\n// ['name' => ['old' => 'John', 'new' => 'Jane'], ...]\n```\n\n**Method Signatures**:\n```php\npublic static function removeNulls(array $data): array\npublic static function hasDirtyData(array $after, array $before, array $exclude = []): bool\npublic static function getDirtyData(array $after, array $before, array $exclude = []): array\npublic static function getUpdatableKeys(array $data, array $exclude): array\npublic static function hasChanges(array $after, array $before): bool\npublic static function getDifferences(array $after, array $before): array\n```\n\n**Catatan**:\n- `getDirtyData` / `hasDirtyData` mendukung **exclude dot-notation** seperti `detail_info.change_log`, yang melewatkan field parent ketika nested key yang dikecualikan ada — digunakan untuk menghindari false positive dari update audit-trail.\n- `getDifferences` mengembalikan `['field' => ['old' => ..., 'new' => ...]]`, yang praktis untuk change log.\n\n**Penggunaan Nyata** — concern entity `Stateful` menggunakan helper ini untuk mendeteksi apakah payload update mengubah sesuatu:\n\n```php\n// src/Domain/Shared/Core/Concerns/Entity/Stateful.php\nprivate const IMMUTABLE_FIELDS = ['id', 'status', 'syncMdb'];\n\npublic function hasFieldChanges(array $data, bool $removeNulls = true): bool\n{\n    $filteredData = $removeNulls ? Arrays::removeNulls($data) : $data;\n\n    $updatableData = Arrays::getUpdatableKeys(\n        data: $filteredData,\n        exclude: self::IMMUTABLE_FIELDS\n    );\n\n    return !empty($up
